<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>區域發展島｜風格測試</title>
<style>
:root{color-scheme:light;--ink:#6b4a22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#f3dfaa;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
p{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0;text-align:center;color:var(--ink);opacity:.65;font-size:14px;pointer-events:none}
.back{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:20;width:46px;height:46px;border-radius:50%;background:rgba(255,248,226,.88);border:2px solid rgba(120,75,30,.45);box-shadow:0 3px 8px rgba(90,60,20,.25);display:grid;place-items:center;transition:transform .15s}
.back:hover,.back:focus-visible{transform:scale(1.1)}
.back svg{width:26px;height:26px}
</style>
</head>
<body>
<a class="back" href="../index.html" aria-label="回地圖集" title="回地圖集"><svg viewBox="0 0 24 24" fill="none" stroke="#6b4a22" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<canvas id="paper" style="pointer-events:none"></canvas>
<p>拖曳旋轉，點點水晶小精靈</p>
<script src="../lib/three.min.js"></script>
<script>
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<p style="top:45%">3D 函式庫載入失敗，請確認 lib 資料夾是否完整。</p>');}
else{
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(R.domElement);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(38,1,.1,50);
sc.add(new THREE.HemisphereLight(0xffffff,0xdde2f4,.5));
const sun=new THREE.DirectionalLight(0xffffff,.62);sun.position.set(3,6,3);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-4,right:4,top:5,bottom:-4});sc.add(sun);
const gm=new THREE.DataTexture(new Uint8Array([150,150,150,255,215,215,215,255,255,255,255,255]),3,1,THREE.RGBAFormat);
gm.minFilter=gm.magFilter=THREE.NearestFilter;gm.generateMipmaps=false;gm.needsUpdate=true;
const world=new THREE.Group();sc.add(world);
const M=c=>new THREE.MeshToonMaterial({color:c,gradientMap:gm});
function S(r,c,x,y,z,sx,sy,sz,p){const m=new THREE.Mesh(new THREE.SphereGeometry(r,28,18),M(c));
m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;(p||world).add(m);return m}
function C(rt,rb,h,c,x,y,z,p){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,16),M(c));
m.position.set(x,y,z);m.castShadow=true;(p||world).add(m);return m}
const gy=(x,z)=>.45*Math.sqrt(Math.max(0,1-(x*x+z*z)/5.76));
// 島
S(1,'#5fd65c',0,0,0,2.4,.45,2.4).receiveShadow=true;
const bot=new THREE.Mesh(new THREE.SphereGeometry(1,32,16,0,Math.PI*2,Math.PI/2,Math.PI/2),M('#b57a40'));
bot.scale.set(2.3,1.7,2.3);bot.position.y=-.02;bot.castShadow=true;world.add(bot);
S(.3,'#9b6431',.6,-1.6,.3,1,1.4,1);S(.2,'#9b6431',-.7,-1.4,-.4,1,1.4,1);S(.14,'#9b6431',-.1,-1.9,.5,1,1.3,1);
[[1.8,.4,'#ff8fb3'],[-1.7,.9,'#ffe15a'],[.5,1.9,'#ffffff'],[-.6,-1.9,'#ff8fb3'],[1.3,-1.5,'#ffe15a'],[-1.9,-.6,'#ffffff'],[1.9,-.9,'#ff8fb3'],[-1.1,1.7,'#ffe15a']]
.forEach(f=>S(.07,f[2],f[0],gy(f[0],f[1])+.03,f[1],1,1,1));
// 大樹
const COL=['#ff6fb0','#4cc9ff','#b58bff','#ffb340','#5df0b0','#ff7a6a','#ffe15a','#7a9bff'];
const tree=new THREE.Group();tree.position.set(0,gy(0,0),0);world.add(tree);
C(.26,.36,.9,'#8a5a33',0,.45,0,tree);[0,1.6,3.2,4.8].forEach(a=>S(.16,'#8a5a33',Math.cos(a)*.38,.06,Math.sin(a)*.38,1,.7,1,tree));
const gc2=['#4fc95a','#3fbf58','#58d068','#46c457'],cmeshes=[S(1,'#3fbf58',0,1,0,2.1,.55,2.1,tree),S(1,'#58d068',0,1.3,0,1.2,.4,1.2,tree)];
for(let k=0;k<10;k++){const a=k/10*Math.PI*2+.3;cmeshes.push(S(.6,gc2[k%4],Math.cos(a)*1.5,1.05,Math.sin(a)*1.5,1,.7,1,tree))}
const cm=cmeshes.map(m=>m.material);
// 發光貼圖與水晶果實
const gc=document.createElement('canvas');gc.width=gc.height=64;const gx=gc.getContext('2d'),gr=gx.createRadialGradient(32,32,0,32,32,32);
gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.4,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(255,255,255,0)');gx.fillStyle=gr;gx.fillRect(0,0,64,64);
const gtex=new THREE.CanvasTexture(gc);
function gem(col,r){return new THREE.Mesh(new THREE.IcosahedronGeometry(r,0),new THREE.MeshPhongMaterial({color:col,flatShading:true,shininess:90,specular:0xffffff,transparent:true,opacity:.95,emissive:col,emissiveIntensity:.15}))}
const fruit=COL.map((col,k)=>{const a=k*Math.PI/4+.2,rr=1.75+(k%2)*.12,g=new THREE.Group();
g.position.set(rr*Math.cos(a),1+.55*Math.sqrt(Math.max(0,1-(rr/2.1)*(rr/2.1)))+.12,rr*Math.sin(a));tree.add(g);
const m=gem(col,.13);m.scale.set(1,1.4,1);m.castShadow=true;g.add(m);
const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:gtex,color:col,transparent:true,opacity:0,depthWrite:false}));gl.scale.set(.9,.9,1);g.add(gl);
return{g,m,gl}});
// 光波
const rings=[0,1].map(i=>{const m=new THREE.Mesh(new THREE.RingGeometry(.9,1,64),new THREE.MeshBasicMaterial({color:i?'#ffd36b':'#fff7c2',transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));
m.rotation.x=-Math.PI/2;m.position.y=gy(0,0)+1.6;world.add(m);return m});
// 跳舞的水晶小精靈
function crystal(col){const g=new THREE.Group();world.add(g);
const mt=new THREE.MeshPhongMaterial({color:col,flatShading:true,shininess:90,specular:0xffffff,transparent:true,opacity:.93,emissive:col,emissiveIntensity:.3});
const b=new THREE.Mesh(new THREE.IcosahedronGeometry(.11,0),mt);b.scale.set(1,1.3,1);b.position.y=.2;b.castShadow=true;g.add(b);
[-1,1].forEach(s=>{const c=new THREE.Mesh(new THREE.ConeGeometry(.03,.1,4),mt);c.position.set(.04*s,.37,0);c.rotation.z=-.3*s;g.add(c);
S(.017,'#10131c',.04*s,.22,.1,1,1,1,g);S(.04,col,.05*s,.03,.02,1,.7,1.2,g)});return g}
const dancers=COL.map((c,i)=>{const g=crystal(c),o={g,i,hop:-1};g.userData.o=o;return o});
// 互動
const el=R.domElement,ray=new THREE.Raycaster();let drag=0,px=0,moved=0;
el.addEventListener('pointerdown',e=>{drag=1;px=e.clientX;moved=0;el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(drag){const d=e.clientX-px;px=e.clientX;moved+=Math.abs(d);world.rotation.y+=d*.01}});
el.addEventListener('pointerup',e=>{drag=0;if(moved<5){
ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);
const h=ray.intersectObjects(dancers.map(o=>o.g),true);
if(h.length){let ob=h[0].object;while(ob&&!ob.userData.o)ob=ob.parent;if(ob)ob.userData.o.hop=0}}});
function fit(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.position.set(0,3.8,Math.max(8.2,8.2*(1.15/cam.aspect)));cam.lookAt(0,.8,0);cam.updateProjectionMatrix()}
function paper(){const c=document.getElementById('paper'),d=Math.min(devicePixelRatio,2),w=innerWidth,h=innerHeight;
c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.scale(d,d);
const b=g.createRadialGradient(w/2,h*.42,Math.min(w,h)*.2,w/2,h/2,Math.max(w,h)*.75);
b.addColorStop(0,'#fff8e2');b.addColorStop(.65,'#f6e5b8');b.addColorStop(1,'#dcb872');g.fillStyle=b;g.fillRect(0,0,w,h);
for(let i=0;i<Math.floor(w*h/120);i++){g.fillStyle=Math.random()<.5?'rgba(140,100,40,.05)':'rgba(255,255,255,.08)';g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2)}
g.lineJoin='round';const cx=w/2,cy=h*.6,u=Math.max(w,h)*.045;
for(let k=1;k<=11;k++){g.beginPath();for(let s=0;s<=120;s++){const t=s/120*Math.PI*2,
r=u*k*(1+.16*Math.sin(2*t+k*.7)+.1*Math.sin(3*t+1.7*k)+.06*Math.sin(5*t+k));
const x=cx+r*1.5*Math.cos(t),y=cy+r*.75*Math.sin(t);s?g.lineTo(x,y):g.moveTo(x,y)}
g.closePath();g.strokeStyle=k%4==0?'rgba(120,75,30,.36)':'rgba(120,75,30,.22)';g.lineWidth=k%4==0?2.2:1.3;g.stroke()}}
addEventListener('resize',()=>{fit();paper()});fit();paper();
const clk=new THREE.Clock(),cl=(x,a,b)=>Math.max(a,Math.min(b,x)),back=x=>1+2.7*Math.pow(x-1,3)+1.7*Math.pow(x-1,2);
R.setAnimationLoop(()=>{
const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;
if(!drag)world.rotation.y+=dt*.12;
world.position.y=Math.sin(t*.9)*.07;
const q=t%14,all=q>8.2&&q<11?Math.sin((q-8.2)*8):0;
// 果實輪流亮起，全部亮起後光波擴散
fruit.forEach((f,i)=>{const s=1+i*.9,on=cl((q-s)/.5,0,1)*(q<12.2?1:Math.max(0,1-(q-12.2)/1.2));
const pop=q>=s&&q<s+.6?back((q-s)/.6):on>0?1:0;
f.m.material.emissiveIntensity=.15+.9*on+.2*Math.max(0,all);
f.m.scale.setScalar((1+.35*on*(pop?1:0))+.08*all);f.m.scale.y*=1.4;
f.gl.material.opacity=.7*on;f.m.rotation.y=t*.8});
cm.forEach(m=>{const a=Math.max(0,all)*.12;m.emissive.setRGB(a,a*.9,a*.5)});
rings.forEach((m,i)=>{const r=(q-8.4-i*.35)/2.4,v=r>0&&r<1;m.visible=v;if(v){m.scale.setScalar(.6+r*2.6);m.material.opacity=.75*(1-r)}});
// 小精靈繞著大樹跳舞，輪到自己的果實亮起時跳得特別高
dancers.forEach(o=>{const a=t*.3+o.i*Math.PI/4,x=Math.cos(a)*1.2,z=Math.sin(a)*1.2,s=1+o.i*.9,dh=q-s;
let y=gy(0,0)+1.45+Math.abs(Math.sin(t*3+o.i*.8))*.1+(dh>=0&&dh<.6?Math.sin(dh/.6*Math.PI)*.3:0);
if(o.hop>=0){o.hop+=dt;y+=Math.sin(Math.min(o.hop/.5,1)*Math.PI)*.3;if(o.hop>.5)o.hop=-1}
o.g.position.set(x,y,z);o.g.rotation.y=Math.atan2(-Math.sin(a),Math.cos(a))});

R.render(sc,cam)});
}
</script>
</body>
</html>
