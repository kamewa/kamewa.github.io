tspin+=dt;tor.position.set(TX,gy(TX,TZ),TZ);tor.scale.setScalar(Math.max(.001,tsc));tor.visible=torn&&tsc>.01;

{const ft=.66,s=sway(ft,tspin),fr=rad(ft)*.9,th=world.rotation.y;tface.position.set(s[0]-Math.sin(th)*fr,hy(ft),s[1]+Math.cos(th)*fr);tface.rotation.y=-th;
const c2=sway(1,tspin);tcap.position.set(c2[0],hy(1)+.28+Math.sin(t*1.4)*.03,c2[1]);tcap.scale.setScalar(1.9)}
tdeb.forEach(d=>{const h=(tspin*d.sp*.9+d.ph)%1,s=sway(h,tspin),r=rad(h)*1.35+.1,a=tspin*(2.6-1.6*h)+d.a0;
d.m.position.set(s[0]+Math.cos(a)*r,hy(h)+.05,s[1]+Math.sin(a)*r);d.m.rotation.y=a;d.m.scale.setScalar(Math.max(.01,Math.sin(h*Math.PI)))});
tdust.forEach(d=>{const a=tspin*3+d.a0,s=.5+.5*Math.sin(tspin*2+d.a0);d.m.position.set(Math.cos(a)*.35,.06,Math.sin(a)*.35);d.m.scale.set(.8+.6*s,.5,.8+.6*s);d.m.material.opacity=.7*(1-s*.5)})}
// 水晶小精靈
spr.forEach(o=>{
if(o.st!=='n'){tornSprite(o,t,dt);return}
setSh(o,true);
if(!o.alive&&t>o.back){o.alive=true;o.x=o.cx;o.z=o.cz;o.th=Math.random()*6.283;o.v=0;o.rs=t;o.idle=false;o.wx=o.cx;o.wz=o.cz}
let tx=o.wx,tz=o.wz,sv=.1,om=1.6,hp=.02,jf=4.5,joy=false;
const rainy=rainOn>.1&&Math.hypot(o.x-cX,o.z-cZ)<.8;
if(rbi>.3){const an=o.i*.6283,rr=.95+.12*(o.i%3);tx=rbX+Math.cos(an)*rr;tz=rbZ+Math.sin(an)*rr;sv=.14;hp=.1;jf=4.5;joy=true;o.idle=false}
else if(rainy){const qx=o.x-cX,qz=o.z-cZ,d=Math.hypot(qx,qz)||1;tx=cX+qx/d*1.1;tz=cZ+qz/d*1.1;sv=.15;om=2;o.idle=false}
else if(panicNow){if(t>o.wt){const an=Math.random()*6.283,rr=Math.random()*1.8;o.wx=Math.cos(an)*rr;o.wz=Math.sin(an)*rr;o.wt=t+.8+Math.random()*.6}tx=o.wx;tz=o.wz;sv=.14;om=2.4;hp=.04;jf=8;o.idle=false}
else{if(Math.hypot(o.wx-o.x,o.wz-o.z)<.15){if(!o.idle){o.idle=true;o.wt=t+1+Math.random()*1.5}else if(t>o.wt){const an=Math.random()*6.283,rr=.2+Math.random()*.5;o.wx=cl(o.cx+Math.cos(an)*rr,-1.9,1.9);o.wz=cl(o.cz+Math.sin(an)*rr,-1.9,1.9);o.idle=false}}else o.idle=false;tx=o.wx;tz=o.wz}
if(torn&&tstate==='hunt'&&o.alive){const qx=o.x-TX,qz=o.z-TZ,d=Math.hypot(qx,qz);if(d<.65){o.st='suck';o.su=t;o.sx0=o.x;o.sz0=o.z}else if(d<1.3){tx=TX+qx/(d||1)*1.5;tz=TZ+qz/(d||1)*1.5;sv=.14;om=2;o.idle=false}}
const dx=tx-o.x,dz=tz-o.z,dist=Math.hypot(dx,dz),stand=(joy&&dist<.15)||o.idle;
let want=stand?(joy?Math.atan2(rbX-o.x,rbZ-o.z):o.th):Math.atan2(dx,dz);
const df=Math.atan2(Math.sin(want-o.th),Math.cos(want-o.th));
o.th+=cl(df,-om*dt,om*dt);
const vt=stand?0:sv*cl(dist/.4,.3,1)*(1-.6*Math.min(1,Math.abs(df)/1.5));
o.v+=(vt-o.v)*Math.min(1,dt*3);
o.x+=Math.sin(o.th)*o.v*dt;o.z+=Math.cos(o.th)*o.v*dt;
const r2=Math.hypot(o.x,o.z);if(r2>1.95){o.x*=1.95/r2;o.z*=1.95/r2}

if(o.hop>=0){o.hop+=dt;y+=Math.sin(Math.min(o.hop/.5,1)*Math.PI)*.3;if(o.hop>.5)o.hop=-1}
o.g.position.set(o.x,y,o.z);o.g.rotation.y=o.th;
let s=1;if(!o.alive)s=Math.max(0,1-(t-o.dt)/.25);else if(t-o.rs<.6)s=back((t-o.rs)/.6);
o.g.scale.setScalar(Math.max(.001,s));o.g.visible=s>.01});
gemE.rotation.y=t*.9;gemE.position.y=gy(-.3,1.55)+.34+Math.sin(t*1.6)*.05;gemH.material.opacity=.45+.15*Math.sin(t*2.2);
{const br=1+.03*Math.sin(t*1.6);sbody.scale.set(br,br*.97,br);srays.rotation.z=t*.18;srayM.forEach((m,i)=>{const s=1+.14*Math.sin(t*2+i*.9);m.scale.set(.78,1.55*s,.6)});
