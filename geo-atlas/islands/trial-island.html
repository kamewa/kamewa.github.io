world.position.set((Math.random()-.5)*a,Math.sin(t*.9)*.05+(Math.random()-.5)*a,(Math.random()-.5)*a);
if(act&&pE<1.2&&E>=1.2)spawn(28,2.4);if(act&&pE<1.9&&E>=1.9)spawn(12,1.7);if(act&&pE<2.6&&E>=2.6)spawn(10,1.4);pE=act?E:-1;
if((!act||E<5)&&Math.random()<dt*(.4+4*inten*inten))spawn(1,.7);

lc.setHSL(.09+.03*Math.sin(t*3),1,.5+.12*inten+(act&&E<2?.15:0));crater.material.color.copy(lc);
lavaSp+=((act?.7:.08+.08*inten)-lavaSp)*Math.min(1,dt*3);lavaPh+=dt*lavaSp;lavaTex.offset.y=-(lavaPh%1);

sm1.forEach((m,i)=>{const f=(t*(.14+.12*inten)+i/10)%1,H=1.8+1.4*erupt;
m.position.set(Math.sin(i*3+f*2)*.25*f+.35*f,1.78+TY+f*H,Math.cos(i*2.3)*.2*f);
m.scale.setScalar((.16+.5*f)*(.7+.6*inten)*(1+.6*erupt));m.material.opacity=.9*Math.pow(1-f,1.1)*cl(.5+inten,0,1)});
// 火星：越激烈越多
emb.forEach((m,i)=>{const f=(t*.25+i/18)%1,on=i/18<inten+.15;m.visible=on;m.position.set(Math.sin(i*2.3+f*3)*.5*f,1.8+TY+f*(1.4+inten),Math.cos(i*1.7)*.4*f);m.scale.setScalar(Math.max(.01,(1-f)*(.6+.8*(.5+.5*Math.sin(t*5+i)))))});

bombs.forEach(b=>{if(!b.on)return;b.vy-=5.5*dt;const p=b.m.position;p.x+=b.vx*dt;p.y+=b.vy*dt;p.z+=b.vz*dt;
if(b.vy<0&&p.y<profY(Math.hypot(p.x,p.z))+.02||p.y<-.2){b.on=0;b.m.visible=false}});
// 光暈、熱浪光環、衝擊波、點光源
flare.material.opacity=Math.max(.2*inten,act&&E>1.1&&E<2.2?1-(E-1.1)/1.1:0);
vhalo.material.opacity=.2+.2*inten+(act&&E<3?.2:0);
hrings.forEach((m,i)=>{const q=((t+i)/3.2)%1;m.rotation.y=-th;m.scale.setScalar(1+q*1.6);m.material.opacity=.3*inten*(1-q)*(1-q)});
const wr=(E-1.2)/1.6,wv=act&&wr>0&&wr<1;wave.visible=wv;if(wv){wave.scale.setScalar(.5+wr*3.6);wave.material.opacity=.8*(1-wr)}
pl.intensity=(.2+inten*.25+(act&&E<3?.5:0))*(.85+Math.random()*.3);
// 火山的臉
const st=!act?'idle':E<1.3?'strain':E<3.2?'blow':'relief',tight=st==='strain'||st==='blow';
vf.position.set(-Math.sin(th)*(rF+.1),.8,Math.cos(th)*(rF+.1));vf.rotation.y=-th;
const hot=st==='idle'?inten:st==='relief'?.1:1;
eyeA.forEach(e=>{e.scale.y=tight?.3:1});
blush.forEach(m=>{m.scale.set(1.1+.35*hot,.62+.22*hot,.4);m.material.color.setHSL(.03+.02*(1-hot),1,.8-.2*hot)});
mSmile.visible=st!=='blow';mSmile.scale.set(1-.25*hot,st==='strain'?.3:1-.35*hot,1);
mOpen.visible=st==='blow';mOpen.scale.set(1,1+.4*Math.abs(Math.sin(t*9)),.4);
sweat.visible=(st==='idle'&&inten>.6)||st==='strain';{const f=(t*.7)%1;sweat.position.set(.34,.2-f*.28,.05);sweat.scale.setScalar(.8+.4*(1-f))}
// 大魔王：出現後會一直等著被點，沒人點約四十秒後才縮回去
const bs=E<2?0:E<3.3?back((E-2)/1.3):E<45?1:Math.max(0,1-(E-45)/1.5);
const hit=Math.max(0,1-(t-hitT)/.6);
boss.scale.setScalar(Math.max(.001,bs)*(1+.12*Math.sin(Math.min(1,(t-hitT)/.6)*Math.PI)*(hitT>0?1:0)));boss.visible=bs>.002;
boss.position.y=1.5+TY+(E>=2?Math.min(1,(E-2)/1.3)*.25:0)+Math.sin(t*2)*.05;
const rq=E>=6?(E-6)%7:9,roar=E>=3.3&&E<6?Math.max(0,Math.sin((E-3.3)*5)):rq<1?Math.sin(rq*Math.PI):hit;
mouth.scale.y=.2+.9*roar;fangs.forEach(f=>{f.visible=roar>.15});boss.rotation.z=roar*Math.sin(t*28)*.03;
arms.forEach((m,i)=>{m.position.y=1.1+.35*roar+Math.sin(t*3+i)*.05+(E>=6?.12*Math.sin(t*2.5+i*3):0)});
bm.emissiveIntensity=.25+.15*Math.sin(t*5)+.3*roar;boss.rotation.y=-th+Math.sin(t*.7)*.25;
bglow.material.opacity=.45+.15*Math.sin(t*2)+.25*roar;
brings.forEach((m,i)=>{const q=((t+i*1.2)/2.4)%1;m.rotation.y=-th-boss.rotation.y;m.scale.setScalar(1.6+q*2);m.material.opacity=(bs>.9?.28:0)*(1-q)*(1-q)});
// 鏡頭：噴發、魔王出場時拉遠
cb+=((act&&E>.8&&E<45?1:0)-cb)*Math.min(1,dt*2.2);
const sh=act&&E<5?(Math.random()-.5)*.05:0;
zoom+=(zoomT-zoom)*Math.min(1,dt*8);const ty0=.9+1*cb;cam.position.set(sh,ty0+(3.8+1.4*cb-ty0)*zoom,(Z0+2.4*cb)*zoom);cam.lookAt(0,ty0,0);
R.render(sc,cam)});
