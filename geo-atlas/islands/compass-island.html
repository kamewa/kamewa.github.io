<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>通論島｜風格測試</title>
<style>
:root{color-scheme:light;--ink:#6b4a22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#f3dfaa;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
p{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0;text-align:center;color:var(--ink);opacity:.65;font-size:14px;pointer-events:none}
.back{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:20;width:46px;height:46px;border-radius:50%;background:rgba(255,248,226,.88);border:2px solid rgba(120,75,30,.45);box-shadow:0 3px 8px rgba(90,60,20,.25);display:grid;place-items:center;transition:transform .15s}
.back:hover,.back:focus-visible{transform:scale(1.1)}
.back svg{width:26px;height:26px}
</style>
</head>
<body>
<a class="back" href="../index.html" aria-label="回地圖集" title="回地圖集"><svg viewBox="0 0 24 24" fill="none" stroke="#6b4a22" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<canvas id="paper" style="pointer-events:none"></canvas>
<p>拖曳旋轉，點點羅盤</p>
<script src="../lib/three.min.js"></script>
<script>
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<p style="top:45%">3D 函式庫載入失敗，請確認 lib 資料夾是否完整。</p>');}
else{
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(R.domElement);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(38,1,.1,50);
cam.position.set(0,3.8,8.6);cam.lookAt(0,.8,0);
sc.add(new THREE.HemisphereLight(0xffffff,0xdde2f4,.5));
const sun=new THREE.DirectionalLight(0xffffff,.62);sun.position.set(3,6,3);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4});sc.add(sun);
const gm=new THREE.DataTexture(new Uint8Array([150,150,150,255,215,215,215,255,255,255,255,255]),3,1,THREE.RGBAFormat);
gm.minFilter=gm.magFilter=THREE.NearestFilter;gm.generateMipmaps=false;gm.needsUpdate=true;
const world=new THREE.Group();sc.add(world);
const M=c=>new THREE.MeshToonMaterial({color:c,gradientMap:gm});
function S(r,c,x,y,z,sx,sy,sz,p){const m=new THREE.Mesh(new THREE.SphereGeometry(r,28,18),M(c));
m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;(p||world).add(m);return m}
function C(rt,rb,h,c,x,y,z,p){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,16),M(c));
m.position.set(x,y,z);m.castShadow=true;(p||world).add(m);return m}
const gy=(x,z)=>.45*Math.sqrt(Math.max(0,1-(x*x+z*z)/5.76));
// 島
S(1,'#5fd65c',0,0,0,2.4,.45,2.4).receiveShadow=true;
const bot=new THREE.Mesh(new THREE.SphereGeometry(1,32,16,0,Math.PI*2,Math.PI/2,Math.PI/2),M('#b57a40'));
bot.scale.set(2.3,1.7,2.3);bot.position.y=-.02;bot.castShadow=true;world.add(bot);
S(.3,'#9b6431',.6,-1.6,.3,1,1.4,1);S(.2,'#9b6431',-.7,-1.4,-.4,1,1.4,1);S(.14,'#9b6431',-.1,-1.9,.5,1,1.3,1);
// 石頭羅盤
const comp=new THREE.Group();comp.position.set(0,.45,0);world.add(comp);
const disc=new THREE.Mesh(new THREE.CylinderGeometry(.95,.95,.08,48),M('#efe3c4'));disc.castShadow=disc.receiveShadow=true;comp.add(disc);
for(let i=0;i<14;i++){const a=i/14*Math.PI*2;S(.09,'#bdb299',Math.cos(a)*1.02,.03,Math.sin(a)*1.02,1,.8,1,comp)}
for(let i=0;i<8;i++){const a=i*Math.PI/4,L=i%2?.45:.72;
const b=new THREE.Mesh(new THREE.BoxGeometry(.09,.03,L),M(i==4?'#ff5a5a':i%2?'#ffffff':'#5aa8ff'));
b.position.set(Math.sin(a)*L/2,.055,Math.cos(a)*L/2);b.rotation.y=a;comp.add(b)}
const needle=new THREE.Group();needle.position.y=.15;comp.add(needle);
const nr=new THREE.Mesh(new THREE.ConeGeometry(.07,.5,12),M('#ff4d4d'));nr.rotation.x=Math.PI/2;nr.position.z=.25;nr.castShadow=true;needle.add(nr);
const nw=new THREE.Mesh(new THREE.ConeGeometry(.07,.5,12),M('#ffffff'));nw.rotation.x=-Math.PI/2;nw.position.z=-.25;nw.castShadow=true;needle.add(nw);
S(.08,'#9a8f7a',0,.1,0,1,1,1,comp);
// 雪堆和冰塊
S(.55,'#f6fbff',-1.3,gy(-1.3,.85)+.03,.85,1,.28,1);S(.3,'#f6fbff',-.6,gy(-.6,1.25)+.03,1.25,1,.35,1);
[[-1.4,.9,1,.3],[-1.1,1.15,.7,1.2],[-1.55,.55,.6,2.1]].forEach(o=>{const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.25,1),new THREE.MeshToonMaterial({color:'#bfe8ff',gradientMap:gm,flatShading:true}));
m.scale.set(o[2],o[2]*1.3,o[2]);m.rotation.y=o[3];m.position.set(o[0],gy(o[0],o[1])+.2*o[2]+.04,o[1]);m.castShadow=true;world.add(m)});
// 樹
function tree(x,z,s){const g=new THREE.Group();g.position.set(x,gy(x,z),z);g.scale.setScalar(s);world.add(g);
C(.09,.13,.5,'#8a5a33',0,.25,0,g);S(.45,'#3fbf58',0,.72,0,1,1,1,g);S(.34,'#58d068',0,1.02,0,1,1,1,g);S(.22,'#7be37c',0,1.25,0,1,1,1,g);return g}
const trees=[tree(1.55,-1,.75),tree(-1.5,-.9,.7)];
// 迷路的北極熊
const ex=new THREE.Group();ex.position.set(1.55,gy(1.55,.5),.5);ex.rotation.y=Math.atan2(.5,-1.55);world.add(ex);
S(.3,'#ffffff',0,.3,0,1.25,.95,.95,ex);S(.065,'#ffffff',-.4,.36,0,1,1,1,ex);[[.22,.17],[.22,-.17],[-.2,.17],[-.2,-.17]].forEach(p=>S(.11,'#ffffff',p[0],.12,p[1],1,1.15,1,ex));
const eh=new THREE.Group();eh.position.set(.4,.5,0);ex.add(eh);
S(.19,'#ffffff',0,0,0,1,.95,1,eh);S(.1,'#fff1e6',.15,-.04,0,1.1,.8,.9,eh);S(.04,'#1d1410',.24,-.01,0,1,.8,1,eh);[-1,1].forEach(s=>{S(.026,'#1d1410',.15,.07,.09*s,1,1,1,eh);S(.07,'#ffffff',-.02,.17,.13*s,1,1,.7,eh);S(.032,'#ffb6c8',.13,-.02,.14*s,1,.6,.5,eh)});
const sf=new THREE.Mesh(new THREE.TorusGeometry(.19,.05,10,28),M('#ff5a6e'));sf.position.set(.3,.36,0);sf.rotation.y=Math.PI/2;sf.castShadow=true;ex.add(sf);
S(.52,'#f2f8ff',1.55,gy(1.55,.5)+.01,.5,1,.1,1);S(.16,'#ffffff',2,gy(2,.2)+.02,.2,1,.6,1);
// 經緯網
const Rg=2.7,cy0=.3,pts=[],beads=[],lats=[.25,.6,.95,1.3],NM=12;
lats.forEach(e=>{const r=Rg*Math.cos(e),y=cy0+Rg*Math.sin(e);
for(let i=0;i<64;i++){const a=i/64*Math.PI*2,b=(i+1)/64*Math.PI*2;pts.push(r*Math.cos(a),y,r*Math.sin(a),r*Math.cos(b),y,r*Math.sin(b))}});
for(let m=0;m<NM;m++){const a=m/NM*Math.PI*2;
for(let i=0;i<24;i++){const e1=i/24*Math.PI/2,e2=(i+1)/24*Math.PI/2;
pts.push(Rg*Math.cos(e1)*Math.cos(a),cy0+Rg*Math.sin(e1),Rg*Math.cos(e1)*Math.sin(a),Rg*Math.cos(e2)*Math.cos(a),cy0+Rg*Math.sin(e2),Rg*Math.cos(e2)*Math.sin(a))}}
const lg=new THREE.BufferGeometry();lg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pts),3));
const lm=new THREE.LineBasicMaterial({color:0x2a86ff,transparent:true,opacity:0});
world.add(new THREE.LineSegments(lg,lm));
const bg=new THREE.SphereGeometry(.045,10,8),bm=new THREE.MeshBasicMaterial({color:0x7fe3ff,transparent:true,opacity:0});
lats.forEach(e=>{for(let m=0;m<NM;m++){const a=m/NM*Math.PI*2,r=Rg*Math.cos(e),x=r*Math.cos(a),z=r*Math.sin(a),y=cy0+Rg*Math.sin(e);
const b=new THREE.Mesh(bg,bm);b.position.set(x,y,z);world.add(b);beads.push({b,x,y,z,e})}});
const cands=beads.filter(o=>(o.e==.6||o.e==.95)&&Math.hypot(o.x-1.15,o.z-.35)>.7&&Math.hypot(o.x+1.35,o.z-.8)>.8);
// 降落的企鵝
const flag=new THREE.Group();world.add(flag);
S(.2,'#2b3347',0,.25,0,1,1.25,.95,flag);S(.16,'#ffffff',0,.22,.07,.95,1.15,.8,flag);S(.14,'#2b3347',0,.56,0,1,1,1,flag);
[-1,1].forEach(s=>{S(.04,'#ffffff',.06*s,.59,.105,1,1,1,flag);S(.022,'#10131c',.06*s,.59,.135,1,1,1,flag);S(.07,'#ffb02e',.08*s,.02,.08,1.2,.4,1.5,flag)});
const pk=new THREE.Mesh(new THREE.ConeGeometry(.04,.1,12),M('#ffb02e'));pk.rotation.x=Math.PI/2;pk.position.set(0,.54,.16);flag.add(pk);
const fp=[-1,1].map(s=>S(.07,'#2b3347',.21*s,.3,0,.5,1.3,.8,flag));

// 互動
const el=R.domElement,ray=new THREE.Raycaster();let drag=0,px=0,moved=0,t0=0,nclk=0;
el.addEventListener('pointerdown',e=>{drag=1;px=e.clientX;moved=0;el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(drag){const d=e.clientX-px;px=e.clientX;moved+=Math.abs(d);world.rotation.y+=d*.01}});
el.addEventListener('pointerup',e=>{drag=0;if(moved<5){
ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);
if(ray.intersectObject(comp,true).length){t0=clk.elapsedTime;nclk++}}});
function fit(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.position.z=Math.max(8.6,8.6*(1.15/cam.aspect));cam.updateProjectionMatrix()}
function paper(){const c=document.getElementById('paper'),d=Math.min(devicePixelRatio,2),w=innerWidth,h=innerHeight;
c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.scale(d,d);
const b=g.createRadialGradient(w/2,h*.42,Math.min(w,h)*.2,w/2,h/2,Math.max(w,h)*.75);
b.addColorStop(0,'#fff8e2');b.addColorStop(.65,'#f6e5b8');b.addColorStop(1,'#dcb872');g.fillStyle=b;g.fillRect(0,0,w,h);
for(let i=0;i<Math.floor(w*h/120);i++){g.fillStyle=Math.random()<.5?'rgba(140,100,40,.05)':'rgba(255,255,255,.08)';g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2)}
g.lineJoin='round';const cx=w/2,cy=h*.6,u=Math.max(w,h)*.045;
for(let k=1;k<=11;k++){g.beginPath();for(let s=0;s<=120;s++){const t=s/120*Math.PI*2,
r=u*k*(1+.16*Math.sin(2*t+k*.7)+.1*Math.sin(3*t+1.7*k)+.06*Math.sin(5*t+k));
const x=cx+r*1.5*Math.cos(t),y=cy+r*.75*Math.sin(t);s?g.lineTo(x,y):g.moveTo(x,y)}
g.closePath();g.strokeStyle=k%4==0?'rgba(120,75,30,.36)':'rgba(120,75,30,.22)';g.lineWidth=k%4==0?2.2:1.3;g.stroke()}}
addEventListener('resize',()=>{fit();paper()});fit();paper();
const clk=new THREE.Clock();
R.setAnimationLoop(()=>{
const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;
if(!drag)world.rotation.y+=dt*.12;
world.position.y=Math.sin(t*.9)*.07;
// 指針：隨企鵝落下快速旋轉，落地時鎖定企鵝的方向
const T=t-t0,cyc=Math.floor(T/9),u=T%9,tg=cands[(cyc*5+2+nclk*3)%cands.length],gh=gy(tg.x,tg.z);
needle.rotation.y=Math.atan2(tg.x,tg.z)+4*Math.PI*Math.exp(-3.5*u)+.3*Math.exp(-2.5*u)*Math.sin(14*u);
// 經緯網淡入、旗子落在座標上
const k=Math.min(1,t/2);lm.opacity=k*(.45+.15*Math.sin(t*1.2));bm.opacity=k*.9;

let h=0;if(u<1)h=1.8*(1-u*u);else if(u<1.35)h=.12*Math.sin((u-1)/.35*Math.PI);
flag.position.set(tg.x,gh+h,tg.z);flag.rotation.y=-world.rotation.y;flag.scale.y=(u>1&&u<1.2)?.85:1;const fa=u<1?Math.sin(t*16)*.5:Math.sin(t*3)*.08;fp[0].rotation.z=.3+fa;fp[1].rotation.z=-.3-fa;

// 探險家
const lost=u<1.3;eh.rotation.y=lost?Math.sin(t*1.6)*.7:Math.sin(t*.8)*.12;eh.rotation.z=lost?Math.sin(t*2.2)*.12:-.12+Math.sin(t*3)*.04;
ex.position.y=gy(1.55,.5)+(lost||u>1.8?0:Math.sin((u-1.3)/.5*Math.PI)*.12);ex.rotation.z=Math.sin(t*1.5)*.02;
trees.forEach((g,i)=>g.rotation.z=Math.sin(t*1.4+i)*.03);
R.render(sc,cam)});
}
</script>
</body>
</html>
