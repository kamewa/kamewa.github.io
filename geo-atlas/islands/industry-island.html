<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>產業島｜風格測試</title>
<style>
:root{color-scheme:light;--ink:#6b4a22;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#f3dfaa;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
p{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0;text-align:center;color:var(--ink);opacity:.65;font-size:14px;pointer-events:none}
.back{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:20;width:46px;height:46px;border-radius:50%;background:rgba(255,248,226,.88);border:2px solid rgba(120,75,30,.45);box-shadow:0 3px 8px rgba(90,60,20,.25);display:grid;place-items:center;transition:transform .15s}
.back:hover,.back:focus-visible{transform:scale(1.1)}
.back svg{width:26px;height:26px}
</style>
</head>
<body>
<a class="back" href="../index.html" aria-label="回地圖集" title="回地圖集"><svg viewBox="0 0 24 24" fill="none" stroke="#6b4a22" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<canvas id="paper" style="pointer-events:none"></canvas>
<p>拖曳旋轉，點點水晶小精靈</p>
<script src="../lib/three.min.js"></script>
<script>
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<p style="top:45%">3D 函式庫載入失敗，請確認 lib 資料夾是否完整。</p>');}
else{
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(R.domElement);
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(38,1,.1,50);
cam.position.set(0,3.6,8);cam.lookAt(0,.6,0);
sc.add(new THREE.HemisphereLight(0xffffff,0xdde2f4,.5));
const sun=new THREE.DirectionalLight(0xffffff,.62);sun.position.set(3,6,3);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4});sc.add(sun);
const gm=new THREE.DataTexture(new Uint8Array([150,150,150,255,215,215,215,255,255,255,255,255]),3,1,THREE.RGBAFormat);
gm.minFilter=gm.magFilter=THREE.NearestFilter;gm.generateMipmaps=false;gm.needsUpdate=true;
const world=new THREE.Group();sc.add(world);
const M=c=>new THREE.MeshToonMaterial({color:c,gradientMap:gm});
function S(r,c,x,y,z,sx,sy,sz,p){const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),M(c));
m.position.set(x,y,z);m.scale.set(sx,sy,sz);m.castShadow=true;(p||world).add(m);return m}
function C(rt,rb,h,c,x,y,z,p){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,14),M(c));
m.position.set(x,y,z);m.castShadow=true;(p||world).add(m);return m}
function GEM(col,r){return new THREE.Mesh(new THREE.IcosahedronGeometry(r,0),new THREE.MeshPhongMaterial({color:col,flatShading:true,shininess:90,specular:0xffffff,transparent:true,opacity:.95,emissive:col,emissiveIntensity:.3}))}
const gy=(x,z)=>.45*Math.sqrt(Math.max(0,1-(x*x+z*z)/5.76));
const V=a=>a.map(p=>new THREE.Vector3(p[0],0,p[1]));
// 島
S(1,'#5fd65c',0,0,0,2.4,.45,2.4).receiveShadow=true;
const bot=new THREE.Mesh(new THREE.SphereGeometry(1,32,16,0,Math.PI*2,Math.PI/2,Math.PI/2),M('#d98a3a'));
bot.scale.set(2.3,1.7,2.3);bot.position.y=-.02;bot.castShadow=true;world.add(bot);
S(.3,'#c9822f',.6,-1.6,.3,1,1.4,1);S(.2,'#c9822f',-.7,-1.4,-.4,1,1.4,1);S(.14,'#c9822f',-.1,-1.9,.5,1,1.3,1);
// 路：各產地通往中央市集
const P={field:[[-1.35,.9],[-1,.7],[-.75,.5],[-.53,.33]],pasture:[[-1.1,-.85],[-.9,-.65],[-.7,-.5],[-.5,-.36]],
forest:[[.65,-1.35],[.5,-1],[.35,-.75],[.25,-.57]],mine:[[1.6,-.45],[1.25,-.12],[.9,-.08],[.62,-.05]],bay:[[1.5,.8],[1.2,.62],[.9,.45],[.56,.26]]};
const cv={},dg=new THREE.SphereGeometry(.07,10,8),dm=M('#f7cf75');
for(const k in P){cv[k]=new THREE.CatmullRomCurve3(V(P[k]));cv[k].getPoints(34).forEach(p=>{const m=new THREE.Mesh(dg,dm);m.position.set(p.x,gy(p.x,p.z)+.02,p.z);m.scale.set(1,.2,1);m.receiveShadow=true;world.add(m)})}
// 中央市集
S(.72,'#f7cf75',0,gy(0,.1)+.01,.1,1,.1,1);
function stall(x,z,col){const g=new THREE.Group();g.position.set(x,gy(x,z)+.04,z);world.add(g);
const b=new THREE.Mesh(new THREE.BoxGeometry(.3,.12,.18),M('#c98a4b'));b.position.y=.06;b.castShadow=true;g.add(b);
[[-.13,-.07],[.13,-.07],[-.13,.07],[.13,.07]].forEach(p=>C(.012,.012,.26,'#8a5a33',p[0],.13,p[1],g));
const a=new THREE.Mesh(new THREE.SphereGeometry(.28,24,12,0,Math.PI*2,0,Math.PI/2),M(col));a.scale.y=.6;a.position.y=.26;a.castShadow=true;g.add(a);
S(.035,'#ffffff',-.09,.15,0,1,1,1,g);S(.03,'#ffc93c',0,.15,0,.8,1.5,.8,g);const o=GEM('#ff6fb0',.035);o.position.set(.09,.15,0);g.add(o)}
stall(0,.48,'#ff5a6e');stall(-.48,-.02,'#ffc93c');stall(-.12,-.46,'#4aa3ff');
// 農：麥田
const fx=-1.45,fz=.95,fPh=Math.asin(Math.hypot(fx,fz)/2.4),fTh=Math.atan2(fz,fx),fDir=new THREE.Vector3(Math.sin(fPh)*Math.cos(fTh),Math.cos(fPh),Math.sin(fPh)*Math.sin(fTh)),FA=.33;
const fG=new THREE.SphereGeometry(1,40,16,0,Math.PI*2,0,FA);fG.applyMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),fDir)));
const fieldM=new THREE.Mesh(fG,M('#ffcf3a'));fieldM.scale.set(2.415,.453,2.415);fieldM.receiveShadow=true;world.add(fieldM);
const inCap=(x,z,dir,ang)=>{const r=Math.min(.999,Math.hypot(x,z)/2.4),ph=Math.asin(r),th=Math.atan2(z,x);return Math.sin(ph)*Math.cos(th)*dir.x+Math.cos(ph)*dir.y+Math.sin(ph)*Math.sin(th)*dir.z>Math.cos(ang)};
const wg=new THREE.CylinderGeometry(.012,.014,.2,6),wh=new THREE.SphereGeometry(.035,10,8),wmM=M('#e2a516'),whM=M('#ffd21f'),stalks=[];
for(let i=0;i<13;i++)for(let j=0;j<11;j++){const x=fx+(i-6)*.1+(j%2)*.03,z=fz+(j-5)*.1;if(!inCap(x,z,fDir,FA*.88))continue;
const g=new THREE.Group();g.position.set(x,gy(x,z)+.03,z);world.add(g);const a=new THREE.Mesh(wg,wmM);a.position.y=.1;g.add(a);
const b=new THREE.Mesh(wh,whM);b.position.y=.22;b.scale.set(1,2.2,1);g.add(b);stalks.push({g,x,z})}
// 林：圓滾滾的樹
function tree(x,z,s){const g=new THREE.Group();g.position.set(x,gy(x,z),z);g.scale.setScalar(s);world.add(g);
C(.09,.13,.5,'#8a5a33',0,.25,0,g);S(.45,'#2fcf5a',0,.72,0,1,1,1,g);S(.34,'#4de06a',0,1.02,0,1,1,1,g);S(.22,'#7bf08c',0,1.25,0,1,1,1,g);return g}
const trees=[tree(.95,-1.5,.8),tree(1.3,-1.2,.7),tree(.35,-1.7,.7),tree(1.55,-1,.6)];
// 牧：小綿羊
function sheep(cx,cz,ph){const g=new THREE.Group();world.add(g);S(.16,'#ffffff',0,0,0,1.2,.95,.95,g);
[[.12,.05,.08],[.12,.05,-.08],[-.12,.05,.08],[-.12,.05,-.08],[0,.12,0]].forEach(p=>S(.1,'#ffffff',p[0],p[1],p[2],1,1,1,g));
[[.09,.07],[.09,-.07],[-.09,.07],[-.09,-.07]].forEach(p=>C(.025,.025,.1,'#5a4332',p[0],-.15,p[1],g));
const h=new THREE.Group();h.position.set(.2,.04,0);g.add(h);S(.08,'#5a4332',.03,0,0,1.05,1,.95,h);S(.05,'#ffffff',.01,.07,0,1,.8,1,h);
[-1,1].forEach(s=>{S(.03,'#5a4332',0,.02,.08*s,1,.5,1.3,h);S(.014,'#1d1410',.1,.02,.035*s,1,1,1,h);S(.018,'#ff9a8a',.085,-.025,.06*s,1,.6,.5,h)});return{g,h,cx,cz,ph}}
const flock=[sheep(-1.15,-1.05,0),sheep(-1.5,-.7,2.5)];
// 漁：海灣與跳躍的小魚
const bayDir=new THREE.Vector3(Math.sin(1.0125)*Math.cos(.4857),Math.cos(1.0125),Math.sin(1.0125)*Math.sin(.4857));
const bayG=new THREE.SphereGeometry(1,40,16,0,Math.PI*2,0,.3);bayG.applyMatrix4(new THREE.Matrix4().makeRotationFromQuaternion(new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0),bayDir)));
const bay=new THREE.Mesh(bayG,new THREE.MeshToonMaterial({color:'#2f9bff',gradientMap:gm,emissive:'#0b3a66'}));bay.scale.set(2.415,.453,2.415);bay.receiveShadow=true;world.add(bay);const URX=-.884,URZ=-.467,UTX=.467,UTZ=-.884;
function fish(){const g=new THREE.Group();world.add(g);S(.07,'#ff8a3c',0,0,0,1.5,1,.7,g);S(.04,'#ff8a3c',-.12,0,0,1,1.5,.5,g);S(.014,'#10131c',.07,.025,.04,1,1,1,g);return g}
const fishes=[fish(),fish()];
// 礦：岩壁、彩色礦脈、石爐
const rx=1.75,rz=-.5,rcy=gy(rx,rz)+.1;
S(.5,'#7f8fe6',rx,rcy,rz,1.2,.9,1);S(.3,'#9aa8ff',1.5,gy(1.5,-.95)+.1,-.95,1,.9,1);
S(.18,'#2a2230',1.22,gy(1.22,-.42)+.1,-.42,.5,1,.9);
[[-.2,.05,'#ff9a4a'],[.05,-.1,'#6fb0ff'],[.2,.1,'#ff6fb0'],[-.1,-.25,'#5df0b0'],[.3,-.15,'#ffe15a']].forEach(o=>{
const y=rcy+.45*Math.sqrt(Math.max(0,1-(o[0]/.6)**2-(o[1]/.5)**2))+.02,m=GEM(o[2],.07);m.scale.set(1,1.4,1);m.position.set(rx+o[0],y,rz+o[1]);m.castShadow=true;world.add(m)});
const fur=new THREE.Group();fur.position.set(1.2,gy(1.2,-.15),-.15);world.add(fur);
S(.17,'#ffa66a',0,.14,0,1,1.1,1,fur);S(.06,'#2a2230',-.12,.1,0,.6,1,1,fur);C(.05,.06,.22,'#d98a5a',.03,.34,0,fur);
const puffs=[0,1,2,3,4].map(()=>{const m=S(.06,'#9a8fa0',0,0,0,1,1,1,fur);m.material.transparent=true;return m});
// 水晶小精靈
const COLS=['#ff6fb0','#4cc9ff','#b58bff','#ffb340','#5df0b0'];
function crystal(col,hat){const g=new THREE.Group();world.add(g);
const mt=new THREE.MeshPhongMaterial({color:col,flatShading:true,shininess:90,specular:0xffffff,transparent:true,opacity:.93,emissive:col,emissiveIntensity:.3});
const b=new THREE.Mesh(new THREE.IcosahedronGeometry(.11,0),mt);b.scale.set(1,1.3,1);b.position.y=.2;b.castShadow=true;g.add(b);
[-1,1].forEach(s=>{const c=new THREE.Mesh(new THREE.ConeGeometry(.03,.1,4),mt);c.position.set(.04*s,.37,0);c.rotation.z=-.3*s;g.add(c);
S(.017,'#10131c',.04*s,.22,.1,1,1,1,g);S(.04,col,.05*s,.03,.02,1,.7,1.2,g)});
if(hat)S(.08,'#ffe14a',0,.35,0,1.2,.55,1.2,g);return g}
const items={wheat:()=>{const g=new THREE.Group();S(.045,'#ffc93c',0,0,0,.8,1.9,.8,g);S(.03,'#ffc93c',.05,-.02,0,.8,1.6,.8,g);return g},
wool:()=>{const g=new THREE.Group();S(.085,'#ffffff',0,0,0,1,1,1,g);return g},
log:()=>{const g=new THREE.Group();C(.035,.035,.18,'#8a5a33',0,0,0,g).rotation.z=Math.PI/2;return g},
ore:()=>{const g=new THREE.Group();g.add(GEM('#ff6fb0',.06));return g},
fish:()=>{const g=new THREE.Group();S(.05,'#ff8a3c',0,0,0,1.5,1,.7,g);S(.03,'#ff8a3c',-.09,0,0,1,1.4,.5,g);return g}};
const carr=[];
function carrier(route,col,hat,item,off,T){const g=crystal(col,hat),it=item();it.position.y=.56;g.add(it);
const o={g,it,c:cv[route],off,T,hop:-1,ph:Math.random()*6.28};g.userData.o=o;carr.push(o)}
carrier('field','#ffb340',0,items.wheat,0,18);carrier('pasture','#4cc9ff',0,items.wool,4,18);carrier('forest','#5df0b0',0,items.log,8,18);
carrier('mine','#ff6fb0',1,items.ore,12,20);carrier('bay','#b58bff',0,items.fish,15,19);
// 互動
const el=R.domElement,ray=new THREE.Raycaster();let drag=0,px=0,moved=0;
el.addEventListener('pointerdown',e=>{drag=1;px=e.clientX;moved=0;el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{if(drag){const d=e.clientX-px;px=e.clientX;moved+=Math.abs(d);world.rotation.y+=d*.01}});
el.addEventListener('pointerup',e=>{drag=0;if(moved<5){
ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),cam);
const h=ray.intersectObjects(carr.map(o=>o.g),true);
if(h.length){let ob=h[0].object;while(ob&&!ob.userData.o)ob=ob.parent;if(ob)ob.userData.o.hop=0}}});
function fit(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.position.z=Math.max(8,8*(1.15/cam.aspect));cam.updateProjectionMatrix()}
function paper(){const c=document.getElementById('paper'),d=Math.min(devicePixelRatio,2),w=innerWidth,h=innerHeight;
c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.scale(d,d);
const b=g.createRadialGradient(w/2,h*.42,Math.min(w,h)*.2,w/2,h/2,Math.max(w,h)*.75);
b.addColorStop(0,'#fff8e2');b.addColorStop(.65,'#f6e5b8');b.addColorStop(1,'#dcb872');g.fillStyle=b;g.fillRect(0,0,w,h);
for(let i=0;i<Math.floor(w*h/120);i++){g.fillStyle=Math.random()<.5?'rgba(140,100,40,.05)':'rgba(255,255,255,.08)';g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2)}
g.lineJoin='round';const cx=w/2,cy=h*.6,u=Math.max(w,h)*.045;
for(let k=1;k<=11;k++){g.beginPath();for(let s=0;s<=120;s++){const t=s/120*Math.PI*2,
r=u*k*(1+.16*Math.sin(2*t+k*.7)+.1*Math.sin(3*t+1.7*k)+.06*Math.sin(5*t+k));
const x=cx+r*1.5*Math.cos(t),y=cy+r*.75*Math.sin(t);s?g.lineTo(x,y):g.moveTo(x,y)}
g.closePath();g.strokeStyle=k%4==0?'rgba(120,75,30,.36)':'rgba(120,75,30,.22)';g.lineWidth=k%4==0?2.2:1.3;g.stroke()}}
addEventListener('resize',()=>{fit();paper()});fit();paper();
const clk=new THREE.Clock(),cl=(x,a,b)=>Math.max(a,Math.min(b,x));
R.setAnimationLoop(()=>{
const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;
if(!drag)world.rotation.y+=dt*.12;
world.position.y=Math.sin(t*.9)*.07;
// 麥浪
stalks.forEach(s=>{s.g.rotation.z=Math.sin(t*2+s.x*4)*.12;s.g.rotation.x=Math.sin(t*1.7+s.z*3)*.06});
trees.forEach((g,i)=>g.rotation.z=Math.sin(t*1.4+i)*.03);
// 綿羊吃草
flock.forEach(o=>{const a=t*.3+o.ph,x=o.cx+Math.cos(a)*.25,z=o.cz+Math.sin(a)*.25;
o.g.position.set(x,gy(x,z)+.2,z);o.g.rotation.y=Math.atan2(-Math.cos(a),-Math.sin(a));o.h.rotation.z=-(.3+.3*Math.sin(t*2+o.ph))});
// 魚躍出水面
fishes.forEach((f,i)=>{const w=t*.15+i*.5,n=Math.floor(w),q=w-n,v=q<.3;f.visible=v;if(v){const k=q/.3,h=a=>{const r0=Math.sin(n*12.9898+i*78.233+a*37.719)*43758.5453;return r0-Math.floor(r0)},
pr=(h(1)*2-1)*.35*.38,pt=(h(2)*2-1)*.35*.6,an=h(3)*Math.PI*2,dx=Math.cos(an),dz=Math.sin(an),cx0=1.8+URX*pr+UTX*pt,cz0=.95+URZ*pr+UTZ*pt,
x=cx0+dx*.17*(2*k-1),z=cz0+dz*.17*(2*k-1),y=gy(x,z)+.03+Math.sin(k*Math.PI)*.3;
f.position.set(x,y,z);f.rotation.set(0,-an,Math.atan2(Math.cos(k*Math.PI)*.3*Math.PI,.34)*.6)}});
// 石爐冒煙
puffs.forEach((m,i)=>{const f=(t*.35+i/5)%1;m.position.set(.03+f*.12,.46+f*.5,0);m.scale.setScalar(.6+f*1.4);m.material.opacity=.8*(1-f)});
// 小精靈搬運：產地 → 市集，送完空手走回去
carr.forEach(o=>{const p=((t+o.off)/o.T)%1;let u,s=1,show=false;
if(p<.45){u=p/.45;show=true}else if(p<.5)u=1;else if(p<.95){u=1-(p-.5)/.45;s=-1}else u=0;
const ms=u>0&&u<1;u=u*u*(3-2*u);const q=o.c.getPointAt(cl(u,0,1)),tn=o.c.getTangentAt(cl(u,0,1));
let y=gy(q.x,q.z)+(ms?Math.abs(Math.sin(t*6+o.ph))*.02:0);
if(o.hop>=0){o.hop+=dt;y+=Math.sin(Math.min(o.hop/.5,1)*Math.PI)*.3;if(o.hop>.5)o.hop=-1}
o.g.position.set(q.x,y,q.z);o.g.rotation.y=Math.atan2(tn.x*s,tn.z*s);
o.it.visible=show&&p<.46;o.it.scale.setScalar(p<.42?1:cl((.46-p)/.04,0,1))});
R.render(sc,cam)});
}
</script>
