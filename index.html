<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>明和老師的地理島</title>
<style>
  :root { --sky1:#0b1d3a; --sky2:#1f4e79; --sea:#2bb3c0; --grass:#7bc96f; --earth:#a9744f; --text:#f4f1e8; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; overflow:hidden;
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; color:var(--text);
    background:radial-gradient(ellipse at 50% 120%, var(--sky2), var(--sky1) 70%); }
  .stars { position:fixed; inset:0; background-image:
    radial-gradient(1px 1px at 20% 30%, #fff8, transparent), radial-gradient(1px 1px at 70% 20%, #fff9, transparent),
    radial-gradient(1.5px 1.5px at 40% 70%, #fff6, transparent), radial-gradient(1px 1px at 85% 60%, #fff8, transparent),
    radial-gradient(1px 1px at 10% 80%, #fff7, transparent), radial-gradient(1.5px 1.5px at 55% 45%, #fff5, transparent); }
  main { position:relative; text-align:center; padding:16px; }
  .island { width:min(260px,70vw); margin:0 auto 32px; animation:float 6s ease-in-out infinite; }
  @keyframes float { 50% { transform:translateY(-14px); } }
  h1 { font-size:clamp(1.8rem,6vw,3rem); letter-spacing:.08em; }
  p { margin-top:12px; opacity:.8; line-height:1.7; }
  .badge { display:inline-block; margin-top:24px; padding:8px 18px; border-radius:999px;
    border:1px solid #ffffff40; background:#ffffff10; font-size:.9rem; }
</style>
</head>
<body>
<div class="stars"></div>
<main>
  <svg class="island" viewBox="0 0 200 150" aria-hidden="true">
    <ellipse cx="100" cy="140" rx="60" ry="6" fill="#000" opacity=".25"/>
    <path d="M30 70 Q100 55 170 70 L130 115 Q100 135 70 115 Z" fill="var(--earth)"/>
    <path d="M28 68 Q100 50 172 68 Q100 82 28 68 Z" fill="var(--grass)"/>
    <path d="M90 64 L110 30 L130 64 Z" fill="#5a9e57"/>
    <path d="M104 40 L110 30 L116 40 Z" fill="#fff"/>
    <circle cx="60" cy="58" r="10" fill="#4f9a4c"/><rect x="58" y="62" width="4" height="8" fill="#6b4a2f"/>
    <ellipse cx="150" cy="64" rx="10" ry="3" fill="var(--sea)"/>
  </svg>
  <h1>明和老師的地理島</h1>
  <p>網站建置中，更多島嶼即將浮現。</p>
  <span class="badge">GitHub Pages 上線測試成功</span>
</main>
</body>
</html>
