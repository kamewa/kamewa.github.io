<style>
/* 版面：整頁是 3D 城堡島，城堡名牌浮在城堡上方，點選後右下角出現介紹卡。永遠明亮。 */
:root{
  color-scheme: light;
  --plum:#4a2260; --plum-soft:#7a5590; --pink:#ff6fae; --pink-soft:#ffd3e6;
  --lav:#b79cff; --lav-soft:#e6dcff; --mint:#63dcb6; --mint-soft:#c8f7e6; --lemon:#ffe27a; --sky:#8fd3ff; --card:#fffafd;
  --font-display:"Chiron GoRound TC","Baloo 2","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-body);font-weight:500;color:var(--plum);overflow:hidden;
  background:linear-gradient(180deg,#bfe6ff 0%,#dcd3ff 30%,#ffe0f0 60%,#ffe0f0 100%);background-color:#ffe0f0;
}
.stage{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.pick{cursor:pointer}
#scene:active{cursor:grabbing}
.brand{position:absolute;left:20px;top:16px;right:20px;display:flex;align-items:center;gap:.4em;pointer-events:none;font-size:clamp(1.3rem,3vw,2.4rem)}
.logo{flex:none;width:1.15em;height:1.15em;display:block}
.brand h1{
  margin:0;white-space:nowrap;font-family:var(--font-display);font-weight:900;font-size:1em;line-height:1.15;color:var(--pink);
  text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,0 5px 0 rgba(183,156,255,.55)
}
.chip{align-self:center;margin-left:.2em;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.85);font-size:clamp(.75rem,1.2vw,.9rem);font-weight:700;color:var(--plum-soft);white-space:nowrap}
.corner{position:absolute;right:16px;top:16px;display:flex;align-items:center;gap:8px;z-index:5}
.to-map{display:flex;align-items:center;gap:6px;padding:7px 15px 7px 11px;border-radius:999px;background:rgba(255,255,255,.88);border:2.5px solid #fff;
  box-shadow:0 3px 0 rgba(183,156,255,.45);font:700 .92rem/1 var(--font-body);color:#7a4f9a;text-decoration:none;transition:transform .15s,background .15s}
.to-map:hover{transform:translateY(-2px);background:#fff}
.to-map:focus-visible,button:focus-visible{outline:3px solid #ff8fc8;outline-offset:2px}
.to-map svg{width:18px;height:18px;flex:none}
.who{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 16px;border-radius:999px;background:rgba(255,255,255,.88);border:2.5px solid #fff;font-size:.9rem;font-weight:700}
.who[hidden]{display:none}
.who button{border:0;border-radius:999px;padding:5px 14px;background:var(--pink-soft);font:inherit;font-size:.85rem;font-weight:700;color:var(--plum);cursor:pointer}
.tip{position:absolute;left:20px;bottom:14px;margin:0;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.78);font-size:.85rem;font-weight:700;color:var(--plum-soft);pointer-events:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
/* 名牌：外層 .pin 負責跟著城堡移動；內層按鈕只做「浮起」的小動畫，不會跳位 */
.pin{position:absolute;left:0;top:0;will-change:transform}
.tag{
  display:block;white-space:nowrap;padding:3px 12px;border-radius:999px;cursor:pointer;pointer-events:auto;transform-origin:50% 100%;
  font-family:var(--font-display);font-weight:800;font-size:clamp(.66rem,1.1vw,.9rem);color:var(--plum);background:rgba(255,255,255,.9);
  border:2.5px solid #fff;box-shadow:0 3px 0 var(--pink-soft);transition:transform .15s ease-out,background .15s,color .15s,box-shadow .15s
}
.tag:hover,.tag:focus-visible{transform:translateY(-3px) scale(1.05);background:#fff;box-shadow:0 6px 0 var(--pink-soft),0 8px 14px rgba(183,120,220,.25)}
.tag:active{transform:translateY(0) scale(1);box-shadow:0 2px 0 var(--pink-soft)}
.tag.on{background:var(--pink);color:#fff;box-shadow:0 3px 0 #e0458f}
.tag.on:hover{box-shadow:0 6px 0 #e0458f,0 8px 14px rgba(224,69,143,.25)}
.tag.special{border-color:var(--lemon)}
.info{
  position:absolute;right:18px;bottom:18px;width:min(360px,calc(100% - 36px));background:var(--card);border-radius:26px;padding:22px 20px 18px;z-index:6;
  border:3px solid #fff;box-shadow:0 0 0 3px var(--pink-soft),0 14px 30px rgba(183,120,220,.28);display:flex;flex-direction:column;gap:10px;animation:pop .2s ease-out
}
.info[hidden]{display:none}
.info::before{content:"";position:absolute;left:26px;right:26px;top:-3px;height:8px;border-radius:0 0 8px 8px;

.info .kind{margin:0;font-size:.82rem;font-weight:700;letter-spacing:.08em;color:var(--plum-soft)}

// 讓路稍微彎曲：在每段中間加一點側向偏移
const ROADS = ROADS_RAW.map((pts, ri) => {
  const out = [pts[0]];
  for (let i = 0; i < pts.length - 1; i++) {
    const [ax, az] = pts[i], [bx, bz] = pts[i + 1], dx = bx - ax, dz = bz - az, l = Math.hypot(dx, dz) || 1, off = Math.sin(ri * 2.3 + i * 1.7) * Math.min(1.2, l * 0.12);
    out.push([(ax + bx) / 2 - dz / l * off, (az + bz) / 2 + dx / l * off], pts[i + 1]);
  }
  return out;
});
function roadK(x, z) { let d = Infinity; for (const r of ROADS) d = Math.min(d, lineDist(x, z, r)); return 1 - smooth(0.13, 0.26, d); }
const nearRoad = (x, z, r) => ROADS.some((rd) => lineDist(x, z, rd) < r);

/* ---------- 山水峰林：一根根拔地而起的石峰 ---------- */
function buildKarst(V, busy, rnd) {
  const peaks = [];
  const add = (x, z, r, h, top) => {
    const y = ground(x, z) - 0.15;
    const tilt = top ? 0 : (rnd() - 0.5) * 0.12, col = pick(rnd, [0xd2c9de, 0xc9cdd8, 0xd6d3e2, 0xc6cfd2]);
    V.add(top ? "karstTop" : "karst", col, x, y, z, r, h + 0.15, r * (0.8 + rnd() * 0.3), rnd() * TAU, tilt, tilt);
    if (!top && rnd() < 0.35) V.add("karst", col, x + r * 0.35, y + h * 0.35, z - r * 0.2, r * 0.55, h * 0.45, r * 0.5, rnd() * TAU);
    // 岩壁上的苔蘚與小樹
    for (let k = 0; k < 3; k++) { const a = rnd() * TAU, f = 0.3 + rnd() * 0.45, rr = r * (0.95 - f * 0.25); V.add("sph", 0x9fd3a2, x + Math.cos(a) * rr, y + h * f, z + Math.sin(a) * rr, r * 0.32, r * 0.16, r * 0.32); }
    if (!top) { V.add("sph", 0x8fcb9a, x, y + h * 0.9, z, r * 0.62, r * 0.3, r * 0.62); TREE.conifer(V, x + r * 0.1, y + h + 0.02, z, 0.55 + rnd() * 0.25, rnd); if (r > 0.5) TREE.round(V, x - r * 0.25, y + h * 0.97, z + r * 0.1, 0.5, rnd); }
    peaks.push([x, z, r, y + h]); busy.push([x, z, r + 0.1]);
  };
  KARST_MAIN.forEach(([x, z, r, h]) => add(x, z, r, h, true));
  for (let tries = 0; tries < 700 && peaks.length < 42; tries++) {
    const a = rnd() * TAU, d = Math.sqrt(rnd()) * 4.6, x = -7.4 + Math.cos(a) * d, z = 4.0 + Math.sin(a) * d * 0.95;
    const r = 0.26 + rnd() * 0.36, h = (1.8 + rnd() * 2.6) * (1.1 - d / 9);
    if (Z.karst(x, z) < 0.35 || islandHeight(x, z) < 0.08 || riverK(x, z) > 0 || nearRoad(x, z, r + 0.35)) continue;
    if (RIVERS.some((rv) => lineDist(x, z, rv.pts) < r + rv.w + 0.1)) continue;
    if (peaks.some(([px, pz, pr]) => Math.hypot(px - x, pz - z) < pr + r + 0.12)) continue;
    add(x, z, r, h, false);
  }
  return peaks;
}

/* ---------- 建造全部 ---------- */
function buildExtras(V, S, busy, low) {
  const rnd = makeRnd(2026);
  const free = (x, z, r) => busy.every(([bx, bz, br]) => Math.hypot(x - bx, z - bz) > r + br);
  const karst = buildKarst(V, busy, rnd);
  const okGround = (x, z, minH) => { const h = islandHeight(x, z); return h > (minH || 0.14) && riverK(x, z) < 0.15 && bayMask(x, z) < 0.15 && slopeAt(x, z) < 1.1; };

  // 村莊
  for (const [id, style, n, r0, r1] of VILLAGES) {
    const c = CASTLE[id];
    for (let k = 0, tries = 0; k < (low ? Math.ceil(n * 0.7) : n) && tries < 200; tries++) {
      const a = rnd() * TAU, r = r0 + rnd() * (r1 - r0), x = c.x + Math.cos(a) * r, z = c.z + Math.sin(a) * r;
      if (!okGround(x, z, 0.16) || !free(x, z, 0.35) || nearRoad(x, z, 0.32)) continue;
      if (id === "global" && Math.hypot(x, (z + 4.2) * 1.05) < 4.7) continue;     // 台地的懸崖上不蓋房子
      const ry = Math.atan2(c.x - x, c.z - z) + (rnd() - 0.5) * 0.5;

  // 樹

    if (riverK(x, z) > 0.1 || bayMask(x, z) > 0.1 || Z.ice(x, z) > 0.3 || roadK(x, z) > 0.05 || nearRoad(x, z, 0.3)) continue;
    if (!free(x, z, 0.25) || slopeAt(x, z) > 1.25) continue;
    if (inField(x, z) && rnd() < 0.92) continue;
    const r = rnd(), s = 0.8 + rnd() * 0.5, y = ground(x, z) - 0.03;

    if (Z.karst(x, z) > 0.45) type = r < 0.22 ? "round" : r < 0.32 ? "bush" : null;
    else if (Z.north(x, z) > 0.5) { if (h > 4.2) continue; if (r < 0.75) type = "conifer"; }
    else if (Z.amer(x, z) > 0.5) type = r < 0.6 ? "maple" : r < 0.85 ? "conifer" : null;
    else if (Z.taiwan(x, z) > 0.5) type = r < 0.45 ? "round" : r < 0.7 ? "palm" : null;
    else if (Z.desert(x, z) > 0.45) { const oasis = Math.hypot(x + 17.6, z + 5.4) < 2.2; type = oasis ? (r < 0.9 ? "palm" : null) : (r < 0.1 ? "cactus" : null); }
    else if (Z.savanna(x, z) > 0.45) type = r < 0.07 ? "baobab" : r < 0.18 ? "acacia" : r < 0.28 ? "bush" : null;
    else if (Z.jungle(x, z) > 0.4) type = r < 0.75 ? "jungle" : r < 0.92 ? "palm" : null;
    else if (Z.sakura(x, z) > 0.4) type = r < 0.6 ? "sakura" : r < 0.7 ? "round" : null;
    else if (Z.china(x, z) > 0.4) type = r < 0.3 ? "round" : r < 0.42 ? "conifer" : null;
    else if (plateau) type = r < 0.2 ? "round" : r < 0.3 ? "bush" : null;
    else type = r < 0.32 ? "round" : r < 0.4 ? "conifer" : r < 0.5 ? "bush" : null;
    if (!type) continue;

  const bridges = [];

// 名牌：在大地圖登入過就顯示
(function who() {
  let s = null; try { s = JSON.parse(sessionStorage.getItem("island-quiz-session") || "null"); } catch (e) { s = null; }
  if (!s) return;
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const label = s.role === "student" ? s.cls + " 班 " + s.seat + " 號　" + esc(s.name) : s.role === "teacher" ? "老師" : "訪客（不記錄成績）";
  const box = $("who"); box.hidden = false;
  box.innerHTML = "<span>" + label + '</span><button type="button" id="whoOut">' + (s.role === "guest" ? "登入" : "登出") + "</button>";
  $("whoOut").addEventListener("click", () => { try { sessionStorage.removeItem("island-quiz-session"); } catch (e) {} location.href = "https://kamewa.github.io/island-quiz/"; });
})();

/* ---------- 地表顏色 ---------- */
const HEX = {}; const rgbOf = (hex) => HEX[hex] || (HEX[hex] = hexRGB(hex));
function mixTo(c, hex, f) { if (f <= 0) return; f = Math.min(1, f); const t = rgbOf(hex); c[0] += (t[0] - c[0]) * f; c[1] += (t[1] - c[1]) * f; c[2] += (t[2] - c[2]) * f; }
const hash2 = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };
const FIELD_COLS = [0xf6e38c, 0xc5e79c, 0xe2d4f6, 0xf8cf98, 0xb3dfa6, 0xffd6e4];
function groundColor(x, z, h, ny, c) {
  const m = landMask(x, z);
  if (h < 0) {
    c[0] = 0.66; c[1] = 0.92; c[2] = 0.9; mixTo(c, 0x7eb4e2, smooth(0, 1.1, -h));
    if (bayMask(x, z) > 0.3 && h > -0.3) mixTo(c, 0xd8d6c4, 0.5);
    return c;
  }
  const v1 = 0.5 + 0.5 * Math.sin(x * 1.3) * Math.sin(z * 1.1), v2 = 0.5 + 0.5 * Math.sin(x * 0.45 + z * 0.6);
  const sv = rgbOf(0xb6e0a2); c[0] = sv[0]; c[1] = sv[1]; c[2] = sv[2];
  mixTo(c, 0xc6e8a8, v1 * 0.5); mixTo(c, 0xa4d6aa, v2 * 0.35);
  // 各區的地表
  const north = Z.north(x, z); mixTo(c, 0xa8d4b4, north * 0.6);
  const dz = Z.desert(x, z); mixTo(c, 0xf5e0ae, dz * 1.25); mixTo(c, 0xeccf98, dz * (0.5 + 0.5 * Math.sin(x * 1.6 + z * 0.7)) * 0.55);
  const sav = Z.savanna(x, z); mixTo(c, 0xe6d894, sav * 1.1); mixTo(c, 0xcfd88e, sav * v1 * 0.4);
  mixTo(c, 0x92d196, Z.jungle(x, z) * 0.9);
  mixTo(c, 0x9fd8ae, Z.karst(x, z) * 0.8);
  const sak = Z.sakura(x, z); mixTo(c, 0xd5ecba, sak * 0.6); if (hash2(Math.floor(x * 3), Math.floor(z * 3)) > 0.82) mixTo(c, 0xffd3e4, sak * 0.6);
  mixTo(c, 0xead59c, Z.amer(x, z) * 0.45);
  const ch = Z.china(x, z); if (ch > 0.2 && h > 0.55) mixTo(c, Math.floor(h * 7) % 2 ? 0xd4eb9e : 0xaedca2, ch * 0.75);
  if (inField(x, z)) { const cx = Math.floor((x + z * 0.25) / 1.25), cz = Math.floor((z - x * 0.15) / 0.95); mixTo(c, FIELD_COLS[Math.floor(hash2(cx, cz) * FIELD_COLS.length)], 0.85); }
  // 海灘
  mixTo(c, 0xf7e8c4, (1 - smooth(0.12, 0.34, h)) * (1 - smooth(0.03, 0.12, m)) * (1 - Z.ice(x, z)));
  // 岩壁與雪
  const rockF = smooth(north > 0.4 ? 0.92 : 0.84, north > 0.4 ? 0.7 : 0.6, ny), rockCol = north > 0.4 ? 0xcbc3dc : 0xdccbbd;
  mixTo(c, rockCol, rockF);
  if (rockF > 0.3 && Math.sin(h * 9) > 0.3) mixTo(c, north > 0.4 ? 0xbcb3d2 : 0xcdb9a8, rockF * 0.5);
  if (north > 0.2) { const sl = 4.0 + 0.5 * Math.sin(x * 0.7 + 1) + 0.25 * Math.sin(z * 1.7); mixTo(c, 0xf7f8ff, smooth(sl, sl + 0.5, h) * north * (ny > 0.6 ? 1 : 0.65)); }
  const iz = Z.ice(x, z); mixTo(c, 0xd5ebfd, iz); if (iz > 0.3) { if (Math.sin(x * 2.1 + z * 0.9) > 0.55) mixTo(c, 0xc6e3fb, 0.7); if (hash2(Math.floor(x * 1.5), Math.floor(z * 1.5)) > 0.75) mixTo(c, 0xf8fcff, 0.7); mixTo(c, 0xbfe0fb, smooth(0.9, 0.7, ny) * 0.8); mixTo(c, 0xd8edff, smooth(0.5, 0.1, h)); }
  // 潮間帶的灘地
  const b = bayMask(x, z) * smooth(-0.04, 0.05, m); mixTo(c, h < 0.07 ? 0xd9d2bd : 0xeae0c8, b * smooth(0.6, 0.2, h));
  // 河流與道路
  const rk = riverK(x, z); mixTo(c, 0x9fd9f2, rk * 1.2);
  mixTo(c, 0xefdcb8, roadK(x, z) * (1 - rk) * (Z.ice(x, z) > 0.5 ? 0.3 : 1));
  return c;
}

   建立場景

  canvas.addEventListener("wheel", (e) => { e.preventDefault(); goal.radius = clamp(goal.radius * Math.exp(e.deltaY * 0.0011), 9, 110); }, { passive: false });
  function resize() { const w = stage.clientWidth || 1, h = stage.clientHeight || 1; renderer.setSize(w, h, false); aspect = w / h; camera.aspect = aspect; camera.updateProjectionMatrix(); }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener("resize", resize);
  resize();

  /* ---------- 名牌與介紹卡 ---------- */
  const labels = $("labels"), v3 = new THREE.Vector3();
  const tags = CASTLES.map((cs) => {
    const el = document.createElement("div"), btn = document.createElement("button"); el.className = "pin";
    btn.type = "button"; btn.className = "tag" + (cs.id === "global" || cs.id === "final" || cs.id === "issue" || cs.id === "karst" ? " special" : "");
    btn.textContent = cs.name; btn.setAttribute("aria-label", cs.name + "（" + cs.region + "）");
    btn.addEventListener("click", () => select(cs)); el.appendChild(btn); labels.appendChild(el);
    return { cs, el, anchor: [cs.x, cs.baseY + cs.top * cs.s + 0.35, cs.z], mid: [cs.x, cs.baseY + cs.top * cs.s * 0.4, cs.z] };
  });
  let selected = null;
  function select(cs) {
    selected = cs;
    tags.forEach((t) => t.el.firstChild.classList.toggle("on", t.cs === cs));
    $("iKind").textContent = (cs.gate ? "" : "對應區域｜") + cs.region; $("iName").textContent = cs.name;
    $("iState").textContent = cs.state || "評量籌備中";
    const go = $("iGo"); go.hidden = !cs.gate; if (cs.gate) { go.textContent = cs.gate.label; go.disabled = !cs.gate.url; go.onclick = () => { if (cs.gate.url) location.href = cs.gate.url; }; } $("iText").textContent = cs.text; $("info").hidden = false;
    Object.assign(goal, { tx: cs.x, ty: cs.baseY + cs.top * cs.s * 0.4, tz: cs.z, radius: 12 + cs.top * cs.s * 1.3, phi: Math.min(goal.phi, 1.05) });
  }
  function home() { selected = null; tags.forEach((t) => t.el.firstChild.classList.remove("on")); $("info").hidden = true; Object.assign(goal, HOME, { theta: Math.round(goal.theta / TAU) * TAU }); }
  $("iBack").addEventListener("click", home);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && selected) home(); });
  const screenOf = (p) => { v3.set(p[0], p[1], p[2]).project(camera); const r = canvas.getBoundingClientRect(); return { x: r.left + (v3.x + 1) / 2 * r.width, y: r.top + (1 - v3.y) / 2 * r.height, z: v3.z }; };
  function nearest(px, py) {
    let best = null, bd = 70;
    for (const t of tags) { const s = screenOf(t.mid); if (s.z > 1) continue; const d = Math.hypot(s.x - px, s.y - py); if (d < bd) { bd = d; best = t.cs; } }
    return best;
  }
  function pickAt(x, y) { const cs = nearest(x, y); if (cs) select(cs); }
  function hover(e) { canvas.classList.toggle("pick", !!nearest(e.clientX, e.clientY)); }
  function placeTags() {
    const r = canvas.getBoundingClientRect();
    for (const t of tags) {
      v3.set(t.anchor[0], t.anchor[1], t.anchor[2]).project(camera);
      if (v3.z > 1 || Math.abs(v3.x) > 1.2 || Math.abs(v3.y) > 1.2) { t.el.style.display = "none"; continue; }
      t.el.style.display = "";
      t.el.style.transform = "translate(" + ((v3.x + 1) / 2 * r.width).toFixed(1) + "px," + ((1 - v3.y) / 2 * r.height).toFixed(1) + "px) translate(-50%,-100%)";
      t.el.style.zIndex = String(Math.round((1 - v3.z) * 1000) + (t.cs === selected ? 2000 : 0));
    }
  }

  /* ---------- 每一格畫面 ---------- */
  let first = true;
  function frame() {
    const dt = Math.min(0.05, clock.getDelta()), time = clock.elapsedTime;
    const k = 1 - Math.exp(-dt * 4);
    for (const key in cam) cam[key] += (goal[key] - cam[key]) * k;
    const fit = aspect < 1.35 ? Math.min(3.3, 1.35 / aspect) : 1, fogK = scene.userData.fogK || (scene.userData.fogK = [scene.fog.near, scene.fog.far]), fogSet = (scene.fog.near = fogK[0] * fit, scene.fog.far = fogK[1] * fit), r = cam.radius * (selected ? Math.min(fit, 1.3) : fit), s = Math.sin(cam.phi);

    const tt = reduceMotion ? 3 : time;
    for (const f of ticks) f(tt, reduceMotion ? 0 : dt);
    renderer.render(scene, camera);
    placeTags();
    if (first) { first = false; $("loading").hidden = true; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

setTimeout(() => {
  try {
    if (!window.THREE) throw new Error("three.js 未載入");
    init3D();
  } catch (err) {
    console.error(err);
    $("loading").hidden = true; $("fallback").hidden = false;
  }
}, 30);
