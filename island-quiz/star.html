<title>星辰尋夢島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 版面：整頁是一座 3D 島，左上角只放印章、島名和課程標籤。永遠明亮，不跟隨深色模式。 */
:root{
  color-scheme: light;
  --plum:#4a2260; --plum-soft:#7a5590; --pink:#ff6fae; --pink-soft:#ffd3e6; --lav:#b79cff;
  --font-display:"Chiron GoRound TC","Baloo 2","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-body);font-weight:500;color:var(--plum);overflow:hidden;
  background:linear-gradient(180deg,#bfe6ff 0%,#dcd3ff 28%,#ffd9ee 56%,#ffd9ee 100%);background-color:#ffd9ee;
}
.stage{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
.brand{position:absolute;left:20px;top:16px;right:20px;display:flex;align-items:center;gap:.4em;pointer-events:none;font-size:clamp(1.3rem,3vw,2.4rem)}
.logo{flex:none;width:1.15em;height:1.15em;display:block}
.brand h1{
  margin:0;white-space:nowrap;font-family:var(--font-display);font-weight:900;font-size:1em;line-height:1.15;color:var(--pink);
  text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,0 5px 0 rgba(183,156,255,.55)
}
.chip{
  align-self:center;margin-left:.2em;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.85);
  font-size:clamp(.75rem,1.2vw,.9rem);font-weight:700;color:var(--plum-soft);white-space:nowrap
}
.tip{position:absolute;left:20px;bottom:14px;margin:0;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.78);font-size:.85rem;font-weight:700;color:var(--plum-soft);pointer-events:none}
.fallback{position:absolute;left:20px;right:20px;top:50%;padding:14px 18px;border-radius:18px;background:#fff;border:2.5px solid #ff5f8a;font-weight:700}
@media (max-width:600px){.brand{left:12px;top:10px;flex-wrap:wrap}.tip{font-size:.75rem;left:12px}}
</style>
<style>
.to-map{position:absolute;right:16px;top:16px;z-index:15;display:flex;align-items:center;gap:6px;padding:7px 15px 7px 11px;border-radius:999px;
  background:rgba(255,255,255,.86);border:2.5px solid #fff;box-shadow:0 3px 0 rgba(183,156,255,.45);
  font:700 .92rem/1 "Noto Sans TC",system-ui,sans-serif;color:#7a4f9a;text-decoration:none;transition:transform .15s,background .15s}
.to-map:hover{transform:translateY(-2px);background:#fff}
.to-map:focus-visible{outline:3px solid #ff8fc8;outline-offset:2px}
.to-map svg{width:18px;height:18px;flex:none}
@media (max-width:600px){.to-map{top:auto;bottom:12px;right:12px;font-size:.8rem;padding:6px 12px 6px 9px}}
</style>
</head>

<main class="stage" id="stage">
  <canvas id="scene" aria-label="星辰尋夢島：中央是水晶燈塔，四周的花圃排成八方位羅盤，北方有一顆旋轉的愛心"></canvas>
  <header class="brand">
    <img class="logo" id="logo" alt="和" width="56" height="56">
    <h1>星辰尋夢島</h1>
    <span class="chip">課程 01｜位置</span>
  </header>

/* ============================================================
   島的形狀：接近圓形但帶一點不規則的海岸，中央微微隆起放燈塔，其餘平坦好排羅盤
   ============================================================ */
function smooth(a, b, v) { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); }
function islandHeight(x, z) {
  const a = Math.atan2(z, x), r = Math.hypot(x, z);
  const R = 8.6 + 0.35 * Math.sin(3 * a + 0.7) + 0.25 * Math.sin(5 * a + 2.1) + 0.15 * Math.sin(7 * a + 0.3);
  const land = 0.45 + 0.55 * Math.exp(-(r * r) / (2 * 1.6 * 1.6));
  return -0.6 + (land + 0.6) * (1 - smooth(R - 1.2, R, r));
}
const ground = (x, z) => Math.max(0, islandHeight(x, z));

/* 八方位：北朝向畫面的 -z（和大地圖的北方一致），東是 +x；角度由北順時針 */
const DIRS = [
  { name: "北",   deg: 0,   hex: 0xff6fae, main: true },
  { name: "東北", deg: 45,  hex: 0xffa883 },
  { name: "東",   deg: 90,  hex: 0xffd84d, main: true },
  { name: "東南", deg: 135, hex: 0xb5e86a },
  { name: "南",   deg: 180, hex: 0x5fd8aa, main: true },
  { name: "西南", deg: 225, hex: 0x7cc8ff },
  { name: "西",   deg: 270, hex: 0xb08cff, main: true },
  { name: "西北", deg: 315, hex: 0xf28ce0 }
];
const dirVec = (deg) => { const r = deg * Math.PI / 180; return [Math.sin(r), -Math.cos(r)]; };

function init3D() {
  const canvas = $("scene"), stage = $("stage");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xffd9ee, 40, 95);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 300);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xffc9e6, 0.78));
  const sun = new THREE.DirectionalLight(0xfff4e0, 0.5); sun.position.set(8, 14, 6); scene.add(sun);

  let seed = 1116;
  const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const ticks = [];
  const mats = {};
  const M = (hex, extra) => {
    if (extra && extra.transparent) return new THREE.MeshLambertMaterial(Object.assign({ color: hex }, extra));
    const key = hex + (extra ? JSON.stringify(extra) : "");
    return mats[key] || (mats[key] = new THREE.MeshLambertMaterial(Object.assign({ color: hex }, extra || {})));
  };
  const GEO = { ball: new THREE.SphereGeometry(1, 16, 12), cyl: new THREE.CylinderGeometry(1, 1, 1, 24), cone: new THREE.ConeGeometry(1, 1, 16), box: new THREE.BoxGeometry(1, 1, 1) };
  function part(p, geo, hex, x, y, z, sx, sy, sz, extra) {
    const m = new THREE.Mesh(GEO[geo], M(hex, extra)); m.position.set(x, y, z);
    m.scale.set(sx, sy === undefined ? sx : sy, sz === undefined ? sx : sz); p.add(m); return m;
  }
  function glowTexture(inner, outer) {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const x = c.getContext("2d"), g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, inner); g.addColorStop(0.35, outer); g.addColorStop(1, "rgba(255,255,255,0)");
    x.fillStyle = g; x.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
  }
  const heartShape = new THREE.Shape();
  heartShape.moveTo(25, 25); heartShape.bezierCurveTo(25, 25, 20, 0, 0, 0); heartShape.bezierCurveTo(-30, 0, -30, 35, -30, 35);
  heartShape.bezierCurveTo(-30, 55, -10, 77, 25, 95); heartShape.bezierCurveTo(60, 77, 80, 55, 80, 35);
  heartShape.bezierCurveTo(80, 35, 80, 0, 50, 0); heartShape.bezierCurveTo(35, 0, 25, 25, 25, 25);
  const heartGeo = new THREE.ExtrudeGeometry(heartShape, { depth: 16, bevelEnabled: true, bevelThickness: 7, bevelSize: 6, bevelSegments: 4, curveSegments: 18 });
  heartGeo.center(); heartGeo.rotateZ(Math.PI); heartGeo.scale(0.01, 0.01, 0.01);

  /* ---------- 島的本體 ---------- */
  const N = 150, SIZE = 21;
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, N, N); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, cols = new Float32Array(pos.count * 3), hs = new Float32Array(pos.count);
  const bands = [[0.02, 0xffe6b0], [0.25, 0xfff3c4], [0.62, 0x9cf0c4], [1.1, 0xc6f48e], [99, 0xffe36e]];
  const col = new THREE.Color(), deepSea = new THREE.Color(0xa9e8f6);
  for (let i = 0; i < pos.count; i++) {
    const h = islandHeight(pos.getX(i), pos.getZ(i)); pos.setY(i, h); hs[i] = h;
    for (const [top, hex] of bands) { if (h < top) { col.setHex(hex); break; } }
    if (h < 0) col.lerp(deepSea, Math.min(1, -h / 0.45));
    cols[i * 3] = col.r; cols[i * 3 + 1] = col.g; cols[i * 3 + 2] = col.b;
  }

      const rise = Math.min(1, e / 1.5), sink = Math.max(0, (e - (EVENT - 1.5)) / 1.5);
      shell.position.y = -0.9 + 0.95 * ease(rise) - 0.95 * ease(sink);
      const open = e < 1.8 ? 0 : e < 3.3 ? ease((e - 1.8) / 1.5) : e < EVENT - 3.2 ? 1 : Math.max(0, 1 - ease((e - (EVENT - 3.2)) / 1.5));
      lid.rotation.x = -0.85 * open;
      const glow = open * (0.85 + 0.15 * Math.sin(e * 3));
      pearlGlow.scale.setScalar(0.2 + glow * 1.5); pearlGlow.material.opacity = glow;
      pearl.material.emissiveIntensity = 0.3 + glow * 0.7;
      shellSparkles.forEach((s, i) => {
        const p = ((e * 0.5 + i / 5) % 1);
        s.visible = open > 0.6;
        s.position.set(Math.cos(i * 1.3 + e) * 0.5, 0.45 + p * 1.2, 0.42 + Math.sin(i * 1.7 + e) * 0.4);
        s.scale.setScalar(0.25 * Math.sin(p * Math.PI)); s.material.opacity = Math.sin(p * Math.PI);
      });
      if (e > EVENT) { shell.visible = false; who = "whale"; start = t + GAP; }
    }
  });

  /* ---------- 雲與閃亮亮的星星（和粉彩地形島一樣） ---------- */
  const clouds = [];
  for (let i = 0; i < 6; i++) {
    const g = new THREE.Group(); g.scale.setScalar(0.9 + rnd() * 0.7); scene.add(g);
    [[0, 0, 0, 1], [0.9, -0.1, 0.1, 0.72], [-0.9, -0.12, -0.1, 0.68], [0.3, 0.38, -0.1, 0.7], [-0.35, 0.3, 0.2, 0.6]].forEach(([x, y, z, r]) => {
      const b = new THREE.Mesh(GEO.ball, M(0xffffff, { fog: false })); b.position.set(x, y, z); b.scale.set(r, r * 0.78, r); g.add(b);
    });
    clouds.push({ g, a: i * 1.05 + rnd(), rad: 14 + rnd() * 7, y: 7 + rnd() * 3.5, sp: 0.02 + rnd() * 0.025 });
  }
  ticks.push((t) => clouds.forEach((c) => { const a = c.a + (reduceMotion ? 0 : t * c.sp); c.g.position.set(Math.cos(a) * c.rad, c.y, Math.sin(a) * c.rad); }));
  const sc = document.createElement("canvas"); sc.width = sc.height = 64;
  const sx = sc.getContext("2d"), gr = sx.createRadialGradient(32, 32, 0, 32, 32, 30);
  gr.addColorStop(0, "rgba(255,255,255,.9)"); gr.addColorStop(1, "rgba(255,255,255,0)"); sx.fillStyle = gr; sx.fillRect(0, 0, 64, 64);
  sx.fillStyle = "#fff"; sx.beginPath(); sx.moveTo(32, 2); sx.quadraticCurveTo(35, 29, 62, 32); sx.quadraticCurveTo(35, 35, 32, 62); sx.quadraticCurveTo(29, 35, 2, 32); sx.quadraticCurveTo(29, 29, 32, 2); sx.fill();
  const SP = 120, spPos = new Float32Array(SP * 3), spCol = new Float32Array(SP * 3), spHex = [0xffffff, 0xfff3a0, 0xffc4e2, 0xd9c8ff];
  for (let i = 0; i < SP; i++) { const a = rnd() * 6.283, r = 5 + rnd() * 14; spPos.set([Math.cos(a) * r, 1.6 + rnd() * 9, Math.sin(a) * r], i * 3); col.setHex(spHex[i % 4]); spCol.set([col.r, col.g, col.b], i * 3); }
  const spGeo = new THREE.BufferGeometry(); spGeo.setAttribute("position", new THREE.BufferAttribute(spPos, 3)); spGeo.setAttribute("color", new THREE.BufferAttribute(spCol, 3));
  const spMat = new THREE.PointsMaterial({ map: new THREE.CanvasTexture(sc), size: 0.6, transparent: true, depthWrite: false, vertexColors: true, fog: false });
  const sparkles = new THREE.Points(spGeo, spMat); scene.add(sparkles);
  ticks.push((t) => { if (!reduceMotion) { sparkles.rotation.y = t * 0.03; spMat.size = 0.6 + 0.14 * Math.sin(t * 2.2); } });

  /* ---------- 鏡頭：拖曳旋轉、滾輪或雙指縮放 ---------- */
  const cam = { theta: 0.55, phi: 0.98, radius: 27, ty: 1.6 }, goal = Object.assign({}, cam);
  let aspect = 1;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const pts = new Map(); let pinch = 0, lastTouch = -10;
  canvas.addEventListener("pointerdown", (e) => { pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); pinch = 0; lastTouch = clock.elapsedTime; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} });
  canvas.addEventListener("pointermove", (e) => {
    const p = pts.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 1) { goal.theta -= dx * 0.006; goal.phi = clamp(goal.phi - dy * 0.005, 0.3, 1.42); }
    else if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch) goal.radius = clamp(goal.radius * pinch / d, 8, 46); pinch = d; }
    lastTouch = clock.elapsedTime;
  });
  const release = (e) => { pts.delete(e.pointerId); pinch = 0; };
  canvas.addEventListener("pointerup", release); canvas.addEventListener("pointercancel", release);
  canvas.addEventListener("wheel", (e) => { e.preventDefault(); goal.radius = clamp(goal.radius * Math.exp(e.deltaY * 0.0011), 8, 46); }, { passive: false });
  function resize() { const w = stage.clientWidth || 1, h = stage.clientHeight || 1; renderer.setSize(w, h, false); aspect = w / h; camera.aspect = aspect; camera.updateProjectionMatrix(); }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener("resize", resize);
  resize();

  const clock = new THREE.Clock(); let time = 0;
  function frame() {
    const dt = Math.min(0.1, clock.getDelta()); time = clock.elapsedTime;   // 用真實經過的時間，電腦比較慢時節奏也不會變慢
    // 放手幾秒後，島會自己慢慢轉
    if (!reduceMotion && pts.size === 0 && time - lastTouch > 4) goal.theta += dt * 0.08;
    for (const f of ticks) f(time, dt);
    const k = 1 - Math.exp(-dt * 4);
    for (const key in cam) cam[key] += (goal[key] - cam[key]) * k;
    const fit = aspect < 1 ? Math.min(1.8, 1 / aspect) : 1, r = cam.radius * fit, s = Math.sin(cam.phi);
    camera.position.set(r * s * Math.sin(cam.theta), cam.ty + r * Math.cos(cam.phi), r * s * Math.cos(cam.theta));
    camera.lookAt(0, cam.ty, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

try {
  if (!window.THREE) throw new Error("three.js 未載入");
  init3D();
} catch (err) {
  console.error(err);
  $("fallback").hidden = false;
}
</script>
