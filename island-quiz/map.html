<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星願群島：水晶奇緣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 版面：整頁是 3D 群島，島名標籤浮在島上方，點選後右下角出現資訊卡。永遠明亮。 */
:root{
  color-scheme: light;
  --plum:#4a2260; --plum-soft:#7a5590; --pink:#ff6fae; --pink-soft:#ffd3e6;
  --lav:#b79cff; --lav-soft:#e6dcff; --mint:#63dcb6; --mint-soft:#c8f7e6; --lemon:#ffe27a; --sky:#8fd3ff; --card:#fffafd;
  --font-display:"Chiron GoRound TC","Baloo 2","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-body);font-weight:500;color:var(--plum);overflow:hidden;
  background:linear-gradient(180deg,#bfe6ff 0%,#dcd3ff 26%,#ffd9ee 52%,#ffd9ee 100%);background-color:#ffd9ee;
}
.stage{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.pick{cursor:pointer}
.brand{position:absolute;left:20px;top:16px;right:20px;display:flex;align-items:center;gap:.4em;pointer-events:none;font-size:clamp(1.3rem,3vw,2.4rem)}
button:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
.logo{flex:none;pointer-events:auto;width:1.15em;height:1.15em;padding:0;border:0;background:none;cursor:pointer;transition:transform .15s}
.logo img{display:block;width:100%;height:100%}
.logo:hover{transform:translateY(-2px) rotate(-4deg)}
.brand h1{
  margin:0;min-width:0;white-space:nowrap;font-family:var(--font-display);font-weight:900;font-size:1em;line-height:1.15;color:var(--pink);
  text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,0 5px 0 rgba(183,156,255,.55)
}
.brand h1 .sub1{color:#a873ff}
.brand h1 .colon{color:#fff;text-shadow:0 2px 0 rgba(183,156,255,.7),0 0 6px rgba(183,156,255,.6)}
.brand h1[hidden]{display:none}
.lede{
  font-size:clamp(.85rem,1.5vw,1.05rem) !important;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 18px;border-radius:20px;
  background:rgba(255,255,255,.94);border:2.5px solid #fff;box-shadow:0 0 0 3px var(--pink-soft),0 8px 18px rgba(183,120,220,.22);
  font-family:var(--font-display);font-weight:800;font-size:clamp(.85rem,1.5vw,1.05rem);line-height:1.5;color:var(--plum);
  animation:pop .22s ease-out
}
.lede[hidden]{display:none}
.lede:hover{box-shadow:0 0 0 3px var(--pink),0 8px 18px rgba(183,120,220,.26)}
@media (prefers-reduced-motion:reduce){.lede{animation:none}.logo{transition:none}}
@keyframes pop{from{opacity:0;transform:translateX(-8px) scale(.96)}to{opacity:1;transform:none}}
.tip{position:absolute;left:20px;bottom:14px;margin:0;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.78);font-size:.85rem;font-weight:700;color:var(--plum-soft);pointer-events:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{
  position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;padding:3px 12px;border-radius:999px;
  font-family:var(--font-display);font-weight:800;font-size:.92rem;color:var(--plum);background:rgba(255,255,255,.9);
  border:2.5px solid #fff;box-shadow:0 3px 0 var(--pink-soft);transition:background .15s,color .15s,box-shadow .15s;will-change:transform
}
.tag.on{background:var(--pink);color:#fff;box-shadow:0 3px 0 #e0458f}
.tag.big{font-size:1.05rem;border-color:var(--lemon)}
.info{
  position:absolute;right:18px;bottom:18px;width:min(360px,calc(100% - 36px));background:var(--card);border-radius:26px;padding:22px 20px 18px;
  border:3px solid #fff;box-shadow:0 0 0 3px var(--pink-soft),0 14px 30px rgba(183,120,220,.28);display:flex;flex-direction:column;gap:10px
}
.info[hidden]{display:none}
.info::before{content:"";position:absolute;left:26px;right:26px;top:-3px;height:8px;border-radius:0 0 8px 8px;
  background:repeating-linear-gradient(90deg,var(--pink) 0 18px,var(--lemon) 18px 36px,var(--mint) 36px 54px,var(--sky) 54px 72px,var(--lav) 72px 90px)}
.info .kind{margin:0;font-size:.8rem;font-weight:700;letter-spacing:.1em;color:var(--plum-soft)}
.info h2{margin:0;font-family:var(--font-display);font-weight:900;font-size:1.45rem;line-height:1.3}
.info p{margin:0;line-height:1.7}
.state{align-self:flex-start;font-size:.82rem;font-weight:700;border-radius:999px;padding:2px 12px;background:var(--lav-soft)}
.state.open{background:var(--mint-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
button,a.go{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
.go{
  flex:1;min-height:48px;display:grid;place-items:center;border:0;border-radius:999px;padding:8px 20px;text-decoration:none;
  font-family:var(--font-display);font-weight:900;font-size:1.05rem;color:#fff;background:linear-gradient(180deg,#ff8fc2,var(--pink));
  box-shadow:0 5px 0 #e0458f;text-shadow:0 1px 0 rgba(160,30,100,.45)
}
.ghost{flex:1;min-height:48px;border-radius:999px;background:#fff;border:2.5px solid var(--lav-soft);font-family:var(--font-display);font-weight:800}
.ghost:hover{border-color:var(--pink)}
.fallback{position:absolute;left:20px;right:20px;top:50%;padding:14px 18px;border-radius:18px;background:#fff;border:2.5px solid #ff5f8a;font-weight:700}
@media (max-width:700px){
  .brand{left:12px;right:12px;top:10px}
  .brand{align-items:center}
  .tag{font-size:.74rem;padding:2px 8px}
  .tip{display:none}
  .info{right:10px;bottom:10px;width:calc(100% - 20px);padding:18px 16px 14px}
}
</style>
</head>

/* ---------- 地形島的高度函式（和「粉彩地形島」完全相同，縮小使用） ---------- */
function smooth(a, b, v) { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); }
const G = (x, z, cx, cz, s, h) => h * Math.exp(-((x - cx) ** 2 + (z - cz) ** 2) / (2 * s * s));
const PLAT = (x, z, cx, cz, r, h, edge) => h * (1 - smooth(r - (edge || 0.45), r, Math.hypot(x - cx, z - cz)));
function terrainLand(x, z) {
  let h = 0.32;
  h += G(x, z, -2.6, -2.6, 1.5, 3.6) + G(x, z, -1.2, -3.6, 0.9, 2.2) + G(x, z, -3.9, -1.4, 0.9, 2.0) + G(x, z, -2.2, -0.9, 0.7, 1.2) + G(x, z, -0.6, -2.0, 0.6, 0.9);
  h += G(x, z, 3.6, -3.8, 1.0, 1.1) + G(x, z, 5.0, -2.4, 0.9, 0.9) + G(x, z, 2.6, -2.2, 0.8, 0.8) + G(x, z, 4.6, -4.9, 0.8, 0.7) + G(x, z, 6.0, -3.9, 0.7, 0.6);
  h += 1.2 * (1 - smooth(1.5, 1.9, Math.hypot((x - 4.8) / 1.2, z - 2.6)));
  h += 1.5 * Math.exp(-(((Math.hypot(x + 4.3, z - 3.4) - 2.1) / 0.55) ** 2));
  return h;
}

function init3D() {

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xffd9ee, 80, 190);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 500);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xffc9e6, 0.78));
  const sun = new THREE.DirectionalLight(0xfff4e0, 0.5); sun.position.set(8, 14, 6); scene.add(sun);

  let seed = 20261115;
  const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const ticks = []; // 每一格要更新的小動畫

  /* ---------- 共用零件 ---------- */
  const mats = {};

    const key = hex + (extra ? JSON.stringify(extra) : "");

  };
  const GEO = {
    ball: new THREE.SphereGeometry(1, 14, 10), cyl: new THREE.CylinderGeometry(1, 1, 1, 14), cone: new THREE.ConeGeometry(1, 1, 14),
    box: new THREE.BoxGeometry(1, 1, 1), roof: new THREE.ConeGeometry(1, 1, 4), gem: new THREE.OctahedronGeometry(1),
    taper: new THREE.CylinderGeometry(0.7, 1, 1, 14)
  };
  function part(parent, geo, hex, x, y, z, sx, sy, sz, extra) {
    const m = new THREE.Mesh(GEO[geo], M(hex, extra)); m.position.set(x, y, z); m.scale.set(sx, sy === undefined ? sx : sy, sz === undefined ? sx : sz);

    if (single && moved < 6 && e.type === "pointerup") { const d = islandAt(...local(e)); if (d) select(d); }
  };
  canvas.addEventListener("pointerup", release); canvas.addEventListener("pointercancel", release);
  canvas.addEventListener("pointerleave", () => { hovered = null; canvas.classList.remove("pick"); });
  canvas.addEventListener("wheel", (e) => { e.preventDefault(); goal.radius = clamp(goal.radius * Math.exp(e.deltaY * 0.0011), 8, 80); }, { passive: false });

  function resize() { const w = stage.clientWidth || 1, h = stage.clientHeight || 1; renderer.setSize(w, h, false); aspect = w / h; camera.aspect = aspect; camera.updateProjectionMatrix(); }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener("resize", resize);
  resize();

  const clock = new THREE.Clock(); let time = 0;
  function frame() {
    const dt = Math.min(0.1, clock.getDelta()); time = clock.elapsedTime;   // 用真實經過的時間，電腦比較慢時節奏也不會變慢
    for (const f of ticks) f(time, dt);
    if (selected && selected.id === "sky") { const p = sky.position; goal.tx = p.x; goal.ty = p.y; goal.tz = p.z; }
    const k = 1 - Math.exp(-dt * 3.2);
    for (const key in cam) cam[key] += (goal[key] - cam[key]) * k;
    const r = cam.radius * fit(), s = Math.sin(cam.phi);
    camera.position.set(cam.tx + r * s * Math.sin(cam.theta), cam.ty + r * Math.cos(cam.phi), cam.tz + r * s * Math.cos(cam.theta));
    camera.lookAt(cam.tx, cam.ty, cam.tz);
    camera.updateMatrixWorld();
    for (const d of ISLANDS) {          // 滑鼠靠近或選取的島會微微放大
      const g = groups[d.id], want = d === hovered || d === selected ? 1.07 : 1;
      g.scale.setScalar(g.scale.x + (want - g.scale.x) * k * 2.5);
    }
    renderer.render(scene, camera);
    for (const t of tags) {
      const p = groups[t.d.id].position, c = screenOf(p.x, p.y + t.top, p.z);
      t.el.style.transform = "translate(-50%,-100%) translate(" + c[0].toFixed(1) + "px," + c[1].toFixed(1) + "px)";
      t.el.style.display = c[2] > 1 ? "none" : "";
      t.el.classList.toggle("on", t.d === hovered || t.d === selected);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return { select, onSelect(fn) { onSelect = fn; } };
}

/* ---------- 印章按鈕：在大標題和群島介紹之間切換 ---------- */
function showLede(on) {
  $("title").hidden = on; $("lede").hidden = !on;
  $("logoBtn").setAttribute("aria-expanded", String(on));
}
$("logoBtn").addEventListener("click", () => showLede($("lede").hidden));
$("lede").addEventListener("click", () => { showLede(false); $("logoBtn").focus(); });

/* ---------- 資訊卡 ---------- */
try {
  if (!window.THREE) throw new Error("three.js 未載入");
  const world = init3D();
  world.onSelect((d) => {
    $("info").hidden = !d; if (!d) return;
    $("iKind").textContent = d.kind; $("iName").textContent = d.name; $("iText").textContent = d.text;
    $("iState").textContent = d.state; $("iState").className = "state" + (d.url ? " open" : "");
    $("iGo").hidden = !d.url; if (d.url) $("iGo").href = d.url;
  });
  $("iBack").addEventListener("click", () => world.select(null));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") world.select(null); });
} catch (err) {
  $("fallback").hidden = false;
}
</script>
