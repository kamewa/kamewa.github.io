<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四季魔法島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 版面：整頁是一座 3D 島；左上角印章、島名、課程標籤；右下角四顆季節按鈕。永遠明亮。 */
:root{
  color-scheme: light;
  --plum:#4a2260; --plum-soft:#7a5590; --pink:#ff6fae; --pink-soft:#ffd3e6; --lav:#b79cff;
  --font-display:"Chiron GoRound TC","Baloo 2","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-body);font-weight:500;color:var(--plum);overflow:hidden;
  background:linear-gradient(180deg,#bfe6ff 0%,#dcd3ff 28%,#ffd9ee 56%,#ffd9ee 100%);background-color:#ffd9ee;
}
.stage{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
.brand{position:absolute;left:20px;top:16px;right:20px;display:flex;align-items:center;gap:.4em;pointer-events:none;font-size:clamp(1.3rem,3vw,2.4rem)}
.logo{flex:none;width:1.15em;height:1.15em;display:block}
.brand h1{
  margin:0;white-space:nowrap;font-family:var(--font-display);font-weight:900;font-size:1em;line-height:1.15;color:var(--pink);
  text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,0 5px 0 rgba(183,156,255,.55)
}
.chip{align-self:center;margin-left:.2em;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.85);font-size:clamp(.75rem,1.2vw,.9rem);font-weight:700;color:var(--plum-soft);white-space:nowrap}
.tip{position:absolute;left:20px;bottom:14px;margin:0;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.78);font-size:.85rem;font-weight:700;color:var(--plum-soft);pointer-events:none}
.seasons{position:absolute;right:18px;bottom:14px;display:flex;gap:8px}
.seasons button{
  width:48px;height:48px;border-radius:50%;border:2.5px solid #fff;background:rgba(255,255,255,.82);cursor:pointer;
  font-family:var(--font-display);font-weight:900;font-size:1.15rem;color:var(--plum-soft);box-shadow:0 3px 0 rgba(183,156,255,.45);
  transition:transform .15s,background .2s,color .2s
}
.seasons button:hover{transform:translateY(-2px)}
.seasons button:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
.seasons button[aria-pressed="true"]{color:#fff;transform:translateY(-2px)}
.seasons button[data-s="0"][aria-pressed="true"]{background:#ff8fc2}
.seasons button[data-s="1"][aria-pressed="true"]{background:#4fcf86}
.seasons button[data-s="2"][aria-pressed="true"]{background:#ff8a5c}
.seasons button[data-s="3"][aria-pressed="true"]{background:#8fb8ff}
.fallback{position:absolute;left:20px;right:20px;top:50%;padding:14px 18px;border-radius:18px;background:#fff;border:2.5px solid #ff5f8a;font-weight:700}
@media (max-width:600px){.brand{left:12px;top:10px;flex-wrap:wrap}.tip{display:none}.seasons{right:12px;bottom:12px}.seasons button{width:42px;height:42px;font-size:1rem}}
@media (prefers-reduced-motion:reduce){.seasons button{transition:none}}
</style>
<style>
.to-map{position:absolute;right:16px;top:16px;z-index:15;display:flex;align-items:center;gap:6px;padding:7px 15px 7px 11px;border-radius:999px;
  background:rgba(255,255,255,.86);border:2.5px solid #fff;box-shadow:0 3px 0 rgba(183,156,255,.45);
  font:700 .92rem/1 "Noto Sans TC",system-ui,sans-serif;color:#7a4f9a;text-decoration:none;transition:transform .15s,background .15s}
.to-map:hover{transform:translateY(-2px);background:#fff}
.to-map:focus-visible{outline:3px solid #ff8fc8;outline-offset:2px}
.to-map svg{width:18px;height:18px;flex:none}
@media (max-width:600px){.to-map{top:auto;bottom:12px;right:12px;font-size:.8rem;padding:6px 12px 6px 9px}}
@media (max-width:600px){.to-map{bottom:auto;top:10px}}</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="scene" aria-label="四季魔法島：中央的世界樹隨著春夏秋冬變換顏色，雲朵上的太陽帶來雨、雪、雷、冰與彩虹"></canvas>
  <header class="brand">
    <img class="logo" id="logo" alt="和" width="56" height="56">
    <h1>四季魔法島</h1>
    <span class="chip">課程 03｜氣候</span>
  </header>
  <p class="tip">拖曳旋轉　滾輪或雙指縮放</p>
  <div class="seasons" role="group" aria-label="切換季節">
    <button type="button" data-s="0" aria-pressed="true">春</button>
    <button type="button" data-s="1" aria-pressed="false">夏</button>
    <button type="button" data-s="2" aria-pressed="false">秋</button>
    <button type="button" data-s="3" aria-pressed="false">冬</button>
  </div>
  <p class="fallback" id="fallback" hidden>3D 畫面沒有載入成功，請確認網路後重新整理。</p>
<a class="to-map" href="https://kamewa.github.io/island-quiz/" aria-label="回到星願群島地圖"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>回到地圖</a>
</main>

function smooth(a, b, v) { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); }

function islandHeight(x, z) {
  const a = Math.atan2(z, x), r = Math.hypot(x, z);
  const R = 8.7 + 0.45 * Math.sin(3 * a + 1.1) + 0.3 * Math.sin(5 * a + 0.2) + 0.18 * Math.sin(8 * a + 2.0);
  const land = 0.4 + G(x, z, 0, 0, 2.3, 1.0) + G(x, z, -4.6, 2.6, 1.3, 0.55) + G(x, z, 4.2, 3.4, 1.2, 0.45) + G(x, z, 3.6, -4.4, 1.4, 0.6) + G(x, z, -3.4, -4.8, 1.1, 0.4);
  return -0.6 + (land + 0.6) * (1 - smooth(R - 1.2, R, r));

    const sq = a < 0.25 ? 1 - Math.sin(a / 0.25 * Math.PI) * 0.35 : 1, shrink = 1 - smooth(0.5, 1.1, a);
    g.scale.set(shrink * (2 - sq), shrink * sq, shrink * (2 - sq));
    g.userData.pops.forEach((p) => { const r = a * 1.6; p.position.set(g.position.x + Math.cos(p.userData.a) * r, g.position.y + a * 0.8, g.position.z + Math.sin(p.userData.a) * r); p.scale.setScalar(0.4 * Math.max(0, 1 - a / 1.1)); p.material.opacity = Math.max(0, 1 - a / 1.1); });
    if (a > 1.1) { g.visible = false; g.userData.pops.forEach((p) => { p.visible = false; }); return true; }
    return false;
  }
  function updateWind(m, t, dt) {
    const g = m.g; m.t += dt;
    const p = m.t / 2.8;
    g.position.addScaledVector(m.dir, dt * 2.9);
    g.position.y -= dt * 1.4;
    g.rotation.y = Math.atan2(camera.position.x - g.position.x, camera.position.z - g.position.z);
    g.userData.spin.rotation.z = -m.t * 2.2;
    const s = Math.min(1, m.t / 0.3) * (1 - smooth(0.8, 1, p));
    g.scale.set(active.sign * s, s, s);
    if (p >= 1) { g.visible = false; return true; }
    return false;
  }
  ticks.push((t, dt) => {
    if (!reduceMotion) seasonClock += dt;
    const cur = applySeason();
    // 雲朵慢慢在島的上空飄來飄去
    const k = reduceMotion ? 2 : t;
    const ca = k * 0.12, cr = 5.8 + Math.sin(k * 0.23) * 1.1; // 繞著世界樹外圍飄，不會撞進樹冠
    cloud.position.set(Math.cos(ca) * cr, 10.6 + Math.sin(k * 0.7) * 0.25, Math.sin(ca) * cr);
    cloud.rotation.y = Math.atan2(camera.position.x - cloud.position.x, camera.position.z - cloud.position.z);
    // 太陽：暖烘烘的光暈跟著季節變強變弱，像呼吸一樣
    const heat = w[0] * GLOW[0] + w[1] * GLOW[1] + w[2] * GLOW[2] + w[3] * GLOW[3];
    const breathe = reduceMotion ? 0 : Math.sin(t * 1.3) * 0.08;
    glowIn.scale.setScalar((2.3 + heat * 1.0) * (1 + breathe)); glowIn.material.opacity = Math.min(1, 0.35 + heat * 0.55);
    glowOut.scale.setScalar((3.2 + heat * 2.6) * (1 + breathe * 1.4)); glowOut.material.opacity = Math.min(0.9, heat * 0.6);
    sunLight.intensity = 0.2 + heat * 0.45;
    blushMat.color.copy(lerpHex(0xff9cc0, 0xff4f6a, w[1], cA)); blush.forEach((b) => b.scale.set(0.13 + w[1] * 0.08, 0.08 + w[1] * 0.05, 0.05));
    sunG.position.y = 1.55 + (reduceMotion ? 0 : Math.abs(Math.sin(t * (1.3 - w[3] * 0.8))) * 0.12 * (1 - w[3] * 0.7));
    steam.forEach((p) => { const q = reduceMotion ? p.userData.o : (t * 0.45 + p.userData.o) % 1; p.position.set(Math.sin(q * 9 + p.userData.o * 20) * 0.25, 0.85 + q * 1.6, 0); p.scale.setScalar(0.12 + q * 0.3); p.material.opacity = w[1] * 0.85 * Math.sin(q * Math.PI); });
    cap.scale.setScalar(Math.max(0.001, w[3])); cap.visible = w[3] > 0.01;
    zs.forEach((z) => { const q = reduceMotion ? z.userData.o : (t * 0.3 + z.userData.o) % 1; z.position.set(0.95 + q * 0.6, 0.4 + q * 1.2, 0.2); z.scale.setScalar(0.25 + q * 0.25); z.material.opacity = w[3] * Math.sin(q * Math.PI); });
    if (moodHold > 0) { moodHold -= dt; if (moodHold <= 0) setMood(SEASONS[cur].mood); }
    windPush += ((active && active.kind === "wind" ? 1.6 : 0) - windPush) * Math.min(1, dt * 2);
    if (reduceMotion) return;
    // 天氣：一次一組
    if (!active) { weatherTimer -= dt; if (weatherTimer <= 0) startWeather(cur); }
    else if (active.kind === "rainbow") {
      active.t += dt; const a = active.t, o = Math.min(1, a / 1.2) * (1 - smooth(4.5, 6, a));
      rainbow.position.set(cloud.position.x * 0.4, -0.3, cloud.position.z * 0.4);
      rainbow.rotation.y = Math.atan2(camera.position.x, camera.position.z);
      rbMats.forEach((m) => { m.opacity = o * 0.85; });
      if (a > 6) { rainbow.visible = false; active = null; weatherTimer = 1.4; }
    } else {
      active.t += dt;
      let done = 0;
      active.members.forEach((m) => {
        if (m.finished) { done++; return; }
        if (!m.started) { if (active.t >= m.delay) startMember(m, active.kind); else return; }
        if (active.kind === "wind" ? updateWind(m, t, dt) : updateDrop(m, active.kind, t, dt)) m.finished = true;
      });
      if (done === active.members.length) { active = null; weatherTimer = 1.2; }
    }
    flash.material.opacity = Math.max(0, flash.material.opacity - dt * 2.2);
    hemi.intensity += (0.78 - hemi.intensity) * Math.min(1, dt * 4);
  });

  /* ---------- 背景的雲與星星 ---------- */
  const clouds = [];
  for (let i = 0; i < 5; i++) {
    const g = new THREE.Group(); g.scale.setScalar(0.9 + rnd() * 0.7); scene.add(g);
    [[0, 0, 0, 1], [0.9, -0.1, 0.1, 0.72], [-0.9, -0.12, -0.1, 0.68], [0.3, 0.38, -0.1, 0.7]].forEach(([x, y, z, r]) => part(g, "ball", cloudMat, x, y, z, r, r * 0.78, r));
    clouds.push({ g, a: i * 1.25 + rnd(), rad: 17 + rnd() * 6, y: 6 + rnd() * 3, sp: 0.02 + rnd() * 0.02 });
  }
  ticks.push((t) => clouds.forEach((c) => { const a = c.a + (reduceMotion ? 0 : t * c.sp); c.g.position.set(Math.cos(a) * c.rad, c.y, Math.sin(a) * c.rad); }));
  const sc = document.createElement("canvas"); sc.width = sc.height = 64;
  const sx = sc.getContext("2d"), gr = sx.createRadialGradient(32, 32, 0, 32, 32, 30);
  gr.addColorStop(0, "rgba(255,255,255,.9)"); gr.addColorStop(1, "rgba(255,255,255,0)"); sx.fillStyle = gr; sx.fillRect(0, 0, 64, 64);
  sx.fillStyle = "#fff"; sx.beginPath(); sx.moveTo(32, 2); sx.quadraticCurveTo(35, 29, 62, 32); sx.quadraticCurveTo(35, 35, 32, 62); sx.quadraticCurveTo(29, 35, 2, 32); sx.quadraticCurveTo(29, 29, 32, 2); sx.fill();
  const SP = 110, spPos = new Float32Array(SP * 3), spCol = new Float32Array(SP * 3), spHex = [0xffffff, 0xfff3a0, 0xffc4e2, 0xd9c8ff];
  for (let i = 0; i < SP; i++) { const a = rnd() * 6.283, r = 6 + rnd() * 14; spPos.set([Math.cos(a) * r, 1.6 + rnd() * 10, Math.sin(a) * r], i * 3); col.setHex(spHex[i % 4]); spCol.set([col.r, col.g, col.b], i * 3); }
  const spGeo = new THREE.BufferGeometry(); spGeo.setAttribute("position", new THREE.BufferAttribute(spPos, 3)); spGeo.setAttribute("color", new THREE.BufferAttribute(spCol, 3));
  const spMat = new THREE.PointsMaterial({ map: new THREE.CanvasTexture(sc), size: 0.6, transparent: true, depthWrite: false, vertexColors: true, fog: false });
  const sparkles = new THREE.Points(spGeo, spMat); scene.add(sparkles);
  ticks.push((t) => { if (!reduceMotion) { sparkles.rotation.y = t * 0.03; spMat.size = 0.6 + 0.14 * Math.sin(t * 2.2); } });

  /* ---------- 鏡頭 ---------- */
  const cam = { theta: 0.5, phi: 1.08, radius: 33, ty: 4.2 }, goal = Object.assign({}, cam);
  let aspect = 1;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const clock = new THREE.Clock();
  const pts = new Map(); let pinch = 0, lastTouch = -10;
  canvas.addEventListener("pointerdown", (e) => { pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); pinch = 0; lastTouch = clock.elapsedTime; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} });
  canvas.addEventListener("pointermove", (e) => {
    const p = pts.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 1) { goal.theta -= dx * 0.006; goal.phi = clamp(goal.phi - dy * 0.005, 0.3, 1.45); }
    else if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch) goal.radius = clamp(goal.radius * pinch / d, 10, 52); pinch = d; }
    lastTouch = clock.elapsedTime;
  });
  const release = (e) => { pts.delete(e.pointerId); pinch = 0; };
  canvas.addEventListener("pointerup", release); canvas.addEventListener("pointercancel", release);
  canvas.addEventListener("wheel", (e) => { e.preventDefault(); goal.radius = clamp(goal.radius * Math.exp(e.deltaY * 0.0011), 10, 52); }, { passive: false });
  function resize() { const w = stage.clientWidth || 1, h = stage.clientHeight || 1; renderer.setSize(w, h, false); aspect = w / h; camera.aspect = aspect; camera.updateProjectionMatrix(); }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener("resize", resize);
  resize();

  let time = 0;
  function frame() {
    const dt = Math.min(0.1, clock.getDelta()); time = clock.elapsedTime;   // 用真實經過的時間，電腦比較慢時節奏也不會變慢
    if (!reduceMotion && pts.size === 0 && time - lastTouch > 4) goal.theta += dt * 0.07;
    const k = 1 - Math.exp(-dt * 4);
    for (const key in cam) cam[key] += (goal[key] - cam[key]) * k;
    const fit = aspect < 1 ? Math.min(1.8, 1 / aspect) : 1, r = cam.radius * fit, s = Math.sin(cam.phi);
    camera.position.set(r * s * Math.sin(cam.theta), cam.ty + r * Math.cos(cam.phi), r * s * Math.cos(cam.theta));
    camera.lookAt(0, cam.ty, 0);
    for (const f of ticks) f(time, dt);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

try {
  if (!window.THREE) throw new Error("three.js 未載入");
  init3D();
} catch (err) {
  console.error(err);
  $("fallback").hidden = false;
}
</script>
