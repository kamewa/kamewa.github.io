<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晶願守護島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 版面：整頁是一座 3D 島；左上角印章、島名、課程標籤。永遠明亮。 */
:root{
  color-scheme: light;
  --plum:#4a2260; --plum-soft:#7a5590; --pink:#ff6fae; --lav:#b79cff;
  --font-display:"Chiron GoRound TC","Baloo 2","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-body);font-weight:500;color:var(--plum);overflow:hidden;
  background:linear-gradient(180deg,#bfe6ff 0%,#dcd3ff 28%,#ffd9ee 56%,#ffd9ee 100%);background-color:#ffd9ee;
}
.stage{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
.brand{position:absolute;left:20px;top:16px;right:20px;display:flex;align-items:center;gap:.4em;pointer-events:none;font-size:clamp(1.3rem,3vw,2.4rem)}
.logo{flex:none;width:1.15em;height:1.15em;display:block}
.brand h1{
  margin:0;white-space:nowrap;font-family:var(--font-display);font-weight:900;font-size:1em;line-height:1.15;color:var(--pink);
  text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,0 5px 0 rgba(183,156,255,.55)
}
.chip{align-self:center;margin-left:.2em;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.85);font-size:clamp(.75rem,1.2vw,.9rem);font-weight:700;color:var(--plum-soft);white-space:nowrap}
.tip{position:absolute;left:20px;bottom:14px;margin:0;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.78);font-size:.85rem;font-weight:700;color:var(--plum-soft);pointer-events:none}
.fallback{position:absolute;left:20px;right:20px;top:50%;padding:14px 18px;border-radius:18px;background:#fff;border:2.5px solid #ff5f8a;font-weight:700}
@media (max-width:600px){.brand{left:12px;top:10px;flex-wrap:wrap}.tip{display:none}}
.stages{position:absolute;right:16px;bottom:14px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.stage-btn{font:inherit;font-weight:700;font-size:.9rem;color:var(--plum);background:rgba(255,255,255,.85);border:2px solid #fff;border-radius:999px;padding:7px 14px;cursor:pointer;box-shadow:0 3px 0 rgba(183,156,255,.45);transition:transform .15s,background .15s}
.stage-btn:hover{transform:translateY(-2px)}
.stage-btn:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.stage-btn.on{background:#3fd8a0;color:#fff;border-color:#e6fff4}
.stage-btn[data-stage="0"].on{background:#a49aa8}
.stage-btn[data-stage="0.5"].on{background:#ffb347}
@media (max-width:600px){.stages{left:12px;right:12px;justify-content:center}.stage-btn{font-size:.8rem;padding:6px 10px}}
</style>
<style>
.to-map{position:absolute;right:16px;top:16px;z-index:15;display:flex;align-items:center;gap:6px;padding:7px 15px 7px 11px;border-radius:999px;
  background:rgba(255,255,255,.86);border:2.5px solid #fff;box-shadow:0 3px 0 rgba(183,156,255,.45);
  font:700 .92rem/1 "Noto Sans TC",system-ui,sans-serif;color:#7a4f9a;text-decoration:none;transition:transform .15s,background .15s}
.to-map:hover{transform:translateY(-2px);background:#fff}
.to-map:focus-visible{outline:3px solid #ff8fc8;outline-offset:2px}
.to-map svg{width:18px;height:18px;flex:none}
@media (max-width:600px){.to-map{top:auto;bottom:12px;right:12px;font-size:.8rem;padding:6px 12px 6px 9px}}
@media (max-width:600px){.to-map{bottom:auto;top:10px}}</style>
</head>
<body>
<main class="stage" id="stage">
  <canvas id="scene" aria-label="晶願守護島：同一座島在三個階段之間變化。受傷的島：山坡砍光、下雨引發土石流、都市淹水、颱風、燃煤電廠與霧霾、海灘垃圾；守護行動：精靈種樹、架太陽能板、撿垃圾；永續的島：森林回來、風力與潮汐發電、滯洪池、綠屋頂、自行車道與小動物。中央的晶願循環碑是三箭頭回收標誌，中間的翡翠水晶亮度代表島的健康"></canvas>
  <header class="brand">
    <img class="logo" id="logo" alt="和" width="56" height="56">
    <h1>晶願守護島</h1>
    <span class="chip">課程 09｜議題</span>
  </header>
  <p class="tip">拖曳旋轉　滾輪或雙指縮放</p>
  <nav class="stages" aria-label="島的階段">
    <button class="stage-btn" type="button" data-stage="0">受傷的島</button>
    <button class="stage-btn" type="button" data-stage="0.5">守護行動</button>
    <button class="stage-btn" type="button" data-stage="1">永續的島</button>
    <button class="stage-btn" type="button" data-stage="auto">自動播放</button>
  </nav>
  <p class="fallback" id="fallback" hidden>3D 畫面沒有載入成功，請確認網路後重新整理。</p>
<a class="to-map" href="https://kamewa.github.io/island-quiz/" aria-label="回到星願群島地圖"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>回到地圖</a>
</main>

const TAU = Math.PI * 2;
function smooth(a, b, v) { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); }
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const G = (x, z, c, s, h) => h * Math.exp(-((x - c[0]) ** 2 + (z - c[1]) ** 2) / (2 * s * s));
const polar = (a, r) => [Math.cos(a) * r, Math.sin(a) * r];

/* ============================================================
   晶願守護島：同一座島的三個階段
     H = 0「受傷的島」 → H ≈ 0.5「守護行動」 → H = 1「永續的島」
   所有畫面都跟著 H 變化；中央的晶願循環碑就是島的健康指標
   配置：中央循環碑廣場　左後：森林山坡（土石流）　前方左：河流與海灘（垃圾、回收站）
         右前：都市（淹水、滯洪池、綠屋頂）　右後：燃煤電廠 → 太陽能板　山頂：風力發電
   ============================================================ */
const F = 1.07, BASE = 0.5;
const Rw = (a) => 9.9 + 0.45 * Math.sin(3 * a + 0.9) + 0.3 * Math.sin(5 * a + 0.2) + 0.2 * Math.sin(7 * a + 1.6);
const A_HILL = F + 2.5, P_HILL = polar(A_HILL, 6.2), P_HILL2 = polar(A_HILL + 0.6, 6.8);
const hills = (x, z) => G(x, z, P_HILL, 2.0, 3.4) + G(x, z, P_HILL2, 1.5, 1.6);
const A_CITY = F - 0.85, P_CITY = polar(A_CITY, 6.2), P_POND = polar(F - 0.2, 4.9), P_POWER = polar(F - 2.25, 5.6), P_HOUSE = polar(F + 2.05, 3.35);
const RIVER_CTL = [[A_HILL + 0.3, 5.0], [F + 1.95, 3.9], [F + 1.3, 3.5], [F + 0.95, 5.6], [F + 0.78, 7.8], [F + 0.72, 10.6]];
let RIVER = [];
function riverDist(x, z) {
  let best = 1e9;
  for (let i = 1; i < RIVER.length; i++) {
    const a = RIVER[i - 1], b = RIVER[i], dx = b.x - a.x, dz = b.z - a.z;
    let t = ((x - a.x) * dx + (z - a.z) * dz) / (dx * dx + dz * dz || 1); t = t < 0 ? 0 : t > 1 ? 1 : t;
    const ex = a.x + dx * t - x, ez = a.z + dz * t - z, d = ex * ex + ez * ez; if (d < best) best = d;
  }
  return Math.sqrt(best);
}
const FLATS = [[[0, 0], 2.0], [P_CITY, 2.6], [P_POWER, 1.4], [P_HOUSE, 0.8]];
function landHeight(x, z) {
  let land = BASE + 0.05 * Math.sin(x * 1.1) * Math.sin(z * 0.9) + hills(x, z);
  for (const [p, rad] of FLATS) { const w = 1 - smooth(rad, rad + 0.9, Math.hypot(x - p[0], z - p[1])); land += (BASE + hills(p[0], p[1]) * 0.3 - land) * w; }
  return land;
}
function islandHeight(x, z) {
  const r = Math.hypot(x, z), a = Math.atan2(z, x), u = r / Rw(a);
  let land = landHeight(x, z);
  if (RIVER.length) land -= 0.32 * (1 - smooth(0.32, 0.75, riverDist(x, z)));
  land -= 0.35 * (1 - smooth(0.6, 1.1, Math.hypot(x - P_POND[0], z - P_POND[1])));          // 滯洪池
  return -0.6 + (land + 0.6) * (1 - smooth(0.86, 1.0, u));
}
const ground = (x, z) => Math.max(0, islandHeight(x, z));

/* ---------- 三個階段的時間軸 ---------- */
const STAGES = [0, 0.5, 1];
let mode = "auto", manualTarget = 0, H = 0, autoT0 = 0;
function autoH(t) {                                // 一輪 64 秒
  const c = t % 64;
  if (c < 12) return 0;
  if (c < 34) return 0.55 * smooth(12, 34, c);
  if (c < 44) return 0.55 + 0.45 * smooth(34, 44, c);
  if (c < 60) return 1;
  return 1 - smooth(60, 64, c);
}
