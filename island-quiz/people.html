<title>繁晶慶典島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 版面：左邊是 3D 島嶼舞台，右邊（手機在下方）是作答卡。永遠明亮，不跟隨深色模式。 */
:root{
  color-scheme: light;
  --plum:#4a2260;        /* 文字 */
  --plum-soft:#7a5590;   /* 次要文字 */
  --pink:#ff6fae;        /* 主色：糖果粉 */
  --pink-soft:#ffd3e6;
  --lav:#b79cff;         /* 薰衣草紫 */
  --lav-soft:#e6dcff;
  --mint:#63dcb6;        /* 薄荷綠：答對 */
  --mint-soft:#c8f7e6;
  --lemon:#ffe27a;       /* 檸檬黃 */
  --sky:#8fd3ff;         /* 寶寶藍 */
  --berry:#ff5f8a;       /* 答錯 */
  --card:#fffafd;
  --font-display:"Chiron GoRound TC","Baloo 2","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}

.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:0}
.stage{position:relative;min-height:0;min-width:0;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}

.brand{position:absolute;left:20px;top:16px;right:20px;display:flex;align-items:center;gap:.4em;pointer-events:none;font-size:clamp(1.3rem,3vw,2.4rem)}
.logo{flex:none;width:1.15em;height:1.15em;display:block}
.brand h1{
  margin:0;white-space:nowrap;font-family:var(--font-display);font-weight:900;font-size:1em;line-height:1.15;color:var(--pink);
  text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,0 5px 0 rgba(183,156,255,.55)
}
.bchip{align-self:center;margin-left:.2em;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.85);font-size:clamp(.75rem,1.2vw,.9rem);font-weight:700;color:var(--plum-soft);white-space:nowrap}
/* 右上角：回到地圖＋名牌，排在 3D 畫面裡，不會蓋到作答卡 */
.corner{position:absolute;right:16px;top:16px;display:flex;align-items:center;gap:8px;z-index:5}
.to-map{display:flex;align-items:center;gap:6px;padding:7px 15px 7px 11px;border-radius:999px;background:rgba(255,255,255,.88);border:2.5px solid #fff;
  box-shadow:0 3px 0 rgba(183,156,255,.45);font:700 .92rem/1 var(--font-body);color:#7a4f9a;text-decoration:none;transition:transform .15s,background .15s}
.to-map:hover{transform:translateY(-2px);background:#fff}
.to-map:focus-visible{outline:3px solid #ff8fc8;outline-offset:2px}
.to-map svg{width:18px;height:18px;flex:none}
.tip{
  position:absolute;left:20px;bottom:14px;margin:0;padding:6px 14px;border-radius:999px;
  background:rgba(255,255,255,.78);font-size:.85rem;font-weight:700;color:var(--plum-soft);pointer-events:none
}
.fallback{
  position:absolute;inset:auto 20px 60px 20px;padding:14px 18px;border-radius:18px;
  background:#fff;border:2.5px solid var(--berry);font-weight:700
}

.panel{
  min-height:0;display:flex;flex-direction:column;gap:14px;padding:18px 18px 18px 6px;overflow-y:auto
}
.card{
  position:relative;background:var(--card);border-radius:28px;padding:22px 20px 20px;
  border:3px solid #fff;box-shadow:0 0 0 3px var(--pink-soft),0 14px 30px rgba(183,120,220,.28);
  display:flex;flex-direction:column;gap:14px
}
.card::before{ /* 糖果條紋飾帶 */
  content:"";position:absolute;left:26px;right:26px;top:-3px;height:8px;border-radius:0 0 8px 8px;
  background:repeating-linear-gradient(90deg,var(--pink) 0 18px,var(--lemon) 18px 36px,var(--mint) 36px 54px,var(--sky) 54px 72px,var(--lav) 72px 90px)
}
.progress{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hearts{display:flex;flex-wrap:wrap;gap:7px;list-style:none;margin:0;padding:0}
.hearts svg{width:26px;height:26px;display:block}
.hearts path{fill:#fff;stroke:var(--lav);stroke-width:2.2;transition:fill .3s,stroke .3s}
.hearts .now path{fill:var(--lemon);stroke:var(--pink)}
.hearts .ok path{fill:var(--pink);stroke:var(--pink)}
.hearts .no path{fill:var(--lav-soft);stroke:var(--lav)}
.count{font-family:var(--font-display);font-weight:800;font-size:.95rem;color:var(--plum-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.card h2{margin:0;font-family:var(--font-display);font-weight:900;font-size:1.35rem;line-height:1.35;text-wrap:balance}
.card p{margin:0;line-height:1.75;font-size:1rem}
.question{font-size:1.12rem !important;font-weight:700}

  if (!raw || typeof raw !== "object" || !raw.islands || typeof raw.islands !== "object") throw new Error("這不是星願群島的關卡設定檔。");
  const out = { format: "StarWishIslandsConfig", version: 1, islands: {} };
  Object.keys(raw.islands).forEach((k) => { if (/^[a-z0-9-]{1,30}$/.test(k)) out.islands[k] = normIsland(raw.islands[k], DEFAULT_CONFIG.islands[k]); });
  if (!out.islands[ISLAND_ID]) out.islands[ISLAND_ID] = normIsland(null, DEFAULT_CONFIG.islands[ISLAND_ID]);
  return out;
}
const exportConfig = () => JSON.stringify(config, null, 2);

let bankSrc = Object.assign({ label: "示範題目（網站上還沒有題庫檔）", demo: true }, readBank(DEMO_BANK));
let byId = new Map(bankSrc.list.map((q) => [q.id, q]));

let published = normConfig(DEFAULT_CONFIG), config = clone(published), hasDraft = false;
try { const who = JSON.parse(sessionStorage.getItem("island-quiz-session") || "null"), d = localStorage.getItem(CONFIG_KEY); if (d && who && who.role === "teacher") { config = normConfig(JSON.parse(d)); hasDraft = true; } } catch (e) { /* 沒有草稿 */ }

  items: a.items.map((it) => ({ q: byId.get(it.id), spot: it.spot })).filter((x) => x.q && !x.q.disabled) }));
const levelLabel = (l) => (l.kind === "practice" ? "練習・" : "評量・") + l.name;
const idle = () => !playing && !level;
// 網站上的題庫檔與關卡設定檔
fetch("data/questions.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : Promise.reject())).then((j) => {
  const b = readBank(j); useBank(b, "網站題庫（data/questions.json）", false);

fetch("data/islands.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : Promise.reject())).then((j) => {

/* ============================================================
   登入與雲端
   API_URL 是老師 Google 試算表上那支程式的網址；留空時不啟用登入（單機模式）。
   在 Claude 的預覽頁裡連不到雲端，所以預覽頁也是單機模式。
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbxCc_CpF-nJr1oRM1smz_jxSDGePPvVFwBBs7TdeuBG5Vp3W7rayIoKiGFVtMayN-gjNQ/exec";
const inPreview = /claude|anthropic/i.test(location.hostname);
const MAX_TRIES = 3;
const SESSION_KEY = "island-quiz-session";
let session = null;
try { session = JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch (e) {}
if (session && session.role !== "guest" && !session.token) session = null;
const cloudOn = () => !!API_URL && !inPreview;
const isStudent = () => cloudOn() && session && session.role === "student";
const isTeacher = () => !cloudOn() || (session && session.role === "teacher");
function setSession(s) {
  session = s;
  try { if (s) sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); else sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
}
async function api(payload) {
  // 用 text/plain 送出，瀏覽器才不會先發一次預檢請求（Apps Script 不支援）
  const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload), redirect: "follow" });
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}
function failText(res) {
  const map = {
    locked: "輸錯太多次，請 " + (res.minutes || 10) + " 分鐘後再試，或請老師幫忙。",
    wrong: "資料不正確，請再檢查一次。" + (res.left > 0 ? "還可以再試 " + res.left + " 次。" : ""),
    expired: "登入已經過期，請登出後重新登入。",
    limit: "這個評量已經作答 " + MAX_TRIES + " 次，不能再作答了。",
    exists: "這個座號已經有學生" + (res.name ? "（" + res.name + "）" : "") + "。請先把原本的學生轉出，或換一個座號。",
    not_found: "找不到這位學生。",
    bad_request: "資料格式不正確，請檢查後再試。"
  };
  return map[res.error] || "雲端暫時沒有回應，請稍後再試。";
}

/* ============================================================
   畫面：登入 → 關卡選單 → 作答 → 結果
   ============================================================ */
const HEART = '<svg viewBox="0 0 26 24" aria-hidden="true"><path d="M13 22 C4 15.5 1.5 11 1.5 7.2 C1.5 4 4 1.5 7.2 1.5 C9.7 1.5 11.8 2.9 13 5 C14.2 2.9 16.3 1.5 18.8 1.5 C22 1.5 24.5 4 24.5 7.2 C24.5 11 22 15.5 13 22 Z"/></svg>';
const view = $("view"), heartsEl = $("hearts"), countEl = $("count");
let level = null, quiz = [], step = 0, results = [], playing = false, opts = [];
let attempt = null;   // 評量：{ id, n }；null 代表這次不記錄
let cloudStatus = {}; // 評量：每關已用次數與分數

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function resetStage() {
  playing = false; quiz = []; results = []; step = 0; attempt = null;
  world.clearMarks(); world.rainbow(false); world.home(); $("confetti").innerHTML = "";
  heartsEl.innerHTML = "";
}
function drawHearts() {
  let html = "";
  for (let i = 0; i < quiz.length; i++) {
    const r = results[i], cls = r === true ? "ok" : r === false ? "no" : (playing && i === step ? "now" : "");
    const label = r === true ? "答對" : r === false ? "答錯" : "未作答";
    html += '<li class="' + cls + '" aria-label="第 ' + (i + 1) + " 題" + label + '">' + HEART + "</li>";
  }

}
function drawWho() {
  const box = $("who");
  if (!cloudOn() || !session) { box.hidden = true; return; }
  box.hidden = false;
  const label = session.role === "student" ? session.cls + " 班 " + session.seat + " 號　" + esc(session.name)
    : session.role === "teacher" ? "老師" : "訪客（不記錄成績）";

  $("whoOut").addEventListener("click", () => { setSession(null); home(); });
}
function home() {

}

/* ---------- 練習進度（存在這台電腦的瀏覽器） ---------- */
const progKey = () => "island-quiz-progress:" + ISLAND_ID + ":" + (isStudent() ? session.cls + "-" + session.seat : "guest");
function passedSet() { try { return JSON.parse(localStorage.getItem(progKey())) || []; } catch (e) { return []; } }
function markPassed(id) {
  const s = passedSet(); if (s.includes(id)) return false;
  s.push(id); try { localStorage.setItem(progKey(), JSON.stringify(s)); } catch (e) {}
  return true;
}
// 前一個「有題目」的難度過關後，下一個難度才開放；沒有題目的難度直接跳過
function unlocked(l, levels) {
  if (l.kind !== "practice" || isTeacher()) return true;
  const passed = passedSet();
  for (let j = levels.indexOf(l) - 1; j >= 0; j--) if (levels[j].pool.length) return passed.includes(levels[j].id);
  return true;
}

/* ---------- 關卡選單 ---------- */
async function showLevels() {
  resetStage(); level = null;
  countEl.textContent = isl().name;
  const practice = practiceLevels(), tests = assessmentLevels().filter((l) => l.items.length);
  const draw = (loading) => {
    const passed = passedSet();
    let html = "<h2>選一個關卡</h2><p class=\"lvl-head\">練習　不限次數，不記錄分數，每次隨機出題</p><div class=\"lvls\">";
    practice.forEach((l) => {
      const n = Math.min(isl().practiceCount, l.pool.length), open = unlocked(l, practice), done = passed.includes(l.id);
      const note = !n ? "尚無題目" : !open ? "通過上一個難度後開放" : "每次 " + n + " 題・答對 " + passFor(n) + " 題過關";
      html += '<button class="lvl' + (done ? " done" : "") + '" type="button" data-id="' + l.id + '"' + (n && open ? "" : " disabled") + ">" +
        '<span class="lvl-name">' + esc(l.name) + '</span><span class="lvl-note">' + note + '</span><span class="lvl-tag">' + (done ? "已過關" : !open && n ? "未開放" : "") + "</span></button>";
    });
    html += "</div>";
    if (tests.length) {
      html += '<p class="lvl-head">評量　每關最多 ' + MAX_TRIES + " 次，計算平均</p><div class=\"lvls\">";
      tests.forEach((l) => {
        const n = l.items.length, st = cloudStatus[l.id] || { used: 0, scores: [], avg: null };
        let note = n + " 題", tag = "", off = false;
        if (!cloudOn() || (session && session.role === "teacher")) { note += "・試玩，不記錄"; }
        else if (!isStudent()) { note = "登入後才能作答"; off = true; }
        else if (loading) { note = "讀取作答紀錄中…"; off = true; }
        else { note += "・已作答 " + st.used + "／" + MAX_TRIES + " 次"; tag = st.avg === null ? "" : "平均 " + st.avg + " 分"; off = st.used >= MAX_TRIES; }
        html += '<button class="lvl test" type="button" data-id="' + l.id + '"' + (off ? " disabled" : "") + ">" +
          '<span class="lvl-name">' + esc(l.name) + '</span><span class="lvl-note">' + note + '</span><span class="lvl-tag">' + tag + "</span></button>";
      });
      html += "</div>";
    }
    if (isTeacher() && bankSrc.demo) html += '<p class="lvl-head">目前使用示範題目。把評量系統的題庫檔放上網站後，就會改用你的題目。</p>';
    html += '<p class="login-msg" id="lvMsg" role="alert"></p>';
    view.innerHTML = html;
    view.querySelectorAll(".lvl").forEach((b) => b.addEventListener("click", () => pickLevel([...practice, ...tests].find((l) => l.id === b.dataset.id))));
  };
  const needCloud = isStudent() && tests.length;
  draw(needCloud);
  if (!needCloud) return;
  const who = session;
  try {
    const res = await api({ action: "status", token: session.token, island: isl().name });
    if (session !== who || level || playing) return;
    if (res.ok) { cloudStatus = res.levels || {}; draw(false); }
    else { draw(false); $("lvMsg").textContent = failText(res); }
  } catch (e) {
    if (session !== who || level || playing) return;
    draw(true); $("lvMsg").textContent = "連不上雲端，暫時無法作答評量。練習可以照常進行。";
  }
}
function pickLevel(l) {
  if (!l) return;
  level = l; sfx.tap();
  if (l.kind === "practice") { startQuiz(); return; }
  const recorded = isStudent(), st = cloudStatus[l.id] || { used: 0 }, n = l.items.length;
  countEl.textContent = "評量";
  view.innerHTML = "<h2>" + esc(l.name) + '</h2><p class="lead">共 ' + n + " 題。" +
    (recorded ? "按下「開始作答」就算一次，中途離開也算。你還可以作答 " + (MAX_TRIES - st.used) + " 次。" : "現在是試玩，不計次數，也不記錄分數。") +
    '作答中只會告訴你對或錯，不會顯示正確答案。</p><p class="login-msg" id="lvMsg" role="alert"></p>' +
    '<button class="go" id="lvGo" type="button">開始作答</button><button class="ghost" id="lvBack" type="button">回關卡選單</button>';
  $("lvBack").addEventListener("click", showLevels);
  $("lvGo").addEventListener("click", async () => {
    if (!recorded) { startQuiz(); return; }
    const go = $("lvGo"); go.disabled = true; go.textContent = "準備中…";
    try {
      const res = await api({ action: "begin", token: session.token, island: isl().name, levelId: l.id, levelName: l.name, total: n });
      if (res.ok) { attempt = { id: res.id, n: res.attempt }; startQuiz(); return; }
      $("lvMsg").textContent = failText(res);
    } catch (e) { $("lvMsg").textContent = "連不上雲端，請檢查網路後再試一次。這次不算作答。"; }
    if ($("lvGo")) { go.disabled = false; go.textContent = "開始作答"; }
  });
}

/* ---------- 作答 ---------- */
const toItem = (q, spot) => ({ spot: spot || "none", q: q.stem, options: q.options, answer: q.answer, why: q.explanation, img: q.image });
function startQuiz() {
  const keep = attempt;
  quiz = level.kind === "practice"
    ? shuffle(level.pool.slice()).slice(0, isl().practiceCount).map((q) => toItem(q, "none"))
    : shuffle(level.items.slice()).map((x) => toItem(x.q, x.spot));
  if (!quiz.length) { showLevels(); return; }
  step = 0; results = []; playing = true; attempt = keep;
  world.clearMarks(); world.rainbow(false); $("confetti").innerHTML = "";
  ask();
}
function ask() {
  const item = quiz[step], strict = level.kind === "assessment";
  world.clearMarks();
  quiz.forEach((q, i) => { if (i < step) world.mark(q.spot, results[i] ? "ok" : "no"); });
  world.mark(item.spot, "now"); world.focus(item.spot);
  countEl.textContent = levelLabel(level) + "　" + (step + 1) + "／" + quiz.length;
  drawHearts();
  opts = shuffle(item.options.map((t, i) => ({ t, right: i === item.answer })));
  view.innerHTML = '<p class="question">' + esc(item.q) + "</p>" +
    (item.img ? '<button class="qimg" id="qimg" type="button" aria-label="放大題目圖片"><img src="' + esc(item.img) + '" alt="題目圖片"></button>' : "") +
    '<div class="options">' + opts.map((o, i) => '<button class="opt" type="button" data-i="' + i + '">' + esc(o.t) + "</button>").join("") +
    '</div><div id="fb"></div>' + (strict ? "" : '<button class="textlink" id="quit" type="button">回關卡選單</button>');
  view.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => answer(b, item)));
  if (!strict) $("quit").addEventListener("click", showLevels);
  if (item.img) {
    const im = $("qimg").querySelector("img");
    im.addEventListener("error", () => { $("qimg").outerHTML = '<p class="login-msg">圖片載入失敗：' + esc(item.img) + "</p>"; });
    $("qimg").addEventListener("click", () => { $("zoomImg").src = item.img; $("zoom").hidden = false; $("zoom").focus(); });
  }
}
function answer(btn, item) {
  const ok = opts[+btn.dataset.i].right, strict = level.kind === "assessment"; results[step] = ok;
  view.querySelectorAll(".opt").forEach((b) => {
    b.disabled = true;
    const right = opts[+b.dataset.i].right;
    if (right && (!strict || b === btn)) { b.classList.add("right"); b.insertAdjacentHTML("beforeend", '<span class="mark">' + (strict ? "答對" : "正確答案") + "</span>"); }
    else if (b === btn) { b.classList.add("wrong"); b.insertAdjacentHTML("beforeend", '<span class="mark">你的答案</span>'); }
  });
  world.mark(item.spot, ok ? "ok" : "no");
  ok ? sfx.good() : sfx.bad();
  drawHearts();
  if ($("quit")) $("quit").remove();
  const last = step === quiz.length - 1, right = item.options[item.answer];
  const title = ok ? "答對了！" : strict ? "這一題答錯了。" : "差一點，答案是「" + esc(right) + "」";
  $("fb").outerHTML = '<div class="feedback ' + (ok ? "good" : "bad") + '"><strong>' + title + "</strong>" +
    (!strict && item.why ? "<p>" + esc(item.why) + "</p>" : "") + "</div>" +
    '<button class="go" id="next" type="button">' + (last ? "看結果" : "下一題") + "</button>";
  const next = $("next");
  next.addEventListener("click", () => { sfx.tap(); if (last) finish(); else { step++; ask(); } });
  next.focus({ preventScroll: true });
}
function finish() {
  const score = results.filter(Boolean).length, strict = level.kind === "assessment";
  const pass = score >= passFor(quiz.length);
  playing = false; world.home(); world.rainbow(pass);
  countEl.textContent = levelLabel(level); drawHearts();
  let title, extra = "";
  if (strict) {
    title = "評量完成";
  } else {
    title = score === quiz.length ? "全部答對，彩虹出現了！" : pass ? "過關！彩虹出現了" : "再試一次，把彩虹找出來";
    if (pass) {
      const fresh = markPassed(level.id), practice = practiceLevels(), nextLevel = practice.slice(practice.findIndex((l) => l.id === level.id) + 1).find((l) => l.pool.length);
      if (fresh && nextLevel) extra = '<p class="unlock">已開放新的難度：' + esc(nextLevel.name) + "</p>";
    }
  }
  view.innerHTML = "<h2>" + title + '</h2><p class="score">' + (strict ? Math.round(score / quiz.length * 100) + " <small>分（答對 " + score + "／" + quiz.length + " 題）</small>"
      : score + " <small>／ " + quiz.length + " 題</small>") + "</p>" + extra + '<ul class="review">' +
    quiz.map((q, i) => '<li><span class="tag ' + (results[i] ? "ok" : "no") + '">' + (results[i] ? "答對" : strict ? "答錯" : "再看看") + "</span><span>第 " + (i + 1) + " 題" +
      (strict ? "" : "　<b>" + esc(q.options[q.answer]) + "</b>") + "</span></li>").join("") +
    '</ul><p class="sync" id="sync"></p>' + (strict ? "" : '<button class="go" id="again" type="button">再玩一次</button>') +
    '<button class="' + (strict ? "go" : "ghost") + '" id="back" type="button">回關卡選單</button>';
  if (!strict) $("again").addEventListener("click", () => { sfx.tap(); startQuiz(); });
  $("back").addEventListener("click", showLevels);
  if (pass) { sfx.win(); confetti(); }
  if (strict) sendScore({ id: attempt && attempt.id, score, detail: results.map((r, i) => (i + 1) + (r ? "○" : "×")).join(" ") });
}
// 評量結束：把成績送到老師的試算表
async function sendScore(data) {
  const say = (t, retry) => {
    const el = $("sync"); if (!el) return;
    el.textContent = t;
    if (retry) {
      const b = document.createElement("button"); b.type = "button"; b.className = "textlink"; b.textContent = "重新送出";
      b.addEventListener("click", () => sendScore(data)); el.appendChild(b);
    }
  };
  if (!data.id) { say("試玩模式，這次沒有記錄。"); return; }
  say("成績傳送中…");
  try {
    const res = await api(Object.assign({ action: "score", token: session.token }, data));
    if (res.ok) say("第 " + res.used + " 次作答已記錄。目前平均 " + res.avg + " 分，" + (res.left > 0 ? "還可以作答 " + res.left + " 次。" : "作答次數已用完。"));
    else if (res.error === "done") say("這次成績先前已經記錄。");
    else if (res.error === "expired") say("登入已經過期，成績沒有送出。請不要關閉這個畫面，告訴老師。");
    else say("成績沒有送出。", true);
  } catch (err) { say("連不上雲端，成績沒有送出。", true); }
}
function confetti() {
  if (reduceMotion) return;
  const box = $("confetti"), colors = ["#ff6fae", "#ffe27a", "#63dcb6", "#8fd3ff", "#b79cff", "#ffffff"];
  let html = "";
  for (let i = 0; i < 36; i++) {
    html += '<i style="left:' + (Math.random() * 100).toFixed(1) + "%;background:" + colors[i % colors.length] +
      ";animation-duration:" + (2.4 + Math.random() * 2).toFixed(2) + "s;animation-delay:" + (Math.random() * 0.9).toFixed(2) +
      "s;transform:scale(" + (0.7 + Math.random() * 0.9).toFixed(2) + ')"></i>';
  }
  box.innerHTML = html;
  setTimeout(() => { box.innerHTML = ""; }, 6000);
}
$("zoom").addEventListener("click", () => { $("zoom").hidden = true; });
$("zoom").addEventListener("keydown", (e) => { if (e.key === "Escape" || e.key === "Enter") $("zoom").hidden = true; });

/* ---------- 登入 ---------- */

  view.innerHTML = asTeacher
    ? '<h2>老師登入</h2><form class="login" id="lgForm" novalidate>' +

      '<div class="field"><label for="lgSeat">座號</label><input id="lgSeat" type="text" inputmode="numeric" autocomplete="off" maxlength="2" placeholder="例如 12"></div></div>' +
      '<div class="field"><label for="lgCode">通關碼（老師發的 6 位數字）</label><input id="lgCode" type="password" inputmode="numeric" autocomplete="off" maxlength="6"></div>' +
      '<p class="login-msg" id="lgMsg" role="alert"></p><button class="go" id="lgGo" type="submit">登入</button></form>' +
      '<button class="ghost" id="lgGuest" type="button">訪客進入（只能練習）</button>' +
      '<button class="textlink" id="lgTeacher" type="button">我是老師</button>';
  const msg = (t) => { $("lgMsg").textContent = t; };
  if (asTeacher) $("lgBack").addEventListener("click", () => showLogin(false));
  else {
    $("lgGuest").addEventListener("click", () => { setSession({ role: "guest" }); sfx.tap(); home(); });
    $("lgTeacher").addEventListener("click", () => showLogin(true));
  }
  $("lgForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = $("lgCode").value.trim();
    let payload;
    if (asTeacher) {
      if (!code) { msg("請輸入教師碼。"); return; }
      payload = { action: "teacher", code };
    } else {
      const cls = $("lgCls").value.trim(), seat = $("lgSeat").value.trim();
      if (!/^\d{3}$/.test(cls)) { msg("班級請輸入 3 位數字，例如 204。"); $("lgCls").focus(); return; }
      if (!/^\d{1,2}$/.test(seat) || +seat < 1) { msg("座號請輸入數字，例如 12。"); $("lgSeat").focus(); return; }
      if (!/^\d{6}$/.test(code)) { msg("通關碼是 6 位數字。"); $("lgCode").focus(); return; }
      payload = { action: "login", cls, seat: +seat, code };
    }
    const go = $("lgGo"); go.disabled = true; go.textContent = "登入中…"; msg("");
    try {
      const res = await api(payload);
      if (res.ok) {
        cloudStatus = {};
        setSession(res.role === "teacher" ? { role: "teacher", token: res.token } : { role: "student", cls: res.cls, seat: res.seat, name: res.name, token: res.token });
        sfx.good(); home(); return;
      }
      msg(failText(res)); $("lgCode").value = "";
    } catch (err) {
      msg("連不上雲端，請檢查網路後再試一次。" + (asTeacher ? "" : "也可以先用訪客進入。"));
    }
    if ($("lgGo")) { go.disabled = false; go.textContent = "登入"; }
  });
}
world.onPick(() => { // 在關卡選單時，點島上的愛心直接開始第一個可玩的練習
  if (playing || level || (cloudOn() && !session)) return;
  const practice = practiceLevels(), first = practice.find((l) => l.pool.length && unlocked(l, practice));
  if (first) pickLevel(first);
});

home();

})();
</script>
</body>
</html>
