<style>
/* 版面：整頁是 3D 城堡島，城堡名牌浮在城堡上方，點選後右下角出現介紹卡。永遠明亮。 */
:root{
  color-scheme: light;
  --plum:#4a2260; --plum-soft:#7a5590; --pink:#ff6fae; --pink-soft:#ffd3e6;
  --lav:#b79cff; --lav-soft:#e6dcff; --mint:#63dcb6; --mint-soft:#c8f7e6; --lemon:#ffe27a; --sky:#8fd3ff; --card:#fffafd;
  --font-display:"Chiron GoRound TC","Baloo 2","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-body);font-weight:500;color:var(--plum);overflow:hidden;
  background:linear-gradient(180deg,#a9dcff 0%,#d8ecff 32%,#fff1d2 72%,#fff1d2 100%);background-color:#fff1d2;
}
.stage{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.pick{cursor:pointer}
#scene:active{cursor:grabbing}
.brand{position:absolute;left:20px;top:16px;right:20px;display:flex;align-items:center;gap:.4em;pointer-events:none;font-size:clamp(1.3rem,3vw,2.4rem)}
.logo{flex:none;width:1.15em;height:1.15em;display:block}
.brand h1{
  margin:0;white-space:nowrap;font-family:var(--font-display);font-weight:900;font-size:1em;line-height:1.15;color:var(--pink);
  text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,0 5px 0 rgba(183,156,255,.55)
}
.chip{align-self:center;margin-left:.2em;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.85);font-size:clamp(.75rem,1.2vw,.9rem);font-weight:700;color:var(--plum-soft);white-space:nowrap}
.corner{position:absolute;right:16px;top:16px;display:flex;align-items:center;gap:8px;z-index:5}
.to-map{display:flex;align-items:center;gap:6px;padding:7px 15px 7px 11px;border-radius:999px;background:rgba(255,255,255,.88);border:2.5px solid #fff;
  box-shadow:0 3px 0 rgba(183,156,255,.45);font:700 .92rem/1 var(--font-body);color:#7a4f9a;text-decoration:none;transition:transform .15s,background .15s}
.to-map:hover{transform:translateY(-2px);background:#fff}
.to-map:focus-visible,button:focus-visible{outline:3px solid #ff8fc8;outline-offset:2px}
.to-map svg{width:18px;height:18px;flex:none}
.to-map.small{padding:6px 11px 6px 9px;font-size:.82rem}
.who{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 16px;border-radius:999px;background:rgba(255,255,255,.88);border:2.5px solid #fff;font-size:.9rem;font-weight:700}
.who[hidden]{display:none}
.who button{border:0;border-radius:999px;padding:5px 14px;background:var(--pink-soft);font:inherit;font-size:.85rem;font-weight:700;color:var(--plum);cursor:pointer}
.tip{position:absolute;left:20px;bottom:14px;margin:0;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.78);font-size:.85rem;font-weight:700;color:var(--plum-soft);pointer-events:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
/* 名牌：外層 .pin 負責跟著城堡移動；內層按鈕只做「浮起」的小動畫，不會跳位 */
.pin{position:absolute;left:0;top:0;will-change:transform}
.tag{
  display:block;white-space:nowrap;padding:3px 12px;border-radius:999px;cursor:pointer;pointer-events:auto;transform-origin:50% 100%;
  font-family:var(--font-display);font-weight:800;font-size:clamp(.66rem,1.1vw,.9rem);color:var(--plum);background:rgba(255,255,255,.9);
  border:2.5px solid #fff;box-shadow:0 3px 0 var(--pink-soft);transition:transform .15s ease-out,background .15s,color .15s,box-shadow .15s
}
.tag:hover,.tag:focus-visible{transform:translateY(-3px) scale(1.05);background:#fff;box-shadow:0 6px 0 var(--pink-soft),0 8px 14px rgba(183,120,220,.25)}
.tag:active{transform:translateY(0) scale(1);box-shadow:0 2px 0 var(--pink-soft)}
.tag.on{background:var(--pink);color:#fff;box-shadow:0 3px 0 #e0458f}
.tag.on:hover{box-shadow:0 6px 0 #e0458f,0 8px 14px rgba(224,69,143,.25)}
.tag.special{border-color:var(--lemon)}
.info{
  position:absolute;right:18px;bottom:18px;width:min(360px,calc(100% - 36px));background:var(--card);border-radius:26px;padding:22px 20px 18px;z-index:6;
  border:3px solid #fff;box-shadow:0 0 0 3px var(--pink-soft),0 14px 30px rgba(183,120,220,.28);display:flex;flex-direction:column;gap:10px;animation:pop .2s ease-out
}
.info[hidden]{display:none}
.info::before{content:"";position:absolute;left:26px;right:26px;top:-3px;height:8px;border-radius:0 0 8px 8px;

/* ============================================================

/* ---------- 樹 ---------- */
const TREE = {

/* ---------- 房子（依地區風格） ---------- */

      case "am": V.add("box", pick(rnd, [0xfbe6d6, 0xdff0ff, 0xfff4cc, 0xe8e0ff]), 0, 0, 0, 0.4, 0.34, 0.32); V.add("prism", pick(rnd, [0x7fd2b3, 0xc97b6a, 0x8f96b4]), 0, 0.34, 0, 0.46, 0.3, 0.38); break;

const VILLAGES = [
  ["europe", "eu", 10, 2.6, 5.0], ["neasia", "jp", 9, 2.6, 4.6], ["westasia", "desert", 12, 2.8, 5.2], ["africa", "hut", 12, 2.8, 5.2],
  ["china", "cn", 10, 2.6, 4.8], ["seasia", "stilt", 9, 3.0, 5.0], ["america", "am", 9, 2.5, 4.4], ["taiwan", "tw", 7, 1.6, 3.4],
  ["global", "pastel", 12, 5.4, 8.0]

/* ---------- 山水峰林：一根根拔地而起的石峰 ---------- */
function buildKarst(V, busy, rnd) {
  const peaks = [];
  const add = (x, z, r, h, top) => {
    const y = ground(x, z) - 0.15;
    const tilt = top ? 0 : (rnd() - 0.5) * 0.12, col = pick(rnd, [0xd2c9de, 0xc9cdd8, 0xd6d3e2, 0xc6cfd2]);
    V.add(top ? "karstTop" : "karst", col, x, y, z, r, h + 0.15, r * (0.8 + rnd() * 0.3), rnd() * TAU, tilt, tilt);
    if (!top && rnd() < 0.35) V.add("karst", col, x + r * 0.35, y + h * 0.35, z - r * 0.2, r * 0.55, h * 0.45, r * 0.5, rnd() * TAU);
    // 岩壁上的苔蘚與小樹
    for (let k = 0; k < 3; k++) { const a = rnd() * TAU, f = 0.3 + rnd() * 0.45, rr = r * (0.95 - f * 0.25); V.add("sph", 0x9fd3a2, x + Math.cos(a) * rr, y + h * f, z + Math.sin(a) * rr, r * 0.32, r * 0.16, r * 0.32); }

    peaks.push([x, z, r, y + h]); busy.push([x, z, r + 0.1]);
  };
  KARST_MAIN.forEach(([x, z, r, h]) => add(x, z, r, h, true));
  for (let tries = 0; tries < 700 && peaks.length < 42; tries++) {
    const a = rnd() * TAU, d = Math.sqrt(rnd()) * 4.6, x = -7.4 + Math.cos(a) * d, z = 4.0 + Math.sin(a) * d * 0.95;
    const r = 0.26 + rnd() * 0.36, h = (1.8 + rnd() * 2.6) * (1.1 - d / 9);
    if (Z.karst(x, z) < 0.35 || islandHeight(x, z) < 0.08 || riverK(x, z) > 0 || nearRoad(x, z, r + 0.35)) continue;
    if (RIVERS.some((rv) => lineDist(x, z, rv.pts) < r + rv.w + 0.1)) continue;
    if (peaks.some(([px, pz, pr]) => Math.hypot(px - x, pz - z) < pr + r + 0.12)) continue;
    add(x, z, r, h, false);
  }
  return peaks;
}

/* ---------- 建造全部 ---------- */
function buildExtras(V, S, busy, low) {
  const rnd = makeRnd(2026);
  const free = (x, z, r) => busy.every(([bx, bz, br]) => Math.hypot(x - bx, z - bz) > r + br);
  const karst = buildKarst(V, busy, rnd);

  // 村莊

    const c = CASTLE[id];
    for (let k = 0, tries = 0; k < (low ? Math.ceil(n * 0.7) : n) && tries < 200; tries++) {
      const a = rnd() * TAU, r = r0 + rnd() * (r1 - r0), x = c.x + Math.cos(a) * r, z = c.z + Math.sin(a) * r;
      if (!okGround(x, z, 0.16) || !free(x, z, 0.35) || nearRoad(x, z, 0.32)) continue;
      if (id === "global" && Math.hypot(x, (z + 4.2) * 1.05) < 4.7) continue;     // 台地的懸崖上不蓋房子
      const ry = Math.atan2(c.x - x, c.z - z) + (rnd() - 0.5) * 0.5;

    const h = islandHeight(x, z); if (h < 0.18) continue;
    if (riverK(x, z) > 0.1 || bayMask(x, z) > 0.1 || Z.ice(x, z) > 0.3 || roadK(x, z) > 0.05 || nearRoad(x, z, 0.3)) continue;

    if (Z.karst(x, z) > 0.45) type = r < 0.22 ? "round" : r < 0.32 ? "bush" : null;
    else if (Z.north(x, z) > 0.5) { if (h > 4.2) continue; if (r < 0.75) type = "conifer"; }
    else if (Z.amer(x, z) > 0.5) type = r < 0.6 ? "maple" : r < 0.85 ? "conifer" : null;
    else if (Z.taiwan(x, z) > 0.5) type = r < 0.45 ? "round" : r < 0.7 ? "palm" : null;
    else if (Z.desert(x, z) > 0.45) { const oasis = Math.hypot(x + 17.6, z + 5.4) < 2.2; type = oasis ? (r < 0.9 ? "palm" : null) : (r < 0.1 ? "cactus" : null); }
    else if (Z.savanna(x, z) > 0.45) type = r < 0.07 ? "baobab" : r < 0.18 ? "acacia" : r < 0.28 ? "bush" : null;
    else if (Z.jungle(x, z) > 0.4) type = r < 0.75 ? "jungle" : r < 0.92 ? "palm" : null;
    else if (Z.sakura(x, z) > 0.4) type = r < 0.6 ? "sakura" : r < 0.7 ? "round" : null;
    else if (Z.china(x, z) > 0.4) type = r < 0.3 ? "round" : r < 0.42 ? "conifer" : null;
    else if (plateau) type = r < 0.2 ? "round" : r < 0.3 ? "bush" : null;
    else type = r < 0.32 ? "round" : r < 0.4 ? "conifer" : r < 0.5 ? "bush" : null;
    if (!type) continue;

  const bridges = [];

    let inside = false, sx = 0, sz = 0;
    for (let i = 0; i < rd.length - 1; i++) {
      const [ax, az] = rd[i], [bx, bz] = rd[i + 1], l = Math.hypot(bx - ax, bz - az), n = Math.ceil(l / 0.12);

    V.place(cx, y, cz, ry, 1, () => {
      V.add("box", 0xe9ddd0, 0, 0.06, 0, l, 0.08, 0.34);
      V.add("arch", 0xd9cbbd, 0, -0.32, 0, l * 0.42, l * 0.36, 1.1);
      [-1, 1].forEach((s) => V.add("box", 0xf4ece2, 0, 0.14, s * 0.16, l, 0.08, 0.04));
    });
  }

  // 臺灣長橋：低矮的連拱橋
  {
    const [[ax, az], [bx, bz]] = BRIDGE_TW, l = Math.hypot(bx - ax, bz - az), ry = Math.atan2(-(bz - az), bx - ax), n = Math.round(l / 0.9);

(function who() {
  let s = null; try { s = JSON.parse(sessionStorage.getItem("island-quiz-session") || "null"); } catch (e) { s = null; }
  if (!s) return;
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const label = s.role === "student" ? s.cls + " 班 " + s.seat + " 號　" + esc(s.name) : s.role === "teacher" ? "老師" : "訪客（不記錄成績）";
  const box = $("who"); box.hidden = false;
  box.innerHTML = "<span>" + label + '</span><button type="button" id="whoOut">' + (s.role === "guest" ? "登入" : "登出") + "</button>";
  $("whoOut").addEventListener("click", () => { try { sessionStorage.removeItem("island-quiz-session"); } catch (e) {} location.href = "https://kamewa.github.io/island-quiz/"; });
})();

/* ---------- 地表顏色：青綠山水（低處黃綠、山腰石青綠、山頂石青藍） ---------- */
const HEX = {}; const rgbOf = (hex) => HEX[hex] || (HEX[hex] = hexRGB(hex));
function mixTo(c, hex, f) { if (f <= 0) return; f = Math.min(1, f); const t = rgbOf(hex); c[0] += (t[0] - c[0]) * f; c[1] += (t[1] - c[1]) * f; c[2] += (t[2] - c[2]) * f; }
function groundColor(x, z, h, ny, c) {
  const m = ssMask(x, z);
  if (h < 0) {
    const lk = lakeK(x, z) * smooth(-0.05, 0.05, m);
    const v = rgbOf(0x3fc4b8); c[0] = v[0]; c[1] = v[1]; c[2] = v[2];
    mixTo(c, 0x1d5fb0, smooth(0.1, 1.6, -h) * (1 - lk)); mixTo(c, 0x2a9fb0, lk * smooth(0.2, 0.6, -h) * 0.5);
    return c;
  }
  const v = rgbOf(0xb4dc6a); c[0] = v[0]; c[1] = v[1]; c[2] = v[2];
  mixTo(c, 0x9fd36a, 0.5 + 0.5 * Math.sin(x * 1.2) * Math.sin(z * 1.4));
  mixTo(c, 0x3fb58f, smooth(0.9, 2.2, h));
  mixTo(c, 0x2f93b8, smooth(2.4, 3.8, h));
  mixTo(c, 0x2f5fb8, smooth(3.9, 5.6, h));
  mixTo(c, 0x2a5a9a, smooth(0.8, 0.5, ny) * 0.7);
  // 茶園梯田的條紋
  const tea = G(x, z, 13.6, 10.2, 2.8, 1); if (tea > 0.25 && h > 0.6) mixTo(c, Math.floor(h * 10) % 2 ? 0x8fd06a : 0x5fb85a, 0.8);
  // 沙灘與水岸
  mixTo(c, 0xf2e2ae, (1 - smooth(0.08, 0.3, h)) * (1 - smooth(0.02, 0.1, m)));
  mixTo(c, 0xd9e8a8, (1 - smooth(0.05, 0.25, h)) * lakeK(x, z));
  // 宮殿台地與中軸線
  const pal = (1 - smooth(4.2, 5.2, Math.max(Math.abs(x), Math.abs(z + 12.8) * 1.3))); mixTo(c, 0xefe6d0, pal * 0.6);
  return c;
}

function init3D() {
  const canvas = $("scene"), stage = $("stage");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: !LOW, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, LOW ? 1.5 : 2));
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xeef3ff, 80, 200);
  const camera = new THREE.PerspectiveCamera(38, 1, 0.3, 500);
  scene.add(new THREE.HemisphereLight(0xfffaf0, 0x9fb8e0, 0.8));
  const sun = new THREE.DirectionalLight(0xfff4dc, 0.55); sun.position.set(15, 30, 20); scene.add(sun);
  const ticks = [];
  const rnd = makeRnd(515);

  /* ---------- 地形 ---------- */
  const NX = LOW ? 180 : 260, NZ = LOW ? 170 : 245, W = 60, D = 56;
  const geo = new THREE.PlaneGeometry(W, D, NX, NZ); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, hs = new Float32Array(pos.count);
  for (let i = 0; i < pos.count; i++) { const h = islandHeight(pos.getX(i), pos.getZ(i)); pos.setY(i, h); hs[i] = h; }
  const src = geo.index.array, keep = [];
  for (let i = 0; i < src.length; i += 3) if (Math.max(hs[src[i]], hs[src[i + 1]], hs[src[i + 2]]) > -2.1) keep.push(src[i], src[i + 1], src[i + 2]);
  geo.setIndex(keep); geo.computeVertexNormals();
  const nor = geo.attributes.normal, cols = new Float32Array(pos.count * 3), c = [0, 0, 0];
  for (let i = 0; i < pos.count; i++) { groundColor(pos.getX(i), pos.getZ(i), hs[i], nor.getY(i), c); cols[i * 3] = c[0]; cols[i * 3 + 1] = c[1]; cols[i * 3 + 2] = c[2]; }
  geo.setAttribute("color", new THREE.BufferAttribute(cols, 3));
  scene.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true })));
  const sea = new THREE.Mesh(new THREE.CircleGeometry(260, 72), new THREE.MeshBasicMaterial({ color: 0x3fa8de, transparent: true, opacity: 0.72, depthWrite: false }));
  sea.rotation.x = -Math.PI / 2; sea.renderOrder = 1; scene.add(sea);

  /* ---------- 建築、石峰、樹木（合併網格） ---------- */
  const S = makeBatch(LOW), V = makeBatch(true), glows = [], lamps = [];
  const env = { flag: () => {}, ice: S, glowAt: (p) => glows.push(p), lampAt: (p) => lamps.push(p) };

    const snout = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 6), mat); snout.scale.set(1, 0.7, 1.4); snout.position.set(0, -0.05, 0.38); head.add(snout);
    [-1, 1].forEach((s) => {
      const horn = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.45, 5), finMat); horn.position.set(s * 0.16, 0.3, -0.15); horn.rotation.set(-0.8, 0, s * 0.35); head.add(horn);
      const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.006, 0.7, 4), finMat); wh.position.set(s * 0.22, -0.1, 0.55); wh.rotation.set(1.2, 0, s * 0.9); head.add(wh);
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 5), LM(0xff5a3c, { transparent: true })); eye.position.set(s * 0.18, 0.1, 0.22); head.add(eye);
    });
    // 四隻小爪
    const claws = [6, 9, N - 18, N - 14].map(() => { const c = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.35, 4), mat); g.add(c); return c; });
    const path = (u) => new THREE.Vector3(13.5 * Math.cos(u) + 3.5 * Math.sin(2.3 * u), 7.6 + 1.6 * Math.sin(1.7 * u) + 0.8 * Math.sin(3.1 * u), 11 * Math.sin(u) + 3 * Math.cos(1.6 * u));
    const tmp = new THREE.Vector3(), nxt = new THREE.Vector3();
    return (t) => {
      const u0 = t * 0.09, spacing = 0.024;
      const vis = smooth(0.15, 0.55, Math.sin(t * 0.13) * 0.5 + 0.5 + 0.25 * Math.sin(t * 0.41));
      mat.opacity = finMat.opacity = vis * 0.95; g.visible = vis > 0.02;
      for (let i = 0; i < N; i++) {
        const u = u0 - (i + 1) * spacing, p = path(u); p.y += Math.sin(t * 2.2 - i * 0.35) * 0.18;
        const s = segs[i]; s.m.position.copy(p); nxt.copy(path(u + 0.01)); nxt.y += Math.sin(t * 2.2 - (i - 0.4) * 0.35) * 0.18; s.m.lookAt(nxt);
        if (s.fin) { s.fin.position.copy(p).y += s.r * 1.05; s.fin.rotation.set(0, 0, 0); s.fin.lookAt(nxt.x, nxt.y + s.r, nxt.z); s.fin.rotateX(Math.PI / 2 - 0.6); }
      }
      const hp = path(u0); head.position.copy(hp); head.lookAt(tmp.copy(path(u0 + 0.015)));
      [6, 9, N - 18, N - 14].forEach((k, j) => { const p = segs[k].m.position; claws[j].position.set(p.x, p.y - segs[k].r * 1.1, p.z); claws[j].rotation.set(Math.PI + Math.sin(t * 3 + j) * 0.4, 0, 0); });
    };
  })();
  ticks.push(dragon);

  /* ---------- 水鄉的小船 ---------- */
  const boatMat = LM(0x9b6a4f), canopyMat = LM(0x3c4658);
  const mkBoat = () => { const g = new THREE.Group(); const h = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.1, 0.22), boatMat); h.position.y = 0.05; g.add(h); const c = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.3, 8, 1, true, 0, Math.PI), canopyMat); c.rotation.set(0, 0, Math.PI / 2); c.rotation.order = "ZYX"; c.position.y = 0.12; g.add(c); scene.add(g); return g; };
  const CP = CHANNELS[0].pts.slice(1, 4), cL = [];
  for (let i = 0; i < CP.length - 1; i++) cL.push(Math.hypot(CP[i + 1][0] - CP[i][0], CP[i + 1][1] - CP[i][1]));
  const cTot = cL.reduce((a, b) => a + b, 0);
  const alongC = (d) => { for (let i = 0; i < cL.length; i++) { if (d <= cL[i]) { const f = d / cL[i]; return [CP[i][0] + (CP[i + 1][0] - CP[i][0]) * f, CP[i][1] + (CP[i + 1][1] - CP[i][1]) * f, Math.atan2(-(CP[i + 1][1] - CP[i][1]), CP[i + 1][0] - CP[i][0])]; } d -= cL[i]; } const L = CP[CP.length - 1]; return [L[0], L[1], 0]; };
  const vb = [mkBoat(), mkBoat()], lakeBoats = [mkBoat(), mkBoat()];
  ticks.push((t) => {
    vb.forEach((b, i) => { const q = 0.5 - 0.5 * Math.cos(t * 0.05 + i * 2), [x, z, ry] = alongC(0.4 + q * (cTot - 0.8)); b.position.set(x, 0.02 + Math.sin(t * 1.3 + i) * 0.02, z); b.rotation.y = ry + (Math.sin(t * 0.05 + i * 2) < 0 ? Math.PI : 0); });
    lakeBoats.forEach((b, i) => { const a = t * 0.04 + i * Math.PI, x = 1 + Math.cos(a) * 4.6, z = 1.2 + Math.sin(a) * 3.3; b.position.set(x, 0.02 + Math.sin(t * 1.2 + i) * 0.02, z); b.rotation.y = Math.atan2(-Math.cos(a) * 3.3, -Math.sin(a) * 4.6); });
  });

  /* ============================================================
     鏡頭與操作（與城堡島相同）
     ============================================================ */
  const HOME = { theta: 0, phi: 0.95, radius: 58, tx: 0, ty: 0.8, tz: 0.6 };
  const cam = Object.assign({}, HOME), goal = Object.assign({}, HOME);
  let aspect = 1;
  const clock = new THREE.Clock();
  const pts = new Map(); let pinch = 0, mid = null, panMode = false, down = null;
  const panBy = (dx, dy) => {
    const k = goal.radius * 0.0017, c = Math.cos(goal.theta), s = Math.sin(goal.theta);
    goal.tx = clamp(goal.tx - (c * dx + s * dy * 1.3) * k, -24, 24); goal.tz = clamp(goal.tz - (-s * dx + c * dy * 1.3) * k, -24, 24);
  };
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  canvas.addEventListener("pointerdown", (e) => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); pinch = 0; mid = null;
    panMode = e.button === 2 || e.shiftKey || e.ctrlKey || e.metaKey;
    down = pts.size === 1 ? { x: e.clientX, y: e.clientY, t: performance.now() } : null;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  });
  canvas.addEventListener("pointermove", (e) => {
    const p = pts.get(e.pointerId);
    if (!p) { hover(e); return; }
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 1) { if (panMode) panBy(dx, dy); else { goal.theta -= dx * 0.006; goal.phi = clamp(goal.phi - dy * 0.005, 0.25, 1.38); } }
    else if (pts.size === 2) {
      const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      if (pinch) goal.radius = clamp(goal.radius * pinch / d, 8, 100); pinch = d;
      if (mid) panBy((m.x - mid.x) * 2, (m.y - mid.y) * 2); mid = m;
    }
  });
  const release = (e) => {
    if (down && pts.size === 1 && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 500) pickAt(e.clientX, e.clientY);
    pts.delete(e.pointerId); pinch = 0; mid = null; down = null;
  };
  canvas.addEventListener("pointerup", release); canvas.addEventListener("pointercancel", (e) => { pts.delete(e.pointerId); down = null; });
  canvas.addEventListener("wheel", (e) => { e.preventDefault(); goal.radius = clamp(goal.radius * Math.exp(e.deltaY * 0.0011), 8, 100); }, { passive: false });
  function resize() { const w = stage.clientWidth || 1, h = stage.clientHeight || 1; renderer.setSize(w, h, false); aspect = w / h; camera.aspect = aspect; camera.updateProjectionMatrix(); }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener("resize", resize);
  resize();

  /* ---------- 名牌與介紹卡 ---------- */
  const labels = $("labels"), v3 = new THREE.Vector3();
  const tags = SITES.map((st) => {
    const el = document.createElement("div"), btn = document.createElement("button"); el.className = "pin";
    btn.type = "button"; btn.className = "tag" + (st.kind === "main" ? " special" : ""); btn.textContent = st.name;
    btn.addEventListener("click", () => select(st)); el.appendChild(btn); labels.appendChild(el);
    return { st, el, anchor: [st.x, st.baseY + st.top * st.s + 0.3, st.z], mid: [st.x, st.baseY + st.top * st.s * 0.4, st.z] };
  });
  let selected = null;
  function select(st) {
    selected = st;
    tags.forEach((t) => t.el.firstChild.classList.toggle("on", t.st === st));
    $("iKind").textContent = st.kind === "main" ? "歷屆會考｜藏經閣主殿" : "歷屆會考｜收藏年份之後設定";
    $("iName").textContent = st.name; $("iText").textContent = st.text; $("info").hidden = false;
    Object.assign(goal, { tx: st.x, ty: st.baseY + st.top * st.s * 0.4, tz: st.z, radius: 9 + st.top * st.s * 1.6 + (st.kind === "main" ? 6 : 0), phi: Math.min(goal.phi, 1.05) });
  }
  function home() { selected = null; tags.forEach((t) => t.el.firstChild.classList.remove("on")); $("info").hidden = true; Object.assign(goal, HOME, { theta: Math.round(goal.theta / TAU) * TAU }); }
  $("iBack").addEventListener("click", home);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && selected) home(); });
  const screenOf = (p) => { v3.set(p[0], p[1], p[2]).project(camera); const r = canvas.getBoundingClientRect(); return { x: r.left + (v3.x + 1) / 2 * r.width, y: r.top + (1 - v3.y) / 2 * r.height, z: v3.z }; };
  function nearest(px, py) { let best = null, bd = 70; for (const t of tags) { const s = screenOf(t.mid); if (s.z > 1) continue; const d = Math.hypot(s.x - px, s.y - py); if (d < bd) { bd = d; best = t.st; } } return best; }
  function pickAt(x, y) { const st = nearest(x, y); if (st) select(st); }
  function hover(e) { canvas.classList.toggle("pick", !!nearest(e.clientX, e.clientY)); }
  function placeTags() {
    const r = canvas.getBoundingClientRect();
    for (const t of tags) {
      v3.set(t.anchor[0], t.anchor[1], t.anchor[2]).project(camera);
      if (v3.z > 1 || Math.abs(v3.x) > 1.2 || Math.abs(v3.y) > 1.2) { t.el.style.display = "none"; continue; }
      t.el.style.display = "";
      t.el.style.transform = "translate(" + ((v3.x + 1) / 2 * r.width).toFixed(1) + "px," + ((1 - v3.y) / 2 * r.height).toFixed(1) + "px) translate(-50%,-100%)";
      t.el.style.zIndex = String(Math.round((1 - v3.z) * 1000) + (t.st === selected ? 2000 : 0));
    }
  }

  let first = true;
  function frame() {
    const dt = Math.min(0.05, clock.getDelta()), time = clock.elapsedTime;
    const k = 1 - Math.exp(-dt * 4);
    for (const key in cam) cam[key] += (goal[key] - cam[key]) * k;
    const fit = aspect < 1.35 ? Math.min(1.9, 1.35 / aspect) : 1, r = cam.radius * (selected ? Math.min(fit, 1.3) : fit), s = Math.sin(cam.phi);
    camera.position.set(cam.tx + r * s * Math.sin(cam.theta), cam.ty + r * Math.cos(cam.phi), cam.tz + r * s * Math.cos(cam.theta));
    camera.lookAt(cam.tx, cam.ty, cam.tz);
    const tt = reduceMotion ? 20 : time;
    for (const f of ticks) f(tt, reduceMotion ? 0 : dt);
    renderer.render(scene, camera);
    placeTags();
    if (first) { first = false; $("loading").hidden = true; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

setTimeout(() => {
  try { if (!window.THREE) throw new Error("three.js 未載入"); init3D(); }
  catch (err) { console.error(err); $("loading").hidden = true; $("fallback").hidden = false; }
}, 30);


</script>
</body>
