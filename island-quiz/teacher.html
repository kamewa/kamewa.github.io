<title>老師管理｜星願群島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 版面：左邊是 3D 島嶼舞台，右邊（手機在下方）是作答卡。永遠明亮，不跟隨深色模式。 */
:root{
  color-scheme: light;
  --plum:#4a2260;        /* 文字 */
  --plum-soft:#7a5590;   /* 次要文字 */
  --pink:#ff6fae;        /* 主色：糖果粉 */
  --pink-soft:#ffd3e6;
  --lav:#b79cff;         /* 薰衣草紫 */
  --lav-soft:#e6dcff;
  --mint:#63dcb6;        /* 薄荷綠：答對 */
  --mint-soft:#c8f7e6;
  --lemon:#ffe27a;       /* 檸檬黃 */
  --sky:#8fd3ff;         /* 寶寶藍 */
  --berry:#ff5f8a;       /* 答錯 */
  --card:#fffafd;
  --font-display:"Chiron GoRound TC","Baloo 2","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-body);font-weight:500;color:var(--plum);
  background:linear-gradient(180deg,#bfe6ff 0%,#dcd3ff 28%,#ffd9ee 56%,#ffd9ee 100%);
  background-color:#ffd9ee;
  overflow:hidden;
}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:0}
.stage{position:relative;min-height:0;min-width:0;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}

.brand{position:absolute;left:20px;top:16px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.eyebrow{margin:0;font-size:.82rem;font-weight:700;letter-spacing:.14em;color:var(--plum-soft)}
.brand h1{
  margin:0;display:flex;align-items:center;gap:10px;
  font-family:var(--font-display);font-weight:900;font-size:clamp(1.7rem,3.4vw,2.6rem);line-height:1.15;
  color:var(--pink);
  text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,0 5px 0 rgba(183,156,255,.55);
}
.brand svg{width:1.25em;height:1.25em;flex:none;filter:drop-shadow(0 2px 0 #fff)}
.tip{
  position:absolute;left:20px;bottom:14px;margin:0;padding:6px 14px;border-radius:999px;
  background:rgba(255,255,255,.78);font-size:.85rem;font-weight:700;color:var(--plum-soft);pointer-events:none
}
.fallback{
  position:absolute;inset:auto 20px 60px 20px;padding:14px 18px;border-radius:18px;
  background:#fff;border:2.5px solid var(--berry);font-weight:700
}

.panel{
  min-height:0;display:flex;flex-direction:column;gap:14px;padding:18px 18px 18px 6px;overflow-y:auto
}
.card{
  position:relative;background:var(--card);border-radius:28px;padding:22px 20px 20px;
  border:3px solid #fff;box-shadow:0 0 0 3px var(--pink-soft),0 14px 30px rgba(183,120,220,.28);
  display:flex;flex-direction:column;gap:14px
}
.card::before{ /* 糖果條紋飾帶 */
  content:"";position:absolute;left:26px;right:26px;top:-3px;height:8px;border-radius:0 0 8px 8px;
  background:repeating-linear-gradient(90deg,var(--pink) 0 18px,var(--lemon) 18px 36px,var(--mint) 36px 54px,var(--sky) 54px 72px,var(--lav) 72px 90px)
}
.progress{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hearts{display:flex;flex-wrap:wrap;gap:7px;list-style:none;margin:0;padding:0}
.hearts svg{width:26px;height:26px;display:block}
.hearts path{fill:#fff;stroke:var(--lav);stroke-width:2.2;transition:fill .3s,stroke .3s}
.hearts .now path{fill:var(--lemon);stroke:var(--pink)}
.hearts .ok path{fill:var(--pink);stroke:var(--pink)}
.hearts .no path{fill:var(--lav-soft);stroke:var(--lav)}
.count{font-family:var(--font-display);font-weight:800;font-size:.95rem;color:var(--plum-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.card h2{margin:0;font-family:var(--font-display);font-weight:900;font-size:1.35rem;line-height:1.35;text-wrap:balance}
.card p{margin:0;line-height:1.75;font-size:1rem}
.question{font-size:1.12rem !important;font-weight:700}
.lead{color:var(--plum-soft)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
.opt{
  min-height:56px;padding:10px 8px;border-radius:18px;background:#fff;
  border:2.5px solid var(--lav-soft);font-family:var(--font-display);font-weight:800;font-size:1.15rem;
  box-shadow:0 4px 0 var(--lav-soft);transition:transform .12s,border-color .12s,box-shadow .12s,background .2s
}

const DIFFS = ["基礎", "進階", "思考", "統整"];
const RANK = { 記憶: 0, 理解: 0, 應用: 1, 分析: 2, 評鑑: 2, 創造: 3, 記: 0, 理: 0, 應: 1, 分: 2, 評: 2, 創: 3 };

const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const newId = () => "a" + Math.random().toString(36).slice(2, 8);
const passFor = (n) => Math.max(1, Math.ceil(n * PASS_RATE));

// 認知層次 → 難易度：取最高的層次；沒有標的算基礎
function difficultyOf(levels) {
  const list = Array.isArray(levels) ? levels : String(levels || "").split(/[、,，/\s]+/);
  return list.reduce((d, v) => Math.max(d, RANK[String(v).trim()] || 0), 0);
}
function safeImage(v) {
  const s = String(v || "").trim();
  if (/^data:image\//i.test(s) || /^https?:\/\//i.test(s)) return s;
  return /\.(png|jpe?g|webp|gif|bmp|svg)$/i.test(s) && !s.includes("..") && !/^[a-z]+:/i.test(s) ? s : "";
}
// 讀一題「互動式評量系統」的題目；不完整的題目略過
function shapeQuestion(o) {
  if (!o || typeof o !== "object") return null;
  const id = String(o.id ?? "").trim(), stem = String(o.stem ?? o.question ?? o.title ?? o.text ?? "").trim();
  let opts = o.options ?? o.choices ?? o.answers;
  if (opts && !Array.isArray(opts) && typeof opts === "object") opts = ["A", "B", "C", "D"].map((k) => opts[k] ?? opts[k.toLowerCase()]);
  if (!id || !stem || !Array.isArray(opts) || opts.length < 4) return null;
  const options = opts.slice(0, 4).map((x) => String(x ?? "").trim());
  if (options.some((x) => !x)) return null;
  const raw = o.answer ?? o.correctAnswer ?? o.correct ?? o.key;
  const answer = Number.isInteger(raw) ? raw : "ABCD".indexOf(((String(raw || "").match(/[A-D]/i) || [""])[0]).toUpperCase());
  if (!(answer >= 0 && answer <= 3)) return null;
  const cat = String(o.category || o.subject || "").trim();
  const levels = o.cognitiveLevels ?? o.cognitiveLevel ?? o.bloom;
  return { id, stem, options, answer, category: LEGACY_CAT[cat] || cat, unit: String(o.unit || o.chapter || "").trim(),
           levels: Array.isArray(levels) ? levels.map(String) : String(levels || "").split(/[、,，/\s]+/).filter(Boolean),
           diff: difficultyOf(levels), image: safeImage(o.image ?? o.imageUrl), explanation: String(o.explanation ?? o.why ?? "").trim(),
           disabled: Boolean(o.disabled ?? o.inactive) };
}
function readBank(raw) {
  const rows = Array.isArray(raw) ? raw : raw && Array.isArray(raw.questions) ? raw.questions : raw && raw.data && Array.isArray(raw.data.questions) ? raw.data.questions : null;
  if (!rows) throw new Error("這不是互動式評量系統的題庫檔，找不到題目清單。");
  const byId = new Map();
  rows.map(shapeQuestion).filter(Boolean).forEach((q) => byId.set(q.id, q));
  return { list: [...byId.values()], skipped: rows.length - byId.size };
}
function normIsland(raw, fallback) {
  const r = raw && typeof raw === "object" ? raw : {}, f = fallback || {};
  const units = (Array.isArray(r.units) ? r.units : f.units || []).filter((u) => u && u.category && u.unit).map((u) => ({ category: String(u.category), unit: String(u.unit) }));
  let count = parseInt(r.practiceCount, 10); if (!(count >= 1 && count <= 30)) count = f.practiceCount || 5;
  const seen = {};
  const assessments = (Array.isArray(r.assessments) ? r.assessments : []).filter((a) => a && typeof a === "object").map((a) => {
    let id = /^a[a-z0-9]{1,15}$/.test(a.id) && !seen[a.id] ? a.id : newId(); seen[id] = true;
    const ids = {};
    const items = (Array.isArray(a.items) ? a.items : []).map((it) => (typeof it === "string" ? { id: it } : it))
      .filter((it) => it && it.id && !ids[it.id] && (ids[it.id] = true))
      .map((it) => ({ id: String(it.id), spot: SPOT_NAMES[it.spot] ? it.spot : "none" }));
    return { id, name: String(a.name || "評量").slice(0, 30), items };
  });
  return { name: String(r.name || f.name || "島嶼"), units, practiceCount: count, assessments };
}
function normConfig(raw) {
  if (!raw || typeof raw !== "object" || !raw.islands || typeof raw.islands !== "object") throw new Error("這不是星願群島的關卡設定檔。");
  const out = { format: "StarWishIslandsConfig", version: 1, islands: {} };
  Object.keys(raw.islands).forEach((k) => { if (/^[a-z0-9-]{1,30}$/.test(k)) out.islands[k] = normIsland(raw.islands[k], DEFAULT_CONFIG.islands[k]); });
  ISLAND_ORDER.forEach((k) => { if (!out.islands[k]) out.islands[k] = normIsland(null, DEFAULT_CONFIG.islands[k]); else out.islands[k].name = DEFAULT_CONFIG.islands[k].name; });
  return out;
}
const exportConfig = () => JSON.stringify(config, null, 2);

let bankSrc = Object.assign({ label: "示範題目（網站上還沒有題庫檔）", demo: true }, readBank(DEMO_BANK));

function useBank(b, label, demo) { bankSrc = Object.assign({ label, demo: !!demo }, b); byId = new Map(b.list.map((q) => [q.id, q])); }

/* ============================================================
   登入與雲端
   API_URL 是老師 Google 試算表上那支程式的網址；留空時不啟用登入（單機模式）。
   在 Claude 的預覽頁裡連不到雲端，所以預覽頁也是單機模式。
   ============================================================ */
const API_URL = "https://script.google.com/macros/s/AKfycbxCc_CpF-nJr1oRM1smz_jxSDGePPvVFwBBs7TdeuBG5Vp3W7rayIoKiGFVtMayN-gjNQ/exec";
const inPreview = /claude|anthropic/i.test(location.hostname);
const MAX_TRIES = 3;
const SESSION_KEY = "island-quiz-session";
let session = null;
try { session = JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch (e) {}
if (session && session.role !== "guest" && !session.token) session = null;
const cloudOn = () => !!API_URL && !inPreview;
const isStudent = () => cloudOn() && session && session.role === "student";
const isTeacher = () => !cloudOn() || (session && session.role === "teacher");
function setSession(s) {
  session = s;
  try { if (s) sessionStorage.setItem(SESSION_KEY, JSON.stringify(s)); else sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
}
async function api(payload) {
  // 用 text/plain 送出，瀏覽器才不會先發一次預檢請求（Apps Script 不支援）
  const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload), redirect: "follow" });
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}
function failText(res) {
  const map = {
    locked: "輸錯太多次，請 " + (res.minutes || 10) + " 分鐘後再試，或請老師幫忙。",
    wrong: "資料不正確，請再檢查一次。" + (res.left > 0 ? "還可以再試 " + res.left + " 次。" : ""),
    expired: "登入已經過期，請登出後重新登入。",
    limit: "這個評量已經作答 " + MAX_TRIES + " 次，不能再作答了。",
    exists: "這個座號已經有學生" + (res.name ? "（" + res.name + "）" : "") + "。請先把原本的學生轉出，或換一個座號。",
    not_found: "找不到這位學生。",
    bad_request: "資料格式不正確，請檢查後再試。"
  };
  return map[res.error] || "雲端暫時沒有回應，請稍後再試。";
}

/* ---------- 兩段式按鈕：刪除、轉出這類動作要按兩次才執行 ---------- */
let armed = null;
function disarm() { if (armed) { armed.btn.textContent = armed.label; armed.btn.classList.remove("armed"); armed = null; } }
function twoStep(btn, askText, run) {
  btn.addEventListener("click", () => {
    if (armed && armed.btn === btn) { disarm(); run(); return; }
    disarm(); armed = { btn, label: btn.textContent }; btn.textContent = askText; btn.classList.add("armed");
  });
}

/* ============================================================
   老師：學生管理（轉入、轉出、重設通關碼）
   ============================================================ */
const ad = { cls: "" };
function adMsg(text, bad) { const m = $("adMsg"); m.textContent = text; m.className = "ed-msg" + (bad ? " bad" : ""); }
function adCode(res, what) {
  $("adCode").hidden = false;
  $("adCode").innerHTML = "<span>" + esc(res.cls) + " 班 " + res.seat + " 號　" + esc(res.name) + "　" + what + "</span><strong>" +
    esc(res.code.slice(0, 3) + " " + res.code.slice(3)) + "</strong><span>請現在抄給學生。關閉後要到試算表才查得到。</span>";
}
async function adCall(payload) {
  try {
    const res = await api(Object.assign({ token: session.token }, payload));
    if (!res.ok) adMsg(failText(res), true);
    return res.ok ? res : null;
  } catch (e) { adMsg("連不上雲端，請檢查網路後再試一次。", true); return null; }
}
async function adLoadClasses(keep) {
  const res = await adCall({ action: "classes" });
  if (!res) return;
  const sel = $("adCls");
  sel.innerHTML = res.classes.map((c) => '<option value="' + esc(c.cls) + '">' + esc(c.cls) + " 班（" + c.n + " 人）</option>").join("");
  if (keep && res.classes.some((c) => c.cls === keep)) sel.value = keep;
  ad.cls = sel.value; $("adNewCls").value = ad.cls;
  await adLoadRoster();
}
async function adLoadRoster() {
  disarm();
  $("adList").innerHTML = '<li class="ad-note">讀取中…</li>';
  const res = await adCall({ action: "roster", cls: ad.cls });
  if (!res) { $("adList").innerHTML = ""; return; }
  $("adList").innerHTML = res.students.map((s) =>
    '<li class="ad-row' + (s.active ? "" : " off") + '"><span class="ed-no">' + s.seat + '</span><span class="ad-name">' + esc(s.name) +
    (s.active ? "" : "（已轉出）") + '</span><span class="ed-moves">' +
    (s.active ? '<button class="mini" type="button" data-act="reset" data-seat="' + s.seat + '">重設通關碼</button><button class="mini warn" type="button" data-act="off" data-seat="' + s.seat + '">轉出</button>'
              : '<button class="mini" type="button" data-act="on" data-seat="' + s.seat + '">恢復</button>') + "</span></li>").join("") ||
    '<li class="ad-note">這個班級還沒有學生。</li>';
  $("adList").querySelectorAll("button").forEach((b) => {
    const seat = +b.dataset.seat, act = b.dataset.act;
    if (act === "reset") twoStep(b, "再按一次確定重設", async () => {
      const r = await adCall({ action: "resetCode", cls: ad.cls, seat });
      if (r) { adCode(r, "新的通關碼"); adMsg("已重設，舊的通關碼已經失效。"); }
    });
    else if (act === "off") twoStep(b, "再按一次確定轉出", async () => {
      if (await adCall({ action: "removeStudent", cls: ad.cls, seat })) { adMsg(ad.cls + " 班 " + seat + " 號已轉出，不能再登入；過去的成績仍然保留。"); adLoadClasses(ad.cls); }
    });
    else b.addEventListener("click", async () => {
      if (await adCall({ action: "restoreStudent", cls: ad.cls, seat })) { adMsg(ad.cls + " 班 " + seat + " 號已恢復，可以用原本的通關碼登入。"); adLoadClasses(ad.cls); }
    });
  });
}

$("adCls").addEventListener("change", () => { ad.cls = $("adCls").value; $("adNewCls").value = ad.cls; $("adCode").hidden = true; adLoadRoster(); });
$("adForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const cls = $("adNewCls").value.trim(), seat = $("adNewSeat").value.trim(), name = $("adNewName").value.trim();
  if (!/^\d{3}$/.test(cls)) { adMsg("班級請輸入 3 位數字，例如 204。", true); return; }
  if (!/^\d{1,2}$/.test(seat) || +seat < 1 || +seat > 60) { adMsg("座號請輸入 1 到 60 的數字。", true); return; }
  if (!name) { adMsg("請輸入學生姓名。", true); return; }
  const r = await adCall({ action: "addStudent", cls, seat: +seat, name });
  if (!r) return;
  adCode(r, "的通關碼"); adMsg("已轉入 " + cls + " 班 " + seat + " 號。");
  $("adNewSeat").value = ""; $("adNewName").value = "";
  adLoadClasses(cls);
});

/* ============================================================
   老師：關卡設定（從共用題庫挑題組成評量關卡）
   題目一律在「互動式評量系統」編修；這裡只決定哪幾題放進哪個評量關卡。
   ============================================================ */
const ed = { lv: 0, filter: -1, search: "" };
const DTAG = ["d0", "d1", "d2", "d3"];
function edMsg(text, bad) { const m = $("edMsg"); m.textContent = text; m.className = "ed-msg" + (bad ? " bad" : ""); }
const curTest = () => isl().assessments[ed.lv];
function qMeta(q) {
  return '<span class="dtag ' + DTAG[q.diff] + '">' + DIFFS[q.diff] + "</span>" + esc(q.category + "／" + q.unit) +
    (q.levels.length ? "・" + esc(q.levels.join("、")) : "・未標認知層次") + "・答案 " + "ABCD"[q.answer] + (q.explanation ? "・有解說" : "") + (q.image ? "・有圖" : "");
}
function edRender() {
  disarm();
  const I = isl(), pool = islandPool(), test = curTest();
  $("edTitle").textContent = "關卡設定";
  $("edBank").textContent = "題庫：" + bankSrc.label + "，共 " + bankSrc.list.length + " 題" + (bankSrc.skipped ? "（另有 " + bankSrc.skipped + " 題格式不完整，已略過）" : "") +
    "；本島可用 " + pool.length + " 題（" + DIFFS.map((n, i) => n + " " + pool.filter((q) => q.diff === i).length).join("、") + "）";
  $("edUnits").textContent = I.units.length ? I.units.map((u) => u.category + "／" + u.unit).join("、") : "還沒有設定單元"; drawUnits();
  $("edCount").value = I.practiceCount;
  // 評量關卡
  $("edLevel").innerHTML = I.assessments.length ? I.assessments.map((a, i) => '<option value="' + i + '">' + esc(a.name) + "（" + a.items.length + " 題）</option>").join("")
    : '<option value="">還沒有評量關卡</option>';
  $("edLevel").disabled = !I.assessments.length; $("lvDel").disabled = !test; $("lvName").disabled = !test;
  if (test) $("edLevel").value = ed.lv;
  $("lvName").value = test ? test.name : "";
  // 已選題目
  if (!test) {
    $("edChosenCount").textContent = "按「新增評量關卡」開始挑題。";
    $("edChosen").innerHTML = "";
  } else {
    const missing = test.items.filter((it) => !byId.get(it.id) || byId.get(it.id).disabled).length;
    $("edChosenCount").textContent = "已選 " + test.items.length + " 題" + (missing ? "，其中 " + missing + " 題在目前的題庫找不到或已停用，學生不會看到" : "") + "。每一題可以設定鏡頭飛到哪裡。";
    $("edChosen").innerHTML = test.items.map((it, i) => {
      const q = byId.get(it.id), bad = !q || q.disabled;
      return '<li class="pick-row in' + (bad ? " bad" : "") + '" data-i="' + i + '"><span class="ed-no">' + (i + 1) + '</span><span class="pick-main"><span class="pick-stem">' +
        (q ? esc(q.stem) : "（題庫中找不到這一題：" + esc(it.id) + "）") + '</span><span class="pick-meta">' + (q ? qMeta(q) + (q.disabled ? "・已停用" : "") : "") + "</span></span>" +
        '<span class="pick-tools">' + (ISLAND_ID === "terrain" ? '<select data-act="spot" aria-label="第 ' + (i + 1) + ' 題的鏡頭位置">' +
        Object.keys(SPOT_NAMES).map((k) => '<option value="' + k + '"' + (k === it.spot ? " selected" : "") + ">" + (k === "none" ? "整座島" : "飛到" + SPOT_NAMES[k]) + "</option>").join("") + '</select>' : "") +
        '<button class="mini" type="button" data-act="up"' + (i ? "" : " disabled") + '>上移</button><button class="mini" type="button" data-act="down"' + (i < test.items.length - 1 ? "" : " disabled") +
        '>下移</button><button class="mini warn" type="button" data-act="remove">移除</button></span></li>';
    }).join("");
  }
  // 本島題庫
  $("edChips").innerHTML = [-1, 0, 1, 2, 3].map((d) => '<button class="chip" type="button" data-d="' + d + '" aria-pressed="' + (ed.filter === d) + '">' +
    (d < 0 ? "全部 " + pool.length : DIFFS[d] + " " + pool.filter((q) => q.diff === d).length) + "</button>").join("");
  const kw = ed.search.trim().toLowerCase(), chosen = new Set(test ? test.items.map((it) => it.id) : []);
  const shown = pool.filter((q) => (ed.filter < 0 || q.diff === ed.filter) && (!kw || (q.stem + " " + q.options.join(" ")).toLowerCase().includes(kw)));
  $("edPool").innerHTML = shown.map((q) => '<li class="pick-row' + (chosen.has(q.id) ? " in" : "") + '" data-id="' + esc(q.id) + '"><span class="ed-no">' + DIFFS[q.diff].slice(0, 1) +
    '</span><span class="pick-main"><span class="pick-stem">' + esc(q.stem) + '</span><span class="pick-opts">' + q.options.map((o, i) => "ABCD"[i] + ". " + esc(o)).join("　") +
    '</span><span class="pick-meta">' + qMeta(q) + '</span></span><span class="pick-tools">' +
    (chosen.has(q.id) ? '<span class="pick-done">已加入</span>' : '<button class="mini add" type="button" data-act="add"' + (test ? "" : " disabled") + ">加入</button>") + "</span></li>").join("") ||
    '<li class="ad-note">' + (pool.length ? "沒有符合條件的題目。" : "題庫裡還沒有「" + esc(I.units.map((u) => u.category + "／" + u.unit).join("、")) + "」的題目。請先在互動式評量系統新增題目，再讀取題庫檔。") + "</li>";
}
function edChanged(text) { saveDraft(); edRender(); if (text) edMsg(text); }

$("edCount").addEventListener("change", () => {
  const v = parseInt($("edCount").value, 10);
  if (!(v >= 1 && v <= 30)) { edRender(); edMsg("請輸入 1 到 30 的數字。", true); return; }
  isl().practiceCount = v; edChanged("練習每次改為抽 " + v + " 題。");
});
$("edLevel").addEventListener("change", () => { ed.lv = +$("edLevel").value || 0; edRender(); });
$("lvName").addEventListener("input", () => { const t = curTest(); if (!t) return; t.name = $("lvName").value.slice(0, 30) || "評量"; saveDraft(); const o = $("edLevel").options[ed.lv]; if (o) o.textContent = t.name + "（" + t.items.length + " 題）"; });
$("lvAdd").addEventListener("click", () => {
  const A = isl().assessments; A.push({ id: newId(), name: "評量 " + (A.length + 1), items: [] });
  ed.lv = A.length - 1; edChanged("已新增評量關卡。從右邊的本島題庫按「加入」挑題；學生每關最多作答 " + MAX_TRIES + " 次。");
  $("lvName").focus(); $("lvName").select();
});
twoStep($("lvDel"), "再按一次確定刪除關卡", () => {
  isl().assessments.splice(ed.lv, 1); ed.lv = 0; edChanged("已刪除這個評量關卡。試算表裡已經記錄的成績不受影響。");
});
$("edChosen").addEventListener("click", (e) => {
  const b = e.target.closest("button"), row = e.target.closest("[data-i]"), t = curTest(); if (!b || !row || !t) return;
  const i = +row.dataset.i, items = t.items;
  if (b.dataset.act === "remove") { items.splice(i, 1); edChanged("已從這個關卡移除。"); }
  if (b.dataset.act === "up" && i > 0) { [items[i - 1], items[i]] = [items[i], items[i - 1]]; edChanged(); }
  if (b.dataset.act === "down" && i < items.length - 1) { [items[i + 1], items[i]] = [items[i], items[i + 1]]; edChanged(); }
});
$("edChosen").addEventListener("change", (e) => {
  const row = e.target.closest("[data-i]"), t = curTest(); if (!row || !t || e.target.dataset.act !== "spot") return;
  t.items[+row.dataset.i].spot = e.target.value; saveDraft(); edMsg("已設定鏡頭位置。");
});
$("edPool").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act='add']"), row = e.target.closest("[data-id]"), t = curTest(); if (!b || !row || !t) return;
  t.items.push({ id: row.dataset.id, spot: "none" }); edChanged("已加入第 " + t.items.length + " 題。");
});
$("edChips").addEventListener("click", (e) => { const b = e.target.closest("[data-d]"); if (!b) return; ed.filter = +b.dataset.d; edRender(); });
$("edSearch").addEventListener("input", () => { ed.search = $("edSearch").value; edRender(); });
twoStep($("edReset"), "再按一次確定還原", () => {
  try { localStorage.removeItem(CONFIG_KEY); } catch (e) {}
  hasDraft = false; config = clone(published); ed.lv = 0; edRender(); edMsg("已還原成網站上的關卡設定，這台電腦上的修改已清除。");
});
function readJsonFile(input, onLoad) {
  const f = input.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { onLoad(JSON.parse(String(rd.result)), f.name); }
    catch (err) { edMsg("讀取失敗：" + (err instanceof SyntaxError ? "這不是正確的 JSON 檔。" : err.message), true); }
    input.value = "";
  };
  rd.onerror = () => edMsg("讀不到這個檔案，請再試一次。", true);
  rd.readAsText(f, "utf-8");
}
$("edBankFile").addEventListener("click", () => $("edBankInput").click());
$("edBankInput").addEventListener("change", () => readJsonFile($("edBankInput"), (j, name) => {
  if (j && j.format === "InteractiveAssessmentSystemBackup") { edMsg("這是完整備份檔（含班級與成績），請改用評量系統「題庫編修 → 儲存題庫」產生的檔案。", true); return; }
  const b = readBank(j); useBank(b, "本機題庫檔「" + name + "」", false); edRender();
  edMsg("已讀取題庫檔，共 " + b.list.length + " 題。這只在這次編輯時使用；要讓學生看到，請把這個檔案以 data/questions.json 上傳到網站。");
}));
$("edImport").addEventListener("click", () => $("edFile").click());
$("edFile").addEventListener("change", () => readJsonFile($("edFile"), (j, name) => {
  config = normConfig(j); ed.lv = 0; saveDraft(); edRender(); edMsg("已讀取關卡檔「" + name + "」。");
}));
$("edSave").addEventListener("click", async () => {
  if (inPreview || (window.claude && window.claude.use)) {
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if (!dl) { edMsg("這個預覽頁無法下載檔案，請改按「複製 JSON」，貼到記事本存成 islands.json。", true); return; }
      await dl.save({ filename: "islands.json", data: exportConfig() });
      edMsg("已儲存 islands.json。把它放在網站的 data 資料夾，學生就會看到新的評量關卡。");
    } catch (e) { edMsg("沒有存檔（已取消或失敗）。也可以改按「複製 JSON」。", true); }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([exportConfig()], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = "islands.json";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    edMsg("已下載 islands.json。把它放在網站的 data 資料夾，學生就會看到新的評量關卡。");
  } catch (e) { edMsg("下載失敗，請改按「複製 JSON」。", true); }
});
$("edCopy").addEventListener("click", () => {
  const text = exportConfig();
  const fallback = () => { const ta = $("edRaw"); ta.hidden = false; ta.value = text; ta.focus(); ta.select(); edMsg("瀏覽器不允許自動複製。內容已顯示在下方，請按 Ctrl+C 複製。", true); };
  try { navigator.clipboard.writeText(text).then(() => edMsg("已複製關卡設定 JSON。"), fallback); } catch (e) { fallback(); }
});


/* ============================================================
   老師管理頁：分頁切換、選島、單元設定、老師登入
   ============================================================ */
let ready = false;
function showTab(name) {
  disarm();
  $("editor").hidden = name !== "editor"; $("admin").hidden = name !== "admin";
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-current", b.dataset.tab === name ? "page" : "false"));
  if (name === "editor") { edRender(); edMsg(hasDraft ? "目前顯示的是這台電腦上修改過的關卡設定。" : "修改會自動存在這台電腦的瀏覽器；要給學生用，請按「儲存關卡檔」再上傳到網站。"); }
  else if (!cloudOn()) { adMsg("學生管理要在網站上（kamewa.github.io）使用，這個預覽頁連不到雲端。", true); $("adList").innerHTML = ""; }
  else { $("adCode").hidden = true; adMsg("選一個班級，就能轉入、轉出學生或重設通關碼。"); adLoadClasses(ad.cls); }
  try { history.replaceState(null, "", "#" + name); } catch (e) {}
}
document.addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b) showTab(b.dataset.tab); });
// 選島
$("edIsland").innerHTML = ISLAND_ORDER.map((k) => '<option value="' + k + '">' + esc(DEFAULT_CONFIG.islands[k].name) + "</option>").join("");
$("edIsland").addEventListener("change", () => { ISLAND_ID = $("edIsland").value; ed.lv = 0; ed.filter = -1; ed.search = ""; $("edSearch").value = ""; edRender(); edMsg("現在設定的是「" + isl().name + "」。"); });
// 單元：題庫裡有的分類與單元會出現在選單裡，也可以自己輸入
function drawUnits() {
  const I = isl();
  $("unitList").innerHTML = I.units.length ? I.units.map((u, i) => "<li>" + esc(u.category + "／" + u.unit) + '<button type="button" data-i="' + i + '" aria-label="移除 ' + esc(u.category + u.unit) + '">×</button></li>').join("")
    : '<li class="empty">還沒有設定單元，練習抽不到題目</li>';
  const cats = [...new Set(["通論", "臺灣"].concat(bankSrc.list.map((q) => q.category).filter(Boolean)))];
  const keep = $("unitCat").value;
  $("unitCat").innerHTML = cats.map((c) => '<option value="' + esc(c) + '">' + esc(c) + "</option>").join("");
  if (cats.includes(keep)) $("unitCat").value = keep;
  $("unitNames").innerHTML = [...new Set(bankSrc.list.map((q) => q.unit).filter(Boolean))].map((u) => '<option value="' + esc(u) + '">').join("");
}
$("unitList").addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (!b) return; const u = isl().units.splice(+b.dataset.i, 1)[0]; edChanged("已移除單元「" + u.category + "／" + u.unit + "」。"); });
$("unitAdd").addEventListener("click", () => {
  const category = $("unitCat").value, unit = $("unitName").value.trim();
  if (!unit) { edMsg("請輸入單元名稱。", true); $("unitName").focus(); return; }
  if (isl().units.some((u) => u.category === category && u.unit === unit)) { edMsg("這個單元已經加入了。", true); return; }
  isl().units.push({ category, unit }); $("unitName").value = ""; edChanged("已加入單元「" + category + "／" + unit + "」。");
});
$("unitName").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("unitAdd").click(); } });

// 老師登入：在大地圖登入過就直接進來
function start() {
  $("gate").hidden = true; ready = true;
  showTab(location.hash === "#admin" ? "admin" : "editor");
}
function showGate() {
  $("gate").hidden = false; $("editor").hidden = true; $("admin").hidden = true;
  const msg = (t) => { $("gtMsg").textContent = t; };
  $("gtCode").focus();
  $("gtForm").onsubmit = async (e) => {
    e.preventDefault();
    const code = $("gtCode").value.trim(); if (!code) { msg("請輸入教師碼。"); return; }
    const go = $("gtGo"); go.disabled = true; go.textContent = "登入中…"; msg("");
    try {
      const res = await api({ action: "teacher", code });
      if (res.ok && res.role === "teacher") { setSession({ role: "teacher", token: res.token }); start(); return; }
      msg(failText(res)); $("gtCode").value = "";
    } catch (err) { msg("連不上雲端，請檢查網路後再試一次。"); }
    go.disabled = false; go.textContent = "登入";
  };
}
if (!cloudOn() || (session && session.role === "teacher")) start(); else showGate();

</script>
