<style>
/* 版面：整頁是 3D 城堡島，城堡名牌浮在城堡上方，點選後右下角出現介紹卡。永遠明亮。 */
:root{
  color-scheme: light;
  --plum:#4a2260; --plum-soft:#7a5590; --pink:#ff6fae; --pink-soft:#ffd3e6;
  --lav:#b79cff; --lav-soft:#e6dcff; --mint:#63dcb6; --mint-soft:#c8f7e6; --lemon:#ffe27a; --sky:#8fd3ff; --card:#fffafd;
  --font-display:"Chiron GoRound TC","Baloo 2","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-body);font-weight:500;color:var(--plum);overflow:hidden;
  background:#10143a;
}
.stage{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene.pick{cursor:pointer}
#scene:active{cursor:grabbing}
.brand{position:absolute;left:20px;top:16px;right:20px;display:flex;align-items:center;gap:.4em;pointer-events:none;font-size:clamp(1.3rem,3vw,2.4rem)}
.logo{flex:none;width:1.15em;height:1.15em;display:block}
.brand h1{
  margin:0;white-space:nowrap;font-family:var(--font-display);font-weight:900;font-size:1em;line-height:1.15;color:var(--pink);
  text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,0 5px 0 rgba(183,156,255,.55)
}
.chip{align-self:center;margin-left:.2em;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.85);font-size:clamp(.75rem,1.2vw,.9rem);font-weight:700;color:var(--plum-soft);white-space:nowrap}
.corner{position:absolute;right:16px;top:16px;display:flex;align-items:center;gap:8px;z-index:5}
.to-map{display:flex;align-items:center;gap:6px;padding:7px 15px 7px 11px;border-radius:999px;background:rgba(255,255,255,.88);border:2.5px solid #fff;
  box-shadow:0 3px 0 rgba(183,156,255,.45);font:700 .92rem/1 var(--font-body);color:#7a4f9a;text-decoration:none;transition:transform .15s,background .15s}
.to-map:hover{transform:translateY(-2px);background:#fff}
.to-map:focus-visible,button:focus-visible{outline:3px solid #ff8fc8;outline-offset:2px}
.to-map svg{width:18px;height:18px;flex:none}
.to-map.small{padding:6px 11px 6px 9px;font-size:.82rem}
.who{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 16px;border-radius:999px;background:rgba(255,255,255,.88);border:2.5px solid #fff;font-size:.9rem;font-weight:700}
.who[hidden]{display:none}
.who button{border:0;border-radius:999px;padding:5px 14px;background:var(--pink-soft);font:inherit;font-size:.85rem;font-weight:700;color:var(--plum);cursor:pointer}
.tip{position:absolute;left:20px;bottom:14px;margin:0;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.78);font-size:.85rem;font-weight:700;color:var(--plum-soft);pointer-events:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
/* 名牌：外層 .pin 負責跟著城堡移動；內層按鈕只做「浮起」的小動畫，不會跳位 */
.pin{position:absolute;left:0;top:0;will-change:transform}
.tag{
  display:block;white-space:nowrap;padding:3px 12px;border-radius:999px;cursor:pointer;pointer-events:auto;transform-origin:50% 100%;
  font-family:var(--font-display);font-weight:800;font-size:clamp(.66rem,1.1vw,.9rem);color:var(--plum);background:rgba(255,255,255,.9);
  border:2.5px solid #fff;box-shadow:0 3px 0 var(--pink-soft);transition:transform .15s ease-out,background .15s,color .15s,box-shadow .15s
}
.tag:hover,.tag:focus-visible{transform:translateY(-3px) scale(1.05);background:#fff;box-shadow:0 6px 0 var(--pink-soft),0 8px 14px rgba(183,120,220,.25)}
.tag:active{transform:translateY(0) scale(1);box-shadow:0 2px 0 var(--pink-soft)}
.tag.on{background:var(--pink);color:#fff;box-shadow:0 3px 0 #e0458f}
.tag.on:hover{box-shadow:0 6px 0 #e0458f,0 8px 14px rgba(224,69,143,.25)}
.tag.special{border-color:var(--lemon)}
.info{
  position:absolute;right:18px;bottom:18px;width:min(360px,calc(100% - 36px));background:var(--card);border-radius:26px;padding:22px 20px 18px;z-index:6;
  border:3px solid #fff;box-shadow:0 0 0 3px var(--pink-soft),0 14px 30px rgba(183,120,220,.28);display:flex;flex-direction:column;gap:10px;animation:pop .2s ease-out
}
.info[hidden]{display:none}
.info::before{content:"";position:absolute;left:26px;right:26px;top:-3px;height:8px;border-radius:0 0 8px 8px;

  K.cyl = (x, y, z, r, h, col, nm) => B.add(nm || "cyl", col, x, y, z, r, h, r);
  K.cone = (x, y, z, r, h, col, nm) => B.add(nm || "cone", col, x, y, z, r, h, r);

  };

  K.tower = (x, z, y, r, h, col, o) => {
    o = o || {};
    K.cyl(x, y, z, r, h, col, o.seg);

    const rc = o.roofCol || col, rh = o.roofH || r * 2.4, ov = o.over || 1.22;

      case "dome": K.dome(x, top, z, r * 1.02, rc, o.hs || 1); top += r * (o.hs || 1); break;

/* ============================================================

/* ---------- 樹 ---------- */
const TREE = {

/* ---------- 房子（依地區風格） ---------- */
function house(V, x, y, z, ry, style, rnd) {

    switch (style) {

      case "jp": V.add("box", 0xfff9ef, 0, 0, 0, 0.44, 0.24, 0.32); V.add("box", 0x9b7f8f, 0, 0, 0.165, 0.44, 0.06, 0.02); V.add("prism", 0x5f6e9a, 0, 0.24, 0, 0.56, 0.2, 0.44); break;
      case "desert": V.add("box", pick(rnd, [0xf6e2b8, 0xf0d6a6, 0xfaeacb]), 0, 0, 0, 0.38, 0.3, 0.34); if (rnd() < 0.4) V.add("dome", 0x5ecac4, 0, 0.3, 0, 0.12, 0.1, 0.12); V.add("box", 0x8f7a9a, 0.08, 0, 0.175, 0.1, 0.16, 0.02); break;

      case "cn": V.add("box", 0xf3ede6, 0, 0, 0, 0.44, 0.26, 0.3); V.add("box", 0xe57670, 0, 0, 0.155, 0.44, 0.06, 0.01); V.add("prism", 0x8f96b4, 0, 0.26, 0, 0.56, 0.2, 0.42); break;
      case "am": V.add("box", pick(rnd, [0xfbe6d6, 0xdff0ff, 0xfff4cc, 0xe8e0ff]), 0, 0, 0, 0.4, 0.34, 0.32); V.add("prism", pick(rnd, [0x7fd2b3, 0xc97b6a, 0x8f96b4]), 0, 0.34, 0, 0.46, 0.3, 0.38); break;
      case "stilt": [[-0.15, -0.12], [0.15, -0.12], [-0.15, 0.12], [0.15, 0.12]].forEach(([a, b]) => V.add("cyl", 0x9a7b70, a, 0, b, 0.025, 0.18)); V.add("box", 0xd9c09a, 0, 0.18, 0, 0.4, 0.22, 0.32); V.add("prism", 0xe3c983, 0, 0.4, 0, 0.5, 0.3, 0.42); break;
      case "tw": V.add("box", pick(rnd, [0xfff6ee, 0xf3d9c8]), 0, 0, 0, 0.44, 0.26, 0.3); V.add("prism", 0xe56c5c, 0, 0.26, 0, 0.5, 0.18, 0.38); [-1, 1].forEach((k) => V.add("cone", 0xe56c5c, k * 0.25, 0.38, 0, 0.025, 0.12, 0.025, 0, 0, -k * 0.85)); break;
      default: V.add("box", pick(rnd, [0xfff6fb, 0xfff1dc, 0xe9f6ff]), 0, 0, 0, 0.4, 0.32, 0.32); V.add("prism", pick(rnd, [0xff9cbf, 0xb79cff, 0x8fd3ff, 0xffc36b]), 0, 0.32, 0, 0.46, 0.28, 0.38); break;
    }
  });
}
const VILLAGES = [
  ["europe", "eu", 10, 2.6, 5.0], ["neasia", "jp", 9, 2.6, 4.6], ["westasia", "desert", 12, 2.8, 5.2], ["africa", "hut", 12, 2.8, 5.2],
  ["china", "cn", 10, 2.6, 4.8], ["seasia", "stilt", 9, 3.0, 5.0], ["america", "am", 9, 2.5, 4.4], ["taiwan", "tw", 7, 1.6, 3.4],
  ["global", "pastel", 12, 5.4, 8.0]
];

/* ---------- 山水峰林：一根根拔地而起的石峰 ---------- */
function buildKarst(V, busy, rnd) {
  const peaks = [];
  const add = (x, z, r, h, top) => {
    const y = ground(x, z) - 0.15;
    const tilt = top ? 0 : (rnd() - 0.5) * 0.12, col = pick(rnd, [0xd2c9de, 0xc9cdd8, 0xd6d3e2, 0xc6cfd2]);
    V.add(top ? "karstTop" : "karst", col, x, y, z, r, h + 0.15, r * (0.8 + rnd() * 0.3), rnd() * TAU, tilt, tilt);
    if (!top && rnd() < 0.35) V.add("karst", col, x + r * 0.35, y + h * 0.35, z - r * 0.2, r * 0.55, h * 0.45, r * 0.5, rnd() * TAU);
    // 岩壁上的苔蘚與小樹
    for (let k = 0; k < 3; k++) { const a = rnd() * TAU, f = 0.3 + rnd() * 0.45, rr = r * (0.95 - f * 0.25); V.add("sph", 0x9fd3a2, x + Math.cos(a) * rr, y + h * f, z + Math.sin(a) * rr, r * 0.32, r * 0.16, r * 0.32); }
    if (!top) { V.add("sph", 0x8fcb9a, x, y + h * 0.9, z, r * 0.62, r * 0.3, r * 0.62); TREE.conifer(V, x + r * 0.1, y + h + 0.02, z, 0.55 + rnd() * 0.25, rnd); if (r > 0.5) TREE.round(V, x - r * 0.25, y + h * 0.97, z + r * 0.1, 0.5, rnd); }
    peaks.push([x, z, r, y + h]); busy.push([x, z, r + 0.1]);
  };
  KARST_MAIN.forEach(([x, z, r, h]) => add(x, z, r, h, true));
  for (let tries = 0; tries < 700 && peaks.length < 42; tries++) {
    const a = rnd() * TAU, d = Math.sqrt(rnd()) * 4.6, x = -7.4 + Math.cos(a) * d, z = 4.0 + Math.sin(a) * d * 0.95;
    const r = 0.26 + rnd() * 0.36, h = (1.8 + rnd() * 2.6) * (1.1 - d / 9);
    if (Z.karst(x, z) < 0.35 || islandHeight(x, z) < 0.08 || riverK(x, z) > 0 || nearRoad(x, z, r + 0.35)) continue;
    if (RIVERS.some((rv) => lineDist(x, z, rv.pts) < r + rv.w + 0.1)) continue;
    if (peaks.some(([px, pz, pr]) => Math.hypot(px - x, pz - z) < pr + r + 0.12)) continue;
    add(x, z, r, h, false);
  }
  return peaks;
}

/* ---------- 建造全部 ---------- */
function buildExtras(V, S, busy, low) {
  const rnd = makeRnd(2026);
  const free = (x, z, r) => busy.every(([bx, bz, br]) => Math.hypot(x - bx, z - bz) > r + br);
  const karst = buildKarst(V, busy, rnd);
  const okGround = (x, z, minH) => { const h = islandHeight(x, z); return h > (minH || 0.14) && riverK(x, z) < 0.15 && bayMask(x, z) < 0.15 && slopeAt(x, z) < 1.1; };

  // 村莊
  for (const [id, style, n, r0, r1] of VILLAGES) {
    const c = CASTLE[id];
    for (let k = 0, tries = 0; k < (low ? Math.ceil(n * 0.7) : n) && tries < 200; tries++) {
      const a = rnd() * TAU, r = r0 + rnd() * (r1 - r0), x = c.x + Math.cos(a) * r, z = c.z + Math.sin(a) * r;
      if (!okGround(x, z, 0.16) || !free(x, z, 0.35) || nearRoad(x, z, 0.32)) continue;
      if (id === "global" && Math.hypot(x, (z + 4.2) * 1.05) < 4.7) continue;     // 台地的懸崖上不蓋房子
      const ry = Math.atan2(c.x - x, c.z - z) + (rnd() - 0.5) * 0.5;
      house(V, x, ground(x, z) - 0.02, z, ry, style, rnd); busy.push([x, z, 0.3]); k++;
    }
  }

  // 樹
  const tries = low ? 4400 : 7500;
  for (let i = 0; i < tries; i++) {
    const x = -30 + rnd() * 74, z = -26 + rnd() * 52;
    const h = islandHeight(x, z); if (h < 0.18) continue;
    if (riverK(x, z) > 0.1 || bayMask(x, z) > 0.1 || Z.ice(x, z) > 0.3 || roadK(x, z) > 0.05 || nearRoad(x, z, 0.3)) continue;
    if (!free(x, z, 0.25) || slopeAt(x, z) > 1.25) continue;
    if (inField(x, z) && rnd() < 0.92) continue;
    const r = rnd(), s = 0.8 + rnd() * 0.5, y = ground(x, z) - 0.03;
    const plateau = Math.hypot(x, (z + 4.2) * 1.05) < 3.7;
    let type = null;
    if (Z.karst(x, z) > 0.45) type = r < 0.22 ? "round" : r < 0.32 ? "bush" : null;
    else if (Z.north(x, z) > 0.5) { if (h > 4.2) continue; if (r < 0.75) type = "conifer"; }
    else if (Z.amer(x, z) > 0.5) type = r < 0.6 ? "maple" : r < 0.85 ? "conifer" : null;
    else if (Z.taiwan(x, z) > 0.5) type = r < 0.45 ? "round" : r < 0.7 ? "palm" : null;
    else if (Z.desert(x, z) > 0.45) { const oasis = Math.hypot(x + 17.6, z + 5.4) < 2.2; type = oasis ? (r < 0.9 ? "palm" : null) : (r < 0.1 ? "cactus" : null); }
    else if (Z.savanna(x, z) > 0.45) type = r < 0.07 ? "baobab" : r < 0.18 ? "acacia" : r < 0.28 ? "bush" : null;
    else if (Z.jungle(x, z) > 0.4) type = r < 0.75 ? "jungle" : r < 0.92 ? "palm" : null;
    else if (Z.sakura(x, z) > 0.4) type = r < 0.6 ? "sakura" : r < 0.7 ? "round" : null;
    else if (Z.china(x, z) > 0.4) type = r < 0.3 ? "round" : r < 0.42 ? "conifer" : null;
    else if (plateau) type = r < 0.2 ? "round" : r < 0.3 ? "bush" : null;
    else type = r < 0.32 ? "round" : r < 0.4 ? "conifer" : r < 0.5 ? "bush" : null;
    if (!type) continue;
    TREE[type](V, x, y, z, s, rnd, h > 2.6);
    busy.push([x, z, 0.12]);
  }

  // 道路經過河流的地方：小石拱橋
  const bridges = [];
  for (const rd of ROADS) {
    let inside = false, sx = 0, sz = 0;
    for (let i = 0; i < rd.length - 1; i++) {
      const [ax, az] = rd[i], [bx, bz] = rd[i + 1], l = Math.hypot(bx - ax, bz - az), n = Math.ceil(l / 0.12);
      for (let k = 0; k <= n; k++) {
        const x = ax + (bx - ax) * k / n, z = az + (bz - az) * k / n, w = riverK(x, z) > 0.3 && islandHeight(x, z) > -0.3;
        if (w && !inside) { inside = true; sx = x; sz = z; }
        if (!w && inside) { inside = false; bridges.push([sx, sz, x, z]); }

    const cx = (ax + bx) / 2, cz = (az + bz) / 2, l = Math.hypot(bx - ax, bz - az) + 0.5, ry = Math.atan2(-(bz - az), bx - ax);
    const y = Math.max(ground(ax, az), ground(bx, bz), ground(cx, cz)) + 0.02;
    V.place(cx, y, cz, ry, 1, () => {
      V.add("box", 0xe9ddd0, 0, 0.06, 0, l, 0.08, 0.34);
      V.add("arch", 0xd9cbbd, 0, -0.32, 0, l * 0.42, l * 0.36, 1.1);
      [-1, 1].forEach((s) => V.add("box", 0xf4ece2, 0, 0.14, s * 0.16, l, 0.08, 0.04));
    });
  }

  // 臺灣長橋：低矮的連拱橋

(function who() {
  let s = null; try { s = JSON.parse(sessionStorage.getItem("island-quiz-session") || "null"); } catch (e) { s = null; }
  if (!s) return;
  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const label = s.role === "student" ? s.cls + " 班 " + s.seat + " 號　" + esc(s.name) : s.role === "teacher" ? "老師" : "訪客（不記錄成績）";
  const box = $("who"); box.hidden = false;
  box.innerHTML = "<span>" + label + '</span><button type="button" id="whoOut">' + (s.role === "guest" ? "登入" : "登出") + "</button>";
  $("whoOut").addEventListener("click", () => { try { sessionStorage.removeItem("island-quiz-session"); } catch (e) {} location.href = "https://kamewa.github.io/island-quiz/"; });
})();

function init3D() {
  const canvas = $("scene"), stage = $("stage");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: !LOW, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, LOW ? 1.5 : 2));
  renderer.setClearColor(0x10143a);
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x2a3a86, 190, 560);
  const camera = new THREE.PerspectiveCamera(42, 1, 0.3, 900);
  scene.add(new THREE.HemisphereLight(0xd8e0ff, 0x2a3a7a, 0.75));
  const moonLight = new THREE.DirectionalLight(0xfff0c8, 0.75); moonLight.position.set(-20, 60, -80); scene.add(moonLight);
  const ticks = [], rnd = makeRnd(1101);

  /* ---------- 浮世繪的版畫感：三階卡通著色＋深靛色描邊 ---------- */
  const grad = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 170, 170, 170, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
  grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
  const toon = (opt) => new THREE.MeshToonMaterial(Object.assign({ gradientMap: grad }, opt));
  const outlineMat = (w, col) => new THREE.ShaderMaterial({
    uniforms: { c: { value: new THREE.Color(col || 0x141a44) }, w: { value: w } },
    vertexShader: "uniform float w; void main(){ vec3 p = position + normal * w; gl_Position = projectionMatrix * modelViewMatrix * vec4(p,1.0); }",
    fragmentShader: "uniform vec3 c; void main(){ gl_FragColor = vec4(c,1.0); }",
    side: THREE.BackSide
  });
  const withOutline = (mesh, w) => { const o = new THREE.Mesh(mesh.geometry, outlineMat(w)); o.renderOrder = mesh.renderOrder; mesh.add(o); return mesh; };
  const vtxToon = toon({ vertexColors: true });

  /* ---------- 星空：天幕、星星、滿月、彎月、極光、星座、流星 ---------- */
  {
    const g = new THREE.SphereGeometry(600, 48, 24), p = g.attributes.position, cols = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) {
      const y = p.getY(i) / 600, x = p.getX(i) / 600, z = p.getZ(i) / 600, c = [0.07, 0.08, 0.22];
      const hz = 1 - smooth(-0.35, 0.35, y); c[0] += 0.16 * hz; c[1] += 0.18 * hz; c[2] += 0.32 * hz; const lo = smooth(0, -0.6, y); c[0] += 0.12 * lo; c[1] += 0.1 * lo; c[2] += 0.1 * lo;
      const neb = Math.max(0, Math.sin(x * 5 + z * 3) * Math.sin(y * 7 - x * 2)) * smooth(0.1, 0.6, y); c[0] += 0.2 * neb; c[1] += 0.06 * neb; c[2] += 0.22 * neb;
      cols.set(c, i * 3);
    }
    g.setAttribute("color", new THREE.BufferAttribute(cols, 3));
    scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false })));
  }
  const starMat = new THREE.ShaderMaterial({
    uniforms: { t: { value: 0 }, pr: { value: Math.min(window.devicePixelRatio || 1, 2) } }, transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending,
    vertexShader: "attribute float s; attribute float ph; uniform float t; uniform float pr; varying float a; void main(){ a = 0.6 + 0.4*sin(t*1.7+ph); vec4 mv = modelViewMatrix*vec4(position,1.0); gl_PointSize = s*pr*(0.75+0.25*a); gl_Position = projectionMatrix*mv; }",
    fragmentShader: "varying float a; void main(){ vec2 q = gl_PointCoord-0.5; float d = length(q); float k = smoothstep(0.5,0.05,d); k = k*k + smoothstep(0.12,0.0,d); gl_FragColor = vec4(vec3(1.0,0.95,0.82), min(1.0,k*a)); }"
  });
  {
    const N = LOW ? 1500 : 2800, P = new Float32Array(N * 3), S = new Float32Array(N), PH = new Float32Array(N);
    for (let i = 0; i < N; i++) { const u = rnd() * TAU, v = Math.acos(1 - rnd() * 1.25), r = 560; P.set([Math.cos(u) * Math.sin(v) * r, Math.cos(v) * r * 0.9 + 10, Math.sin(u) * Math.sin(v) * r], i * 3); S[i] = 4 + Math.pow(rnd(), 3) * 12; PH[i] = rnd() * TAU; }
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(P, 3)); g.setAttribute("s", new THREE.BufferAttribute(S, 1)); g.setAttribute("ph", new THREE.BufferAttribute(PH, 1));
    scene.add(new THREE.Points(g, starMat));

    const ringGeo = new THREE.RingGeometry(0.75, 1, 28); ringGeo.rotateX(-Math.PI / 2);
    const splashes = [0, 1, 2, 3].map(() => { const r = new THREE.Mesh(ringGeo, ringMat()); r.visible = false; scene.add(r); const drops = []; for (let k = 0; k < 8; k++) { const d = sprite(sprayTex, 0.45, 0); d.visible = false; scene.add(d); drops.push({ d, vx: 0, vy: 0, vz: 0 }); } return { r, drops, t: 9, s: 1, x: 0, z: 0 }; });
    let sk = 0;
    const splash = (x, z, s) => { const p = splashes[sk++ % splashes.length]; p.t = 0; p.s = s; p.x = x; p.z = z; p.r.visible = true; p.drops.forEach((d, k) => { const a = k / 8 * TAU + Math.random() * 0.5, v = (1.2 + Math.random()) * s; d.vx = Math.cos(a) * v; d.vz = Math.sin(a) * v; d.vy = (3 + Math.random() * 2.5) * Math.sqrt(s); d.d.visible = true; d.d.position.set(x, 0.3, z); }); };

    /* ----- 動作 ----- */
    const ZIN = 14.5, ZOUT = 23.5;
    const st = { x: 18, z: 0, h: Math.PI, sp: 2, y: 0.2, pitch: 0, roll: 0, act: "swim", t0: 0, dur: 4, under: false, op: 1, opGoal: 1, shimmerAt: 8 + Math.random() * 8, shimmerEnd: 0, wander: 0, wanderAt: 0, clicks: [], jig: -9, prev: "swim", flags: {} };
    const ACTS = { swim: [3, 6], spout: [2.4, 2.4], dive: [5.4, 5.4], breach: [2.6, 2.6], lobtail: [2.8, 2.8], spyhop: [3.4, 3.4], roll: [3.2, 3.2], spin: [2.6, 2.6] };
    const POOL = ["swim", "swim", "spout", "dive", "breach", "lobtail", "spyhop", "roll", "spin"];
    function start(act, t) {
      st.prev = st.act; st.act = act; st.t0 = t; st.flags = {};
      const d = ACTS[act] || [3.5, 3.5]; st.dur = d[0] + Math.random() * (d[1] - d[0]);
      if (act === "swim") st.sp = 1.2 + Math.random() * 2.6;
    }
    function nextAct(t, notSame) { let a; do { a = POOL[Math.floor(Math.random() * POOL.length)]; } while ((notSame && a === st.act) || (a === "swim" && st.act === "swim")); start(a, t); }
    function poke(t) {
      st.jig = t;
      st.clicks = st.clicks.filter((c) => t - c < 3); st.clicks.push(t);
      if (st.clicks.length >= 5) { st.clicks = []; start("dizzy", t); st.dur = 3.6; return; }
      if (st.under) return;                       // 潛在水裡時點不到，浮上來再說

    }
    const ease = (k) => k * k * (3 - 2 * k), bump = (k) => Math.sin(clamp(k, 0, 1) * Math.PI);

      if (r > ZOUT) want = Math.atan2(-st.x, -st.z) + st.wander * 0.3; else if (r < ZIN) want = Math.atan2(st.x, st.z) + st.wander * 0.3;
      let dh = ((want - st.h + Math.PI) % TAU + TAU) % TAU - Math.PI;
      let speed = st.sp, yaw = 0, pitch = 0, roll = 0, y = 0.2 + seaH(st.x, st.z, t) * 0.8, opGoal = 1, tailK = 1, finWave = 0, hide = false;
      switch (st.act) {
        case "swim": break;
        case "spout": {
          speed = 0.4; const sk2 = clamp((s - 0.15) / 0.6, 0, 1), on = s > 0.15 && s < 0.75;
          spout.material.opacity = on ? bump(sk2) * 0.95 : 0; spout.scale.set(on ? 0.5 + sk2 * 1.2 : 0.1, on ? 0.8 + sk2 * 2.4 : 0.1, 1); spout.position.y = H * 0.5 + 0.3 + sk2 * 0.9;
          hearts.forEach((hh, i) => { const q = clamp((s - 0.3 - i * 0.12) / 0.5, 0, 1); hh.material.opacity = q > 0 && q < 1 ? bump(q) : 0; hh.position.set(Math.sin(i * 2.1 + q * 4) * 0.5, H * 0.5 + 0.8 + q * 2.4, L * 0.2); hh.scale.setScalar(0.5 + q * 0.45); });

        }
        case "dive": {
          // 0～0.22 低頭、尾巴翹起；0.22～0.7 在水底（換到別的地方）；0.7～1 浮上來
          if (s < 0.22) { const q = s / 0.22; pitch = ease(q) * 1.15; y -= ease(q) * 2.2; speed = 1.6; tailK = 1.6; }
          else if (s < 0.7) { hide = true; if (!st.flags.moved) { st.flags.moved = true; splash(st.x, st.z, 0.8); const aa = Math.random() * TAU, rr = ZIN + 0.5 + Math.random() * (ZOUT - ZIN - 1); st.x = Math.cos(aa) * rr; st.z = Math.sin(aa) * rr; st.h = Math.PI - aa + (Math.random() - 0.5) * 2; } y = -3; speed = 0; }
          else { const q = (s - 0.7) / 0.3; if (!st.flags.up) { st.flags.up = true; splash(st.x, st.z, 1.0); } pitch = -(1 - ease(q)) * 0.8; y -= (1 - ease(q)) * 2.0; opGoal = 0.4; speed = 1.0; }
          break;
        }
        case "breach": {
          speed = 3.2; const q = clamp((s - 0.12) / 0.7, 0, 1), air = s > 0.12 && s < 0.82;

          else if (s <= 0.12) { pitch = -s / 0.12 * 0.9; y -= s / 0.12 * 0.6; }
          else { roll = Math.PI * (1 - ease((s - 0.82) / 0.18)); pitch = 0.9 * (1 - ease((s - 0.82) / 0.18)); y -= 0.5 * bump((s - 0.82) / 0.18); }
          if (s > 0.12 && !st.flags.a) { st.flags.a = true; splash(st.x, st.z, 0.7); }
          if (s > 0.82 && !st.flags.b) { st.flags.b = true; splash(st.x + Math.sin(st.h) * 1.5, st.z + Math.cos(st.h) * 1.5, 1.3); }
          tailK = 2; break;
        }
        case "lobtail": {
          speed = 0.3; pitch = 0.55 * bump(s * 1.05); y -= 0.6 * bump(s);
          const slap = Math.sin(s * Math.PI * 4); pivot.rotation.x = -0.4 - Math.abs(slap) * 0.9; tailK = 0;
          const n = Math.floor(s * 4); if (n % 2 === 1 && !st.flags["s" + n]) { st.flags["s" + n] = true; splash(st.x - Math.sin(st.h) * 2.4, st.z - Math.cos(st.h) * 2.4, 0.7); }
          break;
        }
        case "spyhop": {
          speed = 0; const up = s < 0.25 ? ease(s / 0.25) : s > 0.75 ? 1 - ease((s - 0.75) / 0.25) : 1;
          pitch = -up * 1.35; y += up * 1.5 - up * 0.2; yaw = Math.sin(t * 2.4) * 0.5 * up * (s > 0.25 && s < 0.75 ? 1 : 0); tailK = 0.6; finWave = up;

          dizzy.forEach((d, i) => { const aa = t * 4 + i * TAU / 3; d.material.opacity = q; d.position.set(Math.cos(aa) * 1.0, H * 0.5 + 0.9 + Math.sin(aa * 2) * 0.1, L * 0.22 + Math.sin(aa) * 1.0); });

  })();
  ticks.push((t, dt) => baby.update(t, dt));

  /* ============================================================
     鏡頭：拖曳旋轉、右鍵或雙指平移、滾輪縮放；點鯨島時鏡頭會跟著牠游
     ============================================================ */
  const HOME = { theta: 0, phi: 1.0, radius: 100, tx: 0, ty: -3, tz: 6 };
  const cam = Object.assign({}, HOME), goal = Object.assign({}, HOME);
  let aspect = 1;
  const clock = new THREE.Clock();
  const pts = new Map(); let pinch = 0, mid = null, panMode = false, down = null;
  const panBy = (dx, dy) => { const k = goal.radius * 0.0017, c = Math.cos(goal.theta), s = Math.sin(goal.theta); goal.tx = clamp(goal.tx - (c * dx + s * dy * 1.3) * k, -60, 60); goal.tz = clamp(goal.tz - (-s * dx + c * dy * 1.3) * k, -60, 60); };
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  canvas.addEventListener("pointerdown", (e) => { pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); pinch = 0; mid = null; panMode = e.button === 2 || e.shiftKey || e.ctrlKey || e.metaKey; down = pts.size === 1 ? { x: e.clientX, y: e.clientY, t: performance.now() } : null; try { canvas.setPointerCapture(e.pointerId); } catch (err) {} });
  canvas.addEventListener("pointermove", (e) => {
    const p = pts.get(e.pointerId); if (!p) { hover(e); return; }
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 1) { if (panMode) { panBy(dx, dy); follow = null; } else { goal.theta -= dx * 0.006; goal.phi = clamp(goal.phi - dy * 0.005, 0.3, 2.35); } }
    else if (pts.size === 2) { const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; if (pinch) goal.radius = clamp(goal.radius * pinch / d, 10, 230); pinch = d; if (mid) { panBy((m.x - mid.x) * 2, (m.y - mid.y) * 2); follow = null; } mid = m; }
  });
  const release = (e) => { if (down && pts.size === 1 && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 500) pickAt(e.clientX, e.clientY); pts.delete(e.pointerId); pinch = 0; mid = null; down = null; };
  canvas.addEventListener("pointerup", release); canvas.addEventListener("pointercancel", (e) => { pts.delete(e.pointerId); down = null; });
  canvas.addEventListener("wheel", (e) => { e.preventDefault(); goal.radius = clamp(goal.radius * Math.exp(e.deltaY * 0.0011), 10, 230); }, { passive: false });
  function resize() { const w = stage.clientWidth || 1, h = stage.clientHeight || 1; renderer.setSize(w, h, false); aspect = w / h; camera.aspect = aspect; camera.updateProjectionMatrix(); }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener("resize", resize);
  resize();

  /* ---------- 名牌（跟著鯨島移動）與介紹卡 ---------- */
  const labels = $("labels"), v3 = new THREE.Vector3();
  const tags = pods.map((p) => {
    const el = document.createElement("div"), btn = document.createElement("button"); el.className = "pin";
    btn.type = "button"; btn.className = "tag" + (p.w.kind === "main" ? " special" : ""); btn.textContent = p.w.name;
    btn.addEventListener("click", () => select(p)); el.appendChild(btn); labels.appendChild(el);
    return { p, el };
  });
  const babyTag = (() => { const el = document.createElement("div"), btn = document.createElement("button"); el.className = "pin"; btn.type = "button"; btn.className = "tag baby"; btn.textContent = "晶晶"; btn.addEventListener("click", () => baby.poke(clock.elapsedTime)); el.appendChild(btn); labels.appendChild(el); return el; })();
  let selected = null, follow = null;
  const topOf = (p) => p.grp.localToWorld(v3.set(0, p.w.top + 0.4, -p.w.L * 0.04)).clone();
  const midOf = (p) => p.grp.localToWorld(v3.set(0, p.w.H * 0.4, 0)).clone();
  function select(p) {
    selected = follow = p;
    tags.forEach((t) => t.el.firstChild.classList.toggle("on", t.p === p));
    $("iKind").textContent = p.w.kind === "main" ? "成就殿堂｜星願涼亭" : "成就殿堂｜" + p.w.region;
    $("iName").textContent = p.w.name; $("iText").textContent = p.w.text; $("info").hidden = false;
    goal.radius = p.w.kind === "main" ? 34 : 24; goal.phi = Math.min(goal.phi, 1.08);
  }
  function home() { selected = follow = null; tags.forEach((t) => t.el.firstChild.classList.remove("on")); $("info").hidden = true; Object.assign(goal, HOME, { theta: Math.round(goal.theta / TAU) * TAU }); }
  $("iBack").addEventListener("click", home);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && selected) home(); });
  const screenOf = (P) => { v3.copy(P).project(camera); const r = canvas.getBoundingClientRect(); return { x: r.left + (v3.x + 1) / 2 * r.width, y: r.top + (1 - v3.y) / 2 * r.height, z: v3.z }; };
  function nearest(px, py) { let best = null, bd = 80; for (const t of tags) { const s = screenOf(midOf(t.p)); if (s.z > 1) continue; const d = Math.hypot(s.x - px, s.y - py); if (d < bd) { bd = d; best = t.p; } } return best; }

    const r = canvas.getBoundingClientRect();
    const under = camera.position.y < -1;           // 從雲底往上看時，鯨島被雲擋住，名牌先藏起來
    labels.style.visibility = under ? "hidden" : "";
    { v3.copy(baby.topPos()).project(camera);
      if (baby.under || v3.z > 1 || Math.abs(v3.x) > 1.2 || Math.abs(v3.y) > 1.2) babyTag.style.display = "none";
      else { babyTag.style.display = ""; babyTag.style.transform = "translate(" + ((v3.x + 1) / 2 * r.width).toFixed(1) + "px," + ((1 - v3.y) / 2 * r.height).toFixed(1) + "px) translate(-50%,-100%)"; babyTag.style.zIndex = String(Math.round((1 - v3.z) * 1000)); } }

      if (v3.z > 1 || Math.abs(v3.x) > 1.2 || Math.abs(v3.y) > 1.2) { t.el.style.display = "none"; continue; }
      t.el.style.display = "";
      t.el.style.transform = "translate(" + ((v3.x + 1) / 2 * r.width).toFixed(1) + "px," + ((1 - v3.y) / 2 * r.height).toFixed(1) + "px) translate(-50%,-100%)";

  }

    const dt = Math.min(0.05, clock.getDelta()), time = clock.elapsedTime, tt = reduceMotion ? 12 : time;

}

setTimeout(() => {
  try { if (!window.THREE) throw new Error("three.js 未載入"); init3D(); }
  catch (err) { console.error(err); $("loading").hidden = true; $("fallback").hidden = false; }
}, 30);
