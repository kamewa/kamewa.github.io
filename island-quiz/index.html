<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粉彩地形島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 版面：左邊是 3D 島嶼舞台，右邊（手機在下方）是作答卡。永遠明亮，不跟隨深色模式。 */
:root{
  color-scheme: light;
  --plum:#4a2260;        /* 文字 */
  --plum-soft:#7a5590;   /* 次要文字 */
  --pink:#ff6fae;        /* 主色：糖果粉 */
  --pink-soft:#ffd3e6;
  --lav:#b79cff;         /* 薰衣草紫 */
  --lav-soft:#e6dcff;
  --mint:#63dcb6;        /* 薄荷綠：答對 */
  --mint-soft:#c8f7e6;
  --lemon:#ffe27a;       /* 檸檬黃 */
  --sky:#8fd3ff;         /* 寶寶藍 */
  --berry:#ff5f8a;       /* 答錯 */
  --card:#fffafd;
  --font-display:"Chiron GoRound TC","Baloo 2","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--font-body);font-weight:500;color:var(--plum);
  background:linear-gradient(180deg,#bfe6ff 0%,#dcd3ff 28%,#ffd9ee 56%,#ffd9ee 100%);
  background-color:#ffd9ee;
  overflow:hidden;
}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:0}
.stage{position:relative;min-height:0;min-width:0;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}

.brand{position:absolute;left:20px;top:16px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.eyebrow{margin:0;font-size:.82rem;font-weight:700;letter-spacing:.14em;color:var(--plum-soft)}
.brand h1{
  margin:0;display:flex;align-items:center;gap:10px;
  font-family:var(--font-display);font-weight:900;font-size:clamp(1.7rem,3.4vw,2.6rem);line-height:1.15;
  color:var(--pink);
  text-shadow:0 2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 -2px 0 #fff,0 5px 0 rgba(183,156,255,.55);
}
.brand svg{width:1.25em;height:1.25em;flex:none;filter:drop-shadow(0 2px 0 #fff)}
.tip{
  position:absolute;left:20px;bottom:14px;margin:0;padding:6px 14px;border-radius:999px;
  background:rgba(255,255,255,.78);font-size:.85rem;font-weight:700;color:var(--plum-soft);pointer-events:none
}
.fallback{
  position:absolute;inset:auto 20px 60px 20px;padding:14px 18px;border-radius:18px;
  background:#fff;border:2.5px solid var(--berry);font-weight:700
}

.panel{
  min-height:0;display:flex;flex-direction:column;gap:14px;padding:18px 18px 18px 6px;overflow-y:auto
}
.card{
  position:relative;background:var(--card);border-radius:28px;padding:22px 20px 20px;
  border:3px solid #fff;box-shadow:0 0 0 3px var(--pink-soft),0 14px 30px rgba(183,120,220,.28);
  display:flex;flex-direction:column;gap:14px
}
.card::before{ /* 糖果條紋飾帶 */
  content:"";position:absolute;left:26px;right:26px;top:-3px;height:8px;border-radius:0 0 8px 8px;
  background:repeating-linear-gradient(90deg,var(--pink) 0 18px,var(--lemon) 18px 36px,var(--mint) 36px 54px,var(--sky) 54px 72px,var(--lav) 72px 90px)
}
.progress{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hearts{display:flex;flex-wrap:wrap;gap:7px;list-style:none;margin:0;padding:0}
.hearts svg{width:26px;height:26px;display:block}
.hearts path{fill:#fff;stroke:var(--lav);stroke-width:2.2;transition:fill .3s,stroke .3s}
.hearts .now path{fill:var(--lemon);stroke:var(--pink)}
.hearts .ok path{fill:var(--pink);stroke:var(--pink)}
.hearts .no path{fill:var(--lav-soft);stroke:var(--lav)}
.count{font-family:var(--font-display);font-weight:800;font-size:.95rem;color:var(--plum-soft);font-variant-numeric:tabular-nums;white-space:nowrap}

.card h2{margin:0;font-family:var(--font-display);font-weight:900;font-size:1.35rem;line-height:1.35;text-wrap:balance}
.card p{margin:0;line-height:1.75;font-size:1rem}
.question{font-size:1.12rem !important;font-weight:700}
.lead{color:var(--plum-soft)}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
.opt{
  min-height:56px;padding:10px 8px;border-radius:18px;background:#fff;
  border:2.5px solid var(--lav-soft);font-family:var(--font-display);font-weight:800;font-size:1.15rem;
  box-shadow:0 4px 0 var(--lav-soft);transition:transform .12s,border-color .12s,box-shadow .12s,background .2s
}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--pink);box-shadow:0 6px 0 var(--pink-soft)}
.opt:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--pink-soft)}
.opt:disabled{cursor:default;opacity:.55}
.opt.right{opacity:1;background:var(--mint-soft);border-color:var(--mint);box-shadow:0 4px 0 var(--mint)}
.opt.wrong{opacity:1;background:#ffd9e2;border-color:var(--berry);box-shadow:0 4px 0 var(--berry);animation:shake .35s}
.opt .mark{display:block;font-family:var(--font-body);font-size:.78rem;font-weight:700;margin-top:2px}
.feedback{border-radius:18px;padding:12px 14px;background:var(--lav-soft);display:flex;flex-direction:column;gap:6px}
.feedback.good{background:var(--mint-soft)}
.feedback.bad{background:#ffe1ea}
.feedback strong{font-family:var(--font-display);font-weight:900;font-size:1.08rem}
.feedback p{font-size:.97rem}
.go{
  align-self:stretch;min-height:54px;border:0;border-radius:999px;padding:10px 22px;
  font-family:var(--font-display);font-weight:900;font-size:1.15rem;color:#fff;
  background:linear-gradient(180deg,#ff8fc2,var(--pink));box-shadow:0 5px 0 #e0458f,0 10px 18px rgba(255,111,174,.35);
  text-shadow:0 1px 0 rgba(160,30,100,.45);transition:transform .12s,box-shadow .12s
}
.go:hover{transform:translateY(-2px);box-shadow:0 7px 0 #e0458f,0 12px 20px rgba(255,111,174,.4)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #e0458f}
.score{font-family:var(--font-display);font-weight:900;font-size:2.6rem;line-height:1;color:var(--pink);font-variant-numeric:tabular-nums}
.score small{font-size:1.1rem;color:var(--plum-soft)}
.review{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.review li{display:flex;gap:8px;align-items:baseline}
.review b{font-family:var(--font-display);font-weight:900}
.tag{flex:none;font-size:.78rem;font-weight:700;border-radius:999px;padding:1px 9px}
.tag.ok{background:var(--mint-soft)}
.tag.no{background:#ffd9e2}
.foot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.sound{
  border-radius:999px;border:2.5px solid #fff;background:rgba(255,255,255,.75);
  padding:6px 14px;font-size:.85rem;font-weight:700;color:var(--plum-soft)
}
/* ---------- 關卡選單 ---------- */
.card .lvl-head{font-size:.85rem;font-weight:700;color:var(--plum-soft);line-height:1.4;margin-top:2px}
.lvls{display:flex;flex-direction:column;gap:8px}
.lvl{
  display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;text-align:left;padding:9px 14px;border-radius:18px;
  background:#fff;border:2.5px solid var(--lav-soft);box-shadow:0 4px 0 var(--lav-soft);transition:transform .12s,border-color .12s
}
.lvl:hover:not(:disabled){border-color:var(--pink);transform:translateY(-1px)}
.lvl:disabled{opacity:.55;cursor:default;box-shadow:none}
.lvl.done{border-color:var(--mint);box-shadow:0 4px 0 var(--mint)}
.lvl.test{border-color:var(--lemon);box-shadow:0 4px 0 var(--lemon)}
.lvl-name{font-family:var(--font-display);font-weight:900;font-size:1.1rem}
.lvl-note{grid-column:1;font-size:.82rem;font-weight:700;color:var(--plum-soft)}
.lvl-tag{grid-column:2;grid-row:1 / span 2;align-self:center;font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--mint-soft);white-space:nowrap}
.lvl-tag:empty{display:none}
.card .unlock{align-self:flex-start;font-weight:700;font-size:.95rem;border-radius:999px;padding:4px 14px;background:var(--mint-soft)}
.qimg{padding:0;border:2.5px solid var(--lav-soft);border-radius:16px;overflow:hidden;background:#fff;cursor:zoom-in}
.qimg img{display:block;width:100%;max-height:230px;object-fit:contain}
.zoom{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(74,34,96,.72);border:0;cursor:zoom-out}
.zoom[hidden]{display:none}
.zoom img{max-width:100%;max-height:100%;border-radius:16px;background:#fff}
/* ---------- 關卡設定（從題庫挑題） ---------- */
.ed-bank{margin:0;font-size:.88rem;font-weight:700;color:var(--plum);line-height:1.6}
.ed-note{margin:0;font-size:.82rem;line-height:1.7;color:var(--plum-soft)}
.ed-list.chosen,.ed-list.pool{flex:none;min-height:0;overflow:visible;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:34px;padding:4px 12px;border-radius:999px;background:#fff;border:2.5px solid var(--lav-soft);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--pink)}
.chip[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.editor input[type=search]{font:inherit;color:var(--plum);background:#fff;border:2.5px solid var(--lav-soft);border-radius:14px;padding:9px 12px;width:100%}
.editor select:disabled,.editor input:disabled{opacity:.55}
.pick-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-radius:16px;background:#fff;border:2.5px solid var(--lav-soft)}
.pick-row.in{border-color:var(--mint);background:#f4fffa}
.pick-row.bad{border-color:#ffc2d2;background:#fff5f8}
.pick-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.pick-stem{font-weight:700;font-size:.93rem;line-height:1.55}
.pick-opts{font-size:.8rem;line-height:1.5;color:var(--plum)}
.pick-meta{font-size:.76rem;font-weight:700;color:var(--plum-soft);line-height:1.5}
.pick-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.editor .pick-tools select{width:auto;padding:5px 8px;font-size:.82rem;border-radius:10px}
.pick-done{font-size:.8rem;font-weight:700;color:#1f9c72}
.dtag{display:inline-block;margin-right:6px;padding:0 8px;border-radius:999px;font-size:.74rem;color:#fff}
.dtag.d0{background:#5fd8aa}.dtag.d1{background:#7cc8ff}.dtag.d2{background:#b08cff}.dtag.d3{background:#ff6fae}
@media (max-width:860px){.pick-row{grid-template-columns:auto minmax(0,1fr)}.pick-tools{grid-column:1 / -1;justify-content:flex-start}}
/* ---------- 學生管理 ---------- */
.ad-body{min-height:0;overflow-y:auto;padding:18px 22px 22px;display:flex;flex-direction:column;gap:14px}
.ad-body>*{flex-shrink:0}
.ad-pick{display:flex;align-items:center;gap:10px;font-weight:700}
.ad-pick select{width:auto;min-width:180px}
.ad-form{display:grid;grid-template-columns:110px 90px minmax(0,1fr) auto;gap:10px;align-items:end;padding:14px;border-radius:18px;background:#fff3f9}
.ad-form label,.ed-lab{display:block;font-size:.85rem;font-weight:700;color:var(--plum-soft);margin-bottom:3px}
.ad-form .mini{min-height:44px}
.ad-code{display:flex;flex-direction:column;gap:2px;padding:14px 18px;border-radius:18px;background:#fff6c9;border:2.5px solid var(--lemon);font-weight:700}
.ad-code[hidden]{display:none}
.ad-code strong{font-family:var(--font-display);font-weight:900;font-size:2.2rem;letter-spacing:.08em;font-variant-numeric:tabular-nums;color:var(--pink)}
.ad-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ad-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:6px 12px;border-radius:16px;background:#fff;border:2.5px solid var(--lav-soft)}
.ad-row.off{background:#f6f1fa;border-style:dashed}
.ad-row.off .ad-name{color:var(--plum-soft)}
.ad-name{font-weight:700}
.ad-note{font-weight:700;color:var(--plum-soft);padding:8px}
@media (max-width:860px){.ad-form{grid-template-columns:1fr 1fr}.ad-form .ad-wide{grid-column:1 / -1}}
/* ---------- 登入 ---------- */
.login{display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.88rem;font-weight:700;color:var(--plum-soft)}
.field input{
  font:inherit;font-family:var(--font-display);font-weight:800;font-size:1.25rem;letter-spacing:.08em;color:var(--plum);
  width:100%;min-height:52px;padding:8px 14px;border-radius:16px;background:#fff;border:2.5px solid var(--lav-soft)
}
.field input::placeholder{font-weight:500;font-size:.95rem;letter-spacing:0;color:#b9a3c8}
.field input:focus-visible{outline:3px solid var(--pink);outline-offset:1px}
.login-msg{min-height:1.4em;font-size:.92rem !important;font-weight:700;color:#c81e5b}
.go:disabled{opacity:.6;cursor:default}
.ghost{
  min-height:48px;border-radius:999px;background:#fff;border:2.5px solid var(--lav-soft);
  font-family:var(--font-display);font-weight:800;font-size:1rem
}
.ghost:hover{border-color:var(--pink)}
.textlink{align-self:center;background:none;border:0;padding:4px 8px;font-size:.88rem;font-weight:700;color:var(--plum-soft);text-decoration:underline}
.sync{font-size:.9rem !important;font-weight:700;color:var(--plum-soft);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.who{
  position:absolute;right:16px;top:16px;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 16px;border-radius:999px;
  background:rgba(255,255,255,.88);border:2.5px solid #fff;font-size:.9rem;font-weight:700
}
.who[hidden]{display:none}
.who button{border:0;border-radius:999px;padding:5px 14px;background:var(--pink-soft);font-size:.85rem;font-weight:700}
@media (max-width:860px){.who{top:auto;bottom:10px;right:16px;font-size:.8rem}.tip{display:none}}
/* ---------- 老師的試題編輯器 ---------- */
.editor{position:fixed;inset:0;z-index:20;display:flex;padding:16px;background:rgba(122,85,144,.42)}
.editor[hidden]{display:none}
.ed-box{
  margin:auto;width:min(1320px,100%);height:100%;background:var(--card);border-radius:28px;
  border:3px solid #fff;box-shadow:0 0 0 3px var(--pink-soft),0 20px 44px rgba(120,60,160,.35);
  display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden
}
.ed-head{padding:18px 22px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:3px dotted var(--pink-soft)}
.ed-titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ed-head h2{margin:0;font-family:var(--font-display);font-weight:900;font-size:1.35rem;color:var(--pink)}
.ed-done{align-self:auto;min-height:44px;padding:6px 26px;font-size:1.05rem}
.ed-tools,.ed-moves{display:flex;flex-wrap:wrap;gap:8px}
.mini{
  min-height:40px;padding:6px 16px;border-radius:999px;background:#fff;border:2.5px solid var(--lav-soft);
  font-family:var(--font-display);font-weight:800;font-size:.95rem;transition:border-color .12s,background .12s
}
.mini:hover:not(:disabled){border-color:var(--pink);background:#fff5fa}
.mini:disabled{opacity:.4;cursor:default}
.mini.add{border-color:var(--mint);background:var(--mint-soft)}
.mini.warn{border-color:#ffc2d2}
.mini.armed{background:var(--berry);border-color:var(--berry);color:#fff}
.ed-msg{margin:0;min-height:1.5em;font-size:.9rem;font-weight:700;color:var(--plum-soft)}
.ed-msg.bad{color:#c81e5b}
.ed-raw{width:100%;font:500 .8rem/1.5 ui-monospace,Consolas,monospace;border:2.5px solid var(--lav-soft);border-radius:14px;padding:8px}
.ed-body{min-height:0;display:grid;grid-template-columns:310px minmax(0,1fr)}
.ed-side{min-height:0;display:flex;flex-direction:column;gap:10px;padding:16px;background:#fff3f9;border-right:3px dotted var(--pink-soft)}
.ed-list{flex:1 1 0;min-height:120px;overflow-y:auto;margin:0;padding:2px;list-style:none;display:flex;flex-direction:column;gap:6px}
.ed-item{
  width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;row-gap:1px;align-items:center;text-align:left;
  padding:8px 12px;border-radius:16px;background:#fff;border:2.5px solid transparent
}
.ed-item:hover{border-color:var(--pink-soft)}
.ed-item.on{border-color:var(--pink);background:#fff}
.ed-no{grid-row:span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--lav-soft);font-family:var(--font-display);font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.ed-item.on .ed-no{background:var(--pink);color:#fff}
.ed-stem{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-spot{font-size:.76rem;font-weight:700;color:var(--plum-soft)}
.ed-item.todo .ed-spot{color:#c81e5b}
.ed-count{margin:0;font-size:.82rem;font-weight:700;color:var(--plum-soft)}
.ed-pass{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.9rem;font-weight:700}
.ed-pass input{width:74px}
.ed-form,.ed-empty{min-height:0;overflow-y:auto;padding:18px 22px 22px;margin:0}
.ed-form{display:flex;flex-direction:column;gap:8px}
.ed-form>*,.ed-side>*{flex-shrink:0} /* 空間不夠時用捲動，不要把欄位壓扁 */
.ed-side{overflow-y:auto}
.ed-form[hidden]{display:none}
.ed-empty{font-weight:700;color:var(--plum-soft);line-height:1.8}
.ed-formhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ed-formhead strong{font-family:var(--font-display);font-weight:900;font-size:1.15rem}
.ed-form label,.ed-form legend{font-size:.88rem;font-weight:700;color:var(--plum-soft);margin-top:6px;padding:0}
.ed-form fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.editor input[type=text],.editor input[type=number],.editor textarea,.editor select{
  font:inherit;color:var(--plum);background:#fff;border:2.5px solid var(--lav-soft);border-radius:14px;padding:9px 12px;width:100%
}
.editor textarea{resize:vertical;line-height:1.6;min-height:6.4em}
.editor input:focus-visible,.editor textarea:focus-visible,.editor select:focus-visible{outline:3px solid var(--pink);outline-offset:1px}
.ed-opt{display:flex;align-items:center;gap:10px}
.ed-opt input[type=radio]{flex:none;width:24px;height:24px;accent-color:var(--mint);cursor:pointer}
@media (max-width:860px){
  .editor{padding:8px}
  .ed-box{overflow-y:auto;grid-template-rows:auto auto}
  .ed-body{grid-template-columns:1fr;grid-template-rows:auto auto;min-height:0}
  .ed-side{border-right:0;border-bottom:3px dotted var(--pink-soft);overflow:visible}
  .ed-list{flex:none;max-height:240px}
  .ed-form,.ed-empty{overflow:visible}
}
@media (min-width:861px) and (max-height:680px){
  .editor{padding:8px}
  .ed-box{overflow-y:auto}
  .ed-body{min-height:600px}
}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{
  position:absolute;top:-30px;width:18px;height:18px;
  clip-path:path("M9 16 C2 11 0 7 0 4.5 C0 2 2 0 4.5 0 C6.5 0 8 1 9 2.8 C10 1 11.5 0 13.5 0 C16 0 18 2 18 4.5 C18 7 16 11 9 16 Z");
  animation:fall linear forwards
}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .panel{padding:0 16px 16px;max-height:56vh;max-height:56dvh}
  .brand{left:16px;top:12px}

<script>
"use strict";

/* ============================================================
   預設題庫：老師可以在頁面上的「老師編輯題目」修改，
   或把匯出的 questions.json 放在網頁旁邊，就會自動取代這份預設題庫。
   ============================================================ */
const ISLAND_ID = "terrain";
const SPOT_NAMES = { mountain: "山地", hills: "丘陵", plateau: "台地", basin: "盆地", plain: "平原", none: "整座島" };
// 網站上還沒有放題庫檔時使用的示範題目（格式和「互動式評量系統」的題庫檔相同）
const DEMO_BANK = { format: "InteractiveAssessmentQuestionBank", schemaVersion: 1, questions: [
  { id: "demo-terrain-1", category: "通論", unit: "地形", cognitiveLevels: ["理解"], answer: "A",
    stem: "這裡高度高、坡度陡、起伏很大，是哪一種地形？", options: ["山地", "丘陵", "台地", "盆地"],
    explanation: "山地的特徵是高度高、起伏大。看顏色就知道：短短的距離內，顏色從粉紅換到紫色再到白色，代表高度變化很快。" },
  { id: "demo-terrain-2", category: "通論", unit: "地形", cognitiveLevels: ["理解"], answer: "A",
    stem: "靠海的一大片土地，地勢低、幾乎沒有起伏，是哪一種地形？", options: ["平原", "盆地", "台地", "丘陵"],
    explanation: "平原地勢低平、起伏很小。平坦的土地適合耕作和居住，人口通常比較多。" },
  { id: "demo-terrain-3", category: "通論", unit: "地形", cognitiveLevels: ["理解"], answer: "A",
    stem: "外圍一圈比較高，中間低而平，是哪一種地形？", options: ["盆地", "平原", "山地", "台地"],
    explanation: "盆地四周高、中間低平，形狀像一個臉盆。臺北盆地、臺中盆地都是這種地形。" },
  { id: "demo-terrain-4", category: "通論", unit: "地形", cognitiveLevels: ["記憶"], answer: "A",
    stem: "頂部平坦、邊緣陡峭，像一張桌子，是哪一種地形？", options: ["台地", "山地", "丘陵", "平原"],
    explanation: "台地的頂部平坦、四周是陡坡，可以記成「頂平崖陡」。林口台地、桃園台地都是例子。" },
  { id: "demo-terrain-5", category: "通論", unit: "地形", cognitiveLevels: ["記憶"], answer: "A",
    stem: "比山地低、坡度和緩的一群小山包，是哪一種地形？", options: ["丘陵", "山地", "平原", "盆地"],
    explanation: "丘陵的高度比山地低，起伏也比較和緩，常分布在山地和平原之間。" }
] };
// 網站上還沒有放關卡設定檔時使用的預設值
const DEFAULT_CONFIG = { format: "StarWishIslandsConfig", version: 1, islands: {
  terrain: { name: "粉彩地形島", units: [{ category: "通論", unit: "地形" }, { category: "台灣", unit: "地形" }], practiceCount: 5, assessments: [] }
} };

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);

/* ---------- 地形高度函式（3D 與標記共用） ---------- */
const SPOTS = {
  mountain: { x: -2.6, z: -2.6, r: 13.5, phi: 1.12 },
  plain:    { x: 0.6,  z: 5.6,  r: 10.5, phi: 0.95 },
  basin:    { x: -4.3, z: 3.4,  r: 10.5, phi: 0.78 },
  plateau:  { x: 4.8,  z: 2.6,  r: 10,   phi: 1.0 },
  hills:    { x: 3.9,  z: -3.6, r: 10.5, phi: 0.98 }
};
function smooth(a, b, v) { const t = Math.min(1, Math.max(0, (v - a) / (b - a))); return t * t * (3 - 2 * t); }
function landHeight(x, z) {
  const g = (cx, cz, s, h) => h * Math.exp(-((x - cx) ** 2 + (z - cz) ** 2) / (2 * s * s));
  let h = 0.32; // 平原的基準高度
  // 山地：幾座又高又尖的山峰疊在一起
  h += g(-2.6, -2.6, 1.5, 3.6) + g(-1.2, -3.6, 0.9, 2.2) + g(-3.9, -1.4, 0.9, 2.0) + g(-2.2, -0.9, 0.7, 1.2) + g(-0.6, -2.0, 0.6, 0.9);
  // 丘陵：一群低矮圓潤的小山包
  h += g(3.6, -3.8, 1.0, 1.1) + g(5.0, -2.4, 0.9, 0.9) + g(2.6, -2.2, 0.8, 0.8) + g(4.6, -4.9, 0.8, 0.7) + g(6.0, -3.9, 0.7, 0.6);
  // 台地：頂平崖陡
  h += 1.2 * (1 - smooth(1.5, 1.9, Math.hypot((x - 4.8) / 1.2, z - 2.6)));
  // 盆地：一圈高地包住低平的中央
  const d = Math.hypot(x + 4.3, z - 3.4);
  h += 1.5 * Math.exp(-(((d - 2.1) / 0.55) ** 2));
  return h;
}
function islandHeight(x, z) {
  const a = Math.atan2(z, x), r = Math.hypot(x, z);
  const R = 8.9 + 0.5 * Math.sin(3 * a + 0.4) + 0.3 * Math.sin(5 * a + 1.3) + 0.2 * Math.sin(8 * a);
  const m = 1 - smooth(R - 1.1, R, r);
  return -0.6 + (landHeight(x, z) + 0.6) * m;
}

/* ---------- 音效（瀏覽器即時合成） ---------- */
let soundOn = true, actx = null;
function tone(freq, at, dur, type, vol) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const o = actx.createOscillator(), gn = actx.createGain(), t = actx.currentTime + at;
    o.type = type || "sine"; o.frequency.value = freq;
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.exponentialRampToValueAtTime(vol || 0.14, t + 0.02);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(actx.destination); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) { /* 沒有聲音也能玩 */ }
}
const sfx = {
  good() { tone(784, 0, 0.18); tone(1047, 0.12, 0.3); },
  bad() { tone(311, 0, 0.2, "triangle", 0.1); tone(262, 0.14, 0.32, "triangle", 0.1); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.11, 0.35)); },
  tap() { tone(660, 0, 0.1, "sine", 0.08); }
};
$("sound").addEventListener("click", () => {
  soundOn = !soundOn;
  $("sound").textContent = "音效：" + (soundOn ? "開" : "關");
  $("sound").setAttribute("aria-pressed", String(soundOn));
  if (soundOn) sfx.tap();
});

/* ============================================================
   3D 島嶼
   ============================================================ */
function init3D() {
  const canvas = $("scene"), stage = $("stage");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xffd9ee, 34, 88);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 300);

  scene.add(new THREE.HemisphereLight(0xffffff, 0xffc9e6, 0.78));
  const sun = new THREE.DirectionalLight(0xfff4e0, 0.5);
  sun.position.set(8, 14, 6); scene.add(sun);

  let seed = 20261115; // 固定亂數，每次打開長得一樣
  const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const lambert = (c, extra) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, extra || {}));

  /* --- 島：依高度分成一層一層的粉彩色帶 --- */
  const N = 170, SIZE = 22;
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, N, N);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, cols = new Float32Array(pos.count * 3);
  const bands = [
    [0.02, 0xffe6b0], [0.2, 0xfff3c4], [0.62, 0x9cf0c4], [1.1, 0xc6f48e],
    [1.72, 0xffe36e], [2.5, 0xffa9d0], [3.4, 0xcfa8ff], [99, 0xffffff]
  ];
  const c = new THREE.Color(), deepSea = new THREE.Color(0xa9e8f6), heights = new Float32Array(pos.count);
  for (let i = 0; i < pos.count; i++) {
    const h = islandHeight(pos.getX(i), pos.getZ(i));
    pos.setY(i, h); heights[i] = h;
    for (const [top, hex] of bands) { if (h < top) { c.setHex(hex); break; } }
    if (h < 0) c.lerp(deepSea, Math.min(1, -h / 0.45)); // 越深越接近海水的顏色
    cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
  }
  geo.setAttribute("color", new THREE.BufferAttribute(cols, 3));
  // 只留下島和岸邊的淺灘；離岸的平坦海底不畫，海面下就不會出現方形邊緣
  const src = geo.index.array, keep = [];
  for (let i = 0; i < src.length; i += 3) {
    if (Math.max(heights[src[i]], heights[src[i + 1]], heights[src[i + 2]]) > -0.5) keep.push(src[i], src[i + 1], src[i + 2]);
  }
  geo.setIndex(keep);
  geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true })));

  /* --- 海 --- */
  const sea = new THREE.Mesh(new THREE.CircleGeometry(95, 72),
    new THREE.MeshBasicMaterial({ color: 0x86e4f4, transparent: true, opacity: 0.8 }));
  sea.rotation.x = -Math.PI / 2; scene.add(sea);

  /* --- 棉花糖樹 --- */
  const trunkMat = lambert(0xd9a98a), canopy = [0xff9ccb, 0xd4b3ff, 0xffb8dc, 0xa8ecd2, 0xffd0e6];
  const trunkGeo = new THREE.CylinderGeometry(0.06, 0.1, 0.5, 8), ballGeo = new THREE.SphereGeometry(1, 16, 12);
  const trees = [
    [2.9, -4.7, 0.6, 0], [4.5, -3.1, 0.55, 1], [5.6, -4.7, 0.5, 2], [3.2, -2.9, 0.5, 4],
    [-5.2, 3.0, 0.55, 2], [-3.6, 4.1, 0.5, 1],
    [-0.9, 6.6, 0.75, 0], [2.0, 4.6, 0.7, 1], [-1.7, 5.1, 0.65, 3], [3.0, 6.5, 0.7, 4],
    [0.8, 0.9, 0.8, 2], [1.7, -0.6, 0.7, 0], [-0.4, 2.3, 0.7, 1], [1.9, 2.1, 0.65, 3], [0.3, -5.7, 0.7, 4],
    [5.6, 2.1, 0.45, 0], [4.0, 3.2, 0.45, 1], [-6.9, -0.4, 0.65, 3], [6.9, -0.3, 0.6, 2]
  ];
  for (const [x, z, s, ci] of trees) {
    const t = new THREE.Group(), m = lambert(canopy[ci]);
    const trunk = new THREE.Mesh(trunkGeo, trunkMat); trunk.position.y = 0.25; t.add(trunk);
    [[0, 0.72, 0, 0.36], [0.22, 0.56, 0.1, 0.26], [-0.2, 0.58, -0.06, 0.25]].forEach(([bx, by, bz, br]) => {
      const b = new THREE.Mesh(ballGeo, m); b.position.set(bx, by, bz); b.scale.setScalar(br); t.add(b);
    });
    t.position.set(x, islandHeight(x, z) - 0.03, z); t.scale.setScalar(s); t.rotation.y = rnd() * 6.28;
    scene.add(t);
  }

  /* --- 小花：灑在平原和盆地底部 --- */
  const flowerHex = [0xff6fae, 0xffffff, 0xffd84d, 0xb79cff, 0xff9ccb];
  const flowers = new THREE.InstancedMesh(new THREE.SphereGeometry(0.075, 8, 6), new THREE.MeshLambertMaterial({ color: 0xffffff }), 170);
  const dummy = new THREE.Object3D(); let placed = 0, guard = 0;
  while (placed < 170 && guard++ < 6000) {
    const x = (rnd() - 0.5) * 17, z = (rnd() - 0.5) * 17, h = islandHeight(x, z);
    if (h < 0.26 || h > 0.42) continue;
    dummy.position.set(x, h + 0.05, z); dummy.scale.setScalar(0.7 + rnd() * 0.8); dummy.updateMatrix();
    flowers.setMatrixAt(placed, dummy.matrix);
    flowers.setColorAt(placed, c.setHex(flowerHex[Math.floor(rnd() * flowerHex.length)]));
    placed++;
  }
  flowers.count = placed; scene.add(flowers);

  /* --- 戴蝴蝶結的小兔子 --- */
  const bunny = new THREE.Group();
  (function () {
    const white = lambert(0xffffff), pink = lambert(0xff8fc2), dark = lambert(0x4a2260), blush = lambert(0xffb3d1);
    const part = (mat, x, y, z, sx, sy, sz) => { const m = new THREE.Mesh(ballGeo, mat); m.position.set(x, y, z); m.scale.set(sx, sy, sz); bunny.add(m); return m; };
    part(white, 0, 0.3, 0, 0.32, 0.29, 0.35);            // 身體

const DIFFS = ["基礎", "進階", "思考", "統整"];

    bad_request: "資料格式不正確，請檢查後再試。"
  };
  return map[res.error] || "雲端暫時沒有回應，請稍後再試。";
}

/* ============================================================
   畫面：登入 → 關卡選單 → 作答 → 結果
   ============================================================ */
const HEART = '<svg viewBox="0 0 26 24" aria-hidden="true"><path d="M13 22 C4 15.5 1.5 11 1.5 7.2 C1.5 4 4 1.5 7.2 1.5 C9.7 1.5 11.8 2.9 13 5 C14.2 2.9 16.3 1.5 18.8 1.5 C22 1.5 24.5 4 24.5 7.2 C24.5 11 22 15.5 13 22 Z"/></svg>';
const view = $("view"), heartsEl = $("hearts"), countEl = $("count");
let level = null, quiz = [], step = 0, results = [], playing = false, opts = [];
let attempt = null;   // 評量：{ id, n }；null 代表這次不記錄
let cloudStatus = {}; // 評量：每關已用次數與分數

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function resetStage() {
  playing = false; quiz = []; results = []; step = 0; attempt = null;
  world.clearMarks(); world.rainbow(false); world.home(); $("confetti").innerHTML = "";
  heartsEl.innerHTML = "";
}
function drawHearts() {
  let html = "";

    const label = r === true ? "答對" : r === false ? "答錯" : "未作答";
    html += '<li class="' + cls + '" aria-label="第 ' + (i + 1) + " 題" + label + '">' + HEART + "</li>";
  }

}
function drawWho() {
  const box = $("who");
  $("teacher").hidden = !isTeacher();
  $("adminBtn").hidden = !(cloudOn() && session && session.role === "teacher");
  if (!cloudOn() || !session) { box.hidden = true; return; }

  const label = session.role === "student" ? session.cls + " 班 " + session.seat + " 號　" + esc(session.name)

  box.innerHTML = "<span>" + label + '</span><button type="button" id="whoOut">' + (session.role === "guest" ? "登入" : "登出") + "</button>";
  $("whoOut").addEventListener("click", () => { setSession(null); home(); });
}
function home() {
  drawWho();
  if (cloudOn() && !session) showLogin(); else showLevels();
}

/* ---------- 練習進度（存在這台電腦的瀏覽器） ---------- */
const progKey = () => "island-quiz-progress:" + ISLAND_ID + ":" + (isStudent() ? session.cls + "-" + session.seat : "guest");
function passedSet() { try { return JSON.parse(localStorage.getItem(progKey())) || []; } catch (e) { return []; } }
function markPassed(id) {
  const s = passedSet(); if (s.includes(id)) return false;
  s.push(id); try { localStorage.setItem(progKey(), JSON.stringify(s)); } catch (e) {}
  return true;
}
// 前一個「有題目」的難度過關後，下一個難度才開放；沒有題目的難度直接跳過
function unlocked(l, levels) {
  if (l.kind !== "practice" || isTeacher()) return true;
  const passed = passedSet();
  for (let j = levels.indexOf(l) - 1; j >= 0; j--) if (levels[j].pool.length) return passed.includes(levels[j].id);
  return true;
}

/* ---------- 關卡選單 ---------- */
async function showLevels() {
  resetStage(); level = null;
  countEl.textContent = isl().name;
  const practice = practiceLevels(), tests = assessmentLevels().filter((l) => l.items.length);
  const draw = (loading) => {
    const passed = passedSet();
    let html = "<h2>選一個關卡</h2><p class=\"lvl-head\">練習　不限次數，不記錄分數，每次隨機出題</p><div class=\"lvls\">";
    practice.forEach((l) => {
      const n = Math.min(isl().practiceCount, l.pool.length), open = unlocked(l, practice), done = passed.includes(l.id);
      const note = !n ? "尚無題目" : !open ? "通過上一個難度後開放" : "每次 " + n + " 題・答對 " + passFor(n) + " 題過關";
      html += '<button class="lvl' + (done ? " done" : "") + '" type="button" data-id="' + l.id + '"' + (n && open ? "" : " disabled") + ">" +
        '<span class="lvl-name">' + esc(l.name) + '</span><span class="lvl-note">' + note + '</span><span class="lvl-tag">' + (done ? "已過關" : !open && n ? "未開放" : "") + "</span></button>";
    });

    if (tests.length) {
      html += '<p class="lvl-head">評量　每關最多 ' + MAX_TRIES + " 次，計算平均</p><div class=\"lvls\">";
      tests.forEach((l) => {
        const n = l.items.length, st = cloudStatus[l.id] || { used: 0, scores: [], avg: null };
        let note = n + " 題", tag = "", off = false;
        if (!cloudOn() || (session && session.role === "teacher")) { note += "・試玩，不記錄"; }
        else if (!isStudent()) { note = "登入後才能作答"; off = true; }
        else if (loading) { note = "讀取作答紀錄中…"; off = true; }
        else { note += "・已作答 " + st.used + "／" + MAX_TRIES + " 次"; tag = st.avg === null ? "" : "平均 " + st.avg + " 分"; off = st.used >= MAX_TRIES; }
        html += '<button class="lvl test" type="button" data-id="' + l.id + '"' + (off ? " disabled" : "") + ">" +
          '<span class="lvl-name">' + esc(l.name) + '</span><span class="lvl-note">' + note + '</span><span class="lvl-tag">' + tag + "</span></button>";
      });
      html += "</div>";
    }
    if (isTeacher() && bankSrc.demo) html += '<p class="lvl-head">目前使用示範題目。把評量系統的題庫檔放上網站後，就會改用你的題目。</p>';
    html += '<p class="login-msg" id="lvMsg" role="alert"></p>';
    view.innerHTML = html;
    view.querySelectorAll(".lvl").forEach((b) => b.addEventListener("click", () => pickLevel([...practice, ...tests].find((l) => l.id === b.dataset.id))));
  };
  const needCloud = isStudent() && tests.length;
  draw(needCloud);
  if (!needCloud) return;
  const who = session;
  try {
    const res = await api({ action: "status", token: session.token, island: isl().name });
    if (session !== who || level || playing) return;
    if (res.ok) { cloudStatus = res.levels || {}; draw(false); }
    else { draw(false); $("lvMsg").textContent = failText(res); }
  } catch (e) {
    if (session !== who || level || playing) return;
    draw(true); $("lvMsg").textContent = "連不上雲端，暫時無法作答評量。練習可以照常進行。";
  }
}
function pickLevel(l) {
  if (!l) return;
  level = l; sfx.tap();
  if (l.kind === "practice") { startQuiz(); return; }
  const recorded = isStudent(), st = cloudStatus[l.id] || { used: 0 }, n = l.items.length;
  countEl.textContent = "評量";
  view.innerHTML = "<h2>" + esc(l.name) + '</h2><p class="lead">共 ' + n + " 題。" +
    (recorded ? "按下「開始作答」就算一次，中途離開也算。你還可以作答 " + (MAX_TRIES - st.used) + " 次。" : "現在是試玩，不計次數，也不記錄分數。") +
    '作答中只會告訴你對或錯，不會顯示正確答案。</p><p class="login-msg" id="lvMsg" role="alert"></p>' +
    '<button class="go" id="lvGo" type="button">開始作答</button><button class="ghost" id="lvBack" type="button">回關卡選單</button>';
  $("lvBack").addEventListener("click", showLevels);
  $("lvGo").addEventListener("click", async () => {
    if (!recorded) { startQuiz(); return; }
    const go = $("lvGo"); go.disabled = true; go.textContent = "準備中…";
    try {
      const res = await api({ action: "begin", token: session.token, island: isl().name, levelId: l.id, levelName: l.name, total: n });
      if (res.ok) { attempt = { id: res.id, n: res.attempt }; startQuiz(); return; }
      $("lvMsg").textContent = failText(res);
    } catch (e) { $("lvMsg").textContent = "連不上雲端，請檢查網路後再試一次。這次不算作答。"; }
    if ($("lvGo")) { go.disabled = false; go.textContent = "開始作答"; }
  });
}

/* ---------- 作答 ---------- */
const toItem = (q, spot) => ({ spot: spot || "none", q: q.stem, options: q.options, answer: q.answer, why: q.explanation, img: q.image });
function startQuiz() {
  const keep = attempt;
  quiz = level.kind === "practice"
    ? shuffle(level.pool.slice()).slice(0, isl().practiceCount).map((q) => toItem(q, "none"))
    : shuffle(level.items.slice()).map((x) => toItem(x.q, x.spot));
  if (!quiz.length) { showLevels(); return; }
  step = 0; results = []; playing = true; attempt = keep;
  world.clearMarks(); world.rainbow(false); $("confetti").innerHTML = "";
  ask();
}
function ask() {
  const item = quiz[step], strict = level.kind === "assessment";
  world.clearMarks();
  quiz.forEach((q, i) => { if (i < step) world.mark(q.spot, results[i] ? "ok" : "no"); });
  world.mark(item.spot, "now"); world.focus(item.spot);
  countEl.textContent = levelLabel(level) + "　" + (step + 1) + "／" + quiz.length;
  drawHearts();
  opts = shuffle(item.options.map((t, i) => ({ t, right: i === item.answer })));
  view.innerHTML = '<p class="question">' + esc(item.q) + "</p>" +
    (item.img ? '<button class="qimg" id="qimg" type="button" aria-label="放大題目圖片"><img src="' + esc(item.img) + '" alt="題目圖片"></button>' : "") +
    '<div class="options">' + opts.map((o, i) => '<button class="opt" type="button" data-i="' + i + '">' + esc(o.t) + "</button>").join("") +
    '</div><div id="fb"></div>' + (strict ? "" : '<button class="textlink" id="quit" type="button">回關卡選單</button>');
  view.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => answer(b, item)));
  if (!strict) $("quit").addEventListener("click", showLevels);
  if (item.img) {
    const im = $("qimg").querySelector("img");
    im.addEventListener("error", () => { $("qimg").outerHTML = '<p class="login-msg">圖片載入失敗：' + esc(item.img) + "</p>"; });
    $("qimg").addEventListener("click", () => { $("zoomImg").src = item.img; $("zoom").hidden = false; $("zoom").focus(); });
  }
}
function answer(btn, item) {
  const ok = opts[+btn.dataset.i].right, strict = level.kind === "assessment"; results[step] = ok;
  view.querySelectorAll(".opt").forEach((b) => {
    b.disabled = true;
    const right = opts[+b.dataset.i].right;
    if (right && (!strict || b === btn)) { b.classList.add("right"); b.insertAdjacentHTML("beforeend", '<span class="mark">' + (strict ? "答對" : "正確答案") + "</span>"); }
    else if (b === btn) { b.classList.add("wrong"); b.insertAdjacentHTML("beforeend", '<span class="mark">你的答案</span>'); }
  });
  world.mark(item.spot, ok ? "ok" : "no");
  ok ? sfx.good() : sfx.bad();
  drawHearts();
  if ($("quit")) $("quit").remove();
  const last = step === quiz.length - 1, right = item.options[item.answer];
  const title = ok ? "答對了！" : strict ? "這一題答錯了。" : "差一點，答案是「" + esc(right) + "」";
  $("fb").outerHTML = '<div class="feedback ' + (ok ? "good" : "bad") + '"><strong>' + title + "</strong>" +
    (!strict && item.why ? "<p>" + esc(item.why) + "</p>" : "") + "</div>" +
    '<button class="go" id="next" type="button">' + (last ? "看結果" : "下一題") + "</button>";
  const next = $("next");
  next.addEventListener("click", () => { sfx.tap(); if (last) finish(); else { step++; ask(); } });
  next.focus({ preventScroll: true });
}
function finish() {
  const score = results.filter(Boolean).length, strict = level.kind === "assessment";
  const pass = score >= passFor(quiz.length);
  playing = false; world.home(); world.rainbow(pass);
  countEl.textContent = levelLabel(level); drawHearts();
  let title, extra = "";
  if (strict) {
    title = "評量完成";
  } else {
    title = score === quiz.length ? "全部答對，彩虹出現了！" : pass ? "過關！彩虹出現了" : "再試一次，把彩虹找出來";
    if (pass) {
      const fresh = markPassed(level.id), practice = practiceLevels(), nextLevel = practice.slice(practice.findIndex((l) => l.id === level.id) + 1).find((l) => l.pool.length);
      if (fresh && nextLevel) extra = '<p class="unlock">已開放新的難度：' + esc(nextLevel.name) + "</p>";
    }
  }
  view.innerHTML = "<h2>" + title + '</h2><p class="score">' + (strict ? Math.round(score / quiz.length * 100) + " <small>分（答對 " + score + "／" + quiz.length + " 題）</small>"
      : score + " <small>／ " + quiz.length + " 題</small>") + "</p>" + extra + '<ul class="review">' +
    quiz.map((q, i) => '<li><span class="tag ' + (results[i] ? "ok" : "no") + '">' + (results[i] ? "答對" : strict ? "答錯" : "再看看") + "</span><span>第 " + (i + 1) + " 題" +
      (strict ? "" : "　<b>" + esc(q.options[q.answer]) + "</b>") + "</span></li>").join("") +
    '</ul><p class="sync" id="sync"></p>' + (strict ? "" : '<button class="go" id="again" type="button">再玩一次</button>') +
    '<button class="' + (strict ? "go" : "ghost") + '" id="back" type="button">回關卡選單</button>';
  if (!strict) $("again").addEventListener("click", () => { sfx.tap(); startQuiz(); });
  $("back").addEventListener("click", showLevels);
  if (pass) { sfx.win(); confetti(); }
  if (strict) sendScore({ id: attempt && attempt.id, score, detail: results.map((r, i) => (i + 1) + (r ? "○" : "×")).join(" ") });
}
// 評量結束：把成績送到老師的試算表
async function sendScore(data) {
  const say = (t, retry) => {
    const el = $("sync"); if (!el) return;
    el.textContent = t;
    if (retry) {
      const b = document.createElement("button"); b.type = "button"; b.className = "textlink"; b.textContent = "重新送出";
      b.addEventListener("click", () => sendScore(data)); el.appendChild(b);
    }
  };
  if (!data.id) { say("試玩模式，這次沒有記錄。"); return; }
  say("成績傳送中…");
  try {
    const res = await api(Object.assign({ action: "score", token: session.token }, data));
    if (res.ok) say("第 " + res.used + " 次作答已記錄。目前平均 " + res.avg + " 分，" + (res.left > 0 ? "還可以作答 " + res.left + " 次。" : "作答次數已用完。"));
    else if (res.error === "done") say("這次成績先前已經記錄。");
    else if (res.error === "expired") say("登入已經過期，成績沒有送出。請不要關閉這個畫面，告訴老師。");
    else say("成績沒有送出。", true);
  } catch (err) { say("連不上雲端，成績沒有送出。", true); }
}
function confetti() {
  if (reduceMotion) return;
  const box = $("confetti"), colors = ["#ff6fae", "#ffe27a", "#63dcb6", "#8fd3ff", "#b79cff", "#ffffff"];
  let html = "";
  for (let i = 0; i < 36; i++) {
    html += '<i style="left:' + (Math.random() * 100).toFixed(1) + "%;background:" + colors[i % colors.length] +
      ";animation-duration:" + (2.4 + Math.random() * 2).toFixed(2) + "s;animation-delay:" + (Math.random() * 0.9).toFixed(2) +
      "s;transform:scale(" + (0.7 + Math.random() * 0.9).toFixed(2) + ')"></i>';
  }
  box.innerHTML = html;
  setTimeout(() => { box.innerHTML = ""; }, 6000);
}
$("zoom").addEventListener("click", () => { $("zoom").hidden = true; });
$("zoom").addEventListener("keydown", (e) => { if (e.key === "Escape" || e.key === "Enter") $("zoom").hidden = true; });

/* ---------- 登入 ---------- */
function showLogin(asTeacher) {
  resetStage(); level = null;
  countEl.textContent = asTeacher ? "老師登入" : "請先報到";
  view.innerHTML = asTeacher
    ? '<h2>老師登入</h2><form class="login" id="lgForm" novalidate>' +
      '<div class="field"><label for="lgCode">教師碼</label><input id="lgCode" type="password" autocomplete="off" maxlength="12"></div>' +
      '<p class="login-msg" id="lgMsg" role="alert"></p><button class="go" id="lgGo" type="submit">登入</button></form>' +
      '<button class="ghost" id="lgBack" type="button">回到學生登入</button>'
    : '<h2>先報到，再出發</h2><form class="login" id="lgForm" novalidate><div class="row2">' +
      '<div class="field"><label for="lgCls">班級</label><input id="lgCls" type="text" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="例如 204"></div>' +
      '<div class="field"><label for="lgSeat">座號</label><input id="lgSeat" type="text" inputmode="numeric" autocomplete="off" maxlength="2" placeholder="例如 12"></div></div>' +
      '<div class="field"><label for="lgCode">通關碼（老師發的 6 位數字）</label><input id="lgCode" type="password" inputmode="numeric" autocomplete="off" maxlength="6"></div>' +
      '<p class="login-msg" id="lgMsg" role="alert"></p><button class="go" id="lgGo" type="submit">登入</button></form>' +
      '<button class="ghost" id="lgGuest" type="button">訪客進入（只能練習）</button>' +
      '<button class="textlink" id="lgTeacher" type="button">我是老師</button>';
  const msg = (t) => { $("lgMsg").textContent = t; };
  if (asTeacher) $("lgBack").addEventListener("click", () => showLogin(false));
  else {
    $("lgGuest").addEventListener("click", () => { setSession({ role: "guest" }); sfx.tap(); home(); });
    $("lgTeacher").addEventListener("click", () => showLogin(true));
  }
  $("lgForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const code = $("lgCode").value.trim();
    let payload;
    if (asTeacher) {
      if (!code) { msg("請輸入教師碼。"); return; }
      payload = { action: "teacher", code };

      const cls = $("lgCls").value.trim(), seat = $("lgSeat").value.trim();
      if (!/^\d{3}$/.test(cls)) { msg("班級請輸入 3 位數字，例如 204。"); $("lgCls").focus(); return; }
      if (!/^\d{1,2}$/.test(seat) || +seat < 1) { msg("座號請輸入數字，例如 12。"); $("lgSeat").focus(); return; }
      if (!/^\d{6}$/.test(code)) { msg("通關碼是 6 位數字。"); $("lgCode").focus(); return; }
      payload = { action: "login", cls, seat: +seat, code };
    }
    const go = $("lgGo"); go.disabled = true; go.textContent = "登入中…"; msg("");
    try {
      const res = await api(payload);
      if (res.ok) {
        cloudStatus = {};
        setSession(res.role === "teacher" ? { role: "teacher", token: res.token } : { role: "student", cls: res.cls, seat: res.seat, name: res.name, token: res.token });
        sfx.good(); home(); return;
      }
      msg(failText(res)); $("lgCode").value = "";
    } catch (err) {
      msg("連不上雲端，請檢查網路後再試一次。" + (asTeacher ? "" : "也可以先用訪客進入。"));
    }
    if ($("lgGo")) { go.disabled = false; go.textContent = "登入"; }
  });
}
world.onPick(() => { // 在關卡選單時，點島上的愛心直接開始第一個可玩的練習
  if (playing || level || !$("editor").hidden || !$("admin").hidden || (cloudOn() && !session)) return;
  const practice = practiceLevels(), first = practice.find((l) => l.pool.length && unlocked(l, practice));
  if (first) pickLevel(first);
});

/* ---------- 兩段式按鈕：刪除、轉出這類動作要按兩次才執行 ---------- */
let armed = null;
function disarm() { if (armed) { armed.btn.textContent = armed.label; armed.btn.classList.remove("armed"); armed = null; } }
function twoStep(btn, askText, run) {
  btn.addEventListener("click", () => {
    if (armed && armed.btn === btn) { disarm(); run(); return; }
    disarm(); armed = { btn, label: btn.textContent }; btn.textContent = askText; btn.classList.add("armed");
  });
}

/* ============================================================
   老師：學生管理（轉入、轉出、重設通關碼）
   ============================================================ */
const ad = { cls: "" };
function adMsg(text, bad) { const m = $("adMsg"); m.textContent = text; m.className = "ed-msg" + (bad ? " bad" : ""); }
function adCode(res, what) {
  $("adCode").hidden = false;
  $("adCode").innerHTML = "<span>" + esc(res.cls) + " 班 " + res.seat + " 號　" + esc(res.name) + "　" + what + "</span><strong>" +
    esc(res.code.slice(0, 3) + " " + res.code.slice(3)) + "</strong><span>請現在抄給學生。關閉後要到試算表才查得到。</span>";
}
async function adCall(payload) {
  try {
    const res = await api(Object.assign({ token: session.token }, payload));
    if (!res.ok) adMsg(failText(res), true);

  } catch (e) { adMsg("連不上雲端，請檢查網路後再試一次。", true); return null; }
}
async function adLoadClasses(keep) {

}
async function adLoadRoster() {
  disarm();
  $("adList").innerHTML = '<li class="ad-note">讀取中…</li>';
  const res = await adCall({ action: "roster", cls: ad.cls });
  if (!res) { $("adList").innerHTML = ""; return; }
  $("adList").innerHTML = res.students.map((s) =>
    '<li class="ad-row' + (s.active ? "" : " off") + '"><span class="ed-no">' + s.seat + '</span><span class="ad-name">' + esc(s.name) +
    (s.active ? "" : "（已轉出）") + '</span><span class="ed-moves">' +
    (s.active ? '<button class="mini" type="button" data-act="reset" data-seat="' + s.seat + '">重設通關碼</button><button class="mini warn" type="button" data-act="off" data-seat="' + s.seat + '">轉出</button>'
              : '<button class="mini" type="button" data-act="on" data-seat="' + s.seat + '">恢復</button>') + "</span></li>").join("") ||
    '<li class="ad-note">這個班級還沒有學生。</li>';
  $("adList").querySelectorAll("button").forEach((b) => {
    const seat = +b.dataset.seat, act = b.dataset.act;
    if (act === "reset") twoStep(b, "再按一次確定重設", async () => {
      const r = await adCall({ action: "resetCode", cls: ad.cls, seat });
      if (r) { adCode(r, "新的通關碼"); adMsg("已重設，舊的通關碼已經失效。"); }
    });
    else if (act === "off") twoStep(b, "再按一次確定轉出", async () => {
      if (await adCall({ action: "removeStudent", cls: ad.cls, seat })) { adMsg(ad.cls + " 班 " + seat + " 號已轉出，不能再登入；過去的成績仍然保留。"); adLoadClasses(ad.cls); }
    });
    else b.addEventListener("click", async () => {
      if (await adCall({ action: "restoreStudent", cls: ad.cls, seat })) { adMsg(ad.cls + " 班 " + seat + " 號已恢復，可以用原本的通關碼登入。"); adLoadClasses(ad.cls); }
    });
  });
}
$("adminBtn").addEventListener("click", () => {
  showLevels(); $("admin").hidden = false; $("adCode").hidden = true;
  adMsg("選一個班級，就能轉入、轉出學生或重設通關碼。"); adLoadClasses(ad.cls); $("adClose").focus();
});
$("adClose").addEventListener("click", () => { disarm(); $("admin").hidden = true; $("adCode").hidden = true; $("adCode").innerHTML = ""; $("adminBtn").focus(); });
$("admin").addEventListener("keydown", (e) => { if (e.key === "Escape") $("adClose").click(); });
$("adCls").addEventListener("change", () => { ad.cls = $("adCls").value; $("adNewCls").value = ad.cls; $("adCode").hidden = true; adLoadRoster(); });
$("adForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const cls = $("adNewCls").value.trim(), seat = $("adNewSeat").value.trim(), name = $("adNewName").value.trim();
  if (!/^\d{3}$/.test(cls)) { adMsg("班級請輸入 3 位數字，例如 204。", true); return; }
  if (!/^\d{1,2}$/.test(seat) || +seat < 1 || +seat > 60) { adMsg("座號請輸入 1 到 60 的數字。", true); return; }
  if (!name) { adMsg("請輸入學生姓名。", true); return; }
  const r = await adCall({ action: "addStudent", cls, seat: +seat, name });
  if (!r) return;
  adCode(r, "的通關碼"); adMsg("已轉入 " + cls + " 班 " + seat + " 號。");
  $("adNewSeat").value = ""; $("adNewName").value = "";
  adLoadClasses(cls);
});

/* ============================================================
   老師：關卡設定（從共用題庫挑題組成評量關卡）
   題目一律在「互動式評量系統」編修；這裡只決定哪幾題放進哪個評量關卡。
   ============================================================ */
const ed = { lv: 0, filter: -1, search: "" };
const DTAG = ["d0", "d1", "d2", "d3"];
function edMsg(text, bad) { const m = $("edMsg"); m.textContent = text; m.className = "ed-msg" + (bad ? " bad" : ""); }
const curTest = () => isl().assessments[ed.lv];
function qMeta(q) {
  return '<span class="dtag ' + DTAG[q.diff] + '">' + DIFFS[q.diff] + "</span>" + esc(q.category + "／" + q.unit) +
    (q.levels.length ? "・" + esc(q.levels.join("、")) : "・未標認知層次") + "・答案 " + "ABCD"[q.answer] + (q.explanation ? "・有解說" : "") + (q.image ? "・有圖" : "");
}
function edRender() {
  disarm();
  const I = isl(), pool = islandPool(), test = curTest();
  $("edTitle").textContent = "關卡設定　" + I.name;
  $("edBank").textContent = "題庫：" + bankSrc.label + "，共 " + bankSrc.list.length + " 題" + (bankSrc.skipped ? "（另有 " + bankSrc.skipped + " 題格式不完整，已略過）" : "") +
    "；本島可用 " + pool.length + " 題（" + DIFFS.map((n, i) => n + " " + pool.filter((q) => q.diff === i).length).join("、") + "）";
  $("edUnits").textContent = I.units.map((u) => u.category + "／" + u.unit).join("、");
  $("edCount").value = I.practiceCount;
  // 評量關卡
  $("edLevel").innerHTML = I.assessments.length ? I.assessments.map((a, i) => '<option value="' + i + '">' + esc(a.name) + "（" + a.items.length + " 題）</option>").join("")
    : '<option value="">還沒有評量關卡</option>';
  $("edLevel").disabled = !I.assessments.length; $("lvDel").disabled = !test; $("lvName").disabled = !test;
  if (test) $("edLevel").value = ed.lv;
  $("lvName").value = test ? test.name : "";
  // 已選題目
  if (!test) {
    $("edChosenCount").textContent = "按「新增評量關卡」開始挑題。";
    $("edChosen").innerHTML = "";
  } else {
    const missing = test.items.filter((it) => !byId.get(it.id) || byId.get(it.id).disabled).length;
    $("edChosenCount").textContent = "已選 " + test.items.length + " 題" + (missing ? "，其中 " + missing + " 題在目前的題庫找不到或已停用，學生不會看到" : "") + "。每一題可以設定鏡頭飛到哪裡。";
    $("edChosen").innerHTML = test.items.map((it, i) => {
      const q = byId.get(it.id), bad = !q || q.disabled;
      return '<li class="pick-row in' + (bad ? " bad" : "") + '" data-i="' + i + '"><span class="ed-no">' + (i + 1) + '</span><span class="pick-main"><span class="pick-stem">' +
        (q ? esc(q.stem) : "（題庫中找不到這一題：" + esc(it.id) + "）") + '</span><span class="pick-meta">' + (q ? qMeta(q) + (q.disabled ? "・已停用" : "") : "") + "</span></span>" +
        '<span class="pick-tools"><select data-act="spot" aria-label="第 ' + (i + 1) + ' 題的鏡頭位置">' +
        Object.keys(SPOT_NAMES).map((k) => '<option value="' + k + '"' + (k === it.spot ? " selected" : "") + ">" + (k === "none" ? "整座島" : "飛到" + SPOT_NAMES[k]) + "</option>").join("") +
        '</select><button class="mini" type="button" data-act="up"' + (i ? "" : " disabled") + '>上移</button><button class="mini" type="button" data-act="down"' + (i < test.items.length - 1 ? "" : " disabled") +
        '>下移</button><button class="mini warn" type="button" data-act="remove">移除</button></span></li>';
    }).join("");
  }
  // 本島題庫
  $("edChips").innerHTML = [-1, 0, 1, 2, 3].map((d) => '<button class="chip" type="button" data-d="' + d + '" aria-pressed="' + (ed.filter === d) + '">' +
    (d < 0 ? "全部 " + pool.length : DIFFS[d] + " " + pool.filter((q) => q.diff === d).length) + "</button>").join("");
  const kw = ed.search.trim().toLowerCase(), chosen = new Set(test ? test.items.map((it) => it.id) : []);
  const shown = pool.filter((q) => (ed.filter < 0 || q.diff === ed.filter) && (!kw || (q.stem + " " + q.options.join(" ")).toLowerCase().includes(kw)));
  $("edPool").innerHTML = shown.map((q) => '<li class="pick-row' + (chosen.has(q.id) ? " in" : "") + '" data-id="' + esc(q.id) + '"><span class="ed-no">' + DIFFS[q.diff].slice(0, 1) +
    '</span><span class="pick-main"><span class="pick-stem">' + esc(q.stem) + '</span><span class="pick-opts">' + q.options.map((o, i) => "ABCD"[i] + ". " + esc(o)).join("　") +
    '</span><span class="pick-meta">' + qMeta(q) + '</span></span><span class="pick-tools">' +
    (chosen.has(q.id) ? '<span class="pick-done">已加入</span>' : '<button class="mini add" type="button" data-act="add"' + (test ? "" : " disabled") + ">加入</button>") + "</span></li>").join("") ||
    '<li class="ad-note">' + (pool.length ? "沒有符合條件的題目。" : "題庫裡還沒有「" + esc(I.units.map((u) => u.category + "／" + u.unit).join("、")) + "」的題目。請先在互動式評量系統新增題目，再讀取題庫檔。") + "</li>";
}
function edChanged(text) { saveDraft(); edRender(); if (text) edMsg(text); }
function openEditor() {
  showLevels(); ed.lv = Math.max(0, Math.min(ed.lv, isl().assessments.length - 1));
  $("editor").hidden = false; edRender();
  edMsg(hasDraft ? "目前顯示的是這台電腦上修改過的關卡設定。" : "修改會自動存在這台電腦的瀏覽器；要給學生用，請按「儲存關卡檔」。");
  $("edClose").focus();
}
function closeEditor() { disarm(); $("editor").hidden = true; home(); $("teacher").focus(); }

$("teacher").addEventListener("click", openEditor);
$("edClose").addEventListener("click", closeEditor);
$("editor").addEventListener("keydown", (e) => { if (e.key === "Escape") closeEditor(); });
$("edCount").addEventListener("change", () => {
  const v = parseInt($("edCount").value, 10);
  if (!(v >= 1 && v <= 30)) { edRender(); edMsg("請輸入 1 到 30 的數字。", true); return; }
  isl().practiceCount = v; edChanged("練習每次改為抽 " + v + " 題。");
});
$("edLevel").addEventListener("change", () => { ed.lv = +$("edLevel").value || 0; edRender(); });
$("lvName").addEventListener("input", () => { const t = curTest(); if (!t) return; t.name = $("lvName").value.slice(0, 30) || "評量"; saveDraft(); const o = $("edLevel").options[ed.lv]; if (o) o.textContent = t.name + "（" + t.items.length + " 題）"; });
$("lvAdd").addEventListener("click", () => {
  const A = isl().assessments; A.push({ id: newId(), name: "評量 " + (A.length + 1), items: [] });
  ed.lv = A.length - 1; edChanged("已新增評量關卡。從右邊的本島題庫按「加入」挑題；學生每關最多作答 " + MAX_TRIES + " 次。");
  $("lvName").focus(); $("lvName").select();
});
twoStep($("lvDel"), "再按一次確定刪除關卡", () => {
  isl().assessments.splice(ed.lv, 1); ed.lv = 0; edChanged("已刪除這個評量關卡。試算表裡已經記錄的成績不受影響。");
});
$("edChosen").addEventListener("click", (e) => {
  const b = e.target.closest("button"), row = e.target.closest("[data-i]"), t = curTest(); if (!b || !row || !t) return;
  const i = +row.dataset.i, items = t.items;
  if (b.dataset.act === "remove") { items.splice(i, 1); edChanged("已從這個關卡移除。"); }
  if (b.dataset.act === "up" && i > 0) { [items[i - 1], items[i]] = [items[i], items[i - 1]]; edChanged(); }
  if (b.dataset.act === "down" && i < items.length - 1) { [items[i + 1], items[i]] = [items[i], items[i + 1]]; edChanged(); }
});
$("edChosen").addEventListener("change", (e) => {
  const row = e.target.closest("[data-i]"), t = curTest(); if (!row || !t || e.target.dataset.act !== "spot") return;
  t.items[+row.dataset.i].spot = e.target.value; saveDraft(); edMsg("已設定鏡頭位置。");
});
$("edPool").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act='add']"), row = e.target.closest("[data-id]"), t = curTest(); if (!b || !row || !t) return;
  t.items.push({ id: row.dataset.id, spot: "none" }); edChanged("已加入第 " + t.items.length + " 題。");
});
$("edChips").addEventListener("click", (e) => { const b = e.target.closest("[data-d]"); if (!b) return; ed.filter = +b.dataset.d; edRender(); });
$("edSearch").addEventListener("input", () => { ed.search = $("edSearch").value; edRender(); });
twoStep($("edReset"), "再按一次確定還原", () => {
  try { localStorage.removeItem(CONFIG_KEY); } catch (e) {}
  hasDraft = false; config = clone(published); ed.lv = 0; edRender(); edMsg("已還原成網站上的關卡設定，這台電腦上的修改已清除。");
});
function readJsonFile(input, onLoad) {
  const f = input.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { onLoad(JSON.parse(String(rd.result)), f.name); }
    catch (err) { edMsg("讀取失敗：" + (err instanceof SyntaxError ? "這不是正確的 JSON 檔。" : err.message), true); }
    input.value = "";
  };
  rd.onerror = () => edMsg("讀不到這個檔案，請再試一次。", true);
  rd.readAsText(f, "utf-8");
}
$("edBankFile").addEventListener("click", () => $("edBankInput").click());
$("edBankInput").addEventListener("change", () => readJsonFile($("edBankInput"), (j, name) => {
  if (j && j.format === "InteractiveAssessmentSystemBackup") { edMsg("這是完整備份檔（含班級與成績），請改用評量系統「題庫編修 → 儲存題庫」產生的檔案。", true); return; }
  const b = readBank(j); useBank(b, "本機題庫檔「" + name + "」", false); edRender();
  edMsg("已讀取題庫檔，共 " + b.list.length + " 題。這只在這次編輯時使用；要讓學生看到，請把這個檔案以 data/questions.json 上傳到網站。");
}));
$("edImport").addEventListener("click", () => $("edFile").click());
$("edFile").addEventListener("change", () => readJsonFile($("edFile"), (j, name) => {
  config = normConfig(j); ed.lv = 0; saveDraft(); edRender(); edMsg("已讀取關卡檔「" + name + "」。");
}));
$("edSave").addEventListener("click", async () => {
  if (inPreview || (window.claude && window.claude.use)) {
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
      if (!dl) { edMsg("這個預覽頁無法下載檔案，請改按「複製 JSON」，貼到記事本存成 islands.json。", true); return; }
      await dl.save({ filename: "islands.json", data: exportConfig() });
      edMsg("已儲存 islands.json。把它放在網站的 data 資料夾，學生就會看到新的評量關卡。");
    } catch (e) { edMsg("沒有存檔（已取消或失敗）。也可以改按「複製 JSON」。", true); }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([exportConfig()], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = "islands.json";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
    edMsg("已下載 islands.json。把它放在網站的 data 資料夾，學生就會看到新的評量關卡。");
  } catch (e) { edMsg("下載失敗，請改按「複製 JSON」。", true); }
});
$("edCopy").addEventListener("click", () => {
  const text = exportConfig();
  const fallback = () => { const ta = $("edRaw"); ta.hidden = false; ta.value = text; ta.focus(); ta.select(); edMsg("瀏覽器不允許自動複製。內容已顯示在下方，請按 Ctrl+C 複製。", true); };
  try { navigator.clipboard.writeText(text).then(() => edMsg("已複製關卡設定 JSON。"), fallback); } catch (e) { fallback(); }
});

home();
</script>
</body>
</html>
