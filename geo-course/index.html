<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>地理差異化互動式學習</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<!-- 有網路時載入設計字型；沒有網路會自動改用電腦內建字型 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 網站字型：標題「粉圓 Huninn」、內文「霞鶩文楷 LXGW WenKai TC」（OFL 開源授權）
     在本機直接開啟（file://，可離線）時用 fonts 資料夾裡的字型；放在網路上時用 Google Fonts。 -->
<script>document.write('<link rel="stylesheet" href="' + (location.protocol === 'file:' ? 'fonts/fonts.css' : 'https://fonts.googleapis.com/css2?family=Huninn&family=LXGW+WenKai+TC:wght@400;700&display=swap') + '">');</script>
<link rel="stylesheet" href="css/style.css?v=2026110358">
</head>
<body>

<header class="toy-header">
  <div class="header-inner">
    <a class="brand" href="#/world">
      <div class="brand-logo has-img" id="brandLogo"><img src="images/logo-he.png" alt="和" width="46" height="46"></div>
      <div>
        <div class="brand-title" id="brandTitle"></div>
        <div class="brand-subtitle" id="brandSubtitle"></div>
      </div>
    </a>
    <nav class="crumbs" id="crumbs" aria-label="目前位置"></nav>
    <div class="mode-toggle" id="modeToggle" hidden>
      <button class="mode-btn active" data-mode="review" data-en="📖 Review">📖 複習模式</button>
      <button class="mode-btn" data-mode="slides" data-en="📺 Slides">📺 簡報模式</button>
    </div>
  </div>
</header>

<main class="main" id="app"></main>

<!-- 簡報模式 -->
<div class="slide-progress"><span id="slideProgress"></span></div>
<div class="slides-wrap" id="slidesWrap">
  <div class="slide-scaler" id="slideScaler"></div>
</div>
<div class="presenter-dock" id="dock" role="toolbar" aria-label="簡報控制">
  <button class="dock-btn" data-act="first" title="第一張（Home）" data-en-title="First (Home)">⏮<span class="dock-text" data-en="First">第一張</span></button>
  <button class="dock-btn" data-act="prev" title="上一張（←）" data-en-title="Previous (←)">◀<span class="dock-text" data-en="Back">上一張</span></button>
  <span class="dock-count" id="dockCount">1 / 1</span>
  <button class="dock-btn dock-btn-primary" data-act="next" title="下一張（→ 或空白鍵）" data-en-title="Next (→ or Space)"><span class="dock-text" data-en="Next">下一張</span>▶</button>
  <button class="dock-btn" data-act="last" title="最後一張（End）" data-en-title="Last (End)"><span class="dock-text" data-en="Last">最後一張</span>⏭</button>
  <span class="dock-divider"></span>
  <button class="dock-btn" data-act="toc" title="目錄（T）" data-en-title="Contents (T)">📑<span class="dock-text" data-en="Contents">目錄</span></button>
  <button class="dock-btn" data-act="notes" title="講者備忘（N）" data-en-title="Notes (N)">📝<span class="dock-text" data-en="Notes">備忘</span></button>
  <button class="dock-btn" data-act="fullscreen" title="全螢幕（F）" data-en-title="Full screen (F)">⛶<span class="dock-text" data-en="Full screen">全螢幕</span></button>
  <span class="dock-divider"></span>
  <button class="dock-btn" data-act="exit" title="回到複習模式" data-en-title="Back to Review">✕<span class="dock-text" data-en="Exit">離開</span></button>
</div>
<aside class="notes-drawer" id="notesDrawer" aria-live="polite">
  <h4><span data-en="📝 Speaker notes">📝 講者備忘</span> <button class="icon-x" data-act="notes" aria-label="關閉">✕</button></h4>
  <p id="notesText"></p>
</aside>
<div class="overlay" id="tocOverlay">
  <div class="toc-box" role="dialog" aria-label="投影片目錄">
    <div class="toc-head"><h3 data-en="📑 Slide contents">📑 投影片目錄</h3><button class="icon-x" data-act="toc" aria-label="關閉">✕</button></div>
    <div class="toc-grid" id="tocGrid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<footer class="footer" id="footer"></footer>

<script src="js/site-data.js?v=2026110358"></script>
<script src="js/site-data.en.js?v=2026110358"></script>
<script src="js/i18n.js?v=2026110358"></script>
<script src="js/app.js?v=2026110358"></script>
</body>
</html>
