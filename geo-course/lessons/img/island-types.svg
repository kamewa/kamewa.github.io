<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="960" height="425" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >島嶼的三種成因</text>
<rect x="30" y="60" width="290" height="320" rx="14" fill="#fff" stroke="#45392F" stroke-width="2.5"/>
<rect x="120.0" y="75.85" width="110" height="32.3" rx="16.15" fill="#E0A43A" stroke="#45392F" stroke-width="2"/><text x="175" y="97.95" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">大陸島</text>
<rect x="45" y="250" width="260" height="70" fill="#9FD0EA"/>
<path d="M45,320 L45,200 C80,190 100,230 125,235 C150,240 155,170 190,175 C225,180 230,250 260,245 C280,240 290,215 305,215 L305,320 Z" fill="#C9A77A" stroke="#45392F" stroke-width="2"/>
<line x1="45" y1="225" x2="305" y2="225" stroke="#4A90C2" stroke-width="2" stroke-dasharray="6 4"/>
<text x="300" y="220" text-anchor="end" font-size="11" font-weight="800" fill="#2C6E9E" >以前海面</text>
<rect x="45" y="250" width="260" height="70" fill="#9FD0EA" opacity=".55"/>
<text x="190" y="165" text-anchor="middle" font-size="13" font-weight="900" fill="#332B25" >山頭成島</text>
<text x="175" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#6B5E52" >海水面上升，谷地淹沒、山頭露出</text>
<text x="175" y="352" text-anchor="middle" font-size="13" font-weight="900" fill="#332B25" >例：金門、馬祖</text>
<rect x="335" y="60" width="290" height="320" rx="14" fill="#fff" stroke="#45392F" stroke-width="2.5"/>
<rect x="425.0" y="75.85" width="110" height="32.3" rx="16.15" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="480" y="97.95" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">火山島</text>
<rect x="350" y="250" width="260" height="70" fill="#9FD0EA"/>
<path d="M395,320 L455,215 L470,208 L490,208 L505,215 L565,320 Z" fill="#8C6A55" stroke="#45392F" stroke-width="2"/>
<path d="M480,205 C470,190 495,182 483,168" stroke="#9C8E80" stroke-width="6" fill="none" stroke-linecap="round"/>
<text x="535" y="190" text-anchor="start" font-size="12" font-weight="900" fill="#332B25" >熔岩堆積</text>
<rect x="350" y="250" width="260" height="70" fill="#9FD0EA" opacity=".55"/>
<text x="480" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#6B5E52" >海底火山噴發、熔岩堆積</text>
<text x="480" y="352" text-anchor="middle" font-size="13" font-weight="900" fill="#332B25" >例：澎湖、綠島、蘭嶼、龜山島</text>
<rect x="640" y="60" width="290" height="320" rx="14" fill="#fff" stroke="#45392F" stroke-width="2.5"/>
<rect x="730.0" y="75.85" width="110" height="32.3" rx="16.15" fill="#2E9A86" stroke="#45392F" stroke-width="2"/><text x="785" y="97.95" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">珊瑚礁島</text>
<rect x="655" y="250" width="260" height="70" fill="#9FD0EA"/>
<path d="M680,320 L710,262 C740,246 830,246 860,262 L890,320 Z" fill="#F4E3C3" stroke="#45392F" stroke-width="2"/>
<circle cx="725" cy="285" r="6" fill="#F2A6A0" stroke="#8C7B6A" stroke-width="1"/>
<circle cx="749" cy="299" r="6" fill="#F2A6A0" stroke="#8C7B6A" stroke-width="1"/>
<circle cx="773" cy="285" r="6" fill="#F2A6A0" stroke="#8C7B6A" stroke-width="1"/>
<circle cx="797" cy="299" r="6" fill="#F2A6A0" stroke="#8C7B6A" stroke-width="1"/>
<circle cx="821" cy="285" r="6" fill="#F2A6A0" stroke="#8C7B6A" stroke-width="1"/>
<circle cx="845" cy="299" r="6" fill="#F2A6A0" stroke="#8C7B6A" stroke-width="1"/>
<rect x="655" y="250" width="260" height="70" fill="#9FD0EA" opacity=".55"/>
<text x="785" y="236" text-anchor="middle" font-size="12" font-weight="900" fill="#332B25" >面積小、地勢低平</text>
<text x="785" y="132" text-anchor="middle" font-size="13" font-weight="800" fill="#6B5E52" >海底珊瑚礁露出海面</text>
<text x="785" y="352" text-anchor="middle" font-size="13" font-weight="900" fill="#332B25" >例：琉球嶼、東沙島、太平島</text>
<text x="480" y="410" text-anchor="middle" font-size="15" font-weight="900" fill="#C0392B" >臺灣位在板塊交界帶，所以多數離島是火山島</text>
</svg>
