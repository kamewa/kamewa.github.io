<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="960" height="444" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >水資源的兩個難題：水庫淤積、超抽地下水</text>
<rect x="30" y="58" width="440" height="372" rx="14" fill="#fff" stroke="#45392F" stroke-width="2.5"/>
<rect x="185.0" y="72.8" width="130" height="30.4" rx="15.2" fill="#E0A43A" stroke="#45392F" stroke-width="2"/><text x="250" y="93.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">水庫淤積</text>
<rect x="490" y="58" width="440" height="372" rx="14" fill="#fff" stroke="#45392F" stroke-width="2.5"/>
<rect x="645.0" y="72.8" width="130" height="30.4" rx="15.2" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="710" y="93.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">超抽地下水</text>
<path d="M50,130 L90,130 L160,270 L240,270 L240,130 " fill="none" stroke="#45392F" stroke-width="2"/>
<path d="M60,150 L100,150 L160,270 L226,270 L226,150 Z" fill="#8FC4E8"/>
<rect x="226" y="120" width="16" height="152" fill="#BDB6AC" stroke="#45392F" stroke-width="2"/>
<text x="170" y="180" text-anchor="middle" font-size="13" font-weight="900" fill="#1F5F8B" >蓄水</text>
<text x="150" y="298" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >淤積前</text>
<text x="234" y="114" text-anchor="middle" font-size="12" font-weight="800" fill="#6B5E52" >壩</text>
<path d="M255,130 L295,130 L365,270 L445,270 L445,130 " fill="none" stroke="#45392F" stroke-width="2"/>
<path d="M265,150 L305,150 L365,270 L431,270 L431,150 Z" fill="#8FC4E8"/>
<rect x="431" y="120" width="16" height="152" fill="#BDB6AC" stroke="#45392F" stroke-width="2"/>
<path d="M318,180 C365,205 405,215 431,215 L431,270 L365,270 Z" fill="#C9A77A" stroke="#45392F" stroke-width="1.5"/>
<text x="395" y="250" text-anchor="middle" font-size="13" font-weight="900" fill="#6B4A2B" >淤沙</text>
<text x="375" y="180" text-anchor="middle" font-size="13" font-weight="900" fill="#1F5F8B" >蓄水</text>
<text x="355" y="298" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >淤積後</text>
<text x="439" y="114" text-anchor="middle" font-size="12" font-weight="800" fill="#6B5E52" >壩</text>
<text x="250" y="340" text-anchor="middle" font-size="13" font-weight="900" fill="#B5651D" >河川輸沙量高 → 泥沙堆在水庫 → 蓄水量變少</text>
<text x="250" y="364" text-anchor="middle" font-size="13" font-weight="800" fill="#6B5E52" >石門水庫淤積超過 30%，曾文水庫將近 40%</text>
<text x="250" y="394" text-anchor="middle" font-size="13" font-weight="900" fill="#2E9A86" >對策：做好上游的水土保持、設攔沙壩、清淤</text>
<rect x="510" y="210" width="400" height="80" fill="#E6D3B0"/>
<rect x="510" y="290" width="400" height="60" fill="#8FC4E8" opacity=".7"/>
<text x="550" y="330" text-anchor="start" font-size="12" font-weight="900" fill="#1F5F8B" >地下水層</text>
<rect x="560" y="150" width="70" height="60" fill="#F4F1EA" stroke="#45392F" stroke-width="2"/><path d="M552,150 L595,120 L638,150 Z" fill="#E0694F" stroke="#45392F" stroke-width="2"/>
<line x1="680" y1="140" x2="680" y2="320" stroke="#45392F" stroke-width="5"/><line x1="695.0" y1="300.0" x2="695.0" y2="167.2" stroke="#4A90C2" stroke-width="3" stroke-linecap="round"/><path d="M695.0,160.0 L700.2,170.8 L689.8,170.8 Z" fill="#4A90C2"/>
<text x="705" y="150" text-anchor="start" font-size="12" font-weight="900" fill="#332B25" >抽水井</text>
<rect x="770" y="190" width="120" height="20" fill="#9FD0EA" stroke="#8C7B6A" stroke-width="1.5"/><text x="830" y="182" text-anchor="middle" font-size="12" font-weight="900" fill="#332B25" >魚塭</text>
<text x="530" y="372" text-anchor="start" font-size="13" font-weight="900" fill="#E0694F" >▸ 地層下陷</text><text x="630" y="372" text-anchor="start" font-size="12" font-weight="800" fill="#6B5E52" >房屋、道路變低，易淹水</text>
<text x="530" y="390" text-anchor="start" font-size="13" font-weight="900" fill="#E0694F" >▸ 海水倒灌</text><text x="630" y="390" text-anchor="start" font-size="12" font-weight="800" fill="#6B5E52" >沿海低地積水不退</text>
<text x="530" y="408" text-anchor="start" font-size="13" font-weight="900" fill="#E0694F" >▸ 土壤鹽化</text><text x="630" y="408" text-anchor="start" font-size="12" font-weight="800" fill="#6B5E52" >鹽分太高，無法耕種</text>
<text x="715" y="250" text-anchor="start" font-size="13" font-weight="900" fill="#B03A2E" >過量抽取</text>
</svg>
