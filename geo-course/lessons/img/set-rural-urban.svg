<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="412" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >鄉村與都市：不同，但互相依存</text>
<rect x="40" y="66" width="280" height="290" rx="18" fill="#E3F4E5" stroke="#45392F" stroke-width="2"/>
<text x="180" y="130" text-anchor="middle" font-size="52" font-weight="400" fill="#332B25" >🏡</text><rect x="125.0" y="157.0" width="110" height="38.0" rx="19.0" fill="#3E8E5A" stroke="#45392F" stroke-width="2"/><text x="180" y="183.0" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">鄉村</text>
<text x="180" y="236" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >人口：較少</text>
<text x="180" y="270" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >人口密度：低</text>
<text x="180" y="304" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >產業：第一級產業為主</text>
<rect x="640" y="66" width="280" height="290" rx="18" fill="#E1EFF9" stroke="#45392F" stroke-width="2"/>
<text x="780" y="130" text-anchor="middle" font-size="52" font-weight="400" fill="#332B25" >🏙️</text><rect x="725.0" y="157.0" width="110" height="38.0" rx="19.0" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="780" y="183.0" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">都市</text>
<text x="780" y="236" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >人口：較多</text>
<text x="780" y="270" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >人口密度：高</text>
<text x="780" y="304" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >產業：第二、三級產業為主</text>
<line x1="330.0" y1="160.0" x2="618.0" y2="160.0" stroke="#3E8E5A" stroke-width="7" stroke-linecap="round"/><path d="M630.0,160.0 L612.0,168.7 L612.0,151.3 Z" fill="#3E8E5A"/><text x="480" y="140" text-anchor="middle" font-size="16" font-weight="900" fill="#3E8E5A" >農產品、原料、勞力</text>
<line x1="630.0" y1="270.0" x2="342.0" y2="270.0" stroke="#4A90C2" stroke-width="7" stroke-linecap="round"/><path d="M330.0,270.0 L348.0,261.3 L348.0,278.7 Z" fill="#4A90C2"/><text x="480" y="300" text-anchor="middle" font-size="16" font-weight="900" fill="#4A90C2" >醫療、教育、消費、就業機會</text>
<text x="480" y="392" text-anchor="middle" font-size="15" font-weight="800" fill="#6B5E52" >鄉村和都市彼此需要；兩者靠交通網絡串聯，形成聚落體系</text>
</svg>
