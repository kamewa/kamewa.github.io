<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="446" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >降低食安風險：友善環境飲食的三種作法</text>
<rect x="40" y="64" width="280" height="240" rx="14" fill="#fff" stroke="#3E8E5A" stroke-width="2.2"/>
<text x="180.0" y="108" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >🥬</text><text x="180.0" y="146" text-anchor="middle" font-size="16" font-weight="900" fill="#3E8E5A" >選購有機農產品</text>
<text x="180.0" y="176" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >不用農藥、化學肥料</text>
<text x="180.0" y="200" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >對環境友善</text>
<text x="180.0" y="224" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >成本高，需要消費者支持</text>
<rect x="340" y="64" width="280" height="240" rx="14" fill="#fff" stroke="#4A90C2" stroke-width="2.2"/>
<text x="480.0" y="108" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >📋</text><text x="480.0" y="146" text-anchor="middle" font-size="16" font-weight="900" fill="#4A90C2" >產銷履歷驗證</text>
<text x="480.0" y="176" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >第三方驗證機關把關</text>
<text x="480.0" y="200" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >記錄生產、加工、流通</text>
<text x="480.0" y="224" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >知道食材從哪裡來</text>
<rect x="640" y="64" width="280" height="240" rx="14" fill="#fff" stroke="#E0A43A" stroke-width="2.2"/>
<text x="780.0" y="108" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >📍</text><text x="780.0" y="146" text-anchor="middle" font-size="16" font-weight="900" fill="#E0A43A" >增加地產地消</text>
<text x="780.0" y="176" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >在地生產：新鮮、里程短</text>
<text x="780.0" y="200" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >當季食材：少用能源保鮮</text>
<text x="780.0" y="224" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >產地到餐桌、農夫市集</text>
<rect x="40" y="324" width="880" height="80" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="480" y="354" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >友善環境飲食：吃對環境負擔較小的食物（碳排放少、有機作物）</text>
<text x="480" y="384" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >可參考「產品碳足跡標籤」，用購買行動改變生產方式</text>
<text x="480" y="428" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >（自繪）</text>
</svg>
