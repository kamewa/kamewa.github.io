<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="360" rx="20" fill="#EAF5FB"/>
