<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="310" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >從聚落地名可以探索什麼？</text>
<rect x="24" y="64" width="170" height="190" rx="18" fill="#fff" stroke="#4A90C2" stroke-width="2.5"/>
<text x="109" y="116" text-anchor="middle" font-size="36" font-weight="400" fill="#332B25" >👪</text><rect x="49.0" y="140.8" width="120" height="30.4" rx="15.2" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="109" y="161.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">祖先來源</text><text x="109" y="206" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >泉州、漳州、陸豐…</text>
<rect x="210" y="64" width="170" height="190" rx="18" fill="#fff" stroke="#9C6ADE" stroke-width="2.5"/>
<text x="295" y="116" text-anchor="middle" font-size="36" font-weight="400" fill="#332B25" >🗣️</text><rect x="235.0" y="140.8" width="120" height="30.4" rx="15.2" fill="#9C6ADE" stroke="#45392F" stroke-width="2"/><text x="295" y="161.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">所屬族群</text><text x="295" y="206" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >厝（閩南）、屋（客家）</text>
<rect x="396" y="64" width="170" height="190" rx="18" fill="#fff" stroke="#3E8E5A" stroke-width="2.5"/>
<text x="481" y="116" text-anchor="middle" font-size="36" font-weight="400" fill="#332B25" >⛰️</text><rect x="421.0" y="140.8" width="120" height="30.4" rx="15.2" fill="#3E8E5A" stroke="#45392F" stroke-width="2"/><text x="481" y="161.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">自然環境</text><text x="481" y="206" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >山仔腳、崙、崁、潭</text>
<rect x="582" y="64" width="170" height="190" rx="18" fill="#fff" stroke="#E0A43A" stroke-width="2.5"/>
<text x="667" y="116" text-anchor="middle" font-size="36" font-weight="400" fill="#332B25" >🏗️</text><rect x="607.0" y="140.8" width="120" height="30.4" rx="15.2" fill="#E0A43A" stroke="#45392F" stroke-width="2"/><text x="667" y="161.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">開發歷史</text><text x="667" y="206" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >從地名分布推測開發過程</text>
<rect x="768" y="64" width="170" height="190" rx="18" fill="#fff" stroke="#E0694F" stroke-width="2.5"/>
<text x="853" y="116" text-anchor="middle" font-size="36" font-weight="400" fill="#332B25" >🌾</text><rect x="793.0" y="140.8" width="120" height="30.4" rx="15.2" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="853" y="161.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">產業發展</text><text x="853" y="206" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >牛墟、糖廍、米粉</text>
<text x="480" y="290" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >早年民眾常依照聚落的自然環境、族群文化與產業來取地名（自繪）</text>
</svg>
