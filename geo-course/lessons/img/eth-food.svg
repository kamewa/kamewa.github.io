<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="425" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >臺灣的飲食：不同族群帶來不同味道</text>
<rect x="40" y="70" width="200" height="220" rx="18" fill="#fff" stroke="#3E8E5A" stroke-width="3"/>
<text x="140" y="132" text-anchor="middle" font-size="46">🍚</text><text x="140" y="176" text-anchor="middle" font-size="19" font-weight="900" fill="#3E8E5A" >早年</text>
<text x="140" y="214" text-anchor="middle" font-size="14.5" font-weight="800" fill="#332B25" >以米食為主</text>
<line x1="244.0" y1="180.0" x2="260.0" y2="180.0" stroke="#6B5E52" stroke-width="4" stroke-linecap="round"/><path d="M266.0,180.0 L257.0,184.3 L257.0,175.7 Z" fill="#6B5E52"/>
<rect x="270" y="70" width="200" height="220" rx="18" fill="#fff" stroke="#E0A43A" stroke-width="3"/>
<text x="370" y="132" text-anchor="middle" font-size="46">🍜</text><text x="370" y="176" text-anchor="middle" font-size="19" font-weight="900" fill="#E0A43A" >二戰後</text>
<text x="370" y="214" text-anchor="middle" font-size="14.5" font-weight="800" fill="#332B25" >移民帶來</text>
<text x="370" y="240" text-anchor="middle" font-size="14.5" font-weight="800" fill="#332B25" >中國北方的麵食、豆漿</text>
<line x1="474.0" y1="180.0" x2="490.0" y2="180.0" stroke="#6B5E52" stroke-width="4" stroke-linecap="round"/><path d="M496.0,180.0 L487.0,184.3 L487.0,175.7 Z" fill="#6B5E52"/>
<rect x="500" y="70" width="200" height="220" rx="18" fill="#fff" stroke="#4A90C2" stroke-width="3"/>
<text x="600" y="132" text-anchor="middle" font-size="46">🍔</text><text x="600" y="176" text-anchor="middle" font-size="19" font-weight="900" fill="#4A90C2" >西方影響</text>
<text x="600" y="214" text-anchor="middle" font-size="14.5" font-weight="800" fill="#332B25" >三明治、漢堡很常見</text>
<line x1="704.0" y1="180.0" x2="720.0" y2="180.0" stroke="#6B5E52" stroke-width="4" stroke-linecap="round"/><path d="M726.0,180.0 L717.0,184.3 L717.0,175.7 Z" fill="#6B5E52"/>
<rect x="730" y="70" width="200" height="220" rx="18" fill="#fff" stroke="#E0694F" stroke-width="3"/>
<text x="830" y="132" text-anchor="middle" font-size="46">🍲</text><text x="830" y="176" text-anchor="middle" font-size="19" font-weight="900" fill="#E0694F" >近年</text>
<text x="830" y="214" text-anchor="middle" font-size="14.5" font-weight="800" fill="#332B25" >新住民、移工</text>
<text x="830" y="240" text-anchor="middle" font-size="14.5" font-weight="800" fill="#332B25" >帶來東南亞飲食</text>
<rect x="40" y="318" width="287" height="84" rx="14" fill="#FDF3DC" stroke="#45392F" stroke-width="1.6"/>
<text x="183" y="350" text-anchor="middle" font-size="18" font-weight="900" fill="#9C6A1E" >炸醬麵</text><text x="183" y="380" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >中國北方乾燥、多種小麥</text>
<rect x="347" y="318" width="287" height="84" rx="14" fill="#FDF3DC" stroke="#45392F" stroke-width="1.6"/>
<text x="490" y="350" text-anchor="middle" font-size="18" font-weight="900" fill="#9C6A1E" >竹筒飯</text><text x="490" y="380" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >原住民族就地取材，用竹子烤小米</text>
<rect x="654" y="318" width="287" height="84" rx="14" fill="#FDF3DC" stroke="#45392F" stroke-width="1.6"/>
<text x="797" y="350" text-anchor="middle" font-size="18" font-weight="900" fill="#9C6A1E" >冬蔭功</text><text x="797" y="380" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >東南亞溼熱，用酸辣開胃</text>
</svg>
