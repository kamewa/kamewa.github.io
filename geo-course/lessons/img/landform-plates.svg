<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="960" height="430" rx="20" fill="#EAF5FB"/>
<text x="480" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >臺灣位在兩個板塊的交界帶（東西向剖面示意）</text>
<rect x="40" y="70" width="880" height="310" rx="14" fill="#E7F2FA"/>
<path d="M40,320 L40,250 L130,245 L230,230 L300,200 L360,120 L400,90 L440,130 L480,170 L520,240 L560,250 L600,250 L630,210 L660,185 L700,215 L740,255 L920,262 L920,320 Z" fill="#C9A77A" stroke="#45392F" stroke-width="3" stroke-linejoin="round"/>
<path d="M40,320 L920,320 L920,380 L40,380 Z" fill="#B08A5E"/>
<line x1="580" y1="250" x2="560" y2="380" stroke="#C0392B" stroke-width="4" stroke-dasharray="10 6"/>
<text x="420" y="80" text-anchor="middle" font-size="17" font-weight="900" fill="#332B25" >中央山脈</text><text x="660" y="175" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >海岸山脈</text><text x="580" y="240" text-anchor="middle" font-size="14" font-weight="900" fill="#C0392B" >花東縱谷</text>
<text x="150" y="236" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >西部平原</text><text x="830" y="250" text-anchor="middle" font-size="15" font-weight="900" fill="#1F5F8B" >太平洋</text>
<rect x="195.0" y="334.8" width="130" height="30.4" rx="15.2" fill="#E0A43A" stroke="#45392F" stroke-width="2"/><text x="260" y="355.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">歐亞板塊</text><rect x="680.0" y="334.8" width="160" height="30.4" rx="15.2" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="760" y="355.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">菲律賓海板塊</text>
<defs><marker id="pa" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#C0392B"/></marker></defs>
<path d="M850,300 L660,300" stroke="#C0392B" stroke-width="7" marker-end="url(#pa)"/>
<text x="760" y="278" text-anchor="middle" font-size="14" font-weight="900" fill="#C0392B" >向西北推擠</text>
<text x="480" y="410" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >板塊推擠讓臺灣山地高聳、山脈南北走向，也多地震</text>
</svg>
