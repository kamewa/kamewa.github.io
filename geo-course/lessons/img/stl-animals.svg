<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 418" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="418" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >動植物與地名：地名裡的生態景觀</text>
<rect x="30" y="64" width="286" height="210" rx="18" fill="#fff" stroke="#3E8E5A" stroke-width="2.5"/>
<text x="173" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🦌</text><text x="173" y="168" text-anchor="middle" font-size="22" font-weight="900" fill="#3E8E5A" >鹿</text><text x="173" y="204" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >鹿港、鹿谷、鹿野…</text><text x="173" y="240" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >散布全臺 → 推測昔日鹿群分布很廣</text>
<rect x="336" y="64" width="286" height="210" rx="18" fill="#fff" stroke="#8A5A2B" stroke-width="2.5"/>
<text x="479" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🐂</text><text x="479" y="168" text-anchor="middle" font-size="22" font-weight="900" fill="#8A5A2B" >牛墟</text><text x="479" y="204" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >交易牛隻的地方</text><text x="479" y="240" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >牛是早年農村重要的勞力</text>
<rect x="642" y="64" width="286" height="210" rx="18" fill="#fff" stroke="#2E9A86" stroke-width="2.5"/>
<text x="785" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🌳</text><text x="785" y="168" text-anchor="middle" font-size="22" font-weight="900" fill="#2E9A86" >茄苳</text><text x="785" y="204" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >早年村內有茄苳樹</text><text x="785" y="240" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >大樹常成為聚落的地標</text>
<rect x="30" y="294" width="900" height="82" rx="14" fill="#FFF8E7" stroke="#E0694F" stroke-width="2"/>
<text x="480" y="326" text-anchor="middle" font-size="16" font-weight="900" fill="#E0694F" >⚠️ 有「鹿」字的地名，不一定和鹿有關！</text>
<text x="480" y="356" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >沙鹿：來自原住民族語　｜　初鹿：原住民族語轉寫成日語漢字</text>
<text x="480" y="400" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >（自繪）</text>
</svg>
