<text x="715" y="276" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >2000 年起退耕還林、退牧還草</text>
<text x="715" y="310" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >廣植樹木、讓環境休養</text>
<text x="715" y="344" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >土壤保水、養分增加 → 更多綠地</text>
<text x="715" y="378" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >黃河泥沙減少，水質改善</text>
