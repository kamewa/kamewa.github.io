<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="480" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >高齡化社會 → 高齡社會 → 超高齡社會</text>
<rect x="90" y="170" width="780" height="34" rx="17" fill="#F4EFE6" stroke="#45392F" stroke-width="1.8"/>
<rect x="90" y="170" width="592.8" height="34" rx="17" fill="#F2A65A"/>
<line x1="308.4" x2="308.4" y1="150" y2="224" stroke="#3E8E5A" stroke-width="4"/>
<text x="308.40000000000003" y="138" text-anchor="middle" font-size="20" font-weight="900" fill="#3E8E5A" >7%</text><text x="308.40000000000003" y="252" text-anchor="middle" font-size="17" font-weight="900" fill="#3E8E5A" >高齡化社會</text>
<line x1="526.8" x2="526.8" y1="150" y2="224" stroke="#E0A43A" stroke-width="4"/>
<text x="526.8000000000001" y="138" text-anchor="middle" font-size="20" font-weight="900" fill="#E0A43A" >14%</text><text x="526.8000000000001" y="252" text-anchor="middle" font-size="17" font-weight="900" fill="#E0A43A" >高齡社會</text>
<line x1="714.0" x2="714.0" y1="150" y2="224" stroke="#E0694F" stroke-width="4"/>
<text x="714.0" y="138" text-anchor="middle" font-size="20" font-weight="900" fill="#E0694F" >20%</text><text x="714.0" y="252" text-anchor="middle" font-size="17" font-weight="900" fill="#E0694F" >超高齡社會</text>
<text x="682.8" y="196" text-anchor="end" font-size="14" font-weight="900" fill="#fff" >臺灣 2024 年 約 19%</text>
<text x="480" y="100" text-anchor="middle" font-size="15" font-weight="800" fill="#6B5E52" >65 歲以上老年人口占總人口的比例（聯合國的定義）</text>
<circle cx="150" cy="294" r="8" fill="#3E8E5A"/><text x="172" y="300" text-anchor="start" font-size="17" font-weight="900" fill="#332B25" >1993 年</text><text x="300" y="300" text-anchor="start" font-size="16" font-weight="800" fill="#332B25" >老年人口超過 7%，成為高齡化社會</text>
<circle cx="150" cy="344" r="8" fill="#E0A43A"/><text x="172" y="350" text-anchor="start" font-size="17" font-weight="900" fill="#332B25" >2018 年</text><text x="300" y="350" text-anchor="start" font-size="16" font-weight="800" fill="#332B25" >超過 14%，成為高齡社會</text>
<circle cx="150" cy="394" r="8" fill="#E0694F"/><text x="172" y="400" text-anchor="start" font-size="17" font-weight="900" fill="#332B25" >約 2025 年</text><text x="300" y="400" text-anchor="start" font-size="16" font-weight="800" fill="#332B25" >超過 20%，進入超高齡社會</text>
<text x="480" y="460" text-anchor="middle" font-size="14" font-weight="800" fill="#6B5E52" >平均壽命延長＋出生率降低 → 老年人口比例快速增加（年份為約略值）</text>
</svg>
