<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="600" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >區域結盟：東協 → 東協＋3 → RCEP</text>
<ellipse cx="360" cy="330" rx="320" ry="250" fill="#E9F4FB" stroke="#4A90C2" stroke-width="3"/>
<ellipse cx="320" cy="340" rx="250" ry="200" fill="#FFF4DC" stroke="#E0A43A" stroke-width="3"/>
<ellipse cx="280" cy="355" rx="170" ry="150" fill="#E3F4E5" stroke="#2E9A86" stroke-width="3"/>
<rect x="170.0" y="224.8" width="220" height="30.4" rx="15.2" fill="#2E9A86" stroke="#45392F" stroke-width="2"/><text x="280" y="245.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">東協 ASEAN（11 國）</text>
<text x="180" y="300" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >緬甸</text>
<text x="280" y="300" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >泰國</text>
<text x="380" y="300" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >寮國</text>
<text x="180" y="336" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >柬埔寨</text>
<text x="280" y="336" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >越南</text>
<text x="380" y="336" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >菲律賓</text>
<text x="180" y="372" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >馬來西亞</text>
<text x="280" y="372" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >新加坡</text>
<text x="380" y="372" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >印尼</text>
<text x="180" y="408" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >汶萊</text>
<text x="280" y="408" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >東帝汶</text>
<rect x="260.0" y="139.8" width="120" height="30.4" rx="15.2" fill="#E0A43A" stroke="#45392F" stroke-width="2"/><text x="320" y="160.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">東協＋3</text>
<text x="495" y="260" text-anchor="middle" font-size="17" font-weight="900" fill="#9C6A1E" >中國</text>
<text x="495" y="300" text-anchor="middle" font-size="17" font-weight="900" fill="#9C6A1E" >日本</text>
<text x="495" y="340" text-anchor="middle" font-size="17" font-weight="900" fill="#9C6A1E" >南韓</text>
<rect x="285.0" y="90.75" width="270" height="28.5" rx="14.25" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="420" y="110.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">RCEP 區域全面經濟夥伴協定</text>
<text x="610" y="370" text-anchor="middle" font-size="17" font-weight="900" fill="#1F5F8B" >澳洲</text>
<text x="610" y="410" text-anchor="middle" font-size="17" font-weight="900" fill="#1F5F8B" >紐西蘭</text>
<rect x="700" y="80" width="236" height="150" rx="14" fill="#E3F4E5" stroke="#45392F" stroke-width="1.8"/>
<text x="716" y="110" text-anchor="start" font-size="18" font-weight="900" fill="#2E7D4F" >東協</text>
<text x="716" y="138.0" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >東南亞國家協會</text>
<text x="716" y="160.5" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >會員國彼此享有</text>
<text x="716" y="183.0" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >關稅優惠，加強合作</text>
<rect x="700" y="244" width="236" height="150" rx="14" fill="#FFF4DC" stroke="#45392F" stroke-width="1.8"/>
<text x="716" y="274" text-anchor="start" font-size="18" font-weight="900" fill="#9C6A1E" >東協＋3</text>
<text x="716" y="302.0" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >加上中國、日本、南韓</text>
<text x="716" y="324.5" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >共同開發能源、礦產，</text>
<text x="716" y="347.0" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >合作糧食救援</text>
<rect x="700" y="408" width="236" height="150" rx="14" fill="#E9F4FB" stroke="#45392F" stroke-width="1.8"/>
<text x="716" y="438" text-anchor="start" font-size="18" font-weight="900" fill="#1F5F8B" >RCEP</text>
<text x="716" y="466.0" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >再加上澳洲、紐西蘭</text>
<text x="716" y="488.5" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >擴大貿易範圍，</text>
<text x="716" y="511.0" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >一起降低關稅</text>
</svg>
