<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 426" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="426" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >「臺灣」這個名字從哪裡來？</text>
<rect x="30" y="64" width="212" height="250" rx="18" fill="#fff" stroke="#2E9A86" stroke-width="2.5"/>
<text x="136" y="108" text-anchor="middle" font-size="32" font-weight="400" fill="#332B25" >🌊</text><rect x="81.0" y="125.75" width="110" height="28.5" rx="14.25" fill="#2E9A86" stroke="#45392F" stroke-width="2"/><text x="136" y="145.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">早期</text><text x="136" y="176" text-anchor="middle" font-size="14.5" font-weight="900" fill="#6B5E52" >平埔族（西拉雅）</text>
<text x="136" y="214" text-anchor="middle" font-size="21" font-weight="900" fill="#2E9A86" >Tavoan</text>
<text x="136" y="256" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >「交會之地」：海水、陸地、</text><text x="136" y="280" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >沙洲交會的台江內海一帶</text>
<line x1="244.0" y1="189.0" x2="254.0" y2="189.0" stroke="#6B5E52" stroke-width="4" stroke-linecap="round"/><path d="M260.0,189.0 L251.0,193.3 L251.0,184.7 Z" fill="#6B5E52"/>
<rect x="262" y="64" width="212" height="250" rx="18" fill="#fff" stroke="#4A90C2" stroke-width="2.5"/>
<text x="368" y="108" text-anchor="middle" font-size="32" font-weight="400" fill="#332B25" >⛵</text><rect x="313.0" y="125.75" width="110" height="28.5" rx="14.25" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="368" y="145.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">17 世紀</text><text x="368" y="176" text-anchor="middle" font-size="14.5" font-weight="900" fill="#6B5E52" >荷蘭人</text>
<text x="368" y="214" text-anchor="middle" font-size="21" font-weight="900" fill="#4A90C2" >Tayovan</text>
<text x="368" y="256" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >標在地圖上：熱蘭遮城所在的</text><text x="368" y="280" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >一鯤鯓沙洲</text>
<line x1="476.0" y1="189.0" x2="486.0" y2="189.0" stroke="#6B5E52" stroke-width="4" stroke-linecap="round"/><path d="M492.0,189.0 L483.0,193.3 L483.0,184.7 Z" fill="#6B5E52"/>
<rect x="494" y="64" width="212" height="250" rx="18" fill="#fff" stroke="#E0A43A" stroke-width="2.5"/>
<text x="600" y="108" text-anchor="middle" font-size="32" font-weight="400" fill="#332B25" >🗣️</text><rect x="545.0" y="125.75" width="110" height="28.5" rx="14.25" fill="#E0A43A" stroke="#45392F" stroke-width="2"/><text x="600" y="145.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">17 世紀</text><text x="600" y="176" text-anchor="middle" font-size="14.5" font-weight="900" fill="#6B5E52" >在臺漢人</text>
<text x="600" y="214" text-anchor="middle" font-size="21" font-weight="900" fill="#E0A43A" >大員・台員・大灣</text>
<text x="600" y="256" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >用讀音相近的漢字記下來</text><text x="600" y="280" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >（先有音，再有字）</text>
<line x1="708.0" y1="189.0" x2="718.0" y2="189.0" stroke="#6B5E52" stroke-width="4" stroke-linecap="round"/><path d="M724.0,189.0 L715.0,193.3 L715.0,184.7 Z" fill="#6B5E52"/>
<rect x="726" y="64" width="212" height="250" rx="18" fill="#fff" stroke="#E0694F" stroke-width="2.5"/>
<text x="832" y="108" text-anchor="middle" font-size="32" font-weight="400" fill="#332B25" >🏝️</text><rect x="777.0" y="125.75" width="110" height="28.5" rx="14.25" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="832" y="145.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">現今</text><text x="832" y="176" text-anchor="middle" font-size="14.5" font-weight="900" fill="#6B5E52" >我們</text>
<text x="832" y="214" text-anchor="middle" font-size="21" font-weight="900" fill="#E0694F" >臺灣</text>
<text x="832" y="256" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >從安平一帶的地名，</text><text x="832" y="280" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >變成全島的名稱</text>
<rect x="30" y="334" width="900" height="74" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="480" y="364" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >另一個名字：西方水手稱臺灣為「福爾摩沙」（Ilha Formosa，美麗之島）</text>
<text x="480" y="392" text-anchor="middle" font-size="13" font-weight="800" fill="#6B5E52" >日治時期北部丘陵種的茶，就以「福爾摩沙茶」（Formosa Tea）為商標外銷歐美</text>
</svg>
