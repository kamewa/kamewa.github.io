<text x="250" y="334" text-anchor="middle" font-size="1" font-weight="700" fill="#332B25" ></text>
<text x="250" y="334" text-anchor="middle" font-size="1" font-weight="700" fill="#332B25" ></text>
<text x="250" y="340" text-anchor="middle" font-size="15" font-weight="900" fill="#E0694F" >板塊運動・火山活動・地震</text>
<text x="250" y="362" text-anchor="middle" font-size="13" font-weight="700" fill="#6B5E52" >例：陽明山小油坑（火山活動）</text>
