<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 378" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="378" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >花園都市新加坡：生活和生態兼顧</text>
<rect x="30" y="64" width="280" height="260" rx="18" fill="#E3F4E5" stroke="#45392F" stroke-width="2"/>
<text x="170" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🌳</text><rect x="100.0" y="146.9" width="140" height="34.199999999999996" rx="17.099999999999998" fill="#3E8E5A" stroke="#45392F" stroke-width="2"/><text x="170" y="170.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">都市綠化</text>
<text x="170" y="214" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >道路預留空間種行道樹</text>
<text x="170" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >設立自然保護區</text>
<text x="170" y="274" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >夏天不像臺北那麼熱</text>
<rect x="340" y="64" width="280" height="260" rx="18" fill="#E1EFF9" stroke="#45392F" stroke-width="2"/>
<text x="480" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🚇</text><rect x="410.0" y="146.9" width="140" height="34.199999999999996" rx="17.099999999999998" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="480" y="170.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">大眾運輸</text>
<text x="480" y="214" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >郊區新市鎮</text>
<text x="480" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >用完善的大眾運輸</text>
<text x="480" y="274" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >和市區連接</text>
<rect x="650" y="64" width="280" height="260" rx="18" fill="#FDE8E3" stroke="#45392F" stroke-width="2"/>
<text x="790" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🚗</text><rect x="720.0" y="146.9" width="140" height="34.199999999999996" rx="17.099999999999998" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="790" y="170.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">管制汽車</text>
<text x="790" y="214" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >收取高額汽車稅</text>
<text x="790" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >管制汽車牌照數量</text>
<text x="790" y="274" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >減少塞車和空氣汙染</text>
<text x="480" y="358" text-anchor="middle" font-size="14" font-weight="800" fill="#6B5E52" >新加坡是只有都市、沒有鄉村的「都市國家」，位在熱帶雨林氣候區，交通位置重要、貿易發達</text>
</svg>
