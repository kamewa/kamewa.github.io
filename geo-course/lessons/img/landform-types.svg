<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="960" height="440" rx="20" fill="#EAF5FB"/>
<text x="480" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >地形的基本類型（剖面示意）</text>
<rect x="30" y="330" width="900" height="60" fill="#C9A77A"/>
<path d="M30,300 L60,290 L80,170 L100,210 L120,120 L145,190 L165,140 L190,230 L210,285 L240,265 L265,245 L290,268 L315,250 L340,280 L355,280 L375,150 L395,145 L470,140 L495,148 L515,285 L540,290 L555,232 L630,230 L645,292 L665,290 L685,225 L705,255 L730,300 L790,302 L815,255 L835,228 L850,285 L870,310 L930,315 L930,330 L30,330 Z" fill="#B5D69A" stroke="#45392F" stroke-width="3" stroke-linejoin="round"/>
<path d="M110,140 L120,120 L132,140 Z M158,152 L165,140 L173,152 Z" fill="#fff" stroke="#45392F" stroke-width="1.5"/>
<line x1="30" y1="200" x2="930" y2="200" stroke="#E0694F" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="925" y="194" text-anchor="end" font-size="12" font-weight="800" fill="#C0392B" >約 1,000 公尺</text>
<rect x="99.0" y="64.8" width="72" height="30.4" rx="15.2" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="135" y="85.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">山地</text>
<text x="135" y="368" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >高、陡，&gt;1,000 m</text>
<rect x="254.0" y="64.8" width="72" height="30.4" rx="15.2" fill="#E0A43A" stroke="#45392F" stroke-width="2"/><text x="290" y="85.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">丘陵</text>
<text x="290" y="368" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >低緩起伏，&lt;1,000 m</text>
<rect x="399.0" y="64.8" width="72" height="30.4" rx="15.2" fill="#9C6ADE" stroke="#45392F" stroke-width="2"/><text x="435" y="85.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">高原</text>
<text x="435" y="368" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >高而平坦、範圍大</text>
<rect x="556.0" y="64.8" width="72" height="30.4" rx="15.2" fill="#2E9A86" stroke="#45392F" stroke-width="2"/><text x="592" y="85.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">台地</text>
<text x="592" y="368" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >頂平、邊陡、規模小</text>
<rect x="724.0" y="64.8" width="72" height="30.4" rx="15.2" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="760" y="85.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">盆地</text>
<text x="760" y="368" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >四周高、中間低平</text>
<rect x="859.0" y="64.8" width="72" height="30.4" rx="15.2" fill="#7CB46A" stroke="#45392F" stroke-width="2"/><text x="895" y="85.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">平原</text>
<text x="895" y="368" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >低平遼闊</text>
<text x="480" y="420" text-anchor="middle" font-size="15" font-weight="900" fill="#C0392B" >臺灣沒有高原，但有規模和高度都較小的「台地」</text>
</svg>
