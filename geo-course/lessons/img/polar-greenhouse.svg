<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#C45037"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E58A12"/></marker></defs>
  <rect width="960" height="400" rx="20" fill="#EAF5FB"/>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="800" fill="#332B25">溫室效應：溫室氣體像一條被子包住地球</text>
  <circle cx="110" cy="105" r="46" fill="#FFD45E" stroke="#E58A12" stroke-width="4"/>
  <text x="110" y="112" text-anchor="middle" font-size="20" font-weight="800" fill="#6B3F0E">太陽</text>
  <path d="M60,175 C300,150 660,150 900,175" fill="none" stroke="#9263A3" stroke-width="26" stroke-opacity=".28" stroke-linecap="round"/>
  <text x="330" y="140" font-size="17" font-weight="800" fill="#6E4180">溫室氣體層（二氧化碳、甲烷、水蒸氣…）</text>
  <path d="M0,310 C240,290 720,290 960,310 L960,400 L0,400 Z" fill="#9CCB7A" stroke="#45392F" stroke-width="3"/>
  <text x="480" y="365" text-anchor="middle" font-size="20" font-weight="800" fill="#2C5A28">地表</text>
  <line x1="150" y1="140" x2="300" y2="290" stroke="#E58A12" stroke-width="5" marker-end="url(#b)"/>
  <text x="190" y="250" font-size="16" font-weight="800" fill="#8C5810">① 陽光照到地表</text>
  <line x1="380" y1="292" x2="430" y2="160" stroke="#C45037" stroke-width="5" stroke-dasharray="10 6" marker-end="url(#a)"/>
  <line x1="430" y1="172" x2="500" y2="285" stroke="#C45037" stroke-width="5" stroke-dasharray="10 6" marker-end="url(#a)"/>
  <text x="510" y="240" font-size="16" font-weight="800" fill="#A93E27">② 地表放出熱能，</text>
  <text x="510" y="262" font-size="16" font-weight="800" fill="#A93E27">被溫室氣體吸收再送回地面</text>
  <line x1="640" y1="292" x2="720" y2="60" stroke="#C45037" stroke-width="3" stroke-opacity=".5" marker-end="url(#a)"/>
  <text x="735" y="78" font-size="15" font-weight="700" fill="#6B5E54">部分熱能散到太空</text>
    <text x="940" y="392" text-anchor="end" font-size="11" fill="#2C5A28">示意圖</text>
</svg>
