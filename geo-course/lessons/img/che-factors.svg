<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 458" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="458" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >影響中國工商業發展的四大因素</text>
<rect x="20" y="56" width="400" height="360" rx="16" fill="#fff" stroke="#45392F" stroke-width="1.5"/>
<text x="220" y="86" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >三級產業產值比例（%）</text>
<line x1="64" x2="320" y1="370.0" y2="370.0" stroke="#E5DED3"/><text x="56" y="375.0" text-anchor="end" font-size="12.5" font-weight="700" fill="#6B5E52" >0</text>
<line x1="64" x2="320" y1="286.7" y2="286.7" stroke="#E5DED3"/><text x="56" y="291.6666666666667" text-anchor="end" font-size="12.5" font-weight="700" fill="#6B5E52" >20</text>
<line x1="64" x2="320" y1="203.3" y2="203.3" stroke="#E5DED3"/><text x="56" y="208.33333333333334" text-anchor="end" font-size="12.5" font-weight="700" fill="#6B5E52" >40</text>
<line x1="64" x2="320" y1="120.0" y2="120.0" stroke="#E5DED3"/><text x="56" y="125.0" text-anchor="end" font-size="12.5" font-weight="700" fill="#6B5E52" >60</text>
<text x="64.0" y="392" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >1980</text>
<text x="180.36363636363637" y="392" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >2000</text>
<text x="320.0" y="392" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >2024</text>
<polyline points="64.0,278.3 93.1,249.2 122.2,236.7 151.3,232.5 180.4,203.3 209.5,199.2 238.5,186.7 267.6,157.5 296.7,142.9 320.0,132.5" fill="none" stroke="#4A90C2" stroke-width="4" stroke-linejoin="round"/>
<text x="328.0" y="137.5" text-anchor="start" font-size="14" font-weight="900" fill="#4A90C2" >第三級 57%</text>
<polyline points="64.0,170.0 93.1,190.8 122.2,199.2 151.3,174.2 180.4,180.4 209.5,174.2 238.5,176.2 267.6,199.2 296.7,211.7 320.0,220.0" fill="none" stroke="#E0A43A" stroke-width="4" stroke-linejoin="round"/>
<text x="328.0" y="225.0" text-anchor="start" font-size="14" font-weight="900" fill="#E0A43A" >第二級 36%</text>
<polyline points="64.0,245.0 93.1,253.3 122.2,257.5 151.3,286.7 180.4,307.5 209.5,320.0 238.5,330.4 267.6,335.0 296.7,337.9 320.0,340.8" fill="none" stroke="#3E8E5A" stroke-width="4" stroke-linejoin="round"/>
<text x="328.0" y="345.8333333333333" text-anchor="start" font-size="14" font-weight="900" fill="#3E8E5A" >第一級 7%</text>
<rect x="440" y="56" width="500" height="80" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="474" y="106" text-anchor="middle" font-size="26" font-weight="400" fill="#332B25" >⛏️</text><text x="504" y="86" text-anchor="start" font-size="16" font-weight="900" fill="#E0694F" >原料（礦產）</text>
<text x="504" y="110" text-anchor="start" font-size="12.5" font-weight="800" fill="#332B25" >北部煤、鐵、石油多 → 鋼鐵、石化等重工業；</text><text x="504" y="128" text-anchor="start" font-size="12.5" font-weight="800" fill="#332B25" >南部礦產少 → 昔日以紡織等輕工業為主</text>
<rect x="440" y="148" width="500" height="80" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="474" y="198" text-anchor="middle" font-size="26" font-weight="400" fill="#332B25" >🚆</text><text x="504" y="178" text-anchor="start" font-size="16" font-weight="900" fill="#E0694F" >交通</text>
<text x="504" y="202" text-anchor="start" font-size="12.5" font-weight="800" fill="#332B25" >東半部鐵公路密、海運發達；</text><text x="504" y="220" text-anchor="start" font-size="12.5" font-weight="800" fill="#332B25" >西半部交通網稀疏；高鐵建設讓移動更快</text>
<rect x="440" y="240" width="500" height="80" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="474" y="290" text-anchor="middle" font-size="26" font-weight="400" fill="#332B25" >📜</text><text x="504" y="270" text-anchor="start" font-size="16" font-weight="900" fill="#E0694F" >政策</text>
<text x="504" y="300" text-anchor="start" font-size="12.5" font-weight="800" fill="#332B25" >改革開放、設立經濟特區，吸引外資 → 「世界工廠」</text>
<rect x="440" y="332" width="500" height="80" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="474" y="382" text-anchor="middle" font-size="26" font-weight="400" fill="#332B25" >🛒</text><text x="504" y="362" text-anchor="start" font-size="16" font-weight="900" fill="#E0694F" >市場</text>
<text x="504" y="392" text-anchor="start" font-size="12.5" font-weight="800" fill="#332B25" >人民收入提高、電子商務發達 → 「世界市場」</text>
<text x="480" y="440" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >改革開放後，第二、三級產業的產值早已超越第一級產業（依中國國家統計局資料整理的約略值，自繪）</text>
</svg>
