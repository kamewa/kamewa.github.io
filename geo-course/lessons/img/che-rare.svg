<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="486" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >稀土：高科技產業不可缺少的原料</text>
<rect x="20" y="56" width="440" height="330" rx="16" fill="#fff" stroke="#45392F" stroke-width="1.5"/>
<text x="240" y="86" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >2024 年各國稀土蘊藏量比例</text>
<path d="M150,230 L150.0,120.0 A110,110 0 0 1 156.9,339.8 Z" fill="#C0392B" stroke="#fff" stroke-width="2"/>
<path d="M150,230 L156.9,339.8 A110,110 0 0 1 41.9,250.6 Z" fill="#E8A33D" stroke="#fff" stroke-width="2"/>
<path d="M150,230 L41.9,250.6 A110,110 0 0 1 45.4,196.0 Z" fill="#7AB87A" stroke="#fff" stroke-width="2"/>
<path d="M150,230 L45.4,196.0 A110,110 0 0 1 65.2,159.9 Z" fill="#5DA9D6" stroke="#fff" stroke-width="2"/>
<path d="M150,230 L65.2,159.9 A110,110 0 0 1 85.3,141.0 Z" fill="#9C6ADE" stroke="#fff" stroke-width="2"/>
<path d="M150,230 L85.3,141.0 A110,110 0 0 1 150.0,120.0 Z" fill="#D8D2C8" stroke="#fff" stroke-width="2"/>
<rect x="290" y="128" width="18" height="18" rx="4" fill="#C0392B"/><text x="316" y="143" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >中國 49%</text>
<rect x="290" y="164" width="18" height="18" rx="4" fill="#E8A33D"/><text x="316" y="179" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >巴西 23%</text>
<rect x="290" y="200" width="18" height="18" rx="4" fill="#7AB87A"/><text x="316" y="215" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >印度 8%</text>
<rect x="290" y="236" width="18" height="18" rx="4" fill="#5DA9D6"/><text x="316" y="251" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >澳洲 6%</text>
<rect x="290" y="272" width="18" height="18" rx="4" fill="#9C6ADE"/><text x="316" y="287" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >俄羅斯 4%</text>
<rect x="290" y="308" width="18" height="18" rx="4" fill="#D8D2C8"/><text x="316" y="323" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >其他 10%</text>
<text x="240" y="372" text-anchor="middle" font-size="12" font-weight="800" fill="#6B5E52" >（依美國地質調查局資料整理的約略值）</text>
<rect x="480" y="56" width="460" height="330" rx="16" fill="#FFF8E7" stroke="#45392F" stroke-width="1.5"/>
<text x="512" y="108" text-anchor="middle" font-size="24" font-weight="400" fill="#332B25" >🔬</text><text x="542" y="96" text-anchor="start" font-size="15.5" font-weight="900" fill="#E0694F" >特色</text><text x="542" y="124" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >十多種性質相似的金屬，提取困難、分布不均</text>
<text x="512" y="184" text-anchor="middle" font-size="24" font-weight="400" fill="#332B25" >📍</text><text x="542" y="172" text-anchor="start" font-size="15.5" font-weight="900" fill="#E0694F" >中國產地</text><text x="542" y="200" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >內蒙古（白雲鄂博）與南部</text>
<text x="512" y="260" text-anchor="middle" font-size="24" font-weight="400" fill="#332B25" >📱</text><text x="542" y="248" text-anchor="start" font-size="15.5" font-weight="900" fill="#E0694F" >用途</text><text x="542" y="276" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >液晶螢幕、手機螢幕、電動車馬達、風力發電機</text>
<text x="512" y="336" text-anchor="middle" font-size="24" font-weight="400" fill="#332B25" >⚖️</text><text x="542" y="324" text-anchor="start" font-size="15.5" font-weight="900" fill="#E0694F" >影響</text><text x="542" y="352" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >他國高科技產業依賴中國供應 → 容易受牽制</text>
<rect x="20" y="402" width="920" height="66" rx="14" fill="#fff" stroke="#E0694F" stroke-width="2"/>
<text x="480" y="430" text-anchor="middle" font-size="16" font-weight="900" fill="#E0694F" >環境代價：每生產 1 公噸稀土，約產生 2,000 公噸有毒物質</text>
<text x="480" y="454" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >有毒廢料汙染土地與水源（例如內蒙古包頭的尾礦壩）</text>
</svg>
