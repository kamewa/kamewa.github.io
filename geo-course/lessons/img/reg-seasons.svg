<text x="530" y="274" text-anchor="start" font-size="14" font-weight="800" fill="#332B25" >3～9 月只抓飛魚</text>
<text x="530" y="296" text-anchor="start" font-size="14" font-weight="800" fill="#332B25" >魚鉤沒有倒鉤，可以放生</text>
<text x="530" y="318" text-anchor="start" font-size="14" font-weight="800" fill="#332B25" >「終食祭」：吃多少捕多少</text>
