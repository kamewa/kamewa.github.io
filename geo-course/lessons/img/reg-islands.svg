<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="385" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >離島地區的特色與挑戰</text>
<rect x="24" y="64" width="215" height="270" rx="18" fill="#fff" stroke="#4A90C2" stroke-width="2.5"/>
<text x="131" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >✈️</text><rect x="66.0" y="144.9" width="130" height="34.199999999999996" rx="17.099999999999998" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="131" y="168.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">對外交通</text>
<text x="131" y="214" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >靠空運和海運</text>
<text x="131" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >大霧、風浪時停飛停駛</text>
<text x="131" y="278" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >影響物資和人員運輸</text>
<rect x="257" y="64" width="215" height="270" rx="18" fill="#fff" stroke="#E0694F" stroke-width="2.5"/>
<text x="364" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🚁</text><rect x="299.0" y="144.9" width="130" height="34.199999999999996" rx="17.099999999999998" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="364" y="168.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">醫療資源</text>
<text x="364" y="214" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >沒有大型醫院</text>
<text x="364" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >緊急就醫要搭飛機</text>
<text x="364" y="278" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >到臺灣本島</text>
<rect x="490" y="64" width="215" height="270" rx="18" fill="#fff" stroke="#2E9A86" stroke-width="2.5"/>
<text x="597" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >💧</text><rect x="532.0" y="144.9" width="130" height="34.199999999999996" rx="17.099999999999998" fill="#2E9A86" stroke="#45392F" stroke-width="2"/><text x="597" y="168.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">水資源</text>
<text x="597" y="214" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >地形平坦，</text>
<text x="597" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >無法攔截水氣</text>
<text x="597" y="278" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >較缺乏水資源</text>
<rect x="723" y="64" width="215" height="270" rx="18" fill="#fff" stroke="#3E8E5A" stroke-width="2.5"/>
<text x="830" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🐟</text><rect x="765.0" y="144.9" width="130" height="34.199999999999996" rx="17.099999999999998" fill="#3E8E5A" stroke="#45392F" stroke-width="2"/><text x="830" y="168.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">產業</text>
<text x="830" y="214" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >海洋資源豐富</text>
<text x="830" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >漁業、觀光業發達</text>
<text x="830" y="278" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >例：馬祖藍眼淚</text>
<text x="480" y="366" text-anchor="middle" font-size="14" font-weight="800" fill="#6B5E52" >金門、馬祖、澎湖、蘭嶼、綠島等離島，交通不便、人口較少，產業和本島有明顯差異</text>
</svg>
