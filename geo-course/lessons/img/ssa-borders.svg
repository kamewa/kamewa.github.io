<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >族群問題的根源：殖民時期「畫直線」分疆界</text>
<rect x="40" y="62" width="430" height="300" rx="16" fill="#fff" stroke="#45392F" stroke-width="2"/>
<rect x="185.0" y="76.8" width="140" height="30.4" rx="15.2" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="255" y="97.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">國內衝突</text>
<ellipse cx="190" cy="220" rx="80" ry="70" fill="#F6C9A0" opacity=".85"/>
<ellipse cx="320" cy="225" rx="80" ry="70" fill="#A8D5A2" opacity=".85"/>
<text x="175" y="225" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >族群甲</text><text x="335" y="230" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >族群乙</text>
<rect x="130" y="150" width="250" height="150" fill="none" stroke="#E0694F" stroke-width="4"/>
<text x="255" y="325" text-anchor="middle" font-size="14" font-weight="900" fill="#E0694F" >國界</text>
<text x="255" y="400" text-anchor="middle" font-size="14.5" font-weight="900" fill="#332B25" >不同族群被畫進同一國：爭奪政權</text>
<text x="255" y="424" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >例：盧安達的胡圖族與圖西族</text>
<rect x="490" y="62" width="430" height="300" rx="16" fill="#fff" stroke="#45392F" stroke-width="2"/>
<rect x="635.0" y="76.8" width="140" height="30.4" rx="15.2" fill="#9C6ADE" stroke="#45392F" stroke-width="2"/><text x="705" y="97.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">國際衝突</text>
<ellipse cx="705" cy="220" rx="130" ry="75" fill="#F6C9A0" opacity=".85"/>
<text x="705" y="225" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >同一個族群</text>
<line x1="705" y1="130" x2="705" y2="315" stroke="#9C6ADE" stroke-width="4"/>
<line x1="550" y1="270" x2="870" y2="270" stroke="#9C6ADE" stroke-width="4"/>
<text x="620" y="160" text-anchor="middle" font-size="15" font-weight="900" fill="#9C6ADE" >A 國</text><text x="790" y="160" text-anchor="middle" font-size="15" font-weight="900" fill="#9C6ADE" >B 國</text><text x="790" y="305" text-anchor="middle" font-size="15" font-weight="900" fill="#9C6ADE" >C 國</text>
<text x="705" y="400" text-anchor="middle" font-size="14.5" font-weight="900" fill="#332B25" >同一族群被分到不同國：為統一而戰</text>
<text x="705" y="424" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >例：東非的索馬利人</text>
<text x="480" y="470" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B3410" >歐洲列強畫分殖民地時沒有考慮族群分布，有些地方直接用經緯線當界線 → 獨立後衝突不斷（示意圖）</text>
