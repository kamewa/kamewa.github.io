<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 475" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="475" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >非洲是「高原大陸」：高原緊鄰海岸，海岸陡直</text>
<rect x="40" y="300" width="230" height="120" fill="#8FC4E8"/>
<path d="M270,420 L270,300 L300,170 L470,160 L560,230 L700,240 L760,165 L930,155 L930,420 Z" fill="#D9B98A" stroke="#45392F" stroke-width="2.5"/>
<path d="M560,230 L700,240 L690,262 L570,252 Z" fill="#7DBE6A" opacity=".7"/>
<text x="630" y="285" text-anchor="middle" font-size="14" font-weight="900" fill="#2E7D4F" >盆地（例：剛果盆地）</text>
<path d="M380,162 L320,168 Q300,170 296,190 L280,300" fill="none" stroke="#2C6E9E" stroke-width="6"/>
<path d="M290,200 l-6,20 l10,0 Z" fill="#fff"/>
<text x="150" y="275" text-anchor="middle" font-size="15" font-weight="900" fill="#1F5F8B" >大西洋／印度洋</text>
<text x="395" y="145" text-anchor="middle" font-size="16" font-weight="900" fill="#6B3410" >高原</text><text x="845" y="140" text-anchor="middle" font-size="16" font-weight="900" fill="#6B3410" >高原</text>
<text x="210" y="200" text-anchor="end" font-size="14" font-weight="900" fill="#1F5F8B" >河川切穿高原邊緣</text><text x="210" y="222" text-anchor="end" font-size="14" font-weight="900" fill="#1F5F8B" >→ 急流、瀑布，不利航行</text>
<text x="300" y="330" text-anchor="start" font-size="14" font-weight="900" fill="#B03A2E" >海岸陡峭平直</text><text x="300" y="352" text-anchor="start" font-size="14" font-weight="900" fill="#B03A2E" >天然港灣少</text>
<text x="480" y="455" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >平均海拔不高（多在 1,000 公尺以下），但高原面積廣大；昔日沿海進出內陸很不方便（剖面示意圖）</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
