<text x="415.52424686620463" y="350.5" text-anchor="middle" font-size="16" font-weight="900" fill="#7A5A0E" stroke="#fff" stroke-width="3" paint-order="stroke">② 中部</text>
<text x="539.1069825526938" y="174.5" text-anchor="middle" font-size="16" font-weight="900" fill="#1F4F7A" stroke="#fff" stroke-width="3" paint-order="stroke">③ 東北</text>
<text x="230.15014333647073" y="290.0" text-anchor="middle" font-size="16" font-weight="900" fill="#2E6B2F" stroke="#fff" stroke-width="3" paint-order="stroke">④ 西部</text>
<text x="320" y="546" text-anchor="middle" font-size="12" font-weight="800" fill="#6B5E52" >（以省區為單位的簡化示意，界線為大致位置，自繪）</text>
<rect x="640" y="60" width="300" height="106" rx="14" fill="#fff" stroke="#45392F" stroke-width="1.4"/>
<rect x="656" y="76" width="20" height="20" rx="5" fill="#F2A07B" stroke="#7A6450" stroke-width=".8"/><text x="686" y="92" text-anchor="start" font-size="15.5" font-weight="900" fill="#332B25" >① 東部率先發展</text>
<text x="658" y="124" text-anchor="start" font-size="12.5" font-weight="800" fill="#6B5E52" >最早開放、交通便利</text><text x="658" y="148" text-anchor="start" font-size="12.5" font-weight="800" fill="#6B5E52" >高科技產業有國際競爭力，帶動其他區域</text>
<rect x="640" y="178" width="300" height="106" rx="14" fill="#fff" stroke="#45392F" stroke-width="1.4"/>
<rect x="656" y="194" width="20" height="20" rx="5" fill="#F6D57A" stroke="#7A6450" stroke-width=".8"/><text x="686" y="210" text-anchor="start" font-size="15.5" font-weight="900" fill="#332B25" >② 中部崛起</text>
<text x="658" y="242" text-anchor="start" font-size="12.5" font-weight="800" fill="#6B5E52" >煤、糧食多、工資較低</text><text x="658" y="266" text-anchor="start" font-size="12.5" font-weight="800" fill="#6B5E52" >連結東部與西部的樞紐</text>
<rect x="640" y="296" width="300" height="106" rx="14" fill="#fff" stroke="#45392F" stroke-width="1.4"/>
<rect x="656" y="312" width="20" height="20" rx="5" fill="#9CC8E8" stroke="#7A6450" stroke-width=".8"/><text x="686" y="328" text-anchor="start" font-size="15.5" font-weight="900" fill="#332B25" >③ 東北振興</text>
<text x="658" y="360" text-anchor="start" font-size="12.5" font-weight="800" fill="#6B5E52" >傳統重工業區，礦產枯竭、設備老舊</text><text x="658" y="384" text-anchor="start" font-size="12.5" font-weight="800" fill="#6B5E52" >→ 轉型新興能源、汽車、旅遊</text>
<rect x="640" y="414" width="300" height="106" rx="14" fill="#fff" stroke="#45392F" stroke-width="1.4"/>
<rect x="656" y="430" width="20" height="20" rx="5" fill="#B9DCA6" stroke="#7A6450" stroke-width=".8"/><text x="686" y="446" text-anchor="start" font-size="15.5" font-weight="900" fill="#332B25" >④ 西部大開發</text>
<text x="658" y="478" text-anchor="start" font-size="12.5" font-weight="800" fill="#6B5E52" >資源豐富，但對外交通不便</text><text x="658" y="502" text-anchor="start" font-size="12.5" font-weight="800" fill="#6B5E52" >→ 輸出能源，發展礦產加工、旅遊</text>
</svg>
