<rect x="816.0" y="80" width="61.3" height="54" fill="#E6E1D8" stroke="#45392F" stroke-width="1.5"/>
<rect x="877.3" y="80" width="22.7" height="54" fill="#8FC4E8" stroke="#45392F" stroke-width="1.5"/>
<text x="900" y="160" text-anchor="end" font-size="13" font-weight="900" fill="#6B5E52" >混血 8.6%｜白人 7.3%｜亞洲裔 2.7%</text>
<text x="60" y="160" text-anchor="start" font-size="13" font-weight="900" fill="#6B5E52" >2022 年南非族群比例（依課本圖表）</text>
