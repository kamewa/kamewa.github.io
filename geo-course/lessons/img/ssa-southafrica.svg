<text x="770" y="278" text-anchor="middle" font-size="18" font-weight="900" fill="#332B25" >隔離政策已終止</text><text x="770" y="306" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >但部分地區種族分居仍明顯</text>
<text x="480" y="370" text-anchor="middle" font-size="14.5" font-weight="900" fill="#6B3410" >南非是漠南非洲經濟較好的國家，但族群問題仍造成社會動盪</text>
