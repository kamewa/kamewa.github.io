<text x="190" y="278" text-anchor="middle" font-size="18" font-weight="900" fill="#332B25" >種族隔離政策</text><text x="190" y="306" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >少數白人統治多數黑人</text>
