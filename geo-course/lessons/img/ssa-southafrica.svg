<text x="480" y="278" text-anchor="middle" font-size="18" font-weight="900" fill="#332B25" >首次全民普選</text><text x="480" y="306" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >選出第一位黑人總統曼德拉</text>
