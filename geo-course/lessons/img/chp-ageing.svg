<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="528" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >中國的人口組成：幼年減少、老年增加</text>
<text x="186" y="114" text-anchor="end" font-size="17" font-weight="900" fill="#332B25" >1980</text>
<rect x="200.0" y="80" width="224.4" height="52" fill="#8CC37A" stroke="#fff" stroke-width="2"/>
<text x="312.22" y="112" text-anchor="middle" font-size="13.5" font-weight="900" fill="#fff" >幼年 36.2%</text>
<rect x="424.4" y="80" width="380.1" height="52" fill="#8DC3E6" stroke="#fff" stroke-width="2"/>
<text x="614.47" y="112" text-anchor="middle" font-size="13.5" font-weight="900" fill="#332B25" >壯年 61.3%</text>
<rect x="804.5" y="80" width="15.5" height="52" fill="#E8735A" stroke="#fff" stroke-width="2"/>
<text x="826.0" y="112" text-anchor="start" font-size="13.5" font-weight="900" fill="#E0694F" >老年 2.5%</text>
<text x="186" y="210" text-anchor="end" font-size="17" font-weight="900" fill="#332B25" >2020</text>
<rect x="200.0" y="176" width="109.7" height="52" fill="#8CC37A" stroke="#fff" stroke-width="2"/>
<text x="254.87" y="208" text-anchor="middle" font-size="13.5" font-weight="900" fill="#fff" >幼年 17.7%</text>
<rect x="309.7" y="176" width="435.9" height="52" fill="#8DC3E6" stroke="#fff" stroke-width="2"/>
<text x="527.6700000000001" y="208" text-anchor="middle" font-size="13.5" font-weight="900" fill="#332B25" >壯年 70.3%</text>
<rect x="745.6" y="176" width="74.4" height="52" fill="#E8735A" stroke="#fff" stroke-width="2"/>
<text x="782.8000000000001" y="208" text-anchor="middle" font-size="13.5" font-weight="900" fill="#fff" >老年 12.0%</text>
<text x="186" y="306" text-anchor="end" font-size="17" font-weight="900" fill="#332B25" >2040（推估）</text>
<rect x="200.0" y="272" width="88.0" height="52" fill="#8CC37A" stroke="#fff" stroke-width="2"/>
<text x="244.01999999999998" y="304" text-anchor="middle" font-size="13.5" font-weight="900" fill="#fff" >幼年 14.2%</text>
<rect x="288.0" y="272" width="385.0" height="52" fill="#8DC3E6" stroke="#fff" stroke-width="2"/>
<text x="480.54999999999995" y="304" text-anchor="middle" font-size="13.5" font-weight="900" fill="#332B25" >壯年 62.1%</text>
<rect x="673.1" y="272" width="146.9" height="52" fill="#E8735A" stroke="#fff" stroke-width="2"/>
<text x="746.53" y="304" text-anchor="middle" font-size="13.5" font-weight="900" fill="#fff" >老年 23.7%</text>
<rect x="40" y="374" width="880" height="110" rx="16" fill="#FFF8E7" stroke="#45392F" stroke-width="1.5"/>
<text x="64" y="402" text-anchor="start" font-size="15" font-weight="900" fill="#E0694F" >原因</text><text x="160" y="402" text-anchor="start" font-size="14" font-weight="800" fill="#332B25" >一胎化政策讓幼年人口減少；醫療衛生進步讓壽命延長</text>
<text x="64" y="432" text-anchor="start" font-size="15" font-weight="900" fill="#E0694F" >問題</text><text x="160" y="432" text-anchor="start" font-size="14" font-weight="800" fill="#332B25" >未來勞動人口不足，影響經濟發展；老年人口的社會負擔加重</text>
<text x="64" y="462" text-anchor="start" font-size="15" font-weight="900" fill="#E0694F" >對策</text><text x="160" y="462" text-anchor="start" font-size="14" font-weight="800" fill="#332B25" >2015 年開放二胎；2021 年通過三孩政策，在教育、住房、就業等方面給予補助</text>
<text x="480" y="510" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >（比例依課本圖 1-3-10 整理的約略值，自繪）</text>
</svg>
