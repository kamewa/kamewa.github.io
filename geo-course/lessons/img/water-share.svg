<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="960" height="460" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >地球上的水，人類方便取用的有多少？</text>
<text x="60" y="68" text-anchor="start" font-size="15" font-weight="900" fill="#332B25" >① 全球的水</text>
<rect x="60.0" y="80" width="814.8" height="54" fill="#3E7FB5" stroke="#45392F" stroke-width="2"/>
<text x="467.4" y="104" text-anchor="middle" font-size="15" font-weight="900" fill="#fff" >海水（鹹水）</text><text x="467.4" y="124" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >97%</text>
<rect x="874.8" y="80" width="25.2" height="54" fill="#9FD9C9" stroke="#45392F" stroke-width="2"/>
<text x="887.4" y="160" text-anchor="end" font-size="13" font-weight="900" fill="#2E9A86" >其他 3%</text>
<path d="M874.8,134 L60,196 M900.0,134 L900,196" stroke="#6B5E52" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="60" y="198" text-anchor="start" font-size="15" font-weight="900" fill="#332B25" >② 把「其他 3%」放大來看</text>
<rect x="60.0" y="210" width="646.8" height="54" fill="#DDEFF8" stroke="#45392F" stroke-width="2"/>
<text x="383.40000000000003" y="234" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >冰雪</text><text x="383.40000000000003" y="254" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >77%</text>
<rect x="706.8" y="210" width="184.8" height="54" fill="#B79A73" stroke="#45392F" stroke-width="2"/>
<text x="799.2" y="234" text-anchor="middle" font-size="15" font-weight="900" fill="#fff" >地下水</text><text x="799.2" y="254" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >22%</text>
<rect x="891.6" y="210" width="8.4" height="54" fill="#4FB59A" stroke="#45392F" stroke-width="2"/>
<text x="900" y="290" text-anchor="end" font-size="13" font-weight="900" fill="#2E9A86" >其他 1%</text>
<path d="M891.6,264 L60,326 M900.0,264 L900,326" stroke="#6B5E52" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="60" y="328" text-anchor="start" font-size="15" font-weight="900" fill="#332B25" >③ 再放大「其他 1%」（占 3% 中的比例）</text>
<rect x="60.0" y="340" width="336.0" height="54" fill="#C9C2E6" stroke="#45392F" stroke-width="2"/>
<text x="228.0" y="373" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >鹹水湖 0.4%</text>
<rect x="396.0" y="340" width="294.0" height="54" fill="#2E9A86" stroke="#45392F" stroke-width="2"/>
<text x="543.0" y="373" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" >河川、淡水湖 0.35%</text>
<rect x="690.0" y="340" width="168.0" height="54" fill="#C9A77A" stroke="#45392F" stroke-width="2"/>
<text x="774.0" y="373" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >土壤水分 0.2%</text>
<rect x="858.0" y="340" width="42.0" height="54" fill="#E6E1D8" stroke="#45392F" stroke-width="2"/>
<text x="879.0" y="373" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >0.05%</text>
<text x="900" y="418" text-anchor="end" font-size="12" font-weight="800" fill="#6B5E52" >最右邊的小格：大氣中的水氣 0.05%</text>
<text x="480" y="440" text-anchor="middle" font-size="15" font-weight="900" fill="#E0694F" >方便直接取用的「河川、淡水湖」，只占全球水量的極小部分 → 要珍惜水資源</text>
</svg>
