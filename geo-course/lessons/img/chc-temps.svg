<text x="835" y="310" text-anchor="middle" font-size="11.5" font-weight="800" fill="#332B25" >0℃ 等溫線大致沿秦嶺—淮河</text>
<rect x="730" y="346" width="210" height="128" rx="14" fill="#fff" stroke="#9C6ADE" stroke-width="2.5"/>
<text x="835" y="374" text-anchor="middle" font-size="15.5" font-weight="900" fill="#9C6ADE" >同緯度比較</text>
<text x="835" y="402" text-anchor="middle" font-size="11.5" font-weight="800" fill="#332B25" >拉薩一月約 -5℃（地勢高）</text>
<text x="835" y="426" text-anchor="middle" font-size="11.5" font-weight="800" fill="#332B25" >上海一月約 5℃（地勢低）</text>
<text x="835" y="450" text-anchor="middle" font-size="11.5" font-weight="800" fill="#332B25" >西半部多高山高原，冬季較冷</text>
<text x="360" y="488" text-anchor="middle" font-size="12" font-weight="800" fill="#6B5E52" >（各城市月均溫為氣候平均的約略值，自繪）</text>
