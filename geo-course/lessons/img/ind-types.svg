<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="420" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >工業的類型：從手工生產到高科技</text>
<rect x="30" y="66" width="280" height="300" rx="18" fill="#FDF3DC" stroke="#45392F" stroke-width="2"/>
<text x="170" y="122" text-anchor="middle" font-size="42" font-weight="400" fill="#332B25" >🧵</text>
<rect x="95.0" y="148.9" width="150" height="34.199999999999996" rx="17.099999999999998" fill="#E0A43A" stroke="#45392F" stroke-width="2"/><text x="170" y="172.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">輕工業</text>
<text x="170" y="220" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >民生消費需要的物品</text>
<text x="170" y="248" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >工廠規模可大可小</text>
<text x="170" y="276" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >常需要大量勞力</text>
<line x1="54" y1="306" x2="286" y2="306" stroke="#45392F" stroke-dasharray="5 4" opacity=".5"/>
<text x="170" y="340" text-anchor="middle" font-size="15" font-weight="900" fill="#E0A43A" >例：衣服、食品、電器</text>
<line x1="314.0" y1="216.0" x2="328.8" y2="216.0" stroke="#6B5E52" stroke-width="5" stroke-linecap="round"/><path d="M336.0,216.0 L325.2,221.2 L325.2,210.8 Z" fill="#6B5E52"/>
<rect x="340" y="66" width="280" height="300" rx="18" fill="#FDE8E3" stroke="#45392F" stroke-width="2"/>
<text x="480" y="122" text-anchor="middle" font-size="42" font-weight="400" fill="#332B25" >🏗️</text>
<rect x="405.0" y="148.9" width="150" height="34.199999999999996" rx="17.099999999999998" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="480" y="172.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">重工業</text>
<text x="480" y="220" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >經濟發展需要的基本物資</text>
<text x="480" y="248" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >工廠規模大、投入資金多</text>
<text x="480" y="276" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >需要大型機具</text>
<line x1="364" y1="306" x2="596" y2="306" stroke="#45392F" stroke-dasharray="5 4" opacity=".5"/>
<text x="480" y="340" text-anchor="middle" font-size="15" font-weight="900" fill="#E0694F" >例：鋼鐵、機械、石化</text>
<line x1="624.0" y1="216.0" x2="638.8" y2="216.0" stroke="#6B5E52" stroke-width="5" stroke-linecap="round"/><path d="M646.0,216.0 L635.2,221.2 L635.2,210.8 Z" fill="#6B5E52"/>
<rect x="650" y="66" width="280" height="300" rx="18" fill="#E1EFF9" stroke="#45392F" stroke-width="2"/>
<text x="790" y="122" text-anchor="middle" font-size="42" font-weight="400" fill="#332B25" >💻</text>
<rect x="715.0" y="148.9" width="150" height="34.199999999999996" rx="17.099999999999998" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="790" y="172.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">高科技工業</text>
<text x="790" y="220" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >投入大量研發資金</text>
<text x="790" y="248" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >技術門檻高</text>
<text x="790" y="276" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >附加價值高</text>
<line x1="674" y1="306" x2="906" y2="306" stroke="#45392F" stroke-dasharray="5 4" opacity=".5"/>
<text x="790" y="340" text-anchor="middle" font-size="15" font-weight="900" fill="#4A90C2" >例：資訊、半導體、生物科技</text>
<text x="480" y="398" text-anchor="middle" font-size="14" font-weight="800" fill="#6B5E52" >傳統社會靠手工少量製作；近代工業興起後，工廠大量生產、成本降低，生活更富裕</text>
</svg>
