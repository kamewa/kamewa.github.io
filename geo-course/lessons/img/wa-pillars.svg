<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 375" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="375" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >伊斯蘭教的「五功」：把信仰落實在日常生活</text>
<circle cx="106" cy="150" r="62" fill="#2E9A86" stroke="#45392F" stroke-width="3"/>
<text x="106" y="172" text-anchor="middle" font-size="58" font-weight="900" fill="#fff" >念</text>
<text x="106" y="250" text-anchor="middle" font-size="19" font-weight="900" fill="#332B25" >念誦證詞</text>
<text x="106" y="280" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >宣誓信仰，成為教徒</text><text x="106" y="300" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" ></text>
<circle cx="293" cy="150" r="62" fill="#4A90C2" stroke="#45392F" stroke-width="3"/>
<text x="293" y="172" text-anchor="middle" font-size="58" font-weight="900" fill="#fff" >禮</text>
<text x="293" y="250" text-anchor="middle" font-size="19" font-weight="900" fill="#332B25" >每日禮拜</text>
<text x="293" y="280" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >每天朝向麥加禮拜五</text><text x="293" y="300" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >次</text>
<circle cx="480" cy="150" r="62" fill="#9C6ADE" stroke="#45392F" stroke-width="3"/>
<text x="480" y="172" text-anchor="middle" font-size="58" font-weight="900" fill="#fff" >齋</text>
<text x="480" y="250" text-anchor="middle" font-size="19" font-weight="900" fill="#332B25" >齋戒</text>
<text x="480" y="280" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >齋戒月日出到日落不</text><text x="480" y="300" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >進食</text>
<circle cx="667" cy="150" r="62" fill="#E0A43A" stroke="#45392F" stroke-width="3"/>
<text x="667" y="172" text-anchor="middle" font-size="58" font-weight="900" fill="#fff" >課</text>
<text x="667" y="250" text-anchor="middle" font-size="19" font-weight="900" fill="#332B25" >天課</text>
<text x="667" y="280" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >把部分所得奉獻出去</text><text x="667" y="300" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" ></text>
<circle cx="854" cy="150" r="62" fill="#E0694F" stroke="#45392F" stroke-width="3"/>
<text x="854" y="172" text-anchor="middle" font-size="58" font-weight="900" fill="#fff" >朝</text>
<text x="854" y="250" text-anchor="middle" font-size="19" font-weight="900" fill="#332B25" >朝覲</text>
<text x="854" y="280" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >能力許可，一生到麥</text><text x="854" y="300" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >加朝聖一次</text>
<text x="480" y="350" text-anchor="middle" font-size="15" font-weight="900" fill="#1F7A68" >穆斯林相信：嚴守五功、定期到清真寺禮拜，就能獲得救贖</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
