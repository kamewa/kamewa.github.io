<rect x="480" y="64" width="460" height="92" rx="14" fill="#fff" stroke="#2E9A86" stroke-width="2.5"/>
<text x="500" y="98" text-anchor="start" font-size="19" font-weight="900" fill="#2E9A86" >養殖漁業</text>
<text x="500" y="124" text-anchor="start" font-size="13.5" font-weight="800" fill="#332B25" >西南沿海平淺沙岸：魚塭養虱目魚、白蝦</text>
<text x="500" y="146" text-anchor="start" font-size="13.5" font-weight="800" fill="#332B25" >潮間帶養牡蠣；海上箱網養殖</text>
<rect x="480" y="168" width="460" height="92" rx="14" fill="#fff" stroke="#3E8E5A" stroke-width="2.5"/>
<text x="500" y="202" text-anchor="start" font-size="19" font-weight="900" fill="#3E8E5A" >沿岸漁業</text>
<text x="500" y="228" text-anchor="start" font-size="13.5" font-weight="800" fill="#332B25" >離岸 12 浬以內，以沿海港灣為基地</text>
<rect x="480" y="272" width="460" height="92" rx="14" fill="#fff" stroke="#E0A43A" stroke-width="2.5"/>
<text x="500" y="306" text-anchor="start" font-size="19" font-weight="900" fill="#E0A43A" >近海漁業</text>
<text x="500" y="332" text-anchor="start" font-size="13.5" font-weight="800" fill="#332B25" >離岸 12～200 浬</text>
<rect x="480" y="376" width="460" height="92" rx="14" fill="#fff" stroke="#E0694F" stroke-width="2.5"/>
<text x="500" y="410" text-anchor="start" font-size="19" font-weight="900" fill="#E0694F" >遠洋漁業</text>
<text x="500" y="436" text-anchor="start" font-size="13.5" font-weight="800" fill="#332B25" >200 浬以外，遠到南太平洋、印度洋、大西洋</text>
<text x="710" y="486" text-anchor="middle" font-size="13" font-weight="800" fill="#6B5E52" >捕撈漁業依離岸距離分成三種；海洋漁源減少，養殖漁業愈來愈重要</text>
