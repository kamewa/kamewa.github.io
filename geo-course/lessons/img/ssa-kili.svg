<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >吉力馬札羅山：赤道附近，山頂卻有積雪</text>
<g transform="translate(105,0) scale(0.72,1)">
<path d="M60,420 L300,300 L420,140 L470,110 L520,140 L640,300 L900,420 Z" fill="#B9A58A" stroke="#45392F" stroke-width="2.5"/>
<path d="M420,140 L470,110 L520,140 L500,160 L480,148 L460,162 L440,150 Z" fill="#fff" stroke="#9C8E80" stroke-width="1.5"/>
<path d="M60,420 L180,360 L760,360 L900,420 Z" fill="#E8D49A"/>
<path d="M180,360 L300,300 L640,300 L760,360 Z" fill="#8CBF6A"/>
<path d="M300,300 L370,210 L570,210 L640,300 Z" fill="#5E9C55"/>
<path d="M370,210 L420,140 L520,140 L570,210 Z" fill="#C9B79A"/>
