<text x="915" y="131" text-anchor="end" font-size="15" font-weight="900" fill="#1F5F8B" >❄️ 山頂：常年積雪（高地氣候）</text>
<text x="915" y="196" text-anchor="end" font-size="15" font-weight="900" fill="#6B5E52" >🪨 高山：草地、岩石</text>
<text x="915" y="266" text-anchor="end" font-size="15" font-weight="900" fill="#2E7D4F" >🌲 山腰：森林</text>
<text x="915" y="336" text-anchor="end" font-size="15" font-weight="900" fill="#5B7A2E" >🌳 山麓：莽原</text>
<text x="915" y="401" text-anchor="end" font-size="15" font-weight="900" fill="#9C6A1E" >🐘 山下：熱帶莽原，大象出沒</text>
<text x="458" y="96" text-anchor="middle" font-size="15" font-weight="900" fill="#8A3B2E" >5,895 公尺</text>
<line x1="90.0" y1="400.0" x2="90.0" y2="137.2" stroke="#B9B0A6" stroke-width="3" stroke-linecap="round"/><path d="M90.0,130.0 L95.2,140.8 L84.8,140.8 Z" fill="#B9B0A6"/><text x="104" y="140" text-anchor="start" font-size="14" font-weight="900" fill="#6B5E52" >愈高愈冷</text>
<text x="480" y="455" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >融雪是東非高原居民和動物的重要水源（「吉力馬札羅」有「白山、水山、閃亮」之意）</text>
