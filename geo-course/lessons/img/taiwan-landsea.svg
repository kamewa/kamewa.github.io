<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 465" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="960" height="465" rx="20" fill="#EAF5FB"/>
<text x="480" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >全球海陸分布：海多陸少，陸地集中在北半球</text>
<text x="70" y="92" text-anchor="start" font-size="17" font-weight="900" fill="#332B25" >全球</text>
<rect x="140" y="72" width="214" height="30" fill="#CDEAC0" stroke="#45392F" stroke-width="2"/>
<rect x="354" y="72" width="524" height="30" fill="#9FD0EA" stroke="#45392F" stroke-width="2"/>
<text x="247.01" y="93" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >陸地 29%</text><text x="616.01" y="93" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >海洋 71%</text>
<text x="888.0" y="93" text-anchor="start" font-size="15" font-weight="800" fill="#6B5E52" >≈ 3：7</text>
<text x="70" y="160" text-anchor="start" font-size="17" font-weight="900" fill="#332B25" >北半球</text>
<rect x="140" y="140" width="288" height="30" fill="#CDEAC0" stroke="#45392F" stroke-width="2"/>
<rect x="428" y="140" width="450" height="30" fill="#9FD0EA" stroke="#45392F" stroke-width="2"/>
<text x="283.90999999999997" y="161" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >陸 39%</text><text x="652.91" y="161" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >海 61%</text>
<text x="70" y="210" text-anchor="start" font-size="17" font-weight="900" fill="#332B25" >南半球</text>
<rect x="140" y="190" width="140" height="30" fill="#CDEAC0" stroke="#45392F" stroke-width="2"/>
<rect x="280" y="190" width="598" height="30" fill="#9FD0EA" stroke="#45392F" stroke-width="2"/>
<text x="210.11" y="211" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >陸 19%</text><text x="579.11" y="211" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >海 81%</text>
<text x="480" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#C0392B" >陸地多在北半球 → 人類活動的空間多 → 全球人口也集中在北半球</text>
<rect x="40" y="285" width="420" height="160" rx="14" fill="#fff" stroke="#45392F" stroke-width="2"/>
<text x="250" y="315" text-anchor="middle" font-size="17" font-weight="900" fill="#332B25" >三大洋（彼此相通）</text>
<rect x="50.0" y="329.75" width="120" height="28.5" rx="14.25" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="110" y="349.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">1 太平洋</text><text x="185" y="350" text-anchor="start" font-size="15" font-weight="700" fill="#332B25" >最大，約占海洋的一半</text>
<rect x="50.0" y="361.75" width="120" height="28.5" rx="14.25" fill="#6FB1DA" stroke="#45392F" stroke-width="2"/><text x="110" y="381.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">2 大西洋</text><text x="185" y="382" text-anchor="start" font-size="15" font-weight="700" fill="#332B25" >第二大</text>
<rect x="50.0" y="393.75" width="120" height="28.5" rx="14.25" fill="#9BC9E6" stroke="#45392F" stroke-width="2"/><text x="110" y="413.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">3 印度洋</text><text x="185" y="414" text-anchor="start" font-size="15" font-weight="700" fill="#332B25" >第三大</text>
<rect x="500" y="285" width="420" height="160" rx="14" fill="#fff" stroke="#45392F" stroke-width="2"/>
<text x="710" y="315" text-anchor="middle" font-size="17" font-weight="900" fill="#332B25" >七大洲</text>
<text x="710" y="350" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >亞洲・歐洲・非洲・北美洲</text><text x="710" y="378" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >中南美洲・大洋洲・南極洲</text>
<text x="710" y="414" text-anchor="middle" font-size="15" font-weight="900" fill="#C0392B" >最大：亞洲　最小：大洋洲</text>
<text x="710" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#6B5E52" >亞洲＋歐洲相連，合稱「歐亞大陸」（最大陸塊）</text>
</svg>
