<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="390" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >依賴石油的經濟：油價一變，國家財政就跟著變</text>
<rect x="60" y="70" width="400" height="230" rx="16" fill="#E3F2EC" stroke="#45392F" stroke-width="2"/>
<text x="260" y="112" text-anchor="middle" font-size="22" font-weight="900" fill="#2E9A86" >📈 油價上漲</text>
<text x="260" y="160" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >石油出口收入增加</text>
<line x1="260.0" y1="168.0" x2="260.0" y2="181.2" stroke="#9C8E80" stroke-width="2.5" stroke-linecap="round"/><path d="M260.0,186.0 L256.5,178.8 L263.5,178.8 Z" fill="#9C8E80"/>
<text x="260" y="202" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >政府錢變多</text>
<line x1="260.0" y1="210.0" x2="260.0" y2="223.2" stroke="#9C8E80" stroke-width="2.5" stroke-linecap="round"/><path d="M260.0,228.0 L256.5,220.8 L263.5,220.8 Z" fill="#9C8E80"/>
<text x="260" y="244" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >財政收支占 GDP 比例上升</text>
<rect x="500" y="70" width="400" height="230" rx="16" fill="#FDE8E2" stroke="#45392F" stroke-width="2"/>
<text x="700" y="112" text-anchor="middle" font-size="22" font-weight="900" fill="#E0694F" >📉 油價下跌</text>
<text x="700" y="160" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >石油出口收入減少</text>
<line x1="700.0" y1="168.0" x2="700.0" y2="181.2" stroke="#9C8E80" stroke-width="2.5" stroke-linecap="round"/><path d="M700.0,186.0 L696.5,178.8 L703.5,178.8 Z" fill="#9C8E80"/>
<text x="700" y="202" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >政府收入 &lt; 支出（赤字）</text>
<line x1="700.0" y1="210.0" x2="700.0" y2="223.2" stroke="#9C8E80" stroke-width="2.5" stroke-linecap="round"/><path d="M700.0,228.0 L696.5,220.8 L703.5,220.8 Z" fill="#9C8E80"/>
<text x="700" y="244" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >財政收支占比下降，甚至變負值</text>
<text x="480" y="340" text-anchor="middle" font-size="15" font-weight="900" fill="#6B3410" >例：沙烏地阿拉伯政府收入約七成以上來自石油</text>
<text x="480" y="368" text-anchor="middle" font-size="14" font-weight="800" fill="#6B5E52" >→ 推動「願景 2030」，發展觀光、製造與科技，想減少對石油的依賴</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
