<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="380" rx="20" fill="#FBF8F2"/>
  <text x="480" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#332B25">地中海型氣候為什麼「夏乾冬雨」？</text>
  <g transform="translate(30,60)">
    <rect width="440" height="290" rx="16" fill="#FFF6E6" stroke="#F2A343" stroke-width="2.5"/>
    <text x="220" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#8C5810">☀️ 夏季：風帶北移</text>
    <rect x="30" y="60" width="380" height="60" rx="12" fill="#BFE0EE"/><text x="220" y="97" text-anchor="middle" font-size="18" font-weight="800" fill="#2F5F78">西風帶 → 移到更北方</text>
    <rect x="30" y="135" width="380" height="70" rx="12" fill="#F7C873" stroke="#D48729" stroke-width="2.5"/><text x="220" y="167" text-anchor="middle" font-size="19" font-weight="800" fill="#6B3F0E">副熱帶高壓 籠罩地中海</text>
    <text x="220" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#6B3F0E">空氣下沉 → 晴朗少雨</text>
    <text x="220" y="250" text-anchor="middle" font-size="26" font-weight="900" fill="#C45037">夏乾</text>
  </g>
  <g transform="translate(490,60)">
    <rect width="440" height="290" rx="16" fill="#EAF3F8" stroke="#4A88A9" stroke-width="2.5"/>
    <text x="220" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#2F5F78">❄️ 冬季：風帶南移</text>
    <rect x="30" y="60" width="380" height="60" rx="12" fill="#F7E3B5"/><text x="220" y="97" text-anchor="middle" font-size="18" font-weight="800" fill="#8C5810">副熱帶高壓 → 移到更南方</text>
    <rect x="30" y="135" width="380" height="70" rx="12" fill="#9FD0EA" stroke="#376C87" stroke-width="2.5"/><text x="220" y="167" text-anchor="middle" font-size="19" font-weight="800" fill="#23394A">西風 吹到地中海</text>
    <text x="220" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#23394A">帶來海洋水氣 → 降雨</text>
    <text x="220" y="250" text-anchor="middle" font-size="26" font-weight="900" fill="#217868">冬雨</text>
  </g>
  <text x="940" y="372" text-anchor="end" font-size="11" fill="#96887D">示意圖</text>
</svg>
