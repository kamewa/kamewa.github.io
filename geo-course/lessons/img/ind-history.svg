<rect x="290.0" y="256.8" width="140" height="30.4" rx="15.2" fill="#E0A43A" stroke="#45392F" stroke-width="2"/><text x="360" y="277.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">輕工業</text>
