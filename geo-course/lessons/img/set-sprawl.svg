<circle cx="760" cy="220" r="72" fill="#F2A07B" opacity=".85"/><circle cx="860" cy="214" r="46" fill="#F2A07B" opacity=".85"/>
<circle cx="760" cy="220" r="28" fill="#E0694F"/><circle cx="860" cy="214" r="18" fill="#E0694F"/>
<line x1="670" y1="240" x2="920" y2="200" stroke="#9C6ADE" stroke-width="5"/><text x="856" y="274" text-anchor="middle" font-size="13" font-weight="900" fill="#9C6ADE" >捷運</text>
<text x="790" y="340" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >和鄰近都市界線模糊，連成一體</text>
<circle cx="320" cy="396" r="8" fill="#BF3B30"/><text x="334" y="401" text-anchor="start" font-size="13.5" font-weight="800" fill="#332B25" >市中心</text>
<circle cx="430" cy="396" r="8" fill="#F2A07B"/><text x="444" y="401" text-anchor="start" font-size="13.5" font-weight="800" fill="#332B25" >擴張的市區、郊區</text>
<text x="480" y="430" text-anchor="middle" font-size="14" font-weight="800" fill="#6B5E52" >例：臺中市都市化區域從 1980 年到 2021 年大幅擴大；臺北市民搬到桃園，每天通勤</text>
