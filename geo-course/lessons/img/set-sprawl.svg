<line x1="624.0" y1="214.0" x2="638.8" y2="214.0" stroke="#6B5E52" stroke-width="5" stroke-linecap="round"/><path d="M646.0,214.0 L635.2,219.2 L635.2,208.8 Z" fill="#6B5E52"/>
