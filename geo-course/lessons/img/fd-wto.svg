<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 398" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="398" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >民國 91 年加入世界貿易組織（WTO）之後</text>
<rect x="40" y="62" width="880" height="70" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="480" y="92" text-anchor="middle" font-size="15.5" font-weight="900" fill="#332B25" >WTO：追求自由貿易，降低關稅與非關稅障礙（如進口配額）</text>
<text x="480" y="118" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >貨品物美價廉，但各產業也面臨更大的國際競爭</text>
<rect x="40" y="152" width="280" height="200" rx="14" fill="#fff" stroke="#4A90C2" stroke-width="2.2"/>
<text x="180.0" y="196" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >🍔</text><text x="180.0" y="234" text-anchor="middle" font-size="16" font-weight="900" fill="#4A90C2" >飲食西化</text>
<text x="180.0" y="264" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >進口農產品變多</text>
<text x="180.0" y="288" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >選擇多元</text>
<text x="180.0" y="312" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >改變國人飲食習慣</text>
<rect x="340" y="152" width="280" height="200" rx="14" fill="#fff" stroke="#3E8E5A" stroke-width="2.2"/>
<text x="480.0" y="196" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >💎</text><text x="480.0" y="234" text-anchor="middle" font-size="16" font-weight="900" fill="#3E8E5A" >精緻農業</text>
<text x="480.0" y="264" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >發展高品質農產品</text>
<text x="480.0" y="288" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >提高附加價值</text>
<rect x="640" y="152" width="280" height="200" rx="14" fill="#fff" stroke="#9C6ADE" stroke-width="2.2"/>
<text x="780.0" y="196" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >🌸</text><text x="780.0" y="234" text-anchor="middle" font-size="16" font-weight="900" fill="#9C6ADE" >推廣外銷</text>
<text x="780.0" y="264" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >例：蘭花</text>
<text x="780.0" y="288" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >改良品種、客製化顏色</text>
<text x="480" y="380" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >（自繪）</text>
</svg>
