<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="490" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >人口增加率＝自然增加率＋社會增加率</text>
<rect x="330" y="70" width="300" height="92" rx="14" fill="#FDF3DC" stroke="#45392F" stroke-width="1.8"/>
<text x="480.0" y="104" text-anchor="middle" font-size="19" font-weight="900" fill="#6B4E2E" >人口增加率</text>
<text x="480.0" y="136" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >＞0 正成長；＜0 負成長</text>
<line x1="420.0" y1="166.0" x2="258.0" y2="217.5" stroke="#6B5E52" stroke-width="4" stroke-linecap="round"/><path d="M250.0,220.0 L260.2,210.4 L263.9,222.0 Z" fill="#6B5E52"/><line x1="540.0" y1="166.0" x2="702.0" y2="217.5" stroke="#6B5E52" stroke-width="4" stroke-linecap="round"/><path d="M710.0,220.0 L696.1,222.0 L699.8,210.4 Z" fill="#6B5E52"/>
<rect x="60" y="226" width="380" height="150" rx="14" fill="#E3F4E5" stroke="#45392F" stroke-width="1.8"/>
<text x="250.0" y="260" text-anchor="middle" font-size="19" font-weight="900" fill="#3E8E5A" >自然增加率</text>
<text x="250.0" y="292" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >＝ 出生率 － 死亡率</text>
<text x="250.0" y="316" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >（一年內出生、死亡的人數</text>
<text x="250.0" y="340" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >　 占總人口的千分比 ‰）</text>
<rect x="520" y="226" width="380" height="150" rx="14" fill="#E1EFF9" stroke="#45392F" stroke-width="1.8"/>
<text x="710.0" y="260" text-anchor="middle" font-size="19" font-weight="900" fill="#4A90C2" >社會增加率</text>
<text x="710.0" y="292" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >＝ 移入率 － 移出率</text>
<text x="710.0" y="316" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >（一年內遷入、遷出的人數</text>
<text x="710.0" y="340" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >　 占總人口的千分比 ‰）</text>
<text x="160" y="430" text-anchor="middle" font-size="34">👶</text><text x="160" y="462" text-anchor="middle" font-size="16" font-weight="900" fill="#3E8E5A" >出生</text>
<text x="340" y="430" text-anchor="middle" font-size="34">🕯️</text><text x="340" y="462" text-anchor="middle" font-size="16" font-weight="900" fill="#3E8E5A" >死亡</text>
<text x="620" y="430" text-anchor="middle" font-size="34">🧳</text><text x="620" y="462" text-anchor="middle" font-size="16" font-weight="900" fill="#4A90C2" >移入</text>
<text x="800" y="430" text-anchor="middle" font-size="34">🚚</text><text x="800" y="462" text-anchor="middle" font-size="16" font-weight="900" fill="#4A90C2" >移出</text>
</svg>
