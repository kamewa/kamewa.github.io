<text x="480" y="344" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >卡那卡那富族語：楠梓仙溪　｜　布農族語：愈來愈好</text>
<text x="480" y="374" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >臺灣有 55 個原住民族地區鄉鎮市區，很多名稱和原住民族語言文化沒有關聯 → 近年推動正名</text>
<text x="480" y="418" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >（改寫自高雄市那瑪夏區公所〈歷史沿革〉，自繪）</text>
