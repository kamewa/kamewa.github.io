<text x="832" y="210" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >鄉民多次討論後正名</text><text x="832" y="232" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >（今高雄市那瑪夏區）</text>
