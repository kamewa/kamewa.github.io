<text x="600" y="210" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >村名改為民族、民權、民生</text><text x="600" y="232" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >政治意涵濃厚</text>
