<rect x="370" y="318" width="220" height="44" rx="22" fill="#2F6F8F"/><text x="480" y="346" text-anchor="middle" font-size="15" font-weight="900" fill="#fff" >臺北捷運 景美站</text>
<rect x="650" y="318" width="220" height="44" rx="22" fill="#2F6F8F"/><text x="760" y="346" text-anchor="middle" font-size="15" font-weight="900" fill="#fff" >高雄捷運 凹子底站</text>
