<rect x="720.0" y="85.75" width="120" height="28.5" rx="14.25" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="780" y="105.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">雅化</text><text x="780" y="168" text-anchor="middle" font-size="34" font-weight="900" fill="#E0694F" >山佳</text><text x="780" y="214" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >改成更文雅的字</text>
<rect x="60" y="264" width="840" height="120" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="480" y="296" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >🔊 搭車時聽聽看：國語念字面，閩南語、客家語可能保留傳統念法</text>
