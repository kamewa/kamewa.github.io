<text x="245" y="448" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >交通路線把大小聚落串聯起來</text>
<rect x="575" y="80" width="270" height="108" rx="14" fill="#E0694F" opacity=".9"/>
<text x="710" y="114" text-anchor="middle" font-size="19" font-weight="900" fill="#fff" >大都市（數量最少）</text>
<text x="710" y="146" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >百貨公司、醫學中心、大學</text>
<text x="710" y="172" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" >服務範圍最大</text>
<rect x="530" y="206" width="360" height="108" rx="14" fill="#E0A43A" opacity=".9"/>
<text x="710" y="240" text-anchor="middle" font-size="19" font-weight="900" fill="#fff" >中型都市（數量較多）</text>
<text x="710" y="272" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >購物中心、地區醫院、高中</text>
<text x="710" y="298" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" >服務範圍中等</text>
<rect x="485" y="332" width="450" height="108" rx="14" fill="#9CCB86" opacity=".9"/>
<text x="710" y="366" text-anchor="middle" font-size="19" font-weight="900" fill="#fff" >小城鎮、鄉村（數量最多）</text>
<text x="710" y="398" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >商店街、診所、小學</text>
<text x="710" y="424" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" >只賣生活必需品</text>
<text x="480" y="494" text-anchor="middle" font-size="14" font-weight="800" fill="#6B5E52" >例：小城鎮居民要買手機、看大醫院，常要到附近的大都市</text>
