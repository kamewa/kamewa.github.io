<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 422" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="422" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >為什麼會出現基因改造作物？</text>
<rect x="24" y="64" width="214" height="200" rx="14" fill="#fff" stroke="#E0A43A" stroke-width="2.2"/>
<text x="131.0" y="108" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >⚠️</text><text x="131.0" y="146" text-anchor="middle" font-size="16" font-weight="900" fill="#E0A43A" >農業面臨的問題</text>
<text x="131.0" y="176" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >單一作物易出現病蟲害</text>
<text x="131.0" y="200" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >氣候變遷影響產量</text>
<line x1="240.0" y1="164.0" x2="250.6" y2="164.0" stroke="#6B5E52" stroke-width="4" stroke-linecap="round"/><path d="M256.0,164.0 L247.9,167.9 L247.9,160.1 Z" fill="#6B5E52"/>
<rect x="258" y="64" width="214" height="200" rx="14" fill="#fff" stroke="#4A90C2" stroke-width="2.2"/>
<text x="365.0" y="108" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >🧬</text><text x="365.0" y="146" text-anchor="middle" font-size="16" font-weight="900" fill="#4A90C2" >科學家改造基因</text>
<text x="365.0" y="176" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >把其他生物的基因</text>
<text x="365.0" y="200" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >轉移到作物中</text>
<line x1="474.0" y1="164.0" x2="484.6" y2="164.0" stroke="#6B5E52" stroke-width="4" stroke-linecap="round"/><path d="M490.0,164.0 L481.9,167.9 L481.9,160.1 Z" fill="#6B5E52"/>
<rect x="492" y="64" width="214" height="200" rx="14" fill="#fff" stroke="#3E8E5A" stroke-width="2.2"/>
<text x="599.0" y="108" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >🌽</text><text x="599.0" y="146" text-anchor="middle" font-size="16" font-weight="900" fill="#3E8E5A" >基改作物的特性</text>
<text x="599.0" y="176" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >抗病蟲害、抗除草劑</text>
<text x="599.0" y="200" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >耐極端天氣、提高產量</text>
<line x1="708.0" y1="164.0" x2="718.6" y2="164.0" stroke="#6B5E52" stroke-width="4" stroke-linecap="round"/><path d="M724.0,164.0 L715.9,167.9 L715.9,160.1 Z" fill="#6B5E52"/>
<rect x="726" y="64" width="214" height="200" rx="14" fill="#fff" stroke="#E0694F" stroke-width="2.2"/>
<text x="833.0" y="108" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >❓</text><text x="833.0" y="146" text-anchor="middle" font-size="16" font-weight="900" fill="#E0694F" >引起的疑慮</text>
<text x="833.0" y="176" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >喪失生物多樣性</text>
<text x="833.0" y="200" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >生態失衡、新病毒</text>
<rect x="24" y="284" width="912" height="96" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="480" y="314" text-anchor="middle" font-size="16" font-weight="900" fill="#E0694F" >臺灣：尚未核准任何基改作物在國內種植</text>
<text x="480" y="344" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >經審查後可進口部分飼料用、食品用基改作物：黃豆、玉米、棉花、油菜、甜菜</text>
<text x="480" y="368" text-anchor="middle" font-size="13" font-weight="800" fill="#6B5E52" >主要商品化種植國：美國、阿根廷、巴西</text>
<text x="480" y="404" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >（自繪）</text>
</svg>
