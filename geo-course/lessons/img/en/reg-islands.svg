<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="385" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="16.9" font-weight="800" fill="#332B25" >Features and challenges of outlying islands</text>
<rect x="24" y="64" width="215" height="270" rx="18" fill="#fff" stroke="#4A90C2" stroke-width="2.5"/>
<text x="131" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >✈️</text><rect x="66.0" y="144.9" width="130" height="34.199999999999996" rx="17.099999999999998" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="131" y="168.3" text-anchor="middle" font-size="16.9" font-weight="800" fill="#fff">Transportation</text>
<text x="131" y="214" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Rely on air and sea</text>
<text x="131" y="246" text-anchor="middle" font-size="11.1" font-weight="800" fill="#332B25" >Fog and waves stop flights and ferries</text>
<text x="131" y="278" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Affects supplies and travel</text>
<rect x="257" y="64" width="215" height="270" rx="18" fill="#fff" stroke="#E0694F" stroke-width="2.5"/>
<text x="364" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🚁</text><rect x="299.0" y="144.9" width="130" height="34.199999999999996" rx="17.099999999999998" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="364" y="168.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">Health care</text>
<text x="364" y="214" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >No large hospitals</text>
<text x="364" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Emergencies fly</text>
<text x="364" y="278" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >to the main island</text>
<rect x="490" y="64" width="215" height="270" rx="18" fill="#fff" stroke="#2E9A86" stroke-width="2.5"/>
<text x="597" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >💧</text><rect x="532.0" y="144.9" width="130" height="34.199999999999996" rx="17.099999999999998" fill="#2E9A86" stroke="#45392F" stroke-width="2"/><text x="597" y="168.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">Water</text>
<text x="597" y="214" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Flat land</text>
<text x="597" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >cannot catch moisture</text>
<text x="597" y="278" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Water is scarce</text>
<rect x="723" y="64" width="215" height="270" rx="18" fill="#fff" stroke="#3E8E5A" stroke-width="2.5"/>
<text x="830" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🐟</text><rect x="765.0" y="144.9" width="130" height="34.199999999999996" rx="17.099999999999998" fill="#3E8E5A" stroke="#45392F" stroke-width="2"/><text x="830" y="168.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">Industry</text>
<text x="830" y="214" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Rich ocean resources</text>
<text x="830" y="246" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Fishing and tourism</text>
<text x="830" y="278" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >e.g. Matsu’s “blue tears”</text>
<text x="480" y="366" text-anchor="middle" font-size="14" font-weight="800" fill="#6B5E52" >Islands like Kinmen, Matsu, Penghu, Orchid, and Green Island have poor transport, fewer people, and different industries</text>
</svg>
