  <g font-weight="800" font-size="16" text-anchor="middle">
    <rect x="140" y="150" width="130" height="32" rx="16" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="205" y="172" fill="#fff" style="font-size:95%">Western Plateau</text>
