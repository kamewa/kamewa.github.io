<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 405" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="405" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="17.9" font-weight="800" fill="#332B25" >Reading road numbers: national, provincial, and county roads</text>
<rect x="30" y="64" width="280" height="290" rx="18" fill="#fff" stroke="#45392F" stroke-width="2"/>
<path d="M136,94 L204,94 L204,134 Q204,158 170,168 Q136,158 136,134 Z" fill="#2E7D4F" stroke="#fff" stroke-width="3"/><text x="170" y="142" text-anchor="middle" font-size="30" font-weight="900" fill="#fff" >1</text>
<text x="170" y="212" text-anchor="middle" font-size="21" font-weight="900" fill="#3E8E5A" >National freeway</text>
<text x="170" y="252" text-anchor="middle" font-size="14.0" font-weight="800" fill="#332B25" >North–south: odd numbers, west to east</text>
<text x="170" y="282" text-anchor="middle" font-size="13.7" font-weight="800" fill="#332B25" >East–west: even numbers, north to south</text>
<text x="170" y="312" text-anchor="middle" font-size="14.5" font-weight="800" fill="#332B25" >e.g. National Freeway 1</text>
<rect x="340" y="64" width="280" height="290" rx="18" fill="#fff" stroke="#45392F" stroke-width="2"/>
<path d="M448,98 L512,98 L512,138 L480,166 L448,138 Z" fill="#fff" stroke="#2F5DA8" stroke-width="4"/><text x="480" y="140" text-anchor="middle" font-size="28" font-weight="900" fill="#2F5DA8" >9</text>
<text x="480" y="212" text-anchor="middle" font-size="21" font-weight="900" fill="#4A90C2" >Provincial highway</text>
<text x="480" y="252" text-anchor="middle" font-size="14.5" font-weight="800" fill="#332B25" >Numbered 1–99</text>
<text x="480" y="282" text-anchor="middle" font-size="14.5" font-weight="800" fill="#332B25" >Also odd north–south, even east–west</text>
<text x="480" y="312" text-anchor="middle" font-size="14.5" font-weight="800" fill="#332B25" >e.g. Highway 9 (Suhua, Huatung)</text>
<rect x="650" y="64" width="280" height="290" rx="18" fill="#fff" stroke="#45392F" stroke-width="2"/>
<rect x="750" y="100" width="80" height="56" rx="8" fill="#fff" stroke="#45392F" stroke-width="3"/><text x="790" y="139" text-anchor="middle" font-size="28" font-weight="900" fill="#332B25" >119</text>
<text x="790" y="212" text-anchor="middle" font-size="21" font-weight="900" fill="#332B25" >County / city road</text>
<text x="790" y="252" text-anchor="middle" font-size="14.5" font-weight="800" fill="#332B25" >Numbers start from 101</text>
<text x="790" y="282" text-anchor="middle" font-size="14.5" font-weight="800" fill="#332B25" >Link towns to main roads</text>
<text x="790" y="312" text-anchor="middle" font-size="14.5" font-weight="800" fill="#332B25" >e.g. County Road 119</text>
<text x="480" y="386" text-anchor="middle" font-size="13" font-weight="800" fill="#6B5E52" >Source: Highway Bureau numbering rules (signs drawn for this lesson)</text>
</svg>
