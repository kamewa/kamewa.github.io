<text x="552" y="100" text-anchor="start" font-size="17" font-weight="900" fill="#332B25" >North: headland-and-bay coast</text><text x="552" y="122" text-anchor="start" font-size="13" font-weight="800" fill="#6B5E52" >Tamsui River mouth – Sandiao Cape</text>
<text x="552" y="142" text-anchor="start" font-size="8.5" font-weight="700" fill="#332B25" >Headlands and bays, many good harbors → fishing, shipping, tourism (Yehliu, Keelung Port)</text>
<rect x="520" y="160" width="20" height="20" rx="4" fill="#E0A43A" stroke="#45392F" stroke-width="1.5"/>
<text x="552" y="178" text-anchor="start" font-size="17" font-weight="900" fill="#332B25" >West: sandy coast</text><text x="552" y="200" text-anchor="start" font-size="12.8" font-weight="800" fill="#6B5E52" >Tamsui River mouth – Fenggang (also Sandiao Cape – Su’ao)</text>
<text x="552" y="220" text-anchor="start" font-size="11.6" font-weight="700" fill="#332B25" >Wide beaches, gentle slopes, sandbars and lagoons → aquaculture</text>
<rect x="520" y="238" width="20" height="20" rx="4" fill="#2E9A86" stroke="#45392F" stroke-width="1.5"/>
<text x="552" y="256" text-anchor="start" font-size="17" font-weight="900" fill="#332B25" >South: coral reef coast</text><text x="552" y="278" text-anchor="start" font-size="13" font-weight="800" fill="#6B5E52" >Fenggang – Xuhai</text>
<text x="552" y="298" text-anchor="start" font-size="12.5" font-weight="700" fill="#332B25" >Rough reef rocks with strange shapes → tourism (Kenting)</text>
<rect x="520" y="316" width="20" height="20" rx="4" fill="#E0694F" stroke="#45392F" stroke-width="1.5"/>
<text x="552" y="334" text-anchor="start" font-size="17" font-weight="900" fill="#332B25" >East: fault coast</text><text x="552" y="356" text-anchor="start" font-size="13" font-weight="800" fill="#6B5E52" >Su’ao – Xuhai</text>
<text x="552" y="376" text-anchor="start" font-size="12.5" font-weight="700" fill="#332B25" >Faces the Pacific, steep cliffs, few harbors (Qingshui Cliffs)</text>
