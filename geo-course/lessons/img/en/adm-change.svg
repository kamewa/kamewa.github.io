<text x="430" y="292" text-anchor="middle" font-size="16" font-weight="900" fill="#E0694F" >Songshan</text>
<text x="560" y="292" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >Japanese rule: looked like Matsuyama in Japan</text>
<rect x="40" y="316" width="880" height="44" rx="10" fill="#fff" stroke="#45392F" stroke-width="1.2"/>
