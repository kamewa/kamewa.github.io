<text x="430" y="504" text-anchor="middle" font-size="16" font-weight="900" fill="#4A90C2" >Keelung</text>
<text x="560" y="504" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >Made more elegant</text>
<rect x="40" y="528" width="880" height="44" rx="10" fill="#fff" stroke="#45392F" stroke-width="1.2"/>
<text x="150" y="556" text-anchor="middle" font-size="15" font-weight="900" fill="#6B5E52" >Pinglinwei</text>
<line x1="258.0" y1="550.0" x2="312.0" y2="550.0" stroke="#4A90C2" stroke-width="4" stroke-linecap="round"/><path d="M318.0,550.0 L309.0,554.3 L309.0,545.7 Z" fill="#4A90C2"/>
<text x="430" y="556" text-anchor="middle" font-size="16" font-weight="900" fill="#4A90C2" >Pinglin</text>
<text x="560" y="556" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >Japanese rule: three characters cut to two</text>
<rect x="40" y="592" width="880" height="60" rx="12" fill="#FFF8E7" stroke="#45392F" stroke-width="1.2"/>
<text x="480" y="618" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >After the war, names like Ren’ai, Xinyi, Zhongshan, and Sanmin were added to show moral teaching and political ideas</text>
<text x="480" y="640" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >Many names are still used from the Zheng or Qing periods, e.g. Xinying, Toufen</text>
</svg>
