<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="432" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >Changing the world with food: palm oil is everywhere</text>
<rect x="40" y="64" width="280" height="220" rx="14" fill="#fff" stroke="#E0A43A" stroke-width="2.2"/>
<text x="180.0" y="108" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >🍪</text><text x="180.0" y="146" text-anchor="middle" font-size="16" font-weight="900" fill="#E0A43A" >Used everywhere</text>
<text x="180.0" y="176" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >Snacks, cookies, noodles, ice cream</text>
<text x="180.0" y="200" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >Shampoo, cleaners, cosmetics</text>
<text x="180.0" y="224" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >May be labeled “vegetable oil”</text>
<rect x="340" y="64" width="280" height="220" rx="14" fill="#fff" stroke="#E0694F" stroke-width="2.2"/>
<text x="480.0" y="108" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >🌴</text><text x="480.0" y="146" text-anchor="middle" font-size="16" font-weight="900" fill="#E0694F" >Rainforest loss</text>
<text x="480.0" y="176" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >Indonesia, 2009–2011</text>
<text x="480.0" y="200" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >About 300,000 ha of forest cleared</text>
<text x="480.0" y="224" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >≈ 11 Taipeis</text>
<rect x="640" y="64" width="280" height="220" rx="14" fill="#fff" stroke="#8A5A2B" stroke-width="2.2"/>
<text x="780.0" y="108" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >🦧</text><text x="780.0" y="146" text-anchor="middle" font-size="16" font-weight="900" fill="#8A5A2B" >Wildlife harmed</text>
<text x="780.0" y="176" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >Over 50,000 orangutans</text>
<text x="780.0" y="200" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >died in 20 years from palm plantations</text>
<text x="780.0" y="224" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >Soil erosion, water and air pollution</text>
<rect x="40" y="304" width="880" height="86" rx="14" fill="#E3F4E5" stroke="#3E8E5A" stroke-width="2"/>
<text x="480" y="336" text-anchor="middle" font-size="15.5" font-weight="900" fill="#3E8E5A" >✅ Shoppers can choose products with labels such as “RSPO sustainable palm oil”</text>
<text x="480" y="366" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >Buyers’ choices push producers to care for the environment</text>
<text x="480" y="414" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >(Rewritten from One Green Planet, “Why You Should Avoid Palm Oil,” original drawing)</text>
</svg>
