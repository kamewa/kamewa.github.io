<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="960" height="380" rx="20" fill="#F2F8FC"/>
  <text x="480" y="38" text-anchor="middle" font-size="21.3" font-weight="800" fill="#332B25">Three landforms made by glaciers</text>
  <!-- panel 1: V to U -->
  <g transform="translate(30,60)">
    <rect width="280" height="250" rx="16" fill="#fff" stroke="#E2D3BF" stroke-width="2.5"/>
    <path d="M20,60 L80,60 C95,150 185,150 200,60 L260,60 L260,200 L20,200 Z" fill="#B9A182" stroke="#45392F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M80,60 C95,150 185,150 200,60 Z" fill="#DDF1FA" stroke="#7FA8BF" stroke-width="2"/>
    <path d="M110,95 l60,0 M100,78 l80,0" stroke="#7FA8BF" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="140" y="232" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25">① U-shaped valley</text>
    <text x="140" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#6B5E54">Carved by a glacier; wide, flat floor</text>
  </g>
  <!-- panel 2: fjord -->
  <g transform="translate(340,60)">
    <rect width="280" height="250" rx="16" fill="#fff" stroke="#E2D3BF" stroke-width="2.5"/>
    <path d="M20,60 L80,60 C95,150 185,150 200,60 L260,60 L260,200 L20,200 Z" fill="#B9A182" stroke="#45392F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M86,92 C110,150 170,150 194,92 Z" fill="#4A88A9" opacity=".85"/>
    <path d="M86,92 L194,92" stroke="#2F5F78" stroke-width="2"/>
    <text x="140" y="232" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25">② Fjord</text>
    <text x="140" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#6B5E54">Glacier melts, sea fills the valley</text>
  </g>
  <!-- panel 3: lake -->
  <g transform="translate(650,60)">
    <rect width="280" height="250" rx="16" fill="#fff" stroke="#E2D3BF" stroke-width="2.5"/>
    <path d="M20,90 C70,85 90,120 140,120 C190,120 210,85 260,90 L260,200 L20,200 Z" fill="#9CCB7A" stroke="#45392F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M75,105 C100,135 180,135 205,105 C170,112 110,112 75,105 Z" fill="#6FB6DA" stroke="#2F5F78" stroke-width="2"/>
    <text x="140" y="232" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25">③ Glacial lake</text>
    <text x="140" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="#6B5E54">Water fills low places</text>
  </g>
  <text x="480" y="352" text-anchor="middle" font-size="16" font-weight="700" fill="#6B5E54">Scandinavia has many fjords; Finland is the “land of a thousand lakes”</text>
  <text x="940" y="372" text-anchor="end" font-size="11" fill="#96887D">Diagram</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
