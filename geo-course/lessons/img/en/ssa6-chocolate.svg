<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 495" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="495" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="19.4" font-weight="800" fill="#332B25" >How much of a chocolate bar’s price goes to cocoa farmers?</text>
<text x="60" y="82" text-anchor="start" font-size="16" font-weight="900" fill="#332B25" >Cocoa bean producers, 2023</text>
<rect x="60.0" y="96" width="352.8" height="46" fill="#8A5A2B" stroke="#fff" stroke-width="2"/>
<text x="236.4" y="118" text-anchor="middle" font-size="13" font-weight="900" fill="#fff" >Côte d’Ivoire</text><text x="236.4" y="136" text-anchor="middle" font-size="12" font-weight="900" fill="#fff" >42%</text>
<rect x="412.8" y="96" width="100.8" height="46" fill="#8A5A2B" stroke="#fff" stroke-width="2"/>
<text x="463.2" y="118" text-anchor="middle" font-size="13" font-weight="900" fill="#fff" >Ghana</text><text x="463.2" y="136" text-anchor="middle" font-size="12" font-weight="900" fill="#fff" >12%</text>
<rect x="513.6" y="96" width="100.8" height="46" fill="#D9C8B0" stroke="#fff" stroke-width="2"/>
<text x="564.0" y="118" text-anchor="middle" font-size="13" font-weight="900" fill="#332B25" >Indonesia</text><text x="564.0" y="136" text-anchor="middle" font-size="12" font-weight="900" fill="#332B25" >12%</text>
<rect x="614.4" y="96" width="58.8" height="46" fill="#D9C8B0" stroke="#fff" stroke-width="2"/>
<text x="643.8" y="118" text-anchor="middle" font-size="11.6" font-weight="900" fill="#332B25" >Ecuador</text><text x="643.8" y="136" text-anchor="middle" font-size="12" font-weight="900" fill="#332B25" >7%</text>
<rect x="673.2" y="96" width="42.0" height="46" fill="#D9C8B0" stroke="#fff" stroke-width="2"/>
<rect x="715.2" y="96" width="42.0" height="46" fill="#8A5A2B" stroke="#fff" stroke-width="2"/>
<rect x="757.2" y="96" width="42.0" height="46" fill="#8A5A2B" stroke="#fff" stroke-width="2"/>
<rect x="799.2" y="96" width="100.8" height="46" fill="#D9C8B0" stroke="#fff" stroke-width="2"/>
<text x="849.5999999999999" y="118" text-anchor="middle" font-size="13" font-weight="900" fill="#332B25" >Others</text><text x="849.5999999999999" y="136" text-anchor="middle" font-size="12" font-weight="900" fill="#332B25" >12%</text>
<text x="900" y="162" text-anchor="end" font-size="12.5" font-weight="800" fill="#6B5E52" >Cameroon, Nigeria about 5% each | dark = West African countries (about 64% in total)</text>
<text x="60" y="210" text-anchor="start" font-size="13.6" font-weight="900" fill="#332B25" >How chocolate profits are shared</text>
<text x="210" y="250" text-anchor="end" font-size="15" font-weight="900" fill="#332B25" >Retailers</text>
<rect x="225" y="232" width="629" height="26" rx="5" fill="#9C8E80" stroke="#45392F" stroke-width="1.2"/>
<text x="863.6222222222223" y="250" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >44.2%</text>
<text x="210" y="288" text-anchor="end" font-size="15" font-weight="900" fill="#332B25" >Chocolate makers</text>
<rect x="225" y="270" width="501" height="26" rx="5" fill="#B9A58A" stroke="#45392F" stroke-width="1.2"/>
<text x="735.6222222222223" y="288" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >35.2%</text>
<text x="210" y="326" text-anchor="end" font-size="15" font-weight="900" fill="#332B25" >Processors (grinding)</text>
<rect x="225" y="308" width="108" height="26" rx="5" fill="#C9B79A" stroke="#45392F" stroke-width="1.2"/>
<text x="343.0888888888889" y="326" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >7.6%</text>
<text x="210" y="364" text-anchor="end" font-size="15" font-weight="900" fill="#B03A2E" >Cocoa farmers</text>
<rect x="225" y="346" width="94" height="26" rx="5" fill="#E0694F" stroke="#45392F" stroke-width="1.2"/>
<text x="328.8666666666667" y="364" text-anchor="start" font-size="14" font-weight="900" fill="#B03A2E" >6.6%</text>
<text x="210" y="402" text-anchor="end" font-size="15" font-weight="900" fill="#332B25" >Tariffs and marketing</text>
<rect x="225" y="384" width="61" height="26" rx="5" fill="#D9C8B0" stroke="#45392F" stroke-width="1.2"/>
<text x="296.15555555555557" y="402" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >4.3%</text>
<text x="210" y="440" text-anchor="end" font-size="15" font-weight="900" fill="#332B25" >Transport and trade</text>
<rect x="225" y="422" width="30" height="26" rx="5" fill="#E6E1D8" stroke="#45392F" stroke-width="1.2"/>
<text x="264.8666666666667" y="440" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >2.1%</text>
<text x="480" y="478" text-anchor="middle" font-size="12.5" font-weight="900" fill="#6B3410" >Cocoa farmers who do the hard work get only about 6.6% → they often use child labor, and children cannot go to school (from textbook charts)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
