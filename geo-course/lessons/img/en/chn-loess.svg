<text x="715" y="276" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Since 2000: farmland back to forest and grass</text>
<text x="715" y="310" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Trees planted, land left to recover</text>
<text x="715" y="344" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Soil holds water and nutrients → more green</text>
<text x="715" y="378" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Less sediment, cleaner Yellow River</text>
