<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="440" rx="20" fill="#EAF5FB"/>
<text x="480" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >Ice Age and today: the Taiwan Strait was once land</text>
<rect x="40" y="70" width="420" height="300" rx="14" fill="#BFE3F2" stroke="#45392F" stroke-width="2.5"/>
<path d="M40,70 L190,70 C180,130 205,190 180,250 C165,300 140,340 100,370 L40,370 Z" fill="#CDEAC0" stroke="#45392F" stroke-width="2"/>
<path d="M325,150 C340,160 345,190 338,225 C332,255 318,285 302,300 C292,275 285,245 288,215 C292,185 305,158 325,150 Z" fill="#F6D776" stroke="#45392F" stroke-width="2.5"/>
<path d="M185,120 C230,130 280,150 320,160 L295,300 C250,300 200,290 160,280 C180,230 190,170 185,120 Z" fill="#E7D9A8" stroke="#8C7B6A" stroke-width="2" stroke-dasharray="6 4"/>
<text x="235" y="262" text-anchor="middle" font-size="15" font-weight="900" fill="#6B5E52" >Land bridge</text>
<path d="M135,200 L275,200" stroke="#E0694F" stroke-width="4" marker-end="url(#am)"/>
<text x="205" y="188" text-anchor="middle" font-size="14" font-weight="900" fill="#C0392B" >Species move in</text>
<text x="115" y="110" text-anchor="middle" font-size="15" font-weight="900" fill="#3E6B33" >Asian continent</text>
<text x="325" y="140" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >Taiwan</text>
<text x="250" y="395" text-anchor="middle" font-size="18" font-weight="900" fill="#332B25" >Ice Age</text>
<text x="250" y="420" text-anchor="middle" font-size="12.7" font-weight="800" fill="#6B5E52" >Sea level dropped; Taiwan joined to the Asian continent</text>
<rect x="500" y="70" width="420" height="300" rx="14" fill="#BFE3F2" stroke="#45392F" stroke-width="2.5"/>
<path d="M500,70 L650,70 C640,130 665,190 640,250 C625,300 600,340 560,370 L500,370 Z" fill="#CDEAC0" stroke="#45392F" stroke-width="2"/>
<path d="M785,150 C800,160 805,190 798,225 C792,255 778,285 762,300 C752,275 745,245 748,215 C752,185 765,158 785,150 Z" fill="#F6D776" stroke="#45392F" stroke-width="2.5"/>
<text x="700" y="222" text-anchor="middle" font-size="16" font-weight="900" fill="#1F5F8B" >Taiwan Strait</text>
<text x="770" y="330" text-anchor="middle" font-size="14.4" font-weight="900" fill="#C0392B" >Changed on their own → endemic species</text>
<text x="575" y="110" text-anchor="middle" font-size="15" font-weight="900" fill="#3E6B33" >Asian continent</text>
<text x="785" y="140" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >Taiwan</text>
<text x="710" y="395" text-anchor="middle" font-size="18" font-weight="900" fill="#332B25" >After the Ice Age</text>
<text x="710" y="420" text-anchor="middle" font-size="14" font-weight="800" fill="#6B5E52" >Sea level rose; the Taiwan Strait cut Taiwan off</text>
<defs><marker id="am" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E0694F"/></marker></defs>
<text x="480" y="222" text-anchor="middle" font-size="34" font-weight="900" fill="#6B5E52" >→</text>
