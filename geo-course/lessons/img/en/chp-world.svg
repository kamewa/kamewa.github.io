<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 458" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="458" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >Most populous countries, 2024 (approximate)</text>
<text x="150" y="92" text-anchor="end" font-size="16" font-weight="900" fill="#332B25" >India</text>
<rect x="166" y="66" width="619.1" height="36" rx="8" fill="#E0A43A"/><text x="793.0933333333334" y="91" text-anchor="start" font-size="14.5" font-weight="900" fill="#E0A43A" >≈1.45 B</text>
<text x="150" y="144" text-anchor="end" font-size="16" font-weight="900" fill="#332B25" >China</text>
<rect x="166" y="118" width="605.4" height="36" rx="8" fill="#E0694F"/><text x="779.4399999999999" y="143" text-anchor="start" font-size="14.5" font-weight="900" fill="#E0694F" >≈1.42 B</text>
<text x="150" y="196" text-anchor="end" font-size="16" font-weight="900" fill="#332B25" >USA</text>
<rect x="166" y="170" width="147.2" height="36" rx="8" fill="#4A90C2"/><text x="321.20000000000005" y="195" text-anchor="start" font-size="14.5" font-weight="900" fill="#4A90C2" >≈345 M</text>
<text x="150" y="248" text-anchor="end" font-size="16" font-weight="900" fill="#332B25" >Indonesia</text>
<rect x="166" y="222" width="120.7" height="36" rx="8" fill="#2E9A86"/><text x="294.74666666666667" y="247" text-anchor="start" font-size="14.5" font-weight="900" fill="#2E9A86" >≈283 M</text>
<text x="150" y="300" text-anchor="end" font-size="16" font-weight="900" fill="#332B25" >Pakistan</text>
<rect x="166" y="274" width="107.1" height="36" rx="8" fill="#3E8E5A"/><text x="281.09333333333336" y="299" text-anchor="start" font-size="14.5" font-weight="900" fill="#3E8E5A" >≈251 M</text>
<text x="150" y="352" text-anchor="end" font-size="16" font-weight="900" fill="#332B25" >Nigeria</text>
<rect x="166" y="326" width="99.4" height="36" rx="8" fill="#9C6ADE"/><text x="273.4133333333333" y="351" text-anchor="start" font-size="14.5" font-weight="900" fill="#9C6ADE" >≈233 M</text>
<text x="150" y="404" text-anchor="end" font-size="16" font-weight="900" fill="#332B25" >Brazil</text>
<rect x="166" y="378" width="90.5" height="36" rx="8" fill="#C9A227"/><text x="264.4533333333333" y="403" text-anchor="start" font-size="14.5" font-weight="900" fill="#C9A227" >≈212 M</text>
<text x="480" y="440" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >China has about 1/5 of the world’s people; India passed it in 2023 (UN World Population Prospects 2024, approximate, original drawing)</text>
</svg>
