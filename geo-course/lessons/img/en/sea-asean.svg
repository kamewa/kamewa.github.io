<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="600" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >Regional cooperation: ASEAN → ASEAN+3 → RCEP</text>
<ellipse cx="360" cy="330" rx="320" ry="250" fill="#E9F4FB" stroke="#4A90C2" stroke-width="3"/>
<ellipse cx="320" cy="340" rx="250" ry="200" fill="#FFF4DC" stroke="#E0A43A" stroke-width="3"/>
<ellipse cx="280" cy="355" rx="170" ry="150" fill="#E3F4E5" stroke="#2E9A86" stroke-width="3"/>
<rect x="170.0" y="224.8" width="220" height="30.4" rx="15.2" fill="#2E9A86" stroke="#45392F" stroke-width="2"/><text x="280" y="245.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">ASEAN (11 countries)</text>
<text x="180" y="300" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Myanmar</text>
<text x="280" y="300" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Thailand</text>
<text x="380" y="300" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Laos</text>
<text x="180" y="336" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Cambodia</text>
<text x="280" y="336" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Vietnam</text>
<text x="380" y="336" text-anchor="middle" font-size="15.1" font-weight="900" fill="#332B25" >Philippines</text>
<text x="180" y="372" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Malaysia</text>
<text x="280" y="372" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Singapore</text>
<text x="380" y="372" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Indonesia</text>
<text x="180" y="408" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Brunei</text>
<text x="280" y="408" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Timor-Leste</text>
<rect x="260.0" y="139.8" width="120" height="30.4" rx="15.2" fill="#E0A43A" stroke="#45392F" stroke-width="2"/><text x="320" y="160.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">ASEAN+3</text>
<text x="495" y="260" text-anchor="middle" font-size="17" font-weight="900" fill="#9C6A1E" >China</text>
<text x="495" y="300" text-anchor="middle" font-size="17" font-weight="900" fill="#9C6A1E" >Japan</text>
<text x="495" y="340" text-anchor="middle" font-size="17" font-weight="900" fill="#9C6A1E" >Korea</text>
<rect x="285.0" y="90.75" width="270" height="28.5" rx="14.25" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="420" y="110.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">RCEP trade partnership</text>
<text x="610" y="370" text-anchor="middle" font-size="17" font-weight="900" fill="#1F5F8B" >Australia</text>
<text x="610" y="410" text-anchor="middle" font-size="17" font-weight="900" fill="#1F5F8B" >New Zealand</text>
<rect x="700" y="80" width="236" height="150" rx="14" fill="#E3F4E5" stroke="#45392F" stroke-width="1.8"/>
<text x="716" y="110" text-anchor="start" font-size="18" font-weight="900" fill="#2E7D4F" >ASEAN</text>
<text x="716" y="138.0" text-anchor="start" font-size="13.9" font-weight="800" fill="#6B5E52" >Association of SE Asian Nations</text>
<text x="716" y="160.5" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >Members enjoy lower</text>
<text x="716" y="183.0" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >tariffs and cooperate</text>
<rect x="700" y="244" width="236" height="150" rx="14" fill="#FFF4DC" stroke="#45392F" stroke-width="1.8"/>
<text x="716" y="274" text-anchor="start" font-size="18" font-weight="900" fill="#9C6A1E" >ASEAN+3</text>
<text x="716" y="302.0" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >Adds China, Japan, S. Korea</text>
<text x="716" y="324.5" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >Develop energy, minerals,</text>
<text x="716" y="347.0" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >and food aid together</text>
<rect x="700" y="408" width="236" height="150" rx="14" fill="#E9F4FB" stroke="#45392F" stroke-width="1.8"/>
<text x="716" y="438" text-anchor="start" font-size="18" font-weight="900" fill="#1F5F8B" >RCEP</text>
<text x="716" y="466.0" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >Adds Australia, New Zealand</text>
<text x="716" y="488.5" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >Trade over a bigger area</text>
<text x="716" y="511.0" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >with lower tariffs</text>
</svg>
