<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 375" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="375" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >The Five Pillars of Islam: faith in daily life</text>
<circle cx="106" cy="150" r="62" fill="#2E9A86" stroke="#45392F" stroke-width="3"/>
<text x="106" y="172" text-anchor="middle" font-size="39.8" font-weight="900" fill="#fff" >Faith</text>
<text x="106" y="250" text-anchor="middle" font-size="19" font-weight="900" fill="#332B25" >Shahada</text>
<text x="106" y="280" text-anchor="middle" font-size="11.9" font-weight="800" fill="#6B5E52" >Declare faith and become a Muslim</text><text x="106" y="300" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" ></text>
<circle cx="293" cy="150" r="62" fill="#4A90C2" stroke="#45392F" stroke-width="3"/>
<text x="293" y="172" text-anchor="middle" font-size="43.7" font-weight="900" fill="#fff" >Pray</text>
<text x="293" y="250" text-anchor="middle" font-size="19" font-weight="900" fill="#332B25" >Salat</text>
<text x="293" y="280" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >Pray toward Mecca</text><text x="293" y="300" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >5 times a day</text>
<circle cx="480" cy="150" r="62" fill="#9C6ADE" stroke="#45392F" stroke-width="3"/>
<text x="480" y="172" text-anchor="middle" font-size="46.3" font-weight="900" fill="#fff" >Fast</text>
<text x="480" y="250" text-anchor="middle" font-size="19" font-weight="900" fill="#332B25" >Sawm</text>
<text x="480" y="280" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >During Ramadan, no food</text><text x="480" y="300" text-anchor="middle" font-size="10.6" font-weight="800" fill="#6B5E52" >from sunrise to sunset</text>
<circle cx="667" cy="150" r="62" fill="#E0A43A" stroke="#45392F" stroke-width="3"/>
<text x="667" y="172" text-anchor="middle" font-size="43.6" font-weight="900" fill="#fff" >Give</text>
<text x="667" y="250" text-anchor="middle" font-size="19" font-weight="900" fill="#332B25" >Zakat</text>
<text x="667" y="280" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >Give part of your income</text><text x="667" y="300" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" ></text>
<circle cx="854" cy="150" r="62" fill="#E0694F" stroke="#45392F" stroke-width="3"/>
<text x="854" y="172" text-anchor="middle" font-size="51.9" font-weight="900" fill="#fff" >Hajj</text>
<text x="854" y="250" text-anchor="middle" font-size="19" font-weight="900" fill="#332B25" >Pilgrimage</text>
<text x="854" y="280" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >If able, go to Mecca once</text><text x="854" y="300" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >in your life</text>
<text x="480" y="350" text-anchor="middle" font-size="15" font-weight="900" fill="#1F7A68" >Muslims believe: follow the Five Pillars and pray at the mosque, and you will be saved</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
