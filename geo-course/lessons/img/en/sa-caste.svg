<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="410" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >India’s caste system (four traditional classes)</text>
<path d="M240.0,70 L280.0,70 L335.0,150 L185.0,150 Z" fill="#F6D776" stroke="#45392F" stroke-width="2"/>
<text x="260" y="118.0" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Priests</text>
<path d="M185.0,150 L335.0,150 L390.0,230 L130.0,230 Z" fill="#F2B880" stroke="#45392F" stroke-width="2"/>
<text x="260" y="198.0" text-anchor="middle" font-size="18.9" font-weight="900" fill="#332B25" >Nobles and warriors</text>
<path d="M130.0,230 L390.0,230 L445.0,310 L75.0,310 Z" fill="#B9DDB0" stroke="#45392F" stroke-width="2"/>
<text x="260" y="278.0" text-anchor="middle" font-size="19" font-weight="900" fill="#332B25" >Commoners</text>
<path d="M75.0,310 L445.0,310 L500.0,390 L20.0,390 Z" fill="#C9C2B8" stroke="#45392F" stroke-width="2"/>
<text x="260" y="358.0" text-anchor="middle" font-size="19" font-weight="900" fill="#332B25" >Servants</text>
<line x1="30.0" y1="380.0" x2="30.0" y2="88.4" stroke="#B9B0A6" stroke-width="4" stroke-linecap="round"/><path d="M30.0,80.0 L36.1,92.6 L23.9,92.6 Z" fill="#B9B0A6"/><text x="48" y="90" text-anchor="start" font-size="13" font-weight="900" fill="#6B5E52" >Higher status</text><text x="48" y="378" text-anchor="start" font-size="13" font-weight="900" fill="#6B5E52" >Lower status</text>
<rect x="500" y="64" width="430" height="80" rx="14" fill="#fff" stroke="#45392F" stroke-width="1.8"/>
<text x="530" y="112" text-anchor="middle" font-size="28" font-weight="400" fill="#332B25" >👶</text><text x="565" y="100" text-anchor="start" font-size="18" font-weight="900" fill="#332B25" >Decided at birth</text><text x="565" y="126" text-anchor="start" font-size="13.5" font-weight="800" fill="#6B5E52" >Status and jobs passed down; class decided at birth</text>
<rect x="500" y="160" width="430" height="80" rx="14" fill="#fff" stroke="#45392F" stroke-width="1.8"/>
<text x="530" y="208" text-anchor="middle" font-size="28" font-weight="400" fill="#332B25" >💍</text><text x="565" y="196" text-anchor="start" font-size="18" font-weight="900" fill="#332B25" >No marriage between castes</text><text x="565" y="222" text-anchor="start" font-size="12.9" font-weight="800" fill="#6B5E52" >The system is abolished, but some areas keep this custom</text>
<rect x="500" y="256" width="430" height="80" rx="14" fill="#fff" stroke="#45392F" stroke-width="1.8"/>
<text x="530" y="304" text-anchor="middle" font-size="28" font-weight="400" fill="#332B25" >🚧</text><text x="565" y="292" text-anchor="start" font-size="18" font-weight="900" fill="#332B25" >Held back social progress</text><text x="565" y="318" text-anchor="start" font-size="13.5" font-weight="800" fill="#6B5E52" >Jobs were limited; talent could not move by ability</text>
