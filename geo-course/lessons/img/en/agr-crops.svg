<rect x="498" y="88" width="26" height="26" rx="6" fill="#7CC36E" stroke="#45392F"/><text x="536" y="108" text-anchor="start" font-size="19" font-weight="900" fill="#332B25" >Rice (food crop)</text>
<text x="498" y="146" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >Where: hot, wet plains and basins with plenty of water</text><text x="498" y="178" text-anchor="start" font-size="13.7" font-weight="800" fill="#6B5E52" >Now overproduced; some fields switch to vegetables, fruit, flowers</text>
<rect x="480" y="220" width="460" height="134" rx="14" fill="#fff" stroke="#45392F" stroke-width="1.8"/>
<rect x="498" y="238" width="26" height="26" rx="6" fill="#E7A84B" stroke="#45392F"/><text x="536" y="258" text-anchor="start" font-size="19" font-weight="900" fill="#332B25" >Sugarcane (cash crop)</text>
<text x="498" y="296" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >Where: hot, rainy plains of the southwest</text><text x="498" y="328" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >Costs more than abroad, so the area has dropped a lot</text>
<rect x="480" y="370" width="460" height="134" rx="14" fill="#fff" stroke="#45392F" stroke-width="1.8"/>
<rect x="498" y="388" width="26" height="26" rx="6" fill="#2E7D4F" stroke="#45392F"/><text x="536" y="408" text-anchor="start" font-size="19" font-weight="900" fill="#332B25" >Tea (cash crop)</text>
<text x="498" y="446" text-anchor="start" font-size="14.1" font-weight="800" fill="#332B25" >Where: misty, well-drained hills and mountains, north and central</text><text x="498" y="478" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >Still an important cash crop in hilly areas</text>
