<text x="740" y="270" text-anchor="start" font-size="15" font-weight="900" fill="#C0572B" >From about July: north</text><text x="740" y="292" text-anchor="start" font-size="12.8" font-weight="800" fill="#6B5E52" >(dry season starts in the south)</text>
<text x="210" y="255" text-anchor="end" font-size="14.4" font-weight="900" fill="#2C6E9E" >From about November: south</text><text x="210" y="277" text-anchor="end" font-size="12.3" font-weight="800" fill="#6B5E52" >(rainy season returns in the south)</text>
<text x="480" y="478" text-anchor="middle" font-size="13" font-weight="800" fill="#6B5E52" >Millions of wildebeest and zebras move with the rainy season, an important ecotourism resource for Kenya and Tanzania (diagram; months approximate)</text>
