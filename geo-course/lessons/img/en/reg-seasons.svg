<text x="530" y="134" text-anchor="start" font-size="14" font-weight="800" fill="#332B25" >Hunt only what the village needs</text>
<text x="530" y="156" text-anchor="start" font-size="14" font-weight="800" fill="#332B25" >Mostly males, few females</text>
<text x="530" y="178" text-anchor="start" font-size="14" font-weight="800" fill="#332B25" >No hunting in breeding season</text>
