<text x="530" y="274" text-anchor="start" font-size="14" font-weight="800" fill="#332B25" >March–September: only flying fish</text>
<text x="530" y="296" text-anchor="start" font-size="14" font-weight="800" fill="#332B25" >Barbless hooks: fish can be released</text>
<text x="530" y="318" text-anchor="start" font-size="14" font-weight="800" fill="#332B25" >End-of-eating ceremony: catch only what you eat</text>
<rect x="470" y="346" width="470" height="126" rx="16" fill="#fff" stroke="#3E8E5A" stroke-width="2.5"/>
<text x="504" y="388" text-anchor="middle" font-size="28" font-weight="400" fill="#332B25" >🌱</text><text x="530" y="386" text-anchor="start" font-size="18" font-weight="900" fill="#3E8E5A" >Atayal: Gaga</text>
<text x="530" y="414" text-anchor="start" font-size="14" font-weight="800" fill="#332B25" >Take only what you need</text>
<text x="530" y="436" text-anchor="start" font-size="14" font-weight="800" fill="#332B25" >Don’t take more for money</text>
<text x="530" y="458" text-anchor="start" font-size="14" font-weight="800" fill="#332B25" >Leave some for nature</text>
<text x="480" y="500" text-anchor="middle" font-size="15" font-weight="900" fill="#6B4E2E" >Shared spirit: take with care, let living things recover, and aim for sustainability</text>
