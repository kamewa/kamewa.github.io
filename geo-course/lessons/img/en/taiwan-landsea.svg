<rect x="50.0" y="329.75" width="120" height="28.5" rx="14.25" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="110" y="349.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">1 Pacific</text><text x="185" y="350" text-anchor="start" font-size="15" font-weight="700" fill="#332B25" >Largest, about half of all ocean</text>
<rect x="50.0" y="361.75" width="120" height="28.5" rx="14.25" fill="#6FB1DA" stroke="#45392F" stroke-width="2"/><text x="110" y="381.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">2 Atlantic</text><text x="185" y="382" text-anchor="start" font-size="15" font-weight="700" fill="#332B25" >Second largest</text>
<rect x="50.0" y="393.75" width="120" height="28.5" rx="14.25" fill="#9BC9E6" stroke="#45392F" stroke-width="2"/><text x="110" y="413.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">3 Indian</text><text x="185" y="414" text-anchor="start" font-size="15" font-weight="700" fill="#332B25" >Third largest</text>
<rect x="500" y="285" width="420" height="160" rx="14" fill="#fff" stroke="#45392F" stroke-width="2"/>
<text x="710" y="315" text-anchor="middle" font-size="17" font-weight="900" fill="#332B25" >Seven continents</text>
<text x="710" y="350" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >Asia · Europe · Africa · North America</text><text x="710" y="378" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >Latin America · Oceania · Antarctica</text>
<text x="710" y="414" text-anchor="middle" font-size="15" font-weight="900" fill="#C0392B" >Largest: Asia   Smallest: Oceania</text>
<text x="710" y="436" text-anchor="middle" font-size="13" font-weight="700" fill="#6B5E52" >Asia + Europe are joined: “Eurasia” (largest landmass)</text>
