<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 465" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="465" rx="20" fill="#EAF5FB"/>
<text x="480" y="40" text-anchor="middle" font-size="19.8" font-weight="800" fill="#332B25" >Land and sea: more sea than land, land mostly in the Northern Hemisphere</text>
<text x="70" y="92" text-anchor="start" font-size="17" font-weight="900" fill="#332B25" >World</text>
<rect x="140" y="72" width="214" height="30" fill="#CDEAC0" stroke="#45392F" stroke-width="2"/>
<rect x="354" y="72" width="524" height="30" fill="#9FD0EA" stroke="#45392F" stroke-width="2"/>
<text x="247.01" y="93" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >Land 29%</text><text x="616.01" y="93" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >Ocean 71%</text>
<text x="888.0" y="93" text-anchor="start" font-size="15" font-weight="800" fill="#6B5E52" >≈ 3 : 7</text>
<text x="70" y="160" text-anchor="start" font-size="17" font-weight="900" fill="#332B25" >North</text>
<rect x="140" y="140" width="288" height="30" fill="#CDEAC0" stroke="#45392F" stroke-width="2"/>
<rect x="428" y="140" width="450" height="30" fill="#9FD0EA" stroke="#45392F" stroke-width="2"/>
<text x="283.90999999999997" y="161" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >Land 39%</text><text x="652.91" y="161" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >Sea 61%</text>
<text x="70" y="210" text-anchor="start" font-size="17" font-weight="900" fill="#332B25" >South</text>
<rect x="140" y="190" width="140" height="30" fill="#CDEAC0" stroke="#45392F" stroke-width="2"/>
<rect x="280" y="190" width="598" height="30" fill="#9FD0EA" stroke="#45392F" stroke-width="2"/>
<text x="210.11" y="211" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >Land 19%</text><text x="579.11" y="211" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >Sea 81%</text>
<text x="480" y="262" text-anchor="middle" font-size="15" font-weight="800" fill="#C0392B" >More land in the north → more room for people → most people live in the Northern Hemisphere</text>
