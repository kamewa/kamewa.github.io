    <text x="155" y="77" text-anchor="middle" font-size="14.9" fill="#fff">Western mountains</text>
    <text x="165" y="222" text-anchor="middle" font-size="15" fill="#332B25">Andes Mountains</text>
    <rect x="460" y="120" width="250" height="34" rx="17" fill="#2E9A86" stroke="#45392F" stroke-width="2"/>
    <text x="585" y="143" text-anchor="middle" font-size="17" fill="#fff">Eastern basins and plateaus</text>
    <text x="420" y="282" text-anchor="middle" font-size="15" fill="#332B25">Amazon Basin (rainforest)</text>
    <text x="700" y="186" text-anchor="middle" font-size="15" fill="#332B25">Brazilian Plateau (savanna)</text>
  </g>
  <g font-size="15" font-weight="700" fill="#2F5F78">
