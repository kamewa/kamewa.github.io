        fill="#C9A77A" stroke="#45392F" stroke-width="3" stroke-linejoin="round"/>
  <path d="M150,103 L160,85 L170,103 Z M114,138 L120,120 L127,138 Z" fill="#fff" stroke="#45392F" stroke-width="2" stroke-linejoin="round"/>
  <path d="M290,240 C380,250 470,250 556,241" fill="none" stroke="#3E8E4E" stroke-width="10" stroke-linecap="round"/>
  <path d="M600,224 C640,206 700,198 760,204" fill="none" stroke="#C8B25A" stroke-width="8" stroke-linecap="round"/>
  <g font-weight="800">
