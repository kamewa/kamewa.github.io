<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="960" height="360" rx="20" fill="#EAF5FB"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25">Cross-section of South America (about 15°S, west to east)</text>
  <rect x="0" y="262" width="960" height="98" fill="#9FD0EA"/>
