<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 426" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="426" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >Where did the name “Taiwan” come from?</text>
<rect x="30" y="64" width="212" height="250" rx="18" fill="#fff" stroke="#2E9A86" stroke-width="2.5"/>
<text x="136" y="108" text-anchor="middle" font-size="32" font-weight="400" fill="#332B25" >🌊</text><rect x="81.0" y="125.75" width="110" height="28.5" rx="14.25" fill="#2E9A86" stroke="#45392F" stroke-width="2"/><text x="136" y="145.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Early times</text><text x="136" y="176" text-anchor="middle" font-size="14.5" font-weight="900" fill="#6B5E52" >Pingpu people (Siraya)</text>
<text x="136" y="214" text-anchor="middle" font-size="21" font-weight="900" fill="#2E9A86" >Tavoan</text>
<text x="136" y="256" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >“A meeting place”: sea, land,</text><text x="136" y="280" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >and sandbars meet at Taijiang</text>
<line x1="244.0" y1="189.0" x2="254.0" y2="189.0" stroke="#6B5E52" stroke-width="4" stroke-linecap="round"/><path d="M260.0,189.0 L251.0,193.3 L251.0,184.7 Z" fill="#6B5E52"/>
<rect x="262" y="64" width="212" height="250" rx="18" fill="#fff" stroke="#4A90C2" stroke-width="2.5"/>
<text x="368" y="108" text-anchor="middle" font-size="32" font-weight="400" fill="#332B25" >⛵</text><rect x="313.0" y="125.75" width="110" height="28.5" rx="14.25" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="368" y="145.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">17th century</text><text x="368" y="176" text-anchor="middle" font-size="14.5" font-weight="900" fill="#6B5E52" >The Dutch</text>
<text x="368" y="214" text-anchor="middle" font-size="21" font-weight="900" fill="#4A90C2" >Tayovan</text>
<text x="368" y="256" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >Marked on maps: the sandbar</text><text x="368" y="280" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >where Fort Zeelandia stood</text>
<line x1="476.0" y1="189.0" x2="486.0" y2="189.0" stroke="#6B5E52" stroke-width="4" stroke-linecap="round"/><path d="M492.0,189.0 L483.0,193.3 L483.0,184.7 Z" fill="#6B5E52"/>
<rect x="494" y="64" width="212" height="250" rx="18" fill="#fff" stroke="#E0A43A" stroke-width="2.5"/>
<text x="600" y="108" text-anchor="middle" font-size="32" font-weight="400" fill="#332B25" >🗣️</text><rect x="545.0" y="125.75" width="110" height="28.5" rx="14.25" fill="#E0A43A" stroke="#45392F" stroke-width="2"/><text x="600" y="145.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">17th century</text><text x="600" y="176" text-anchor="middle" font-size="14.5" font-weight="900" fill="#6B5E52" >Han Chinese settlers</text>
<text x="600" y="214" text-anchor="middle" font-size="16.0" font-weight="900" fill="#E0A43A" >Dayuan・Taiyuan・Dawan</text>
<text x="600" y="256" text-anchor="middle" font-size="12.0" font-weight="800" fill="#332B25" >Wrote similar sounds in characters</text><text x="600" y="280" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >(sound first, then characters)</text>
<line x1="708.0" y1="189.0" x2="718.0" y2="189.0" stroke="#6B5E52" stroke-width="4" stroke-linecap="round"/><path d="M724.0,189.0 L715.0,193.3 L715.0,184.7 Z" fill="#6B5E52"/>
<rect x="726" y="64" width="212" height="250" rx="18" fill="#fff" stroke="#E0694F" stroke-width="2.5"/>
<text x="832" y="108" text-anchor="middle" font-size="32" font-weight="400" fill="#332B25" >🏝️</text><rect x="777.0" y="125.75" width="110" height="28.5" rx="14.25" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="832" y="145.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Today</text><text x="832" y="176" text-anchor="middle" font-size="14.5" font-weight="900" fill="#6B5E52" >Us</text>
<text x="832" y="214" text-anchor="middle" font-size="21" font-weight="900" fill="#E0694F" >Taiwan</text>
<text x="832" y="256" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >From a name for the Anping area</text><text x="832" y="280" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >to the name of the whole island</text>
<rect x="30" y="334" width="900" height="74" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="480" y="364" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >Another name: Western sailors called Taiwan “Formosa” (Ilha Formosa, beautiful island)</text>
<text x="480" y="392" text-anchor="middle" font-size="13" font-weight="800" fill="#6B5E52" >Under Japanese rule, tea from the northern hills was sold abroad as “Formosa Tea”</text>
</svg>
