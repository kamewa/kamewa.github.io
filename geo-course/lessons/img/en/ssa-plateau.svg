<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 475" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="475" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="19.6" font-weight="800" fill="#332B25" >Africa is a “continent of plateaus”: plateaus reach the coast, coasts are steep</text>
<rect x="40" y="300" width="230" height="120" fill="#8FC4E8"/>
<path d="M270,420 L270,300 L300,170 L470,160 L560,230 L700,240 L760,165 L930,155 L930,420 Z" fill="#D9B98A" stroke="#45392F" stroke-width="2.5"/>
<path d="M560,230 L700,240 L690,262 L570,252 Z" fill="#7DBE6A" opacity=".7"/>
<text x="630" y="285" text-anchor="middle" font-size="14" font-weight="900" fill="#2E7D4F" >Basin (e.g., Congo Basin)</text>
<path d="M380,162 L320,168 Q300,170 296,190 L280,300" fill="none" stroke="#2C6E9E" stroke-width="6"/>
<path d="M290,200 l-6,20 l10,0 Z" fill="#fff"/>
<text x="150" y="275" text-anchor="middle" font-size="15" font-weight="900" fill="#1F5F8B" >Atlantic / Indian Ocean</text>
<text x="395" y="145" text-anchor="middle" font-size="16" font-weight="900" fill="#6B3410" >Plateau</text><text x="845" y="140" text-anchor="middle" font-size="16" font-weight="900" fill="#6B3410" >Plateau</text>
<text x="210" y="200" text-anchor="end" font-size="11.7" font-weight="900" fill="#1F5F8B" >Rivers cut through the plateau edge</text><text x="210" y="222" text-anchor="end" font-size="11.2" font-weight="900" fill="#1F5F8B" >→ rapids and waterfalls, bad for boats</text>
<text x="300" y="330" text-anchor="start" font-size="14" font-weight="900" fill="#B03A2E" >Steep, straight coast</text><text x="300" y="352" text-anchor="start" font-size="14" font-weight="900" fill="#B03A2E" >Few natural harbors</text>
<text x="480" y="455" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >Not very high on average (mostly below 1,000 m), but the plateaus are huge; getting inland from the coast was hard (cross-section)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
