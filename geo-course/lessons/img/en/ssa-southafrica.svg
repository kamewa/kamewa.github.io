<rect x="425.0" y="215.75" width="110" height="28.5" rx="14.25" fill="#2E9A86" stroke="#45392F" stroke-width="2"/><text x="480" y="235.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">1994</text>
<text x="480" y="278" text-anchor="middle" font-size="18" font-weight="900" fill="#332B25" >First election for all</text><text x="480" y="306" text-anchor="middle" font-size="12.6" font-weight="800" fill="#6B5E52" >Mandela became the first Black president</text>
<line x1="614.0" y1="265.0" x2="630.0" y2="265.0" stroke="#9C8E80" stroke-width="4" stroke-linecap="round"/><path d="M636.0,265.0 L627.0,269.3 L627.0,260.7 Z" fill="#9C8E80"/>
