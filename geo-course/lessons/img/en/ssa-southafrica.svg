<rect x="135.0" y="215.75" width="110" height="28.5" rx="14.25" fill="#6B5E52" stroke="#45392F" stroke-width="2"/><text x="190" y="235.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Past</text>
<text x="190" y="278" text-anchor="middle" font-size="18" font-weight="900" fill="#332B25" >Apartheid</text><text x="190" y="306" text-anchor="middle" font-size="12.8" font-weight="800" fill="#6B5E52" >A white minority ruled the Black majority</text>
<line x1="324.0" y1="265.0" x2="340.0" y2="265.0" stroke="#9C8E80" stroke-width="4" stroke-linecap="round"/><path d="M346.0,265.0 L337.0,269.3 L337.0,260.7 Z" fill="#9C8E80"/>
