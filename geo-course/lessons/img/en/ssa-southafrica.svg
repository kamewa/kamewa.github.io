<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="390" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="20.5" font-weight="800" fill="#332B25" >South Africa: from apartheid to elections for all</text>
