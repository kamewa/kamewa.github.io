<text x="770" y="278" text-anchor="middle" font-size="18" font-weight="900" fill="#332B25" >Apartheid has ended</text><text x="770" y="306" text-anchor="middle" font-size="10.6" font-weight="800" fill="#6B5E52" >But some areas are still clearly separated by race</text>
<text x="480" y="370" text-anchor="middle" font-size="12.0" font-weight="900" fill="#6B3410" >South Africa has one of the stronger economies in Sub-Saharan Africa, but ethnic problems still cause unrest</text>
