<text x="401.88" y="113" text-anchor="middle" font-size="16" font-weight="900" fill="#fff" >Black 81.4%</text>
<rect x="743.8" y="80" width="72.2" height="54" fill="#C9A24A" stroke="#45392F" stroke-width="1.5"/>
<rect x="816.0" y="80" width="61.3" height="54" fill="#E6E1D8" stroke="#45392F" stroke-width="1.5"/>
<rect x="877.3" y="80" width="22.7" height="54" fill="#8FC4E8" stroke="#45392F" stroke-width="1.5"/>
<text x="900" y="160" text-anchor="end" font-size="13" font-weight="900" fill="#6B5E52" >Mixed 8.6% | White 7.3% | Asian 2.7%</text>
<text x="60" y="160" text-anchor="start" font-size="11.9" font-weight="900" fill="#6B5E52" >South Africa’s population groups, 2022 (from textbook chart)</text>
