<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="960" height="380" rx="20" fill="#FBF8F2"/>
  <text x="480" y="38" text-anchor="middle" font-size="17.7" font-weight="800" fill="#332B25">Why does the Mediterranean climate have “dry summers, rainy winters”?</text>
  <g transform="translate(30,60)">
    <rect width="440" height="290" rx="16" fill="#FFF6E6" stroke="#F2A343" stroke-width="2.5"/>
    <text x="220" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#8C5810">☀️ Summer: wind belts move north</text>
    <rect x="30" y="60" width="380" height="60" rx="12" fill="#BFE0EE"/><text x="220" y="97" text-anchor="middle" font-size="18" font-weight="800" fill="#2F5F78">Westerlies → move farther north</text>
    <rect x="30" y="135" width="380" height="70" rx="12" fill="#F7C873" stroke="#D48729" stroke-width="2.5"/><text x="220" y="167" text-anchor="middle" font-size="18.2" font-weight="800" fill="#6B3F0E">Subtropical high covers the Mediterranean</text>
    <text x="220" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#6B3F0E">Sinking air → sunny, little rain</text>
    <text x="220" y="250" text-anchor="middle" font-size="26" font-weight="900" fill="#C45037">Dry summer</text>
  </g>
  <g transform="translate(490,60)">
    <rect width="440" height="290" rx="16" fill="#EAF3F8" stroke="#4A88A9" stroke-width="2.5"/>
    <text x="220" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#2F5F78">❄️ Winter: wind belts move south</text>
    <rect x="30" y="60" width="380" height="60" rx="12" fill="#F7E3B5"/><text x="220" y="97" text-anchor="middle" font-size="18" font-weight="800" fill="#8C5810">Subtropical high → moves farther south</text>
    <rect x="30" y="135" width="380" height="70" rx="12" fill="#9FD0EA" stroke="#376C87" stroke-width="2.5"/><text x="220" y="167" text-anchor="middle" font-size="19" font-weight="800" fill="#23394A">Westerlies reach the Mediterranean</text>
    <text x="220" y="192" text-anchor="middle" font-size="15" font-weight="700" fill="#23394A">Bring sea moisture → rain</text>
    <text x="220" y="250" text-anchor="middle" font-size="26" font-weight="900" fill="#217868">Rainy winter</text>
  </g>
  <text x="940" y="372" text-anchor="end" font-size="11" fill="#96887D">Diagram</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
