<text x="480" y="432" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >Exports are mostly high-tech products (wafers, ICs, computer parts);</text>
<text x="480" y="460" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >Taiwan lacks natural resources, so oil, coal, and industrial materials are imported</text>
<text x="480" y="508" text-anchor="middle" font-size="10.8" font-weight="800" fill="#6B5E52" >(approximate values from Customs Administration trade statistics, drawn for this lesson)</text>
