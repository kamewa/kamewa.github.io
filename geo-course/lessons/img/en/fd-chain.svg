<rect x="490" y="332" width="410" height="80" rx="14" fill="#fff" stroke="#E0694F" stroke-width="2"/><text x="526" y="382" text-anchor="middle" font-size="26" font-weight="400" fill="#332B25" >✈️</text><text x="556" y="364" text-anchor="start" font-size="16" font-weight="900" fill="#E0694F" >Central marketing, imports</text><text x="556" y="394" text-anchor="start" font-size="13.5" font-weight="800" fill="#332B25" >Long food miles, more transport emissions</text>
