<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="390" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >An oil-based economy: when oil prices change, the budget changes</text>
<rect x="60" y="70" width="400" height="230" rx="16" fill="#E3F2EC" stroke="#45392F" stroke-width="2"/>
<text x="260" y="112" text-anchor="middle" font-size="22" font-weight="900" fill="#2E9A86" >📈 Oil prices rise</text>
<text x="260" y="160" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >More oil export income</text>
<line x1="260.0" y1="168.0" x2="260.0" y2="181.2" stroke="#9C8E80" stroke-width="2.5" stroke-linecap="round"/><path d="M260.0,186.0 L256.5,178.8 L263.5,178.8 Z" fill="#9C8E80"/>
<text x="260" y="202" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >Government has more money</text>
<line x1="260.0" y1="210.0" x2="260.0" y2="223.2" stroke="#9C8E80" stroke-width="2.5" stroke-linecap="round"/><path d="M260.0,228.0 L256.5,220.8 L263.5,220.8 Z" fill="#9C8E80"/>
<text x="260" y="244" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >Budget as a share of GDP goes up</text>
<rect x="500" y="70" width="400" height="230" rx="16" fill="#FDE8E2" stroke="#45392F" stroke-width="2"/>
<text x="700" y="112" text-anchor="middle" font-size="22" font-weight="900" fill="#E0694F" >📉 Oil prices fall</text>
<text x="700" y="160" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >Less oil export income</text>
<line x1="700.0" y1="168.0" x2="700.0" y2="181.2" stroke="#9C8E80" stroke-width="2.5" stroke-linecap="round"/><path d="M700.0,186.0 L696.5,178.8 L703.5,178.8 Z" fill="#9C8E80"/>
<text x="700" y="202" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >Income &lt; spending (deficit)</text>
<line x1="700.0" y1="210.0" x2="700.0" y2="223.2" stroke="#9C8E80" stroke-width="2.5" stroke-linecap="round"/><path d="M700.0,228.0 L696.5,220.8 L703.5,220.8 Z" fill="#9C8E80"/>
<text x="700" y="244" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >Budget share goes down, even below zero</text>
<text x="480" y="340" text-anchor="middle" font-size="15" font-weight="900" fill="#6B3410" >e.g., over 70% of Saudi government income comes from oil</text>
<text x="480" y="368" text-anchor="middle" font-size="14" font-weight="800" fill="#6B5E52" >→ “Vision 2030” develops tourism, manufacturing, and tech to depend less on oil</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
