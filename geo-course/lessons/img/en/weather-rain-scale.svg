<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="365" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >Levels of heavy rain (24-hour total)</text>
<rect x="200" y="80" width="208" height="44" rx="10" fill="#8FC4E8" stroke="#45392F" stroke-width="2"/>
<text x="185" y="109" text-anchor="end" font-size="18" font-weight="900" fill="#332B25" >Heavy rain</text>
<text x="212" y="109" text-anchor="start" font-size="16" font-weight="900" fill="#fff" >80 mm or more</text>
<text x="422.0" y="108" text-anchor="start" font-size="14" font-weight="800" fill="#6B5E52" >or 40 mm in 1 hour</text>
<rect x="200" y="142" width="340" height="44" rx="10" fill="#4A90C2" stroke="#45392F" stroke-width="2"/>
<text x="185" y="171" text-anchor="end" font-size="18" font-weight="900" fill="#332B25" >Torrential rain</text>
<text x="212" y="171" text-anchor="start" font-size="16" font-weight="900" fill="#fff" >200 mm or more</text>
<text x="554.0" y="170" text-anchor="start" font-size="14" font-weight="800" fill="#6B5E52" >or 100 mm in 3 hours</text>
<rect x="200" y="204" width="505" height="44" rx="10" fill="#2C6E9E" stroke="#45392F" stroke-width="2"/>
<text x="185" y="233" text-anchor="end" font-size="12.2" font-weight="900" fill="#332B25" >Extremely torrential rain</text>
<text x="212" y="233" text-anchor="start" font-size="16" font-weight="900" fill="#fff" >350 mm or more</text>
<text x="719.0" y="232" text-anchor="start" font-size="14" font-weight="800" fill="#6B5E52" >or 200 mm in 3 hours</text>
<rect x="200" y="266" width="670" height="44" rx="10" fill="#1B4B73" stroke="#45392F" stroke-width="2"/>
<text x="185" y="295" text-anchor="end" font-size="16.7" font-weight="900" fill="#332B25" >Super torrential rain</text>
<text x="212" y="295" text-anchor="start" font-size="16" font-weight="900" fill="#fff" >500 mm or more</text>
<text x="480" y="345" text-anchor="middle" font-size="13.3" font-weight="900" fill="#C0392B" >Heavy rain in a short time easily causes floods, landslides, and debris flows</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
