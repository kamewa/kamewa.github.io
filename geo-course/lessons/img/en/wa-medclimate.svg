<text x="255" y="492" text-anchor="middle" font-size="11.9" font-weight="900" fill="#332B25" >Subtropical high covers the Mediterranean</text><text x="255" y="518" text-anchor="middle" font-size="14" font-weight="800" fill="#E0A43A" >Sinking air → dry, little rain (dry summer)</text>
