<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 326" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="326" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="18.1" font-weight="800" fill="#332B25" >Summary of China’s climate features</text>
<rect x="24" y="64" width="216" height="210" rx="18" fill="#FDE8E3" stroke="#45392F" stroke-width="2"/>
<text x="132" y="116" text-anchor="middle" font-size="38" font-weight="400" fill="#332B25" >🌞</text><rect x="57.0" y="142.8" width="150" height="30.4" rx="15.2" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="132" y="163.6" text-anchor="middle" font-size="13.2" font-weight="800" fill="#fff">Temperature: summer</text>
<text x="132" y="208" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Hot almost everywhere</text>
<text x="132" y="240" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Small north–south gap</text>
<rect x="258" y="64" width="216" height="210" rx="18" fill="#E1EFF9" stroke="#45392F" stroke-width="2"/>
<text x="366" y="116" text-anchor="middle" font-size="38" font-weight="400" fill="#332B25" >❄️</text><rect x="291.0" y="142.8" width="150" height="30.4" rx="15.2" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="366" y="163.6" text-anchor="middle" font-size="14.4" font-weight="800" fill="#fff">Temperature: winter</text>
<text x="366" y="208" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Warm south, cold north</text>
<text x="366" y="240" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Big north–south gap</text>
<rect x="492" y="64" width="216" height="210" rx="18" fill="#DDF2EF" stroke="#45392F" stroke-width="2"/>
<text x="600" y="116" text-anchor="middle" font-size="38" font-weight="400" fill="#332B25" >📅</text><rect x="525.0" y="142.8" width="150" height="30.4" rx="15.2" fill="#2E9A86" stroke="#45392F" stroke-width="2"/><text x="600" y="163.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Rain: by season</text>
<text x="600" y="208" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Shaped by monsoons</text>
<text x="600" y="240" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Wet summers, dry winters</text>
<rect x="726" y="64" width="216" height="210" rx="18" fill="#FDF3DC" stroke="#45392F" stroke-width="2"/>
<text x="834" y="116" text-anchor="middle" font-size="38" font-weight="400" fill="#332B25" >🗺️</text><rect x="759.0" y="142.8" width="150" height="30.4" rx="15.2" fill="#E0A43A" stroke="#45392F" stroke-width="2"/><text x="834" y="163.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Rain: by place</text>
<text x="834" y="208" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Distance from sea matters</text>
<text x="834" y="240" text-anchor="middle" font-size="12.7" font-weight="900" fill="#332B25" >Less from southeast to northwest</text>
<text x="480" y="306" text-anchor="middle" font-size="14" font-weight="900" fill="#6B4E2E" >Qinling–Huai: the January 0℃ isotherm + the 750 mm isohyet, an important geographic dividing line</text>
</svg>
