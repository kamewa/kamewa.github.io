<text x="135" y="368" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >High, steep, &gt;1,000 m</text>
<rect x="254.0" y="64.8" width="72" height="30.4" rx="15.2" fill="#E0A43A" stroke="#45392F" stroke-width="2"/><text x="290" y="85.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Hills</text>
<text x="290" y="368" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >Low, rolling, &lt;1,000 m</text>
<rect x="399.0" y="64.8" width="72" height="30.4" rx="15.2" fill="#9C6ADE" stroke="#45392F" stroke-width="2"/><text x="435" y="85.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Plateau</text>
