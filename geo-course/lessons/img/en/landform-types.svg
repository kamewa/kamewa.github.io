<rect x="724.0" y="64.8" width="72" height="30.4" rx="15.2" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="760" y="85.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Basin</text>
