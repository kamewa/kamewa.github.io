<rect x="859.0" y="64.8" width="72" height="30.4" rx="15.2" fill="#7CB46A" stroke="#45392F" stroke-width="2"/><text x="895" y="85.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Plain</text>
