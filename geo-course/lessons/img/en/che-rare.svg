<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="486" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >Rare earths: a must-have for high-tech industry</text>
<rect x="20" y="56" width="440" height="330" rx="16" fill="#fff" stroke="#45392F" stroke-width="1.5"/>
<text x="240" y="86" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >Rare-earth reserves by country, 2024</text>
<path d="M150,230 L150.0,120.0 A110,110 0 0 1 156.9,339.8 Z" fill="#C0392B" stroke="#fff" stroke-width="2"/>
<path d="M150,230 L156.9,339.8 A110,110 0 0 1 41.9,250.6 Z" fill="#E8A33D" stroke="#fff" stroke-width="2"/>
<path d="M150,230 L41.9,250.6 A110,110 0 0 1 45.4,196.0 Z" fill="#7AB87A" stroke="#fff" stroke-width="2"/>
<path d="M150,230 L45.4,196.0 A110,110 0 0 1 65.2,159.9 Z" fill="#5DA9D6" stroke="#fff" stroke-width="2"/>
<path d="M150,230 L65.2,159.9 A110,110 0 0 1 85.3,141.0 Z" fill="#9C6ADE" stroke="#fff" stroke-width="2"/>
<path d="M150,230 L85.3,141.0 A110,110 0 0 1 150.0,120.0 Z" fill="#D8D2C8" stroke="#fff" stroke-width="2"/>
<rect x="290" y="128" width="18" height="18" rx="4" fill="#C0392B"/><text x="316" y="143" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >China 49%</text>
<rect x="290" y="164" width="18" height="18" rx="4" fill="#E8A33D"/><text x="316" y="179" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >Brazil 23%</text>
<rect x="290" y="200" width="18" height="18" rx="4" fill="#7AB87A"/><text x="316" y="215" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >India 8%</text>
<rect x="290" y="236" width="18" height="18" rx="4" fill="#5DA9D6"/><text x="316" y="251" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >Australia 6%</text>
<rect x="290" y="272" width="18" height="18" rx="4" fill="#9C6ADE"/><text x="316" y="287" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >Russia 4%</text>
<rect x="290" y="308" width="18" height="18" rx="4" fill="#D8D2C8"/><text x="316" y="323" text-anchor="start" font-size="14" font-weight="900" fill="#332B25" >Others 10%</text>
<text x="240" y="372" text-anchor="middle" font-size="12" font-weight="800" fill="#6B5E52" >(Approximate, from US Geological Survey data)</text>
<rect x="480" y="56" width="460" height="330" rx="16" fill="#FFF8E7" stroke="#45392F" stroke-width="1.5"/>
<text x="512" y="108" text-anchor="middle" font-size="24" font-weight="400" fill="#332B25" >🔬</text><text x="542" y="96" text-anchor="start" font-size="15.5" font-weight="900" fill="#E0694F" >Feature</text><text x="542" y="124" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >10+ similar metals, hard to extract, unevenly spread</text>
<text x="512" y="184" text-anchor="middle" font-size="24" font-weight="400" fill="#332B25" >📍</text><text x="542" y="172" text-anchor="start" font-size="15.5" font-weight="900" fill="#E0694F" >Where in China</text><text x="542" y="200" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >Inner Mongolia (Bayan Obo) and the south</text>
<text x="512" y="260" text-anchor="middle" font-size="24" font-weight="400" fill="#332B25" >📱</text><text x="542" y="248" text-anchor="start" font-size="15.5" font-weight="900" fill="#E0694F" >Uses</text><text x="542" y="276" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >LCD and phone screens, EV motors, wind turbines</text>
<text x="512" y="336" text-anchor="middle" font-size="24" font-weight="400" fill="#332B25" >⚖️</text><text x="542" y="324" text-anchor="start" font-size="15.5" font-weight="900" fill="#E0694F" >Effect</text><text x="542" y="352" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >High-tech countries rely on China → easily pressured</text>
<rect x="20" y="402" width="920" height="66" rx="14" fill="#fff" stroke="#E0694F" stroke-width="2"/>
<text x="480" y="430" text-anchor="middle" font-size="16" font-weight="900" fill="#E0694F" >Cost to nature: each ton of rare earths makes about 2,000 tons of toxic waste</text>
<text x="480" y="454" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >Toxic waste pollutes land and water (e.g. the tailings dam in Baotou)</text>
</svg>
