<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="395" rx="20" fill="#EAF5FB"/>
<text x="480" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >Scale: map distance ÷ real distance</text>
<rect x="40" y="70" width="430" height="300" rx="16" fill="#fff" stroke="#45392F" stroke-width="2.5"/>
<text x="255" y="104" text-anchor="middle" font-size="18" font-weight="900" fill="#332B25" >Three ways to show it</text>
<rect x="70.0" y="137.75" width="80" height="28.5" rx="14.25" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="110" y="157.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Number</text><text x="170" y="158" text-anchor="start" font-size="17" font-weight="800" fill="#332B25" >1/10,000 (or 1 : 10,000)</text>
<rect x="70.0" y="207.75" width="80" height="28.5" rx="14.25" fill="#2E9A86" stroke="#45392F" stroke-width="2"/><text x="110" y="227.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Words</text><text x="170" y="228" text-anchor="start" font-size="17" font-weight="800" fill="#332B25" >1 cm on the map = 100 m in real life</text>
<rect x="70.0" y="277.75" width="80" height="28.5" rx="14.25" fill="#E0A43A" stroke="#45392F" stroke-width="2"/><text x="110" y="297.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Scale bar</text>
<rect x="170" y="282" width="60" height="12" fill="#45392F" stroke="#45392F" stroke-width="2"/>
<rect x="230" y="282" width="60" height="12" fill="#fff" stroke="#45392F" stroke-width="2"/>
<rect x="290" y="282" width="60" height="12" fill="#45392F" stroke="#45392F" stroke-width="2"/>
<rect x="350" y="282" width="60" height="12" fill="#fff" stroke="#45392F" stroke-width="2"/>
<text x="170" y="316" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >0</text>
<text x="230" y="316" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >100</text>
<text x="290" y="316" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >200</text>
<text x="350" y="316" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >300</text>
<text x="410" y="316" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >400 m</text>
<text x="255" y="352" text-anchor="middle" font-size="12.3" font-weight="800" fill="#C0392B" >When a map is copied larger or smaller, only the scale bar stays correct</text>
<rect x="490" y="70" width="430" height="300" rx="16" fill="#fff" stroke="#45392F" stroke-width="2.5"/>
<text x="705" y="104" text-anchor="middle" font-size="18" font-weight="900" fill="#332B25" >Large scale vs. small scale</text>
<rect x="515" y="125" width="180" height="150" rx="8" fill="#F3F7EE" stroke="#45392F" stroke-width="2"/>
<rect x="530" y="140" width="60" height="40" rx="4" fill="#F7C7C0" stroke="#8C7B6A" stroke-width="1.5"/>
<rect x="605" y="140" width="75" height="40" rx="4" fill="#CDEAC0" stroke="#8C7B6A" stroke-width="1.5"/>
<rect x="530" y="200" width="40" height="60" rx="4" fill="#E7DCCB" stroke="#8C7B6A" stroke-width="1.5"/>
<rect x="585" y="200" width="95" height="25" rx="4" fill="#E7DCCB" stroke="#8C7B6A" stroke-width="1.5"/>
<rect x="585" y="235" width="45" height="25" rx="4" fill="#BFE0F5" stroke="#8C7B6A" stroke-width="1.5"/>
<line x1="515" y1="190" x2="695" y2="190" stroke="#fff" stroke-width="8"/><line x1="597" y1="125" x2="597" y2="275" stroke="#fff" stroke-width="8"/>
<text x="605" y="300" text-anchor="middle" font-size="17" font-weight="900" fill="#C0392B" >Large scale</text>
<text x="605" y="326" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >Small area · lots of detail</text>
<text x="605" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#6B5E52" >e.g., neighborhood, city maps</text>
<rect x="715" y="125" width="180" height="150" rx="8" fill="#DDEFF8" stroke="#45392F" stroke-width="2"/>
<path d="M800,135 C815,140 828,160 826,185 C824,215 812,245 798,265 C792,250 784,230 782,205 C780,175 785,150 800,135 Z" fill="#CDEAC0" stroke="#45392F" stroke-width="2"/>
<circle cx="808" cy="150" r="4" fill="#E0694F"/><circle cx="790" cy="220" r="4" fill="#E0694F"/>
<text x="805" y="300" text-anchor="middle" font-size="17" font-weight="900" fill="#2C6E9E" >Small scale</text>
<text x="805" y="326" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >Large area · little detail</text>
<text x="805" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#6B5E52" >e.g., all of Taiwan, world maps</text>
