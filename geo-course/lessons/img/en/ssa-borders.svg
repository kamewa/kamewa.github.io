<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="490" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="21.6" font-weight="800" fill="#332B25" >Roots of ethnic problems: colonial borders drawn as “straight lines”</text>
<rect x="40" y="62" width="430" height="300" rx="16" fill="#fff" stroke="#45392F" stroke-width="2"/>
<rect x="185.0" y="76.8" width="140" height="30.4" rx="15.2" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="255" y="97.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Inside a country</text>
<ellipse cx="190" cy="220" rx="80" ry="70" fill="#F6C9A0" opacity=".85"/>
<ellipse cx="320" cy="225" rx="80" ry="70" fill="#A8D5A2" opacity=".85"/>
<text x="175" y="225" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >Group A</text><text x="335" y="230" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >Group B</text>
<rect x="130" y="150" width="250" height="150" fill="none" stroke="#E0694F" stroke-width="4"/>
<text x="255" y="325" text-anchor="middle" font-size="14" font-weight="900" fill="#E0694F" >Border</text>
<text x="255" y="400" text-anchor="middle" font-size="14.3" font-weight="900" fill="#332B25" >Different groups put in one country: fight for power</text>
<text x="255" y="424" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >e.g., Hutu and Tutsi in Rwanda</text>
<rect x="490" y="62" width="430" height="300" rx="16" fill="#fff" stroke="#45392F" stroke-width="2"/>
<rect x="635.0" y="76.8" width="140" height="30.4" rx="15.2" fill="#9C6ADE" stroke="#45392F" stroke-width="2"/><text x="705" y="97.6" text-anchor="middle" font-size="14.4" font-weight="800" fill="#fff">Between countries</text>
<ellipse cx="705" cy="220" rx="130" ry="75" fill="#F6C9A0" opacity=".85"/>
<text x="705" y="225" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >One ethnic group</text>
<line x1="705" y1="130" x2="705" y2="315" stroke="#9C6ADE" stroke-width="4"/>
<line x1="550" y1="270" x2="870" y2="270" stroke="#9C6ADE" stroke-width="4"/>
<text x="620" y="160" text-anchor="middle" font-size="15" font-weight="900" fill="#9C6ADE" >Country A</text><text x="790" y="160" text-anchor="middle" font-size="15" font-weight="900" fill="#9C6ADE" >Country B</text><text x="790" y="305" text-anchor="middle" font-size="15" font-weight="900" fill="#9C6ADE" >Country C</text>
<text x="705" y="400" text-anchor="middle" font-size="14.5" font-weight="900" fill="#332B25" >One group split among countries: fight to unite</text>
<text x="705" y="424" text-anchor="middle" font-size="12.0" font-weight="800" fill="#6B5E52" >e.g., the Somali people of East Africa</text>
<text x="480" y="470" text-anchor="middle" font-size="12.7" font-weight="800" fill="#6B3410" >European powers drew colonies without thinking about ethnic groups, sometimes along latitude and longitude lines → conflict after independence (diagram)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
