<polyline points="64.0,170.0 93.1,190.8 122.2,199.2 151.3,174.2 180.4,180.4 209.5,174.2 238.5,176.2 267.6,199.2 296.7,211.7 320.0,220.0" fill="none" stroke="#E0A43A" stroke-width="4" stroke-linejoin="round"/>
