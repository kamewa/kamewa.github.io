<polyline points="64.0,245.0 93.1,253.3 122.2,257.5 151.3,286.7 180.4,307.5 209.5,320.0 238.5,330.4 267.6,335.0 296.7,337.9 320.0,340.8" fill="none" stroke="#3E8E5A" stroke-width="4" stroke-linejoin="round"/>
<text x="328.0" y="345.8333333333333" text-anchor="start" font-size="14" font-weight="900" fill="#3E8E5A" >Primary 7%</text>
<rect x="440" y="56" width="500" height="80" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="474" y="106" text-anchor="middle" font-size="26" font-weight="400" fill="#332B25" >⛏️</text><text x="504" y="86" text-anchor="start" font-size="16" font-weight="900" fill="#E0694F" >Raw materials (minerals)</text>
<text x="504" y="110" text-anchor="start" font-size="12.5" font-weight="800" fill="#332B25" >North: much coal, iron, oil → steel, petrochemicals;</text><text x="504" y="128" text-anchor="start" font-size="12.5" font-weight="800" fill="#332B25" >South: few minerals → once mainly textiles, light industry</text>
<rect x="440" y="148" width="500" height="80" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="474" y="198" text-anchor="middle" font-size="26" font-weight="400" fill="#332B25" >🚆</text><text x="504" y="178" text-anchor="start" font-size="16" font-weight="900" fill="#E0694F" >Transportation</text>
<text x="504" y="202" text-anchor="start" font-size="12.5" font-weight="800" fill="#332B25" >East: dense railways and roads, busy shipping;</text><text x="504" y="220" text-anchor="start" font-size="12.5" font-weight="800" fill="#332B25" >West: sparse transport; high-speed rail speeds things up</text>
<rect x="440" y="240" width="500" height="80" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="474" y="290" text-anchor="middle" font-size="26" font-weight="400" fill="#332B25" >📜</text><text x="504" y="270" text-anchor="start" font-size="16" font-weight="900" fill="#E0694F" >Policy</text>
<text x="504" y="300" text-anchor="start" font-size="12.5" font-weight="800" fill="#332B25" >Reform, special economic zones, foreign investment → “world factory”</text>
<rect x="440" y="332" width="500" height="80" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="474" y="382" text-anchor="middle" font-size="26" font-weight="400" fill="#332B25" >🛒</text><text x="504" y="362" text-anchor="start" font-size="16" font-weight="900" fill="#E0694F" >Market</text>
<text x="504" y="392" text-anchor="start" font-size="12.5" font-weight="800" fill="#332B25" >Higher incomes, booming online shopping → “world market”</text>
<text x="480" y="440" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >After reform, secondary and tertiary output far passed primary (approximate, from China NBS data, original drawing)</text>
