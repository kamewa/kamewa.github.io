<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 415" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="415" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="20.4" font-weight="800" fill="#332B25" >Japan’s changing industries: problem → solution</text>
<rect x="30" y="60" width="270" height="300" rx="14" fill="#FDE8E2" stroke="#45392F" stroke-width="2"/>
<rect x="105.0" y="74.8" width="120" height="30.4" rx="15.2" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="165" y="95.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Problems</text>
<text x="165" y="150" text-anchor="middle" font-size="19" font-weight="900" fill="#332B25" >💴 Rising wages</text><text x="165" y="180" text-anchor="middle" font-size="15" font-weight="800" fill="#6B5E52" >Higher costs</text>
<text x="165" y="250" text-anchor="middle" font-size="19" font-weight="900" fill="#332B25" >👴 Aging population</text><text x="165" y="280" text-anchor="middle" font-size="15" font-weight="800" fill="#6B5E52" >Too few workers</text>
<line x1="310.0" y1="210.0" x2="349.2" y2="210.0" stroke="#E0A43A" stroke-width="6" stroke-linecap="round"/><path d="M360.0,210.0 L343.8,217.8 L343.8,202.2 Z" fill="#E0A43A"/>
<rect x="370" y="60" width="560" height="300" rx="14" fill="#E3F2EC" stroke="#45392F" stroke-width="2"/>
<rect x="590.0" y="74.8" width="120" height="30.4" rx="15.2" fill="#2E9A86" stroke="#45392F" stroke-width="2"/><text x="650" y="95.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Solutions</text>
<text x="392" y="140" text-anchor="start" font-size="16" font-weight="900" fill="#332B25" >🌏 Move overseas</text><text x="392" y="162" text-anchor="start" font-size="13" font-weight="800" fill="#6B5E52" >Move labor-intensive industries to countries with low wages and many workers</text>
<text x="392" y="196" text-anchor="start" font-size="16" font-weight="900" fill="#332B25" >🤝 Partnerships and mergers</text><text x="392" y="218" text-anchor="start" font-size="13" font-weight="800" fill="#6B5E52" >Attract global money and go international (e.g., TSMC Kumamoto)</text>
<text x="392" y="252" text-anchor="start" font-size="16" font-weight="900" fill="#332B25" >🔬 Research at home</text><text x="392" y="274" text-anchor="start" font-size="13" font-weight="800" fill="#6B5E52" >Earn high profits from patents; needs few workers</text>
<text x="392" y="308" text-anchor="start" font-size="16" font-weight="900" fill="#332B25" >🤖 New care industries</text><text x="392" y="330" text-anchor="start" font-size="13" font-weight="800" fill="#6B5E52" >AI, robots, remote doctor visits, exoskeletons</text>
<text x="480" y="395" text-anchor="middle" font-size="15" font-weight="900" fill="#1F7A68" >Japan is very competitive in high-tech medicine and care</text>
