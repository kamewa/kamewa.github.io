<text x="250" y="340" text-anchor="middle" font-size="11.8" font-weight="900" fill="#B5651D" >Rivers carry lots of mud → mud piles up in the reservoir → less water stored</text>
<text x="250" y="364" text-anchor="middle" font-size="13" font-weight="800" fill="#6B5E52" >Shimen Reservoir is over 30% silted; Zengwen nearly 40%</text>
<text x="250" y="394" text-anchor="middle" font-size="12.5" font-weight="900" fill="#2E9A86" >Solutions: soil and water conservation upstream, check dams, dredging</text>
