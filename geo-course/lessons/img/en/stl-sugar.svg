<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 422" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="422" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="21.1" font-weight="800" fill="#332B25" >Sugar place name “廍”: why were sugar mills by the cane fields?</text>
<rect x="50" y="66" width="260" height="190" rx="18" fill="#fff" stroke="#8A5A2B" stroke-width="2.5"/>
<text x="180" y="124" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🌾</text><text x="180" y="172" text-anchor="middle" font-size="19" font-weight="900" fill="#8A5A2B" >Sugarcane</text><text x="180" y="206" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >Bulky and heavy</text><text x="180" y="230" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >Hard to move</text>
<line x1="314.0" y1="160.0" x2="338.8" y2="160.0" stroke="#6B5E52" stroke-width="5" stroke-linecap="round"/><path d="M346.0,160.0 L335.2,165.2 L335.2,154.8 Z" fill="#6B5E52"/>
<rect x="350" y="66" width="260" height="190" rx="18" fill="#fff" stroke="#8A5A2B" stroke-width="2.5"/>
<text x="480" y="124" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🐂</text><text x="480" y="172" text-anchor="middle" font-size="19" font-weight="900" fill="#8A5A2B" >Sugar mill (by the field)</text><text x="480" y="206" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >Oxen turn stone mills to press juice</text><text x="480" y="230" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >then it is boiled into sugar</text>
<line x1="614.0" y1="160.0" x2="638.8" y2="160.0" stroke="#6B5E52" stroke-width="5" stroke-linecap="round"/><path d="M646.0,160.0 L635.2,165.2 L635.2,154.8 Z" fill="#6B5E52"/>
<rect x="650" y="66" width="260" height="190" rx="18" fill="#fff" stroke="#8A5A2B" stroke-width="2.5"/>
<text x="780" y="124" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🍬</text><text x="780" y="172" text-anchor="middle" font-size="19" font-weight="900" fill="#8A5A2B" >Sugar</text><text x="780" y="206" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >Much smaller</text><text x="780" y="230" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >Easy to carry to market</text>
<rect x="50" y="280" width="860" height="100" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="480" y="312" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >Sugar mills were also called 糖寮, 糖間, 蔗廍 (廍 sounds like “bù”); many became place names</text>
<text x="480" y="344" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >These names are mostly on Taiwan’s western plains (good for sugarcane)</text>
<text x="480" y="368" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >Use the Ministry of the Interior’s Place Name Information Service to search names near home</text>
<text x="480" y="404" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >(original drawing)</text>
</svg>
