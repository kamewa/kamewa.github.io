<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="450" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="20.1" font-weight="800" fill="#332B25" >Taiwan’s primary industries: features → challenges → changes</text>
<rect x="30" y="66" width="280" height="330" rx="18" fill="#E3F4E5" stroke="#45392F" stroke-width="2"/>
<rect x="95.0" y="84.9" width="150" height="34.199999999999996" rx="17.099999999999998" fill="#3E8E5A" stroke="#45392F" stroke-width="2"/><text x="170" y="108.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">Features</text>
<text x="50" y="156" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >① Intensive farming: little land,</text>
<text x="50" y="192" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >so lots of labor and money</text>
<text x="50" y="228" text-anchor="start" font-size="14.6" font-weight="800" fill="#332B25" >② Better technology: new varieties,</text>
<text x="50" y="264" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >water-quality checks</text>
<text x="50" y="300" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >③ Commercial products:</text>
<text x="50" y="336" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >grown for market demand</text>
<line x1="314.0" y1="230.0" x2="328.8" y2="230.0" stroke="#6B5E52" stroke-width="5" stroke-linecap="round"/><path d="M336.0,230.0 L325.2,235.2 L325.2,224.8 Z" fill="#6B5E52"/>
<rect x="340" y="66" width="280" height="330" rx="18" fill="#FDE8E3" stroke="#45392F" stroke-width="2"/>
<rect x="405.0" y="84.9" width="150" height="34.199999999999996" rx="17.099999999999998" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="480" y="108.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">Challenges</text>
<text x="360" y="156" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >Small scale: high costs, low profits</text>
<text x="360" y="192" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >Changing diets</text>
<text x="360" y="228" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >Aging villages, too few workers</text>
<text x="360" y="264" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >Joined the WTO in 2002,</text>
<text x="360" y="300" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >facing cheap imported farm goods</text>
<line x1="624.0" y1="230.0" x2="638.8" y2="230.0" stroke="#6B5E52" stroke-width="5" stroke-linecap="round"/><path d="M646.0,230.0 L635.2,235.2 L635.2,224.8 Z" fill="#6B5E52"/>
<rect x="650" y="66" width="280" height="330" rx="18" fill="#E1EFF9" stroke="#45392F" stroke-width="2"/>
<rect x="715.0" y="84.9" width="150" height="34.199999999999996" rx="17.099999999999998" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="790" y="108.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">Ways to change</text>
<text x="670" y="156" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >High-value farming: organic crops,</text>
<text x="670" y="192" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >high-value farm products</text>
<text x="670" y="228" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >Leisure farming: add tourism</text>
<text x="670" y="264" text-anchor="start" font-size="14.0" font-weight="800" fill="#332B25" >(leisure farms, forest recreation areas)</text>
<text x="670" y="300" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >Start brands, make new products</text>
<text x="480" y="430" text-anchor="middle" font-size="15" font-weight="900" fill="#6B4E2E" >Example: tilapia skin made into bags, scales into artificial-cornea material → adding value</text>
</svg>
