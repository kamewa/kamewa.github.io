<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 485" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="485" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >Old City of Jerusalem: the “Holy City” of three religions (diagram)</text>
<rect x="60" y="60" width="420" height="380" rx="10" fill="#C9B38A" stroke="#45392F" stroke-width="3"/>
<rect x="70" y="70" width="180" height="200" fill="#CFE3F5" stroke="#45392F" stroke-width="2"/>
<text x="160.0" y="164.0" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >✝️</text><text x="160.0" y="200.0" text-anchor="middle" font-size="17" font-weight="900" fill="#332B25" >Christian Quarter</text>
<rect x="250" y="70" width="220" height="200" fill="#D7EBC9" stroke="#45392F" stroke-width="2"/>
<text x="360.0" y="164.0" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >☪️</text><text x="360.0" y="200.0" text-anchor="middle" font-size="17" font-weight="900" fill="#332B25" >Muslim Quarter</text>
<rect x="70" y="270" width="130" height="160" fill="#F3D9C2" stroke="#45392F" stroke-width="2"/>
<text x="135.0" y="344.0" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >⛪</text><text x="135.0" y="380.0" text-anchor="middle" font-size="13.9" font-weight="900" fill="#332B25" >Armenian Quarter</text>
<rect x="200" y="270" width="270" height="160" fill="#F6E7A8" stroke="#45392F" stroke-width="2"/>
<text x="335.0" y="344.0" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >✡️</text><text x="335.0" y="380.0" text-anchor="middle" font-size="17" font-weight="900" fill="#332B25" >Jewish Quarter</text>
<text x="270" y="462" text-anchor="middle" font-size="14" font-weight="800" fill="#6B5E52" >The Old City is only about 1 km²</text>
<rect x="520" y="74" width="400" height="74" rx="14" fill="#fff" stroke="#45392F" stroke-width="1.8"/>
<text x="545" y="106" text-anchor="start" font-size="19" font-weight="900" fill="#332B25" >✡️ Judaism</text><text x="545" y="134" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >Homeland and holy site of the Jews</text>
<rect x="520" y="166" width="400" height="74" rx="14" fill="#fff" stroke="#45392F" stroke-width="1.8"/>
<text x="545" y="198" text-anchor="start" font-size="19" font-weight="900" fill="#332B25" >✝️ Christianity</text><text x="545" y="226" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >Where Jesus was crucified</text>
<rect x="520" y="258" width="400" height="74" rx="14" fill="#fff" stroke="#45392F" stroke-width="1.8"/>
<text x="545" y="290" text-anchor="start" font-size="19" font-weight="900" fill="#332B25" >☪️ Islam</text><text x="545" y="318" text-anchor="start" font-size="14.5" font-weight="800" fill="#6B5E52" >Holy site of Muhammad’s ascension</text>
<text x="720" y="400" text-anchor="middle" font-size="11.6" font-weight="900" fill="#B03A2E" >Ruled by different powers for a thousand years,</text>
<text x="720" y="424" text-anchor="middle" font-size="15" font-weight="900" fill="#B03A2E" >many religious issues are still unsolved</text>
