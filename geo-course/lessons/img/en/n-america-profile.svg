<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="960" height="360" rx="20" fill="#EAF5FB"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25">Cross-section of North America (about 40°N, west to east)</text>
  <!-- 海 -->
  <rect x="0" y="262" width="960" height="98" fill="#9FD0EA"/>
  <!-- 地形剖面 -->
  <path d="M30,270 C60,262 80,250 100,232 L135,150 L160,190 L185,110 L215,170 L240,95 L270,160 L300,175
           C340,205 380,222 430,232 C520,244 600,246 650,240
           C680,234 700,214 720,200 C740,188 760,196 780,210 C800,222 830,240 870,256 C900,264 920,268 940,270 L940,360 L30,360 Z"
        fill="#C9A77A" stroke="#45392F" stroke-width="3" stroke-linejoin="round"/>
  <path d="M100,232 L135,150 L160,190 L185,110 L215,170 L240,95 L270,160 L300,175 C340,205 380,222 430,232"
        fill="none" stroke="#8C6A45" stroke-width="2" opacity=".5"/>
  <!-- 雪頂 -->
  <path d="M175,128 L185,110 L195,128 Z M230,113 L240,95 L250,113 Z" fill="#fff" stroke="#45392F" stroke-width="2" stroke-linejoin="round"/>
  <!-- 平原綠帶 -->
  <path d="M330,200 C380,222 430,232 520,242 C600,247 640,242 650,240" fill="none" stroke="#7CB46A" stroke-width="8" stroke-linecap="round"/>
  <!-- 標籤 -->
  <g font-weight="800">
    <rect x="120" y="58" width="150" height="34" rx="17" fill="#E0694F" stroke="#45392F" stroke-width="2"/>
    <text x="195" y="81" text-anchor="middle" font-size="14.9" fill="#fff">Western mountains</text>
    <text x="195" y="215" text-anchor="middle" font-size="15" fill="#332B25">Rocky Mountains</text>
    <rect x="410" y="150" width="150" height="34" rx="17" fill="#2E9A86" stroke="#45392F" stroke-width="2"/>
    <text x="485" y="173" text-anchor="middle" font-size="17" fill="#fff">Central plains</text>
    <text x="485" y="280" text-anchor="middle" font-size="15" fill="#332B25">Great Plains · Mississippi River</text>
    <rect x="680" y="128" width="190" height="34" rx="17" fill="#F2A343" stroke="#45392F" stroke-width="2"/>
    <text x="775" y="151" text-anchor="middle" font-size="14.4" fill="#38241D">Eastern plateaus and hills</text>
    <text x="750" y="250" text-anchor="middle" font-size="15" fill="#332B25">Appalachian Mountains</text>
  </g>
  <g font-size="15" font-weight="700" fill="#2F5F78">
    <text x="40" y="320">Pacific Ocean</text>
    <text x="880" y="320" text-anchor="end">Atlantic Ocean</text>
    <text x="480" y="335" text-anchor="middle" fill="#6B5E54">High in the west, low in the east: young fold mountains are tall; old mountains are worn low</text>
  </g>
  <text x="940" y="352" text-anchor="end" font-size="11" fill="#96887D">Diagram · heights not to scale</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
