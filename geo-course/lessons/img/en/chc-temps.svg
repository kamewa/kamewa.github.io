<line x1="160.0" y1="432.0" x2="654.0" y2="432.0" stroke="#6B5E52" stroke-width="3" stroke-linecap="round"/><path d="M660.0,432.0 L651.0,436.3 L651.0,427.7 Z" fill="#6B5E52"/><text x="410" y="452.0" text-anchor="middle" font-size="12.5" font-weight="900" fill="#6B5E52" >North → south (lower latitude)</text>
<rect x="250" y="62" width="16" height="16" fill="#5DA2D6"/><text x="272" y="76" text-anchor="start" font-size="13.5" font-weight="900" fill="#332B25" >January average</text>
