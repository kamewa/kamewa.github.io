<text x="835" y="94" text-anchor="middle" font-size="15.5" font-weight="900" fill="#E0694F" >Summer (July)</text>
<text x="835" y="122" text-anchor="middle" font-size="11.5" font-weight="800" fill="#332B25" >Mostly above 20℃, hot everywhere</text>
<text x="835" y="146" text-anchor="middle" font-size="11.5" font-weight="800" fill="#332B25" >Sun more direct: small N–S gap</text>
<text x="835" y="170" text-anchor="middle" font-size="11.5" font-weight="800" fill="#332B25" >Mountains, plateaus stay cooler</text>
<rect x="730" y="206" width="210" height="128" rx="14" fill="#fff" stroke="#4A90C2" stroke-width="2.5"/>
<text x="835" y="234" text-anchor="middle" font-size="15.5" font-weight="900" fill="#4A90C2" >Winter (January)</text>
<text x="835" y="262" text-anchor="middle" font-size="11.5" font-weight="800" fill="#332B25" >Big N–S gap (about -25℃ to 20℃)</text>
<text x="835" y="286" text-anchor="middle" font-size="11.5" font-weight="800" fill="#332B25" >East: higher latitude, colder</text>
<text x="835" y="310" text-anchor="middle" font-size="11.5" font-weight="800" fill="#332B25" >0℃ isotherm ≈ Qinling–Huai line</text>
<rect x="730" y="346" width="210" height="128" rx="14" fill="#fff" stroke="#9C6ADE" stroke-width="2.5"/>
<text x="835" y="374" text-anchor="middle" font-size="15.5" font-weight="900" fill="#9C6ADE" >Same latitude</text>
<text x="835" y="402" text-anchor="middle" font-size="11.5" font-weight="800" fill="#332B25" >Lhasa in Jan: about -5℃ (high)</text>
<text x="835" y="426" text-anchor="middle" font-size="11.5" font-weight="800" fill="#332B25" >Shanghai in Jan: about 5℃ (low)</text>
<text x="835" y="450" text-anchor="middle" font-size="11.5" font-weight="800" fill="#332B25" >West: high land, colder winters</text>
<text x="360" y="488" text-anchor="middle" font-size="10.2" font-weight="800" fill="#6B5E52" >(City monthly averages are approximate climate normals, drawn for this lesson)</text>
</svg>
