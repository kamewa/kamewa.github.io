<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="430" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >Taiwan’s many peoples</text>
<rect x="30" y="66" width="290" height="300" rx="18" fill="#E3F4E5" stroke="#45392F" stroke-width="2"/>
<text x="175" y="122" text-anchor="middle" font-size="44">🏔️</text><text x="175" y="162" text-anchor="middle" font-size="20" font-weight="900" fill="#3E8E5A" >Indigenous peoples</text>
<text x="175" y="204" text-anchor="middle" font-size="15.5" font-weight="800" fill="#332B25" >Austronesian peoples</text>
<text x="175" y="240" text-anchor="middle" font-size="15.5" font-weight="800" fill="#332B25" >16 recognized groups</text>
<text x="175" y="276" text-anchor="middle" font-size="14.9" font-weight="800" fill="#332B25" >Once mostly in mountains and the east</text>
<text x="175" y="312" text-anchor="middle" font-size="15.5" font-weight="800" fill="#332B25" >More now move to cities</text>
<rect x="340" y="66" width="290" height="300" rx="18" fill="#FDE8E3" stroke="#45392F" stroke-width="2"/>
<text x="485" y="122" text-anchor="middle" font-size="44">🏮</text><text x="485" y="162" text-anchor="middle" font-size="20" font-weight="900" fill="#E0694F" >Han people</text>
<text x="485" y="204" text-anchor="middle" font-size="15.5" font-weight="800" fill="#332B25" >The largest group</text>
<text x="485" y="240" text-anchor="middle" font-size="15.5" font-weight="800" fill="#332B25" >Hoklo and Hakka people</text>
<text x="485" y="276" text-anchor="middle" font-size="14.9" font-weight="800" fill="#332B25" >Crossed the sea from China’s SE coast</text>
<text x="485" y="312" text-anchor="middle" font-size="13.0" font-weight="800" fill="#332B25" >About 1.2 million postwar immigrants in 1949</text>
<rect x="650" y="66" width="290" height="300" rx="18" fill="#E1EFF9" stroke="#45392F" stroke-width="2"/>
<text x="795" y="122" text-anchor="middle" font-size="44">🌏</text><text x="795" y="162" text-anchor="middle" font-size="16.5" font-weight="900" fill="#4A90C2" >New immigrants &amp; migrant workers</text>
<text x="795" y="204" text-anchor="middle" font-size="15.5" font-weight="800" fill="#332B25" >Come to Taiwan for work or marriage</text>
<text x="795" y="240" text-anchor="middle" font-size="15.2" font-weight="800" fill="#332B25" >Mostly from China and Southeast Asia</text>
<text x="795" y="276" text-anchor="middle" font-size="13.2" font-weight="800" fill="#332B25" >Hundreds of thousands of SE Asian workers</text>
<text x="795" y="312" text-anchor="middle" font-size="15.5" font-weight="800" fill="#332B25" >Working in Taiwan for a short time</text>
<text x="480" y="404" text-anchor="middle" font-size="15" font-weight="800" fill="#6B4E2E" >Groups who came at different times, together with Indigenous peoples, make Taiwan multicultural</text>
</svg>
