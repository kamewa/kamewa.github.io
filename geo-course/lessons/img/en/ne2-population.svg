<text x="755.6" y="251" text-anchor="middle" font-size="17" font-weight="900" fill="#332B25" >~29%</text>
<rect x="170" y="342" width="22" height="22" rx="4" fill="#8FC4E8" stroke="#45392F" stroke-width="1.5"/><text x="202" y="360" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >Children (0–14)</text>
<rect x="420" y="342" width="22" height="22" rx="4" fill="#F6D776" stroke="#45392F" stroke-width="1.5"/><text x="452" y="360" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >Working age (15–64)</text>
<rect x="670" y="342" width="22" height="22" rx="4" fill="#F2A6A0" stroke="#45392F" stroke-width="1.5"/><text x="702" y="360" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >Elderly (65+)</text>
<line x1="820.0" y1="160.0" x2="820.0" y2="197.8" stroke="#E0694F" stroke-width="4" stroke-linecap="round"/><path d="M820.0,205.0 L814.8,194.2 L825.2,194.2 Z" fill="#E0694F"/><text x="840" y="190" text-anchor="start" font-size="12.8" font-weight="900" fill="#B03A2E" >Many more elderly</text>
<text x="480" y="400" text-anchor="middle" font-size="15" font-weight="900" fill="#C0392B" >Result: too few workers and high wages → Japan develops automation, robots, and care technology</text>
<text x="480" y="424" text-anchor="middle" font-size="12" font-weight="800" fill="#6B5E52" >(Rough shares, from Japanese government statistics)</text>
