<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="440" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >Japan’s population: fewer children, more old people</text>
<text x="120" y="130" text-anchor="end" font-size="20" font-weight="900" fill="#332B25" >1950</text>
<rect x="140.0" y="90" width="252.0" height="64" fill="#8FC4E8" stroke="#45392F" stroke-width="2"/>
<text x="266.0" y="131" text-anchor="middle" font-size="17" font-weight="900" fill="#332B25" >~35%</text>
<rect x="392.0" y="90" width="432.0" height="64" fill="#F6D776" stroke="#45392F" stroke-width="2"/>
<text x="608.0" y="131" text-anchor="middle" font-size="17" font-weight="900" fill="#332B25" >~60%</text>
<rect x="824.0" y="90" width="36.0" height="64" fill="#F2A6A0" stroke="#45392F" stroke-width="2"/>
<text x="842.0" y="131" text-anchor="middle" font-size="11.6" font-weight="900" fill="#332B25" >~5%</text>
<text x="120" y="250" text-anchor="end" font-size="20" font-weight="900" fill="#332B25" >2024</text>
<rect x="140.0" y="210" width="79.2" height="64" fill="#8FC4E8" stroke="#45392F" stroke-width="2"/>
<text x="179.6" y="251" text-anchor="middle" font-size="13" font-weight="900" fill="#332B25" >~11%</text>
<rect x="219.2" y="210" width="432.0" height="64" fill="#F6D776" stroke="#45392F" stroke-width="2"/>
<text x="435.2" y="251" text-anchor="middle" font-size="17" font-weight="900" fill="#332B25" >~60%</text>
