<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="480" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >River system, catchment, river basin, divide</text>
<rect x="20" y="56" width="560" height="390" rx="14" fill="#EAF4E2" stroke="#45392F" stroke-width="2"/>
<path d="M70,90 C200,70 380,70 520,100 C540,180 520,260 470,330 C420,380 360,410 300,420 C240,410 180,380 130,330 C80,260 60,180 70,90 Z" fill="#D6EBC8" stroke="#2E9A86" stroke-width="4" stroke-dasharray="10 6"/>
<path d="M72,175 C68,140 68,110 70,90 C200,70 380,70 520,100 C530,150 526,190 518,212 C430,232 330,250 268,250 C200,242 130,226 80,205 Z" fill="#F4B9AE" fill-opacity=".6" stroke="#E0694F" stroke-width="3"/>
<path d="M300,420 C295,360 290,320 268,250 C250,200 260,150 300,100" stroke="#3E7FB5" stroke-width="7" fill="none" stroke-linecap="round"/>
<path d="M268,250 C220,220 170,190 120,140" stroke="#5FA8D3" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M262,200 C220,160 180,130 150,100" stroke="#5FA8D3" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M282,320 C350,295 420,268 490,250" stroke="#5FA8D3" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M275,180 C330,160 380,140 450,110" stroke="#5FA8D3" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M290,360 C240,340 190,310 150,290" stroke="#5FA8D3" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M180,155 C170,130 175,110 190,95" stroke="#5FA8D3" stroke-width="4" fill="none" stroke-linecap="round"/>
<circle cx="268" cy="250" r="9" fill="#E0694F" stroke="#fff" stroke-width="2"/><text x="250" y="274" text-anchor="middle" font-size="18" font-weight="900" fill="#C0392B" >A</text>
<text x="300" y="440" text-anchor="middle" font-size="13" font-weight="900" fill="#1F5F8B" >River mouth</text>
<text x="300" y="92" text-anchor="middle" font-size="12" font-weight="800" fill="#6B5E52" >Upstream (high land)</text>
<text x="170" y="175" text-anchor="middle" font-size="13" font-weight="900" fill="#B03A2E" >Catchment of point A</text>
<text x="420" y="330" text-anchor="middle" font-size="16" font-weight="900" fill="#1F7A68" >River basin</text>
<text x="340" y="300" text-anchor="middle" font-size="12" font-weight="900" fill="#1F5F8B" >Main river</text><text x="430" y="175" text-anchor="middle" font-size="12" font-weight="900" fill="#1F5F8B" >Tributary</text>
<rect x="615.0" y="84.8" width="90" height="30.4" rx="15.2" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="660" y="105.6" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">River system</text>
<text x="612" y="134" text-anchor="start" font-size="13.0" font-weight="800" fill="#332B25" >Main river plus tributaries, a network like tree branches</text>
<rect x="615.0" y="172.8" width="90" height="30.4" rx="15.2" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="660" y="193.6" text-anchor="middle" font-size="15.0" font-weight="800" fill="#fff">Catchment</text>
<text x="612" y="222" text-anchor="start" font-size="11.1" font-weight="800" fill="#332B25" >Area upstream of a point; when it rains, water flows to that point</text>
<rect x="615.0" y="260.8" width="90" height="30.4" rx="15.2" fill="#2E9A86" stroke="#45392F" stroke-width="2"/><text x="660" y="281.6" text-anchor="middle" font-size="14.5" font-weight="800" fill="#fff">River basin</text>
<text x="612" y="310" text-anchor="start" font-size="11.5" font-weight="800" fill="#332B25" >Catchment above the river mouth = a river’s largest catchment</text>
<rect x="615.0" y="348.8" width="90" height="30.4" rx="15.2" fill="#E0A43A" stroke="#45392F" stroke-width="2"/><text x="660" y="369.6" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Divide</text>
<text x="612" y="398" text-anchor="start" font-size="12.6" font-weight="800" fill="#332B25" >The line between two neighboring basins, usually a ridge</text>
<text x="300" y="466" text-anchor="middle" font-size="13" font-weight="800" fill="#6B5E52" >Red = catchment of point A; green dashed line = the whole river basin</text>
