<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="400" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >Types of migration</text>
<rect x="260" y="70" width="380" height="56" fill="#FDF3DC" stroke="#45392F" stroke-width="1.8"/><text x="450.0" y="106" text-anchor="middle" font-size="19" font-weight="900" fill="#9C6A1E" >Temporary migration</text>
<rect x="640" y="70" width="220" height="56" fill="#FDF3DC" stroke="#45392F" stroke-width="1.8"/><text x="750.0" y="106" text-anchor="middle" font-size="19" font-weight="900" fill="#9C6A1E" >Permanent migration</text>
<rect x="120" y="126" width="140" height="110" fill="#E1EFF9" stroke="#45392F" stroke-width="1.8"/><text x="190" y="188.0" text-anchor="middle" font-size="19" font-weight="900" fill="#1F5F8B" >Domestic</text>
<rect x="260" y="126" width="380" height="110" fill="#fff" stroke="#45392F" stroke-width="1.8"/>
<rect x="640" y="126" width="220" height="110" fill="#fff" stroke="#45392F" stroke-width="1.8"/>
<text x="450.0" y="170" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >Study or work in another county</text>
<text x="450.0" y="200" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >Going home for Lunar New Year</text>
<text x="750.0" y="170" text-anchor="middle" font-size="12.6" font-weight="800" fill="#332B25" >A family moves from village to city</text>
<rect x="120" y="236" width="140" height="110" fill="#E1EFF9" stroke="#45392F" stroke-width="1.8"/><text x="190" y="298.0" text-anchor="middle" font-size="19" font-weight="900" fill="#1F5F8B" >International</text>
<rect x="260" y="236" width="380" height="110" fill="#fff" stroke="#45392F" stroke-width="1.8"/>
<rect x="640" y="236" width="220" height="110" fill="#fff" stroke="#45392F" stroke-width="1.8"/>
<text x="450.0" y="280" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >Foreign students, migrant workers</text>
<text x="450.0" y="310" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >Study or work abroad</text>
<text x="750.0" y="280" text-anchor="middle" font-size="11.7" font-weight="800" fill="#332B25" >New immigrants who marry in Taiwan</text>
<text x="750.0" y="310" text-anchor="middle" font-size="16" font-weight="800" fill="#332B25" >Emigrating abroad</text>
<text x="480" y="380" text-anchor="middle" font-size="14" font-weight="800" fill="#6B5E52" >By place: domestic, international; by time: temporary, permanent (examples written for this lesson)</text>
</svg>
