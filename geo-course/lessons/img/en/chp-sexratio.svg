<line x1="90" x2="690" y1="264.0" y2="264.0" stroke="#E5DED3"/><text x="82" y="269.0" text-anchor="end" font-size="12.5" font-weight="700" fill="#6B5E52" >110</text>
<line x1="90" x2="690" y1="206.0" y2="206.0" stroke="#E5DED3"/><text x="82" y="211.0" text-anchor="end" font-size="12.5" font-weight="700" fill="#6B5E52" >115</text>
<line x1="90" x2="690" y1="148.0" y2="148.0" stroke="#E5DED3"/><text x="82" y="153.0" text-anchor="end" font-size="12.5" font-weight="700" fill="#6B5E52" >120</text>
<line x1="90" x2="690" y1="90.0" y2="90.0" stroke="#E5DED3"/><text x="82" y="95.0" text-anchor="end" font-size="12.5" font-weight="700" fill="#6B5E52" >125</text>
<rect x="90" y="298.8" width="600" height="46.4" fill="#DDF2EF"/><text x="98" y="339.2" text-anchor="start" font-size="12" font-weight="900" fill="#2E9A86" >Natural ≈103–107</text>
<polyline points="140.0,281.4 240.0,248.9 302.5,199.0 365.0,173.5 415.0,134.1 465.0,141.0 490.0,170.0 552.5,223.4 615.0,248.9 665.0,275.6" fill="none" stroke="#4A90C2" stroke-width="4" stroke-linejoin="round"/>
<circle cx="140.0" cy="281.4" r="4.5" fill="#fff" stroke="#4A90C2" stroke-width="2.5"/>
<circle cx="240.0" cy="248.9" r="4.5" fill="#fff" stroke="#4A90C2" stroke-width="2.5"/>
<circle cx="302.5" cy="199.0" r="4.5" fill="#fff" stroke="#4A90C2" stroke-width="2.5"/>
<circle cx="365.0" cy="173.5" r="4.5" fill="#fff" stroke="#4A90C2" stroke-width="2.5"/>
<circle cx="415.0" cy="134.1" r="4.5" fill="#fff" stroke="#4A90C2" stroke-width="2.5"/>
<circle cx="465.0" cy="141.0" r="4.5" fill="#fff" stroke="#4A90C2" stroke-width="2.5"/>
<circle cx="490.0" cy="170.0" r="4.5" fill="#fff" stroke="#4A90C2" stroke-width="2.5"/>
<circle cx="552.5" cy="223.4" r="4.5" fill="#fff" stroke="#4A90C2" stroke-width="2.5"/>
