<circle cx="665.0" cy="275.6" r="4.5" fill="#fff" stroke="#4A90C2" stroke-width="2.5"/>
<text x="115.0" y="402" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >1980</text>
<text x="240.0" y="402" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >1990</text>
<text x="365.0" y="402" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >2000</text>
<text x="490.0" y="402" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >2010</text>
<text x="615.0" y="402" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >2020</text>
<line x1="102.5" x2="102.5" y1="90.0" y2="380" stroke="#9C6ADE" stroke-width="2" stroke-dasharray="6 4"/><text x="106.5" y="101.60000000000002" text-anchor="start" font-size="12.5" font-weight="900" fill="#9C6ADE" >One-child</text>
<line x1="552.5" x2="552.5" y1="90.0" y2="380" stroke="#3E8E5A" stroke-width="2" stroke-dasharray="6 4"/><text x="556.5" y="101.60000000000002" text-anchor="start" font-size="12.5" font-weight="900" fill="#3E8E5A" >Two-child</text>
<line x1="627.5" x2="627.5" y1="90.0" y2="380" stroke="#E0A43A" stroke-width="2" stroke-dasharray="6 4"/><text x="631.5" y="119.60000000000002" text-anchor="start" font-size="12.5" font-weight="900" fill="#E0A43A" >Three-child</text>
<text x="671.0" y="297.6" text-anchor="end" font-size="13.5" font-weight="900" fill="#4A90C2" stroke="#fff" stroke-width="3" paint-order="stroke">2024: ≈109</text>
<rect x="720" y="70" width="220" height="300" rx="14" fill="#fff" stroke="#45392F" stroke-width="1.5"/>
<text x="830" y="104" text-anchor="middle" font-size="15" font-weight="900" fill="#E0694F" >Problems</text>
<text x="830" y="138" text-anchor="middle" font-size="13.5" font-weight="900" fill="#332B25" >Son preference + one child</text>
<text x="830" y="172" text-anchor="middle" font-size="13.5" font-weight="900" fill="#332B25" >→ very unbalanced ratio</text>
<text x="830" y="240" text-anchor="middle" font-size="15" font-weight="900" fill="#3E8E5A" >Responses</text>
<text x="830" y="274" text-anchor="middle" font-size="13.5" font-weight="900" fill="#332B25" >“Boys and girls are equal”</text>
<text x="830" y="308" text-anchor="middle" font-size="13.5" font-weight="900" fill="#332B25" >Eased in recent years,</text>
<text x="830" y="342" text-anchor="middle" font-size="13.5" font-weight="900" fill="#332B25" >still above world average</text>
<text x="400" y="432" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >Sex ratio: boys per 100 girls born (approximate, from China NBS and other public data, original drawing)</text>
</svg>
