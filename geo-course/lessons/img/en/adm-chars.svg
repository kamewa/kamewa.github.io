<rect x="40" y="480" width="880" height="72" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="480" y="508" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >Besides words like east, west, south, north, middle, big, new, the most common are mountain, forest, lake, stream, harbor…</text>
<text x="480" y="536" text-anchor="middle" font-size="12.0" font-weight="800" fill="#6B5E52" >山 mountain・林 forest・里 village・埔 plain・竹 bamboo・湖 lake・港 harbor・水 water・溪 stream・金 gold (numbers = times used, textbook Fig. 1-1-8)</text>
