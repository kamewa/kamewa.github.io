<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 446" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="446" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >Lowering food safety risks: three eco-friendly ways</text>
<rect x="40" y="64" width="280" height="240" rx="14" fill="#fff" stroke="#3E8E5A" stroke-width="2.2"/>
<text x="180.0" y="108" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >🥬</text><text x="180.0" y="146" text-anchor="middle" font-size="16" font-weight="900" fill="#3E8E5A" >Buy organic</text>
<text x="180.0" y="176" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >No pesticides or chemical fertilizers</text>
<text x="180.0" y="200" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >Kind to the environment</text>
<text x="180.0" y="224" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >Costs more; needs buyers’ support</text>
<rect x="340" y="64" width="280" height="240" rx="14" fill="#fff" stroke="#4A90C2" stroke-width="2.2"/>
<text x="480.0" y="108" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >📋</text><text x="480.0" y="146" text-anchor="middle" font-size="16" font-weight="900" fill="#4A90C2" >Traceability certification</text>
<text x="480.0" y="176" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >Checked by a third party</text>
<text x="480.0" y="200" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >Records production and distribution</text>
<text x="480.0" y="224" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >Know where food comes from</text>
<rect x="640" y="64" width="280" height="240" rx="14" fill="#fff" stroke="#E0A43A" stroke-width="2.2"/>
<text x="780.0" y="108" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >📍</text><text x="780.0" y="146" text-anchor="middle" font-size="16" font-weight="900" fill="#E0A43A" >Eat more local food</text>
<text x="780.0" y="176" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >Local: fresh, short food miles</text>
<text x="780.0" y="200" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >Seasonal: less energy to keep fresh</text>
<text x="780.0" y="224" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >Farm to table, farmers’ markets</text>
<rect x="40" y="324" width="880" height="80" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="480" y="354" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >Eco-friendly eating: foods with less environmental impact (low carbon, organic)</text>
<text x="480" y="384" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >Look for carbon footprint labels; use your purchases to change production</text>
<text x="480" y="428" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >(original drawing)</text>
</svg>
