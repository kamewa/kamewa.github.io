<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 398" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="398" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >After joining the WTO in 2002</text>
<rect x="40" y="62" width="880" height="70" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="480" y="92" text-anchor="middle" font-size="15.5" font-weight="900" fill="#332B25" >WTO: free trade, lower tariffs and non-tariff barriers (e.g. import quotas)</text>
<text x="480" y="118" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >Goods are cheaper, but industries face more competition</text>
<rect x="40" y="152" width="280" height="200" rx="14" fill="#fff" stroke="#4A90C2" stroke-width="2.2"/>
<text x="180.0" y="196" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >🍔</text><text x="180.0" y="234" text-anchor="middle" font-size="16" font-weight="900" fill="#4A90C2" >Western-style diets</text>
<text x="180.0" y="264" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >More imported food</text>
<text x="180.0" y="288" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >More choices</text>
<text x="180.0" y="312" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >Changed eating habits</text>
<rect x="340" y="152" width="280" height="200" rx="14" fill="#fff" stroke="#3E8E5A" stroke-width="2.2"/>
<text x="480.0" y="196" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >💎</text><text x="480.0" y="234" text-anchor="middle" font-size="16" font-weight="900" fill="#3E8E5A" >Specialty farming</text>
<text x="480.0" y="264" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >High-quality products</text>
<text x="480.0" y="288" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >Higher added value</text>
<rect x="640" y="152" width="280" height="200" rx="14" fill="#fff" stroke="#9C6ADE" stroke-width="2.2"/>
<text x="780.0" y="196" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >🌸</text><text x="780.0" y="234" text-anchor="middle" font-size="16" font-weight="900" fill="#9C6ADE" >More exports</text>
<text x="780.0" y="264" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >e.g. orchids</text>
<text x="780.0" y="288" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >Improved breeds, custom colors</text>
<text x="480" y="380" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >(original drawing)</text>
</svg>
