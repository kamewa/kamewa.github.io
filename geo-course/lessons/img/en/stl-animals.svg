<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 418" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="418" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >Plants and animals in place names: past ecology</text>
<rect x="30" y="64" width="286" height="210" rx="18" fill="#fff" stroke="#3E8E5A" stroke-width="2.5"/>
<text x="173" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🦌</text><text x="173" y="168" text-anchor="middle" font-size="22" font-weight="900" fill="#3E8E5A" >Deer (鹿)</text><text x="173" y="204" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >Lugang, Lugu, Luye…</text><text x="173" y="240" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >Found all over → deer were once widespread</text>
<rect x="336" y="64" width="286" height="210" rx="18" fill="#fff" stroke="#8A5A2B" stroke-width="2.5"/>
<text x="479" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🐂</text><text x="479" y="168" text-anchor="middle" font-size="22" font-weight="900" fill="#8A5A2B" >Niuxu (牛墟)</text><text x="479" y="204" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >A cattle market</text><text x="479" y="240" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >Oxen were key farm labor</text>
<rect x="642" y="64" width="286" height="210" rx="18" fill="#fff" stroke="#2E9A86" stroke-width="2.5"/>
<text x="785" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🌳</text><text x="785" y="168" text-anchor="middle" font-size="22" font-weight="900" fill="#2E9A86" >Jiadong (茄苳)</text><text x="785" y="204" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >A village with a bishop wood tree</text><text x="785" y="240" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >Big trees became village landmarks</text>
<rect x="30" y="294" width="900" height="82" rx="14" fill="#FFF8E7" stroke="#E0694F" stroke-width="2"/>
<text x="480" y="326" text-anchor="middle" font-size="16" font-weight="900" fill="#E0694F" >⚠️ Names with “鹿 (deer)” are not always about deer!</text>
<text x="480" y="356" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >Shalu: from an Indigenous language　|　Chulu: Indigenous word in Japanese-style characters</text>
<text x="480" y="400" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >(original drawing)</text>
</svg>
