<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="460" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >How much of Earth’s water can people easily use?</text>
<text x="60" y="68" text-anchor="start" font-size="14.6" font-weight="900" fill="#332B25" >① All the world’s water</text>
<rect x="60.0" y="80" width="814.8" height="54" fill="#3E7FB5" stroke="#45392F" stroke-width="2"/>
<text x="467.4" y="104" text-anchor="middle" font-size="15" font-weight="900" fill="#fff" >Seawater (salt water)</text><text x="467.4" y="124" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >97%</text>
<rect x="874.8" y="80" width="25.2" height="54" fill="#9FD9C9" stroke="#45392F" stroke-width="2"/>
<text x="887.4" y="160" text-anchor="end" font-size="13" font-weight="900" fill="#2E9A86" >Other 3%</text>
<path d="M874.8,134 L60,196 M900.0,134 L900,196" stroke="#6B5E52" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="60" y="198" text-anchor="start" font-size="15" font-weight="900" fill="#332B25" >② Zoom in on the “other 3%”</text>
<rect x="60.0" y="210" width="646.8" height="54" fill="#DDEFF8" stroke="#45392F" stroke-width="2"/>
<text x="383.40000000000003" y="234" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >Ice and snow</text><text x="383.40000000000003" y="254" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >77%</text>
<rect x="706.8" y="210" width="184.8" height="54" fill="#B79A73" stroke="#45392F" stroke-width="2"/>
<text x="799.2" y="234" text-anchor="middle" font-size="15" font-weight="900" fill="#fff" >Groundwater</text><text x="799.2" y="254" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >22%</text>
<rect x="891.6" y="210" width="8.4" height="54" fill="#4FB59A" stroke="#45392F" stroke-width="2"/>
<text x="900" y="290" text-anchor="end" font-size="13" font-weight="900" fill="#2E9A86" >Other 1%</text>
<path d="M891.6,264 L60,326 M900.0,264 L900,326" stroke="#6B5E52" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="60" y="328" text-anchor="start" font-size="15" font-weight="900" fill="#332B25" >③ Zoom in on the “other 1%” (share of the 3%)</text>
<rect x="60.0" y="340" width="336.0" height="54" fill="#C9C2E6" stroke="#45392F" stroke-width="2"/>
<text x="228.0" y="373" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >Salt lakes 0.4%</text>
<rect x="396.0" y="340" width="294.0" height="54" fill="#2E9A86" stroke="#45392F" stroke-width="2"/>
<text x="543.0" y="373" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" >Rivers, freshwater lakes 0.35%</text>
<rect x="690.0" y="340" width="168.0" height="54" fill="#C9A77A" stroke="#45392F" stroke-width="2"/>
<text x="774.0" y="373" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >Soil moisture 0.2%</text>
<rect x="858.0" y="340" width="42.0" height="54" fill="#E6E1D8" stroke="#45392F" stroke-width="2"/>
<text x="879.0" y="373" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >0.05%</text>
<text x="900" y="418" text-anchor="end" font-size="12" font-weight="800" fill="#6B5E52" >Smallest box on the right: water vapor in the air 0.05%</text>
<text x="480" y="440" text-anchor="middle" font-size="15" font-weight="900" fill="#E0694F" >“Rivers and freshwater lakes,” easy to use directly, are a tiny part of the world’s water → value water</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
