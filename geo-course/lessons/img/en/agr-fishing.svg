<text x="240" y="470" text-anchor="middle" font-size="11.3" font-weight="800" fill="#332B25" >In winter, cold and warm currents meet near Taiwan: lots of plankton draws fish</text>
<rect x="480" y="64" width="460" height="92" rx="14" fill="#fff" stroke="#2E9A86" stroke-width="2.5"/>
<text x="500" y="98" text-anchor="start" font-size="19" font-weight="900" fill="#2E9A86" >Aquaculture</text>
<text x="500" y="124" text-anchor="start" font-size="13.2" font-weight="800" fill="#332B25" >Flat sandy southwest coast: fish ponds for milkfish and white shrimp</text>
<text x="500" y="146" text-anchor="start" font-size="13.5" font-weight="800" fill="#332B25" >Oysters on tidal flats; sea-cage farming offshore</text>
