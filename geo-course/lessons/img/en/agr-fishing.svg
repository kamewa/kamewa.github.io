<text x="500" y="202" text-anchor="start" font-size="19" font-weight="900" fill="#3E8E5A" >Coastal fishing</text>
<text x="500" y="228" text-anchor="start" font-size="13.5" font-weight="800" fill="#332B25" >Within 12 nautical miles, based at coastal harbors</text>
<rect x="480" y="272" width="460" height="92" rx="14" fill="#fff" stroke="#E0A43A" stroke-width="2.5"/>
<text x="500" y="306" text-anchor="start" font-size="19" font-weight="900" fill="#E0A43A" >Offshore fishing</text>
<text x="500" y="332" text-anchor="start" font-size="13.5" font-weight="800" fill="#332B25" >12–200 nautical miles from shore</text>
<rect x="480" y="376" width="460" height="92" rx="14" fill="#fff" stroke="#E0694F" stroke-width="2.5"/>
<text x="500" y="410" text-anchor="start" font-size="19" font-weight="900" fill="#E0694F" >Deep-sea fishing</text>
<text x="500" y="436" text-anchor="start" font-size="13.1" font-weight="800" fill="#332B25" >Beyond 200 nautical miles: South Pacific, Indian, and Atlantic Oceans</text>
<text x="710" y="486" text-anchor="middle" font-size="9.0" font-weight="800" fill="#6B5E52" >Capture fishing has three types by distance from shore; with fewer wild fish, aquaculture matters more and more</text>
