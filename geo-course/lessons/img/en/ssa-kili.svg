<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 475" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="475" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >Mt. Kilimanjaro: near the Equator, but snow on top</text>
<g transform="translate(105,0) scale(0.72,1)">
<path d="M60,420 L300,300 L420,140 L470,110 L520,140 L640,300 L900,420 Z" fill="#B9A58A" stroke="#45392F" stroke-width="2.5"/>
<path d="M420,140 L470,110 L520,140 L500,160 L480,148 L460,162 L440,150 Z" fill="#fff" stroke="#9C8E80" stroke-width="1.5"/>
<path d="M60,420 L180,360 L760,360 L900,420 Z" fill="#E8D49A"/>
<path d="M180,360 L300,300 L640,300 L760,360 Z" fill="#8CBF6A"/>
<path d="M300,300 L370,210 L570,210 L640,300 Z" fill="#5E9C55"/>
<path d="M370,210 L420,140 L520,140 L570,210 Z" fill="#C9B79A"/>
</g>
<text x="915" y="131" text-anchor="end" font-size="15" font-weight="900" fill="#1F5F8B" >❄️ Top: snow all year (highland climate)</text>
<text x="915" y="196" text-anchor="end" font-size="15" font-weight="900" fill="#6B5E52" >🪨 High: grass and rock</text>
<text x="915" y="266" text-anchor="end" font-size="15" font-weight="900" fill="#2E7D4F" >🌲 Middle slopes: forest</text>
<text x="915" y="336" text-anchor="end" font-size="14.7" font-weight="900" fill="#5B7A2E" >🌳 Lower slopes: savanna</text>
<text x="915" y="401" text-anchor="end" font-size="15" font-weight="900" fill="#9C6A1E" >🐘 Below: tropical savanna with elephants</text>
<text x="458" y="96" text-anchor="middle" font-size="15" font-weight="900" fill="#8A3B2E" >5,895 m</text>
<line x1="90.0" y1="400.0" x2="90.0" y2="137.2" stroke="#B9B0A6" stroke-width="3" stroke-linecap="round"/><path d="M90.0,130.0 L95.2,140.8 L84.8,140.8 Z" fill="#B9B0A6"/><text x="104" y="140" text-anchor="start" font-size="14" font-weight="900" fill="#6B5E52" >Higher = colder</text>
<text x="480" y="455" text-anchor="middle" font-size="10.9" font-weight="800" fill="#6B5E52" >Melting snow is an important water source for people and animals on the East African Plateau (“Kilimanjaro” means “white mountain, water mountain, shining”)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
