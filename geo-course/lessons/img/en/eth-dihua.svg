<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="395" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >Dihua Street: 170 years of an old street</text>
<line x1="70" x2="890" y1="150" y2="150" stroke="#45392F" stroke-width="4"/>
<circle cx="90" cy="150" r="14" fill="#3E8E5A" stroke="#45392F" stroke-width="2"/>
<text x="90" y="116" text-anchor="middle" font-size="16" font-weight="900" fill="#3E8E5A" >1850s</text>
<text x="90" y="196" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >Quanzhou traders arrive</text><text x="90" y="220" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >a street by the river</text>
<circle cx="285" cy="150" r="14" fill="#E0A43A" stroke="#45392F" stroke-width="2"/>
<text x="285" y="116" text-anchor="middle" font-size="16" font-weight="900" fill="#E0A43A" >Japanese rule</text>
<text x="285" y="196" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >Dried goods, herbs,</text><text x="285" y="220" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >and tea shops opened</text>
<circle cx="480" cy="150" r="14" fill="#4A90C2" stroke="#45392F" stroke-width="2"/>
<text x="480" y="116" text-anchor="middle" font-size="16" font-weight="900" fill="#4A90C2" >After the war</text>
<text x="480" y="196" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >Business grows:</text><text x="480" y="220" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >cloth merchants</text>
<circle cx="675" cy="150" r="14" fill="#6B5E52" stroke="#45392F" stroke-width="2"/>
<text x="675" y="116" text-anchor="middle" font-size="16" font-weight="900" fill="#6B5E52" >1970s–80s</text>
<text x="675" y="196" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >Taipei grew toward the east</text><text x="675" y="220" text-anchor="middle" font-size="12.7" font-weight="800" fill="#332B25" >and Dihua Street slowed down</text>
<circle cx="870" cy="150" r="14" fill="#E0694F" stroke="#45392F" stroke-width="2"/>
<text x="870" y="116" text-anchor="middle" font-size="16" font-weight="900" fill="#E0694F" >Recent years</text>
<text x="870" y="196" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >Renewal, new shops</text><text x="870" y="220" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >attract foreign visitors</text>
<rect x="60" y="256" width="840" height="116" rx="16" fill="#FDF3DC" stroke="#45392F" stroke-width="1.6"/>
<text x="480" y="292" text-anchor="middle" font-size="18" font-weight="900" fill="#9C6A1E" >Old street features</text>
<text x="480" y="324" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Arcades: long covered walkways that keep out the rain</text>
<text x="480" y="352" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Long, narrow row shops: shop in front, home behind (Hoklo style); plus Western-style buildings</text>
</svg>
