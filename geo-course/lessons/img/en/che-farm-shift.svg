<rect x="60" y="210" width="390" height="60" rx="12" fill="#F4F0E6"/><text x="88" y="248" text-anchor="middle" font-size="22" font-weight="400" fill="#332B25" >🥛</text><text x="114" y="236" text-anchor="start" font-size="14.5" font-weight="900" fill="#3E8E5A" >Inner Mongolia</text><text x="114" y="258" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >Dairy farms: a key milk area</text>
<rect x="60" y="282" width="390" height="60" rx="12" fill="#F4F0E6"/><text x="88" y="320" text-anchor="middle" font-size="22" font-weight="400" fill="#332B25" >🚜</text><text x="114" y="308" text-anchor="start" font-size="14.5" font-weight="900" fill="#3E8E5A" >Northeast China Plain</text><text x="114" y="330" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >Large-scale machine farming: a key breadbasket</text>
<rect x="490" y="64" width="430" height="300" rx="18" fill="#fff" stroke="#2E9A86" stroke-width="2.5"/>
<text x="705" y="112" text-anchor="middle" font-size="36" font-weight="400" fill="#332B25" >🌱</text><rect x="605.0" y="133.85" width="200" height="32.3" rx="16.15" fill="#2E9A86" stroke="#45392F" stroke-width="2"/><text x="705" y="155.95" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">Sustainable farming</text><text x="705" y="190" text-anchor="middle" font-size="14.5" font-weight="800" fill="#332B25" >Eco-farming with farm technology</text>
<rect x="510" y="210" width="390" height="60" rx="12" fill="#F4F0E6"/><text x="538" y="248" text-anchor="middle" font-size="22" font-weight="400" fill="#332B25" >💡</text><text x="564" y="236" text-anchor="start" font-size="14.5" font-weight="900" fill="#2E9A86" >Solar insect-trap lamps</text><text x="564" y="258" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >Catch pests, use fewer pesticides</text>
<rect x="510" y="282" width="390" height="60" rx="12" fill="#F4F0E6"/><text x="538" y="320" text-anchor="middle" font-size="22" font-weight="400" fill="#332B25" >⚖️</text><text x="564" y="308" text-anchor="start" font-size="14.5" font-weight="900" fill="#2E9A86" >Balance environment and harvest</text><text x="564" y="330" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >Richer soil, sustainable use</text>
<text x="480" y="394" text-anchor="middle" font-size="14" font-weight="800" fill="#6B5E52" >Traditional “farm east, herd west; dry north, paddy south” → now specialized, mechanized, ecological</text>
