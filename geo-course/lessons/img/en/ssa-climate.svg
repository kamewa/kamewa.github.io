<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="470" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="18.7" font-weight="800" fill="#332B25" >Africa’s climate: centered on the Equator, mirrored north and south</text>
<line x1="20" y1="253.0" x2="610" y2="253.0" stroke="#B03A2E" stroke-width="3" stroke-dasharray="8 5"/>
<rect x="90" y="64" width="500" height="54" fill="#C9E4F5" stroke="#45392F" stroke-width="1.5"/>
<text x="106" y="98" text-anchor="start" font-size="18" font-weight="900" fill="#332B25" >Mediterranean</text><text x="275" y="98" text-anchor="start" font-size="14" font-weight="800" fill="#6B5E52" >30°–40° west side | dry summer, rainy winter</text>
<rect x="90" y="118" width="500" height="54" fill="#F6E3B4" stroke="#45392F" stroke-width="1.5"/>
<text x="106" y="152" text-anchor="start" font-size="18" font-weight="900" fill="#332B25" >Tropical desert</text><text x="275" y="152" text-anchor="start" font-size="14" font-weight="800" fill="#6B5E52" >Near the Tropics | dry, little rain</text>
<rect x="90" y="172" width="500" height="54" fill="#E3EFB4" stroke="#45392F" stroke-width="1.5"/>
<text x="106" y="206" text-anchor="start" font-size="18" font-weight="900" fill="#332B25" >Tropical savanna</text><text x="275" y="206" text-anchor="start" font-size="11.4" font-weight="800" fill="#6B5E52" >Between rainforest and desert | rainy summer, dry winter</text>
<rect x="90" y="226" width="500" height="54" fill="#9FD49A" stroke="#45392F" stroke-width="1.5"/>
<text x="106" y="260" text-anchor="start" font-size="18" font-weight="900" fill="#332B25" >Tropical rainforest</text><text x="275" y="260" text-anchor="start" font-size="14" font-weight="800" fill="#6B5E52" >Near the Equator | hot and rainy all year</text>
<rect x="90" y="280" width="500" height="54" fill="#E3EFB4" stroke="#45392F" stroke-width="1.5"/>
<text x="106" y="314" text-anchor="start" font-size="18" font-weight="900" fill="#332B25" >Tropical savanna</text><text x="275" y="314" text-anchor="start" font-size="11.4" font-weight="800" fill="#6B5E52" >Between rainforest and desert | rainy summer, dry winter</text>
<rect x="90" y="334" width="500" height="54" fill="#F6E3B4" stroke="#45392F" stroke-width="1.5"/>
<text x="106" y="368" text-anchor="start" font-size="18" font-weight="900" fill="#332B25" >Tropical desert</text><text x="275" y="368" text-anchor="start" font-size="14" font-weight="800" fill="#6B5E52" >Near the Tropics | dry, little rain</text>
<rect x="90" y="388" width="500" height="54" fill="#C9E4F5" stroke="#45392F" stroke-width="1.5"/>
<text x="106" y="422" text-anchor="start" font-size="18" font-weight="900" fill="#332B25" >Mediterranean</text><text x="275" y="422" text-anchor="start" font-size="14" font-weight="800" fill="#6B5E52" >30°–40° west side | dry summer, rainy winter</text>
<text x="28" y="245.0" text-anchor="start" font-size="14" font-weight="900" fill="#B03A2E" >Equator</text>
<text x="60" y="56" text-anchor="middle" font-size="15" font-weight="900" fill="#6B5E52" >N</text><text x="60" y="464" text-anchor="middle" font-size="15" font-weight="900" fill="#6B5E52" >S</text>
<text x="780" y="90" text-anchor="middle" font-size="16.2" font-weight="900" fill="#6B3410" >Two that are not mirrored</text>
<rect x="620" y="110" width="310" height="110" rx="14" fill="#fff" stroke="#45392F" stroke-width="1.8"/>
<text x="640" y="148" text-anchor="start" font-size="17" font-weight="900" fill="#6B5E52" >🏔️ Highland climate</text>
<text x="640" y="178" text-anchor="start" font-size="13.5" font-weight="800" fill="#6B5E52" >Eastern plateaus (Ethiopia, East Africa)</text><text x="640" y="202" text-anchor="start" font-size="13.5" font-weight="800" fill="#6B5E52" >Low latitude but high land → cool</text>
<rect x="620" y="240" width="310" height="110" rx="14" fill="#fff" stroke="#45392F" stroke-width="1.8"/>
<text x="640" y="278" text-anchor="start" font-size="15.9" font-weight="900" fill="#2E9A86" >🌧️ Warm temperate with summer rain</text>
<text x="640" y="308" text-anchor="start" font-size="13.5" font-weight="800" fill="#6B5E52" >Southeast corner (SE coast of South Africa)</text><text x="640" y="332" text-anchor="start" font-size="12.8" font-weight="800" fill="#6B5E52" >Faces SE trade winds in summer → lots of rain</text>
<text x="775" y="420" text-anchor="middle" font-size="9.6" font-weight="900" fill="#B03A2E" >Other areas are roughly mirrored north and south</text>
