<text x="840.0" y="105" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" >High seas</text>
<text x="840.0" y="136" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >Belongs to no country</text>
<text x="222" y="154" text-anchor="middle" font-size="12" font-weight="800" fill="#C0392B" >12 nmi</text>
<line x1="760" y1="86" x2="760" y2="180" stroke="#45392F" stroke-width="2" stroke-dasharray="5 4"/>
<text x="905" y="390" text-anchor="end" font-size="11" font-weight="800" fill="#6B5E52" >Diagram; depth exaggerated</text>
<text x="480" y="432" text-anchor="middle" font-size="13.5" font-weight="800" fill="#6B5E52" >Territorial sea, economic zone, high seas: by “distance from the baseline”; continental shelf: by “water depth”</text>
<text x="480" y="457" text-anchor="middle" font-size="14" font-weight="700" fill="#6B5E52" >1 nmi ≈ 1.852 km; when neighbors’ economic zones overlap, fishing disputes happen easily</text>
