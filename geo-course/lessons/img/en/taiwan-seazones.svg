<rect x="252.0" y="242.75" width="96" height="28.5" rx="14.25" fill="#5E9E3E" stroke="#45392F" stroke-width="2"/><text x="300" y="262.25" text-anchor="middle" font-size="10.4" font-weight="800" fill="#fff">Continental shelf</text>
<text x="300" y="289" text-anchor="middle" font-size="13" font-weight="900" fill="#3B2A1C" >From the coast along the sea floor to 200 m deep</text>
