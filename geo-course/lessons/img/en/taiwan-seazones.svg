<text x="205.0" y="105" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" >Terr. sea</text>
<text x="223.0" y="136" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >Country’s territory</text>
<rect x="240" y="86" width="520" height="26" fill="#E0A43A" opacity=".9" stroke="#45392F" stroke-width="2"/>
<text x="500.0" y="105" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" >Economic zone 200 nmi</text>
<text x="500.0" y="136" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >Can use fish, minerals, etc.</text>
