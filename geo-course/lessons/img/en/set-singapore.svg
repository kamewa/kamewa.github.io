<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 378" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="378" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="21.3" font-weight="800" fill="#332B25" >Garden city Singapore: balancing people and nature</text>
<rect x="30" y="64" width="280" height="260" rx="18" fill="#E3F4E5" stroke="#45392F" stroke-width="2"/>
<text x="170" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🌳</text><rect x="100.0" y="146.9" width="140" height="34.199999999999996" rx="17.099999999999998" fill="#3E8E5A" stroke="#45392F" stroke-width="2"/><text x="170" y="170.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">Greening</text>
<text x="170" y="214" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Space for street trees</text>
<text x="170" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Nature reserves</text>
<text x="170" y="274" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Cooler summers than Taipei</text>
