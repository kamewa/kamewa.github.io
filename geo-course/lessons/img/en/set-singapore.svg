<text x="480" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🚇</text><rect x="410.0" y="146.9" width="140" height="34.199999999999996" rx="17.099999999999998" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="480" y="170.3" text-anchor="middle" font-size="12.7" font-weight="800" fill="#fff">Public transportation</text>
<text x="480" y="214" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >New towns in the suburbs</text>
<text x="480" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Good public transportation</text>
<text x="480" y="274" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Links to downtown</text>
<rect x="650" y="64" width="280" height="260" rx="18" fill="#FDE8E3" stroke="#45392F" stroke-width="2"/>
<text x="790" y="120" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🚗</text><rect x="720.0" y="146.9" width="140" height="34.199999999999996" rx="17.099999999999998" fill="#E0694F" stroke="#45392F" stroke-width="2"/><text x="790" y="170.3" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">Limiting cars</text>
<text x="790" y="214" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >High car taxes</text>
<text x="790" y="244" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Limits on car licenses</text>
<text x="790" y="274" text-anchor="middle" font-size="15" font-weight="800" fill="#332B25" >Less traffic and air pollution</text>
<text x="480" y="358" text-anchor="middle" font-size="14" font-weight="800" fill="#6B5E52" >Singapore is a city-state with no countryside, in a tropical rainforest climate, with an important location and busy trade</text>
