<svg data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="960" height="420" rx="20" fill="#DDF0F8"/>
  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="800" fill="#332B25">Three island groups: roughly divided by the Equator and 180°</text>
  <rect x="60" y="60" width="440" height="140" rx="14" fill="#E3EFF6" stroke="#4A88A9" stroke-width="2.5"/>
  <rect x="60" y="210" width="440" height="180" rx="14" fill="#F1E7F5" stroke="#9263A3" stroke-width="2.5"/>
  <rect x="510" y="60" width="390" height="330" rx="14" fill="#FEF3D6" stroke="#F2A343" stroke-width="2.5"/>
  <line x1="40" y1="205" x2="920" y2="205" stroke="#C45037" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="915" y="198" text-anchor="end" font-size="16" font-weight="800" fill="#C45037">Equator 0°</text>
  <line x1="505" y1="50" x2="505" y2="400" stroke="#376C87" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="512" y="410" font-size="16" font-weight="800" fill="#376C87">180° longitude</text>
  <g font-weight="900" text-anchor="middle">
    <text x="280" y="120" font-size="28" fill="#2F5F78">Micronesia</text>
    <text x="280" y="152" font-size="17" fill="#2F5F78" font-weight="700">“Small islands” · north of the Equator, west of 180°</text>
    <text x="280" y="290" font-size="28" fill="#6E4180">Melanesia</text>
    <text x="280" y="322" font-size="17" fill="#6E4180" font-weight="700">“Black islands” · south of the Equator, west of 180°</text>
    <text x="705" y="215" font-size="28" fill="#8C5810">Polynesia</text>
    <text x="705" y="247" font-size="17" fill="#8C5810" font-weight="700">“Many islands” · mostly east of 180°</text>
  </g>
  <g fill="#fff" stroke="#45392F" stroke-width="2">
    <circle cx="140" cy="90" r="6"/><circle cx="170" cy="100" r="5"/><circle cx="400" cy="85" r="6"/><circle cx="430" cy="170" r="5"/>
    <ellipse cx="120" cy="250" rx="22" ry="12"/><ellipse cx="420" cy="360" rx="18" ry="9"/><circle cx="150" cy="360" r="7"/>
    <circle cx="600" cy="100" r="6"/><circle cx="820" cy="120" r="7"/><circle cx="640" cy="340" r="6"/><circle cx="830" cy="330" r="6"/><circle cx="760" cy="300" r="5"/>
  </g>
  <text x="940" y="412" text-anchor="end" font-size="11" fill="#96887D">Diagram · borders are approximate</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
