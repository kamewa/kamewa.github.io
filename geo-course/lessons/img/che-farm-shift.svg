<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="412" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >中國農業的轉型</text>
<rect x="40" y="64" width="430" height="300" rx="18" fill="#fff" stroke="#3E8E5A" stroke-width="2.5"/>
<text x="255" y="112" text-anchor="middle" font-size="36" font-weight="400" fill="#332B25" >🐄</text><rect x="155.0" y="133.85" width="200" height="32.3" rx="16.15" fill="#3E8E5A" stroke="#45392F" stroke-width="2"/><text x="255" y="155.95" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">專業化生產</text><text x="255" y="190" text-anchor="middle" font-size="14.5" font-weight="800" fill="#332B25" >因地制宜，生產有優勢的農產品</text>
<rect x="60" y="210" width="390" height="60" rx="12" fill="#F4F0E6"/><text x="88" y="248" text-anchor="middle" font-size="22" font-weight="400" fill="#332B25" >🥛</text><text x="114" y="236" text-anchor="start" font-size="14.5" font-weight="900" fill="#3E8E5A" >內蒙古</text><text x="114" y="258" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >乳牛飼養區：重要的乳製品產區</text>
<rect x="60" y="282" width="390" height="60" rx="12" fill="#F4F0E6"/><text x="88" y="320" text-anchor="middle" font-size="22" font-weight="400" fill="#332B25" >🚜</text><text x="114" y="308" text-anchor="start" font-size="14.5" font-weight="900" fill="#3E8E5A" >東北平原</text><text x="114" y="330" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >大規模機械化耕作：重要糧倉</text>
<rect x="490" y="64" width="430" height="300" rx="18" fill="#fff" stroke="#2E9A86" stroke-width="2.5"/>
<text x="705" y="112" text-anchor="middle" font-size="36" font-weight="400" fill="#332B25" >🌱</text><rect x="605.0" y="133.85" width="200" height="32.3" rx="16.15" fill="#2E9A86" stroke="#45392F" stroke-width="2"/><text x="705" y="155.95" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">永續發展農業</text><text x="705" y="190" text-anchor="middle" font-size="14.5" font-weight="800" fill="#332B25" >用農業科技發展生態農業</text>
<rect x="510" y="210" width="390" height="60" rx="12" fill="#F4F0E6"/><text x="538" y="248" text-anchor="middle" font-size="22" font-weight="400" fill="#332B25" >💡</text><text x="564" y="236" text-anchor="start" font-size="14.5" font-weight="900" fill="#2E9A86" >太陽能捕蟲燈</text><text x="564" y="258" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >捕捉害蟲，減少農藥使用</text>
<rect x="510" y="282" width="390" height="60" rx="12" fill="#F4F0E6"/><text x="538" y="320" text-anchor="middle" font-size="22" font-weight="400" fill="#332B25" >⚖️</text><text x="564" y="308" text-anchor="start" font-size="14.5" font-weight="900" fill="#2E9A86" >兼顧環境與產量</text><text x="564" y="330" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >提升耕地肥沃度，永續經營</text>
<text x="480" y="394" text-anchor="middle" font-size="14" font-weight="800" fill="#6B5E52" >傳統農業「東農西牧、北旱田南水田」→ 現在朝專業化、機械化、生態化發展</text>
</svg>
