<text x="552" y="298" text-anchor="start" font-size="12.5" font-weight="700" fill="#332B25" >礁石崎嶇、造型奇特 → 觀光（墾丁）</text>
<rect x="520" y="316" width="20" height="20" rx="4" fill="#E0694F" stroke="#45392F" stroke-width="1.5"/>
<text x="552" y="334" text-anchor="start" font-size="17" font-weight="900" fill="#332B25" >東部：斷層海岸</text><text x="552" y="356" text-anchor="start" font-size="13" font-weight="800" fill="#6B5E52" >蘇澳～旭海</text>
<text x="552" y="376" text-anchor="start" font-size="12.5" font-weight="700" fill="#332B25" >面臨太平洋、懸崖陡直、港灣少（清水斷崖）</text>
