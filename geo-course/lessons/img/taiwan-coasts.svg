<text x="552" y="100" text-anchor="start" font-size="17" font-weight="900" fill="#332B25" >北部：岬灣海岸</text><text x="552" y="122" text-anchor="start" font-size="13" font-weight="800" fill="#6B5E52" >淡水河口～三貂角</text>
<text x="552" y="142" text-anchor="start" font-size="12.5" font-weight="700" fill="#332B25" >岬角與海灣相間、多良港 → 漁業、海運、觀光（野柳、基隆港）</text>
<rect x="520" y="160" width="20" height="20" rx="4" fill="#E0A43A" stroke="#45392F" stroke-width="1.5"/>
<text x="552" y="178" text-anchor="start" font-size="17" font-weight="900" fill="#332B25" >西部：沙岸</text><text x="552" y="200" text-anchor="start" font-size="13" font-weight="800" fill="#6B5E52" >淡水河口～楓港（另有三貂角～蘇澳）</text>
<text x="552" y="220" text-anchor="start" font-size="12.5" font-weight="700" fill="#332B25" >海灘寬、坡度緩、多沙洲與潟湖 → 養殖漁業</text>
