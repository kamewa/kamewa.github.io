<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="432" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >用飲食改變世界：無所不在的棕櫚油</text>
<rect x="40" y="64" width="280" height="220" rx="14" fill="#fff" stroke="#E0A43A" stroke-width="2.2"/>
<text x="180.0" y="108" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >🍪</text><text x="180.0" y="146" text-anchor="middle" font-size="16" font-weight="900" fill="#E0A43A" >用途很廣</text>
<text x="180.0" y="176" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >零食、餅乾、泡麵、冰淇淋</text>
<text x="180.0" y="200" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >洗髮精、清潔劑、化妝品</text>
<text x="180.0" y="224" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >可能只標「植物油」</text>
<rect x="340" y="64" width="280" height="220" rx="14" fill="#fff" stroke="#E0694F" stroke-width="2.2"/>
<text x="480.0" y="108" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >🌴</text><text x="480.0" y="146" text-anchor="middle" font-size="16" font-weight="900" fill="#E0694F" >雨林消失</text>
<text x="480.0" y="176" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >印尼 2009～2011 年</text>
<text x="480.0" y="200" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >砍伐約 30 萬公頃林地</text>
<text x="480.0" y="224" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >≈ 11 個臺北市</text>
<rect x="640" y="64" width="280" height="220" rx="14" fill="#fff" stroke="#8A5A2B" stroke-width="2.2"/>
<text x="780.0" y="108" text-anchor="middle" font-size="30" font-weight="400" fill="#332B25" >🦧</text><text x="780.0" y="146" text-anchor="middle" font-size="16" font-weight="900" fill="#8A5A2B" >生態受害</text>
<text x="780.0" y="176" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >20 年間超過 5 萬隻</text>
<text x="780.0" y="200" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >紅毛猩猩因棕櫚開發死亡</text>
<text x="780.0" y="224" text-anchor="middle" font-size="12.5" font-weight="800" fill="#332B25" >土壤侵蝕、水與空氣汙染</text>
<rect x="40" y="304" width="880" height="86" rx="14" fill="#E3F4E5" stroke="#3E8E5A" stroke-width="2"/>
<text x="480" y="336" text-anchor="middle" font-size="15.5" font-weight="900" fill="#3E8E5A" >✅ 消費者可以選擇有「RSPO 永續棕櫚油」等驗證標章的產品</text>
<text x="480" y="366" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >消費者的選擇會帶動生產者重視環境 → 用購買行動支持永續</text>
<text x="480" y="414" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >（改寫自 One Green Planet〈Why You Should Avoid Palm Oil〉，自繪）</text>
</svg>
