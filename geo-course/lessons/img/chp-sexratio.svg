<text x="830" y="104" text-anchor="middle" font-size="15" font-weight="900" fill="#E0694F" >問題</text>
<text x="830" y="138" text-anchor="middle" font-size="13.5" font-weight="900" fill="#332B25" >重男輕女＋一胎化</text>
<text x="830" y="172" text-anchor="middle" font-size="13.5" font-weight="900" fill="#332B25" >→ 性別比嚴重失衡</text>
<text x="830" y="240" text-anchor="middle" font-size="15" font-weight="900" fill="#3E8E5A" >對策</text>
<text x="830" y="274" text-anchor="middle" font-size="13.5" font-weight="900" fill="#332B25" >推廣「男孩女孩一樣好」</text>
<text x="830" y="308" text-anchor="middle" font-size="13.5" font-weight="900" fill="#332B25" >近年稍有緩解，</text>
<text x="830" y="342" text-anchor="middle" font-size="13.5" font-weight="900" fill="#332B25" >但仍高於世界平均</text>
<text x="400" y="432" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >性別比：每 100 個女嬰對應的男嬰數（依中國國家統計局等公開資料整理的約略值，自繪）</text>
