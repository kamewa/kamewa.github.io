<text x="805" y="300" text-anchor="middle" font-size="17" font-weight="900" fill="#2C6E9E" >小比例尺</text>
<text x="805" y="326" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >範圍大・內容簡略</text>
<text x="805" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#6B5E52" >例：全臺灣、世界地圖</text>
