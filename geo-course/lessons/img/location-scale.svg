<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="960" height="395" rx="20" fill="#EAF5FB"/>
<text x="480" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >比例尺：圖上距離 ÷ 實際距離</text>
<rect x="40" y="70" width="430" height="300" rx="16" fill="#fff" stroke="#45392F" stroke-width="2.5"/>
<text x="255" y="104" text-anchor="middle" font-size="18" font-weight="900" fill="#332B25" >三種表示方法</text>
<rect x="70.0" y="137.75" width="80" height="28.5" rx="14.25" fill="#4A90C2" stroke="#45392F" stroke-width="2"/><text x="110" y="157.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">數字</text><text x="170" y="158" text-anchor="start" font-size="17" font-weight="800" fill="#332B25" >1 / 10,000（或 1：10,000）</text>
<rect x="70.0" y="207.75" width="80" height="28.5" rx="14.25" fill="#2E9A86" stroke="#45392F" stroke-width="2"/><text x="110" y="227.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">文字</text><text x="170" y="228" text-anchor="start" font-size="17" font-weight="800" fill="#332B25" >圖上 1 公分＝實際 100 公尺</text>
<rect x="70.0" y="277.75" width="80" height="28.5" rx="14.25" fill="#E0A43A" stroke="#45392F" stroke-width="2"/><text x="110" y="297.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">圖示</text>
<rect x="170" y="282" width="60" height="12" fill="#45392F" stroke="#45392F" stroke-width="2"/>
