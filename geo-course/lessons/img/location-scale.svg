<line x1="515" y1="190" x2="695" y2="190" stroke="#fff" stroke-width="8"/><line x1="597" y1="125" x2="597" y2="275" stroke="#fff" stroke-width="8"/>
<text x="605" y="300" text-anchor="middle" font-size="17" font-weight="900" fill="#C0392B" >大比例尺</text>
<text x="605" y="326" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >範圍小・內容詳細</text>
<text x="605" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#6B5E52" >例：社區、縣市地圖</text>
<rect x="715" y="125" width="180" height="150" rx="8" fill="#DDEFF8" stroke="#45392F" stroke-width="2"/>
