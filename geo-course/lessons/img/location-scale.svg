<rect x="350" y="282" width="60" height="12" fill="#fff" stroke="#45392F" stroke-width="2"/>
<text x="170" y="316" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >0</text>
<text x="230" y="316" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >100</text>
<text x="290" y="316" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >200</text>
<text x="350" y="316" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >300</text>
<text x="410" y="316" text-anchor="start" font-size="13" font-weight="800" fill="#332B25" >400 公尺</text>
<text x="255" y="352" text-anchor="middle" font-size="14" font-weight="800" fill="#C0392B" >影印放大縮小時，只有「圖示法」仍然正確</text>
<rect x="490" y="70" width="430" height="300" rx="16" fill="#fff" stroke="#45392F" stroke-width="2.5"/>
<text x="705" y="104" text-anchor="middle" font-size="18" font-weight="900" fill="#332B25" >大比例尺 vs 小比例尺</text>
