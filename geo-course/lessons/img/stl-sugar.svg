<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 422" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
<rect width="960" height="422" rx="20" fill="#EAF5FB"/>
<text x="480" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >糖業地名「廍」：糖廍為什麼蓋在蔗田旁？</text>
<rect x="50" y="66" width="260" height="190" rx="18" fill="#fff" stroke="#8A5A2B" stroke-width="2.5"/>
<text x="180" y="124" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🌾</text><text x="180" y="172" text-anchor="middle" font-size="19" font-weight="900" fill="#8A5A2B" >甘蔗</text><text x="180" y="206" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >體積大、很重</text><text x="180" y="230" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >運送不易</text>
<line x1="314.0" y1="160.0" x2="338.8" y2="160.0" stroke="#6B5E52" stroke-width="5" stroke-linecap="round"/><path d="M346.0,160.0 L335.2,165.2 L335.2,154.8 Z" fill="#6B5E52"/>
<rect x="350" y="66" width="260" height="190" rx="18" fill="#fff" stroke="#8A5A2B" stroke-width="2.5"/>
<text x="480" y="124" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🐂</text><text x="480" y="172" text-anchor="middle" font-size="19" font-weight="900" fill="#8A5A2B" >糖廍（蔗田旁）</text><text x="480" y="206" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >牛隻拉石磨榨汁</text><text x="480" y="230" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >再熬煮成糖</text>
<line x1="614.0" y1="160.0" x2="638.8" y2="160.0" stroke="#6B5E52" stroke-width="5" stroke-linecap="round"/><path d="M646.0,160.0 L635.2,165.2 L635.2,154.8 Z" fill="#6B5E52"/>
<rect x="650" y="66" width="260" height="190" rx="18" fill="#fff" stroke="#8A5A2B" stroke-width="2.5"/>
<text x="780" y="124" text-anchor="middle" font-size="40" font-weight="400" fill="#332B25" >🍬</text><text x="780" y="172" text-anchor="middle" font-size="19" font-weight="900" fill="#8A5A2B" >糖</text><text x="780" y="206" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >體積小很多</text><text x="780" y="230" text-anchor="middle" font-size="13.5" font-weight="800" fill="#332B25" >方便運到市場</text>
<rect x="50" y="280" width="860" height="100" rx="14" fill="#FFF8E7" stroke="#45392F" stroke-width="1.3"/>
<text x="480" y="312" text-anchor="middle" font-size="15" font-weight="900" fill="#332B25" >糖廍又叫糖寮、糖間、蔗廍（廍，音同「步」），很多後來變成地名</text>
<text x="480" y="344" text-anchor="middle" font-size="14" font-weight="800" fill="#332B25" >這類地名多分布在臺灣西部的平原地區（適合種甘蔗）</text>
<text x="480" y="368" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >可以用內政部「地名資訊服務網」查詢家鄉附近的地名</text>
<text x="480" y="404" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >（自繪）</text>
</svg>
