<text x="480" y="400" text-anchor="middle" font-size="15" font-weight="900" fill="#E0694F" >製造業從約 71% 降到約 28%；服務業、科技研發比例提高</text>
<text x="480" y="428" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >原因：工資上漲、美國提高關稅與技術禁令 → 外國企業轉型或遷移；人民所得增加 → 消費潛力大</text>
<text x="480" y="474" text-anchor="middle" font-size="12.5" font-weight="800" fill="#6B5E52" >（依課本圖 1-4-32 整理的約略值，自繪）</text>
