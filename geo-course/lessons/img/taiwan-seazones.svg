<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="960" height="440" rx="20" fill="#EAF5FB"/>
<text x="480" y="40" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >海域範圍：從「領海基線」往外量</text>
<rect x="40" y="150" width="880" height="200" fill="#BFE3F2"/>
<path d="M40,110 L150,110 L170,150 L360,190 C400,198 420,210 440,300 L920,325 L920,360 L40,360 Z" fill="#C9A77A" stroke="#45392F" stroke-width="2.5"/>
<line x1="40" y1="150" x2="920" y2="150" stroke="#4A90C2" stroke-width="3"/>
<text x="95" y="98" text-anchor="middle" font-size="16" font-weight="900" fill="#332B25" >陸地</text>
<line x1="170" y1="80" x2="170" y2="210" stroke="#45392F" stroke-width="3"/>
<text x="170" y="72" text-anchor="middle" font-size="14" font-weight="900" fill="#332B25" >領海基線</text>
<rect x="170" y="100" width="70" height="26" fill="#E0694F" opacity=".9" stroke="#45392F" stroke-width="2"/>
<text x="205.0" y="119" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" >領海</text>
<text x="205.0" y="180" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >國家領土</text>
<rect x="240" y="100" width="520" height="26" fill="#E0A43A" opacity=".9" stroke="#45392F" stroke-width="2"/>
<text x="500.0" y="119" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" >經濟海域 200 浬</text>
<text x="500.0" y="180" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >可開發漁、礦等資源</text>
<rect x="760" y="100" width="160" height="26" fill="#2E9A86" opacity=".9" stroke="#45392F" stroke-width="2"/>
<text x="840.0" y="119" text-anchor="middle" font-size="14" font-weight="900" fill="#fff" >公海</text>
<text x="840.0" y="180" text-anchor="middle" font-size="13" font-weight="800" fill="#332B25" >不屬於任何國家</text>
<text x="205" y="204" text-anchor="middle" font-size="12" font-weight="800" fill="#C0392B" >12 浬</text>
<line x1="760" y1="100" x2="760" y2="210" stroke="#45392F" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M170,220 L400,220" stroke="#4A6E2A" stroke-width="4"/>
<rect x="175.0" y="233.65" width="230" height="24.7" rx="12.35" fill="#7CB46A" stroke="#45392F" stroke-width="2"/><text x="290" y="250.55" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">大陸棚：水深 200 公尺以內</text>
<text x="480" y="395" text-anchor="middle" font-size="15" font-weight="800" fill="#6B5E52" >領海、經濟海域、公海看「離基線的距離」；大陸棚看「海水深度」</text>
<text x="480" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#6B5E52" >1 浬 ≈ 1.852 公里；鄰國的經濟海域重疊時，容易發生漁業糾紛</text>
