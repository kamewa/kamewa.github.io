<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
<rect width="960" height="440" rx="20" fill="#EAF5FB"/>
<text x="480" y="36" text-anchor="middle" font-size="22" font-weight="800" fill="#332B25" >日本的人口組成：小孩變少、老人變多</text>
<text x="120" y="130" text-anchor="end" font-size="20" font-weight="900" fill="#332B25" >1950 年</text>
<rect x="140.0" y="90" width="252.0" height="64" fill="#8FC4E8" stroke="#45392F" stroke-width="2"/>
<text x="266.0" y="131" text-anchor="middle" font-size="17" font-weight="900" fill="#332B25" >約 35%</text>
<rect x="392.0" y="90" width="432.0" height="64" fill="#F6D776" stroke="#45392F" stroke-width="2"/>
<text x="608.0" y="131" text-anchor="middle" font-size="17" font-weight="900" fill="#332B25" >約 60%</text>
<rect x="824.0" y="90" width="36.0" height="64" fill="#F2A6A0" stroke="#45392F" stroke-width="2"/>
<text x="842.0" y="131" text-anchor="middle" font-size="13" font-weight="900" fill="#332B25" >約 5%</text>
<text x="120" y="250" text-anchor="end" font-size="20" font-weight="900" fill="#332B25" >2024 年</text>
<rect x="140.0" y="210" width="79.2" height="64" fill="#8FC4E8" stroke="#45392F" stroke-width="2"/>
<text x="179.6" y="251" text-anchor="middle" font-size="13" font-weight="900" fill="#332B25" >約 11%</text>
<rect x="219.2" y="210" width="432.0" height="64" fill="#F6D776" stroke="#45392F" stroke-width="2"/>
<text x="435.2" y="251" text-anchor="middle" font-size="17" font-weight="900" fill="#332B25" >約 60%</text>
<rect x="651.2" y="210" width="208.8" height="64" fill="#F2A6A0" stroke="#45392F" stroke-width="2"/>
<text x="755.6" y="251" text-anchor="middle" font-size="17" font-weight="900" fill="#332B25" >約 29%</text>
<rect x="170" y="342" width="22" height="22" rx="4" fill="#8FC4E8" stroke="#45392F" stroke-width="1.5"/><text x="202" y="360" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >幼年（0～14 歲）</text>
<rect x="420" y="342" width="22" height="22" rx="4" fill="#F6D776" stroke="#45392F" stroke-width="1.5"/><text x="452" y="360" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >壯年（15～64 歲）</text>
<rect x="670" y="342" width="22" height="22" rx="4" fill="#F2A6A0" stroke="#45392F" stroke-width="1.5"/><text x="702" y="360" text-anchor="start" font-size="15" font-weight="800" fill="#332B25" >老年（65 歲以上）</text>
<line x1="820.0" y1="160.0" x2="820.0" y2="197.8" stroke="#E0694F" stroke-width="4" stroke-linecap="round"/><path d="M820.0,205.0 L814.8,194.2 L825.2,194.2 Z" fill="#E0694F"/><text x="840" y="190" text-anchor="start" font-size="14" font-weight="900" fill="#B03A2E" >老年人口大增</text>
<text x="480" y="400" text-anchor="middle" font-size="15" font-weight="900" fill="#C0392B" >結果：勞動力不足、薪資高漲 → 日本發展自動化、機器人與照護科技</text>
<text x="480" y="424" text-anchor="middle" font-size="12" font-weight="800" fill="#6B5E52" >（數字為約略比例，依日本官方統計整理）</text>
